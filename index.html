<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kiln</title>
<meta name="description" content="Kiln is a collection of original, handmade games that play offline.">
<meta name="theme-color" content="#07101E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Unbounded:wght@600;800&display=swap">
<style>
/* Layout: one dark column; a compact brand header, then shelves of art-led game cards. A game opens full screen under a slim bar; settings and insights are sheets and pages over it.
   Visual system: Kiln blueprint v2.0, section 10. One committed dark look; game art supplies the colour. */
:root {
  /* colour */
  --bg: #07101E;          /* main canvas */
  --surface: #101C31;     /* cards and navigation */
  --raised: #192841;      /* sheets and focused panels */
  --primary: #6557FF;     /* main action and selected state */
  --primary-ink: #FFFFFF;
  --secondary: #45C4D7;   /* supporting emphasis, focus */
  --reward: #F0C75E;      /* rare highlights only: best scores, new bests */
  --reward-ink: #1A1405;
  --text: #F5F7FC;        /* headings and key labels */
  --text-2: #AAB8CC;      /* descriptions and metadata */
  --line: rgba(170, 184, 204, 0.14);
  --line-strong: rgba(170, 184, 204, 0.26);
  --scrim: rgba(3, 7, 15, 0.66);
  /* game accents for card grounds (from the games' glazes) */
  --g1: #4C76E8; --g2: #EFAE36; --g3: #22AC89; --g4: #EC6650; --g5: #A262CE; --g6: #31B4D3;
  /* shape and rhythm */
  --r-chip: 12px;
  --r-card: 18px;
  --r-hero: 26px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --tap: 48px;
  /* type: one display family for hero moments, one body family for everything else */
  --font-display: "Unbounded", "Arial Black", "Helvetica Neue", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --t-hero: clamp(28px, 7.6vw, 34px);
  --t-section: 21px;
  --t-card: 16px;
  --t-body: 15px;
  --t-meta: 13px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html {
  height: 100%;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--bg);
}
body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 500 var(--t-body)/1.45 var(--font-body);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 3px solid var(--secondary); outline-offset: 3px; }
h1, h2, h3 { text-wrap: balance; }

.icon-btn {
  width: var(--tap);
  height: var(--tap);
  flex: none;
  border: 1px solid var(--line);
  border-radius: var(--r-chip);
  background: var(--surface);
  color: var(--text);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: background 0.15s var(--ease), transform 0.1s var(--ease);
}
.icon-btn:active { background: var(--raised); transform: scale(0.96); }
.icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- home ---------- */
.home {
  height: 100%;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.wrap {
  max-width: 1080px;
  margin-inline: auto;
  padding-inline: max(var(--s4), env(safe-area-inset-left, 0px)) max(var(--s4), env(safe-area-inset-right, 0px));
}
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s3);
  padding-block: var(--s3) var(--s2);
  min-height: 64px;
}
.brand { display: flex; align-items: center; gap: var(--s3); }
.logo { display: grid; grid-template-columns: repeat(2, 12px); gap: 3px; }
.logo i { width: 12px; height: 12px; border-radius: 4px; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.25); }
.logo i:nth-child(1) { background: var(--g1); }
.logo i:nth-child(2) { background: var(--g2); }
.logo i:nth-child(3) { background: var(--g4); }
.logo i:nth-child(4) { background: var(--raised); box-shadow: inset 0 2px 2px rgba(0, 0, 0, 0.35); }
.word { font: 800 22px/1 var(--font-display); letter-spacing: -0.03em; }
.actions { display: flex; gap: var(--s2); }
.intro { padding-block: var(--s4) var(--s5); display: grid; gap: var(--s2); }
.intro h1 { margin: 0; font: 800 var(--t-hero)/1.12 var(--font-display); letter-spacing: -0.03em; max-width: 16ch; }
.intro p { margin: 0; color: var(--text-2); font-size: var(--t-body); max-width: 46ch; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 158px), 1fr));
  gap: var(--s3);
  padding-bottom: var(--s6);
}
.card {
  appearance: none;
  border: 1px solid var(--line);
  padding: 0;
  text-align: left;
  cursor: pointer;
  background: var(--surface);
  border-radius: var(--r-card);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-width: 0;
  transition: transform 0.12s var(--ease), border-color 0.15s var(--ease);
}
.card:active { transform: scale(0.98); border-color: var(--line-strong); }
.card[aria-disabled="true"] { cursor: default; }
.card[aria-disabled="true"] .cover { filter: saturate(0.35) brightness(0.8); }
.cover {
  aspect-ratio: 4 / 5;
  max-width: 100%;
  background: var(--c);
  position: relative;
  overflow: hidden;
}
.cover img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
.cover .tiles {
  position: absolute;
  inset: 18% 18%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8%;
}
.cover .tiles i { border-radius: 22%; background: rgba(255, 255, 255, 0.2); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.15); }
.cover .tiles i:nth-child(odd) { background: rgba(255, 255, 255, 0.36); }
.status {
  position: absolute;
  top: var(--s2);
  left: var(--s2);
  padding: 6px 10px;
  border-radius: 999px;
  background: rgba(7, 16, 30, 0.78);
  color: var(--text);
  font: 700 11px/1 var(--font-body);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.card-body { padding: var(--s3) var(--s3) var(--s4); display: grid; gap: var(--s1); min-width: 0; }
.genre { font: 700 11px/1.2 var(--font-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--secondary); }
.card h3 { margin: 2px 0 0; font: 700 var(--t-card)/1.2 var(--font-body); letter-spacing: -0.01em; }
.card p {
  margin: 0;
  font-size: var(--t-meta);
  line-height: 1.4;
  color: var(--text-2);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card .best { margin-top: var(--s2); font-size: 12px; font-weight: 700; color: var(--text-2); }
.card .best b { color: var(--reward); font-variant-numeric: tabular-nums; }
.foot { padding-block: var(--s2) var(--s6); color: var(--text-2); font-size: 12px; }

/* ---------- player ---------- */
.player {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.bar {
  flex: none;
  height: 56px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: var(--s2);
  padding-inline: max(var(--s2), env(safe-area-inset-left, 0px)) max(var(--s2), env(safe-area-inset-right, 0px));
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.back {
  justify-self: start;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  height: var(--tap);
  padding: 0 var(--s3) 0 var(--s2);
  border: 0;
  border-radius: var(--r-chip);
  background: transparent;
  font-weight: 700;
  cursor: pointer;
}
.back:active { background: var(--raised); }
.back svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.bar h2 { margin: 0; font: 700 16px/1 var(--font-body); letter-spacing: -0.01em; }
.bar .icon-btn { justify-self: end; background: transparent; border-color: transparent; }
.frame { position: relative; flex: 1 1 auto; min-height: 0; }
.frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
.loading {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--text-2);
  font-weight: 700;
  font-size: var(--t-meta);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  pointer-events: none;
}

/* ---------- sheets ---------- */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: grid;
  place-items: end center;
  background: var(--scrim);
  animation: fade 0.18s var(--ease);
}
.sheet {
  width: min(480px, 100%);
  max-height: 92%;
  overflow: auto;
  background: var(--raised);
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: var(--r-hero) var(--r-hero) 0 0;
  padding: var(--s5) var(--s5) calc(var(--s5) + env(safe-area-inset-bottom, 0px));
  display: grid;
  gap: var(--s3);
  animation: up 0.22s var(--ease);
}
@media (min-width: 600px) {
  .overlay { place-items: center; }
  .sheet { border-radius: var(--r-hero); border-bottom: 1px solid var(--line); padding-bottom: var(--s5); }
}
.sheet h2 { margin: 0 0 var(--s1); font: 700 var(--t-section)/1.2 var(--font-body); letter-spacing: -0.01em; }
.row { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); min-height: var(--tap); font-weight: 600; }
.row small { display: block; font-weight: 500; color: var(--text-2); font-size: var(--t-meta); }
.switch {
  flex: none;
  position: relative;
  width: 52px;
  height: 32px;
  border: 0;
  border-radius: 999px;
  background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--line-strong);
  cursor: pointer;
  transition: background 0.18s var(--ease);
}
.switch::after {
  content: "";
  position: absolute;
  top: 4px;
  left: 4px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--text-2);
  transition: transform 0.18s var(--ease), background 0.18s var(--ease);
}
.switch[aria-checked="true"] { background: var(--primary); box-shadow: none; }
.switch[aria-checked="true"]::after { transform: translateX(20px); background: var(--primary-ink); }
.seg { display: inline-flex; padding: 3px; border-radius: var(--r-chip); background: var(--surface); gap: 2px; }
.seg button { border: 0; background: transparent; min-height: 40px; padding: 0 var(--s3); border-radius: 9px; font-size: var(--t-meta); font-weight: 700; color: var(--text-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); }
.btn {
  appearance: none;
  border: 0;
  cursor: pointer;
  font: 700 16px/1 var(--font-body);
  min-height: 52px;
  padding: 0 var(--s5);
  border-radius: var(--r-chip);
  background: var(--primary);
  color: var(--primary-ink);
  transition: transform 0.1s var(--ease), filter 0.15s var(--ease);
}
.btn:active { transform: translateY(1px); filter: brightness(0.92); }
.btn.ghost { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong); }
.btn.small { min-height: var(--tap); padding: 0 var(--s4); font-size: 14px; }
.note { margin: 0; font-size: var(--t-meta); color: var(--text-2); }

/* ---------- insights ---------- */
.page {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: var(--bg);
  overflow-y: auto;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--s3); margin-block: var(--s2) var(--s5); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: var(--s4); display: grid; gap: var(--s2); }
.kpi span { font: 700 11px/1.15 var(--font-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-2); }
.kpi b { font: 800 26px/1 var(--font-display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.gstats { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: var(--s3); }
.gstat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: var(--s4); display: grid; gap: var(--s3); min-width: 0; }
.gstat header { display: flex; align-items: center; gap: var(--s3); }
.gstat header i { width: 14px; height: 14px; border-radius: 4px; background: var(--c); flex: none; }
.gstat header h3 { margin: 0; font: 700 var(--t-card)/1.2 var(--font-body); }
.gstat header span { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--text-2); }
.meter { display: grid; gap: 6px; }
.meter .lbl { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--text-2); }
.meter .lbl b { color: var(--text); font-variant-numeric: tabular-nums; }
.track { height: 8px; border-radius: 4px; background: var(--raised); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 4px; background: var(--primary); }
.cells { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s2); }
.cell { background: var(--raised); border-radius: var(--r-chip); padding: 10px; display: grid; gap: var(--s1); min-width: 0; }
.cell span { font: 700 10px/1.15 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-2); }
.cell b { font: 700 15px/1 var(--font-body); font-variant-numeric: tabular-nums; }
.empty { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: var(--s5); color: var(--text-2); }
.data-actions { display: flex; flex-wrap: wrap; gap: var(--s3); margin-block: var(--s5) var(--s6); }
.data-out { width: 100%; height: 120px; font: 12px/1.4 ui-monospace, Menlo, monospace; border-radius: var(--r-chip); border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); padding: 10px; }

@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(24px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .overlay, .sheet { animation: none; }
  .card, .icon-btn, .btn, .switch, .switch::after { transition: none; }
}
</style>
</head>
<body>

<div class="home" id="home">
  <div class="wrap">
    <header class="top">
      <div class="brand"><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="word">Kiln</span></div>
      <div class="actions">
        <button class="icon-btn" id="insightsBtn" type="button" aria-label="Play insights">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </header>
    <section class="intro">
      <h1>Original games, made by hand</h1>
      <p id="introLine">Play offline. Your progress stays on this device.</p>
    </section>
    <section class="grid" id="grid" aria-label="Games"></section>
    <footer class="foot" id="foot">Kiln</footer>
  </div>
</div>

<div class="player" id="player" hidden>
  <header class="bar">
    <button class="back" id="backBtn" type="button" aria-label="Back to games">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Games</span>
    </button>
    <h2 id="playerTitle"></h2>
    <button class="icon-btn" id="playerSettingsBtn" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <div class="frame" id="frame"><div class="loading" id="loading">Loading</div></div>
</div>

<div class="page" id="insights" hidden>
  <div class="wrap">
    <header class="top">
      <button class="back" id="insightsBack" type="button" aria-label="Back to games">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Games</span>
      </button>
    </header>
    <div class="intro">
      <h1>Play insights</h1>
      <p id="insightsNote">How each game is doing, from play on this device.</p>
    </div>
    <div id="insightsBody"></div>
    <div class="data-actions">
      <button class="btn small ghost" id="copyData" type="button">Copy raw data</button>
      <button class="btn small ghost" id="clearData" type="button">Clear play data</button>
      <button class="btn small" id="clearYes" type="button" hidden>Yes, clear it</button>
    </div>
    <textarea class="data-out" id="dataOut" readonly hidden aria-label="Raw play data"></textarea>
  </div>
</div>

<div class="overlay" id="settings" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <h2 id="settingsTitle">Settings</h2>
    <div class="row"><span id="sndLbl">Sound</span><button class="switch" id="sndSw" type="button" role="switch" aria-checked="true" aria-labelledby="sndLbl"></button></div>
    <div class="row"><span id="vibLbl">Vibration</span><button class="switch" id="vibSw" type="button" role="switch" aria-checked="true" aria-labelledby="vibLbl"></button></div>
    <div class="row"><span>Game theme<small>Kiln itself is always dark.</small></span>
      <span class="seg" role="group" aria-label="Game theme">
        <button type="button" data-theme-opt="system">System</button><button type="button" data-theme-opt="light">Light</button><button type="button" data-theme-opt="dark">Dark</button>
      </span>
    </div>
    <div class="row"><span id="shareLbl">Share anonymous play stats<small id="shareNote">Helps decide which games to build next.</small></span><button class="switch" id="shareSw" type="button" role="switch" aria-checked="false" aria-labelledby="shareLbl"></button></div>
    <button class="btn" id="settingsDone" type="button">Done</button>
  </div>
</div>

<script src="hub/config.js"></script>
<script src="hub/sdk.js"></script>
<script src="games/registry.js"></script>
<script>
(() => {
  'use strict';

  const APP_VERSION = '0.1.0';
  const A = window.Arcade;
  const ls = A._ls;
  const Log = A._log;
  const GAMES = (window.KILN_GAMES || []).filter(g => g && g.id);
  const CONFIG = Object.assign({ analyticsEndpoint: '' }, window.KILN_CONFIG || {});
  const nf = new Intl.NumberFormat();
  const fmt = n => nf.format(Math.round(n));
  const $ = id => document.getElementById(id);

  let settings = Object.assign({}, A._defaults, ls.get('settings', {}));
  const uid = Log.uid();
  const sid = A._rid();
  const bestMem = {};
  let current = null; // { game, frame, since, ready, timer, pushed }

  /* ---------- logging ---------- */
  function clean(props) {
    const out = {};
    let n = 0;
    for (const k in props) {
      if (n >= 24) break;
      const v = props[k];
      if (typeof v === 'number' && isFinite(v)) out[k] = v;
      else if (typeof v === 'boolean') out[k] = v;
      else if (typeof v === 'string') out[k] = v.slice(0, 120);
      else continue;
      n++;
    }
    return out;
  }
  function log(ev, props) {
    Log.append([Object.assign({ ts: Date.now(), ev, uid, sid, src: 'hub', v: APP_VERSION }, props || {})]);
    queueSend();
  }

  /* ---------- optional upload (only with an endpoint configured and the player's consent) ---------- */
  let sendTimer = 0;
  function canSend() { return !!CONFIG.analyticsEndpoint && !!settings.shareStats; }
  function queueSend() {
    if (!canSend()) return;
    clearTimeout(sendTimer);
    sendTimer = setTimeout(() => flush(false), 8000);
  }
  function flush(beacon) {
    if (!canSend()) return;
    const sentTs = ls.get('sent_ts', 0);
    const batch = Log.all().filter(e => e.ts > sentTs).slice(0, 500);
    if (!batch.length) return;
    const last = batch[batch.length - 1].ts;
    const body = JSON.stringify({ app: 'kiln', v: APP_VERSION, events: batch });
    try {
      if (beacon && navigator.sendBeacon) {
        if (navigator.sendBeacon(CONFIG.analyticsEndpoint, body)) ls.set('sent_ts', last);
        return;
      }
      fetch(CONFIG.analyticsEndpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body, keepalive: true })
        .then(r => { if (r.ok) ls.set('sent_ts', last); })
        .catch(() => {});
    } catch (e) { /* offline or blocked */ }
  }

  /* ---------- settings ---------- */
  function syncSettingsUi() {
    $('sndSw').setAttribute('aria-checked', String(!!settings.sound));
    $('vibSw').setAttribute('aria-checked', String(!!settings.vibration));
    $('shareSw').setAttribute('aria-checked', String(!!settings.shareStats));
    document.querySelectorAll('[data-theme-opt]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeOpt === settings.theme)));
    $('shareNote').textContent = CONFIG.analyticsEndpoint
      ? 'Sends which games you play and for how long. No names, no contacts.'
      : 'No stats server is connected yet, so nothing leaves this device.';
  }
  function setSetting(key, value) {
    if (!(key in A._defaults)) return;
    settings[key] = value;
    ls.set('settings', settings);
    syncSettingsUi();
    sendToGame({ type: 'settings', settings });
    if (key === 'shareStats') { log('consent', { share_stats: !!value }); if (value) flush(false); }
  }
  function openSettings() {
    syncSettingsUi();
    $('settings').hidden = false;
    sendToGame({ type: 'pause' });
    $('settingsDone').focus({ preventScroll: true });
  }
  function closeSettings() {
    $('settings').hidden = true;
    sendToGame({ type: 'resume' });
  }
  $('settingsBtn').addEventListener('click', openSettings);
  $('playerSettingsBtn').addEventListener('click', openSettings);
  $('settingsDone').addEventListener('click', closeSettings);
  $('settings').addEventListener('click', e => { if (e.target === $('settings')) closeSettings(); });
  $('sndSw').addEventListener('click', () => setSetting('sound', !settings.sound));
  $('vibSw').addEventListener('click', () => {
    setSetting('vibration', !settings.vibration);
    if (settings.vibration) A._buzz(20);
  });
  $('shareSw').addEventListener('click', () => setSetting('shareStats', !settings.shareStats));
  document.querySelectorAll('[data-theme-opt]').forEach(b => b.addEventListener('click', () => setSetting('theme', b.dataset.themeOpt)));

  /* ---------- home ---------- */
  function bestOf(id) {
    const stored = ls.get(id + ':best', 0);
    return Math.max(typeof stored === 'number' ? stored : 0, bestMem[id] || 0);
  }
  function renderHome() {
    const grid = $('grid');
    grid.replaceChildren();
    for (const g of GAMES) {
      const soon = g.status === 'soon';
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'card';
      card.dataset.id = g.id;
      card.style.setProperty('--c', `var(${g.accent || '--g1'})`);
      if (soon) card.setAttribute('aria-disabled', 'true');

      const cover = document.createElement('div');
      cover.className = 'cover';
      if (g.cover) {
        const img = document.createElement('img');
        img.src = g.cover;
        img.alt = '';
        img.loading = 'lazy';
        cover.append(img);
      } else {
        const tiles = document.createElement('div');
        tiles.className = 'tiles';
        for (let i = 0; i < 9; i++) tiles.append(document.createElement('i'));
        cover.append(tiles);
      }
      if (g.status === 'beta' || soon) {
        const st = document.createElement('span');
        st.className = 'status';
        st.textContent = soon ? 'Coming soon' : 'New';
        cover.append(st);
      }

      const body = document.createElement('div');
      body.className = 'card-body';
      const genre = document.createElement('span');
      genre.className = 'genre';
      genre.textContent = g.genre || 'Game';
      const h = document.createElement('h3');
      h.textContent = g.title;
      const p = document.createElement('p');
      p.textContent = g.pitch || '';
      const best = document.createElement('div');
      best.className = 'best';
      const b = bestOf(g.id);
      if (soon) best.textContent = 'In the kiln';
      else if (b > 0) { best.textContent = 'Best '; const bb = document.createElement('b'); bb.textContent = fmt(b); best.append(bb); }
      else best.textContent = 'Not played yet';
      body.append(genre, h, p, best);

      card.append(cover, body);
      if (!soon) card.addEventListener('click', () => openGame(g.id, true));
      grid.append(card);
    }
    const playable = GAMES.filter(g => g.status !== 'soon').length;
    $('introLine').textContent = `${playable} ${playable === 1 ? 'game' : 'games'} so far. Play offline; your progress stays on this device.`;
    $('foot').textContent = `Kiln ${APP_VERSION} · working title`;
  }

  /* ---------- player ---------- */
  function sendToGame(msg) {
    if (!current || !current.frame.contentWindow) return;
    msg.kiln = 1;
    try { current.frame.contentWindow.postMessage(msg, '*'); } catch (e) { /* frame gone */ }
  }
  function playSegment() {
    if (!current || !current.since) return;
    const s = Math.round((Date.now() - current.since) / 100) / 10;
    current.since = 0;
    if (s > 0) log('play_time', { game: current.game.id, s });
  }
  function openGame(id, push) {
    const g = GAMES.find(x => x.id === id && x.status !== 'soon');
    if (!g) return;
    if (current) closeGame(false);
    const frame = document.createElement('iframe');
    frame.title = g.title;
    if (g.srcdoc) frame.srcdoc = g.srcdoc;
    else frame.src = g.path;
    current = { game: g, frame, since: Date.now(), ready: false, pushed: false, timer: 0 };
    $('loading').hidden = false;
    $('frame').append(frame);
    $('playerTitle').textContent = g.title;
    $('player').hidden = false;
    $('home').setAttribute('aria-hidden', 'true');
    current.timer = setTimeout(() => { $('loading').hidden = true; }, 6000);
    if (push) {
      try { history.pushState({ kiln: g.id }, '', '#' + g.id); current.pushed = true; } catch (e) { /* history unavailable */ }
    }
    log('game_launch', { game: g.id });
    frame.addEventListener('load', () => setTimeout(() => frame.focus(), 50));
  }
  function closeGame(viaHistory) {
    if (!current) return;
    playSegment();
    log('game_close', { game: current.game.id });
    clearTimeout(current.timer);
    const wasPushed = current.pushed;
    current.frame.remove();
    current = null;
    $('player').hidden = true;
    $('home').removeAttribute('aria-hidden');
    renderHome();
    if (!viaHistory && wasPushed) {
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ignore */ }
    }
  }
  function goHome() {
    if (current && current.pushed) {
      try { history.back(); return; } catch (e) { /* fall through */ }
    }
    closeGame(false);
  }
  $('backBtn').addEventListener('click', goHome);
  window.addEventListener('popstate', () => {
    if (current && !(history.state && history.state.kiln === current.game.id)) closeGame(true);
    if (!$('insights').hidden && !(history.state && history.state.page === 'insights')) $('insights').hidden = true;
  });

  window.addEventListener('message', e => {
    if (!current || e.source !== current.frame.contentWindow) return;
    const m = e.data;
    if (!m || m.kiln !== 1) return;
    switch (m.type) {
      case 'hello':
        sendToGame({ type: 'settings', settings });
        break;
      case 'ready':
        current.ready = true;
        clearTimeout(current.timer);
        $('loading').hidden = true;
        break;
      case 'event':
        if (m.event && typeof m.event.ev === 'string') {
          const ev = clean(m.event);
          Log.append([Object.assign(ev, { ts: Date.now(), uid, sid, src: 'game', game: current.game.id, v: APP_VERSION })]);
          queueSend();
        }
        break;
      case 'score':
        if (typeof m.score === 'number' && isFinite(m.score)) bestMem[current.game.id] = Math.max(bestMem[current.game.id] || 0, m.score);
        break;
      case 'setting':
        setSetting(m.key, m.value);
        break;
      case 'exit':
        goHome();
        break;
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      playSegment();
      flush(true);
    } else if (current) {
      current.since = Date.now();
    }
  });
  window.addEventListener('pagehide', () => { playSegment(); flush(true); });

  /* ---------- insights ---------- */
  const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
  function median(a) {
    if (!a.length) return 0;
    const s = a.slice().sort((x, y) => x - y);
    const m = s.length >> 1;
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }
  function dur(s) {
    if (s < 60) return Math.round(s) + 's';
    if (s < 3600) return Math.floor(s / 60) + 'm ' + String(Math.round(s % 60)).padStart(2, '0') + 's';
    return Math.floor(s / 3600) + 'h ' + String(Math.round((s % 3600) / 60)).padStart(2, '0') + 'm';
  }
  function computeStats() {
    const events = Log.all();
    const by = {};
    for (const g of GAMES) by[g.id] = { opens: 0, starts: 0, ends: 0, gaveUp: 0, durations: [], best: 0, time: 0, days: new Set() };
    const allDays = new Set(), sessions = new Set();
    let total = 0;
    for (const e of events) {
      if (!e || typeof e.ts !== 'number') continue;
      allDays.add(dayKey(e.ts));
      if (e.sid) sessions.add(e.sid);
      const s = by[e.game];
      if (!s) continue;
      if (e.ev === 'game_launch' || (e.ev === 'game_open' && e.src === 'standalone')) { s.opens++; s.days.add(dayKey(e.ts)); }
      else if (e.ev === 'run_start') s.starts++;
      else if (e.ev === 'run_end') {
        s.ends++;
        if (e.reason === 'quit' || e.reason === 'restart' || e.reason === 'abandoned') s.gaveUp++;
        if (typeof e.duration_s === 'number') s.durations.push(e.duration_s);
        if (typeof e.score === 'number') s.best = Math.max(s.best, e.score);
      } else if (e.ev === 'play_time' && typeof e.s === 'number') { s.time += e.s; total += e.s; }
    }
    return { by, days: allDays.size, sessions: sessions.size, total, count: events.length };
  }
  function kpi(label, value) {
    const d = document.createElement('div');
    d.className = 'kpi';
    const s = document.createElement('span');
    s.textContent = label;
    const b = document.createElement('b');
    b.textContent = value;
    d.append(s, b);
    return d;
  }
  function cell(label, value) {
    const d = document.createElement('div');
    d.className = 'cell';
    const s = document.createElement('span');
    s.textContent = label;
    const b = document.createElement('b');
    b.textContent = value;
    d.append(s, b);
    return d;
  }
  function renderInsights() {
    const st = computeStats();
    const body = $('insightsBody');
    body.replaceChildren();
    $('insightsNote').textContent = CONFIG.analyticsEndpoint
      ? 'How each game is doing on this device. Players who opt in also send these events to your stats server.'
      : 'How each game is doing, from play on this device. Connect a stats server to compare games across all players.';
    const tried = GAMES.filter(g => st.by[g.id] && st.by[g.id].opens > 0).length;
    const k = document.createElement('div');
    k.className = 'kpis';
    k.append(kpi('Play time', dur(st.total)), kpi('Days played', fmt(st.days)), kpi('Sessions', fmt(st.sessions)), kpi('Games tried', `${tried} of ${GAMES.filter(g => g.status !== 'soon').length}`));
    body.append(k);
    if (!st.count) {
      const e = document.createElement('p');
      e.className = 'empty';
      e.textContent = 'No play yet. Open a game and the numbers will appear here: opens, runs, how long runs last, how often people replay and how often they give up.';
      body.append(e);
      return;
    }
    const list = document.createElement('div');
    list.className = 'gstats';
    const rows = GAMES.filter(g => g.status !== 'soon').map(g => ({ g, s: st.by[g.id] })).sort((a, b) => b.s.time - a.s.time);
    const maxTime = Math.max(1, ...rows.map(r => r.s.time));
    for (const { g, s } of rows) {
      const card = document.createElement('section');
      card.className = 'gstat';
      card.style.setProperty('--c', `var(${g.accent || '--g1'})`);
      const head = document.createElement('header');
      const dot = document.createElement('i');
      const h = document.createElement('h3');
      h.textContent = g.title;
      const share = document.createElement('span');
      share.textContent = st.total ? Math.round((s.time / st.total) * 100) + '% of play time' : '';
      head.append(dot, h, share);
      const meter = document.createElement('div');
      meter.className = 'meter';
      const lbl = document.createElement('div');
      lbl.className = 'lbl';
      const l1 = document.createElement('span');
      l1.textContent = 'Play time';
      const l2 = document.createElement('b');
      l2.textContent = dur(s.time);
      lbl.append(l1, l2);
      const track = document.createElement('div');
      track.className = 'track';
      const fill = document.createElement('i');
      fill.style.width = Math.max(s.time > 0 ? 2 : 0, (s.time / maxTime) * 100) + '%';
      track.append(fill);
      meter.append(lbl, track);
      const cells = document.createElement('div');
      cells.className = 'cells';
      const finished = s.ends - s.gaveUp;
      cells.append(
        cell('Opens', fmt(s.opens)),
        cell('Runs', fmt(s.ends)),
        cell('Median run', s.durations.length ? dur(median(s.durations)) : '–'),
        cell('Runs per open', s.opens ? (s.ends / s.opens).toFixed(1) : '–'),
        cell('Gave up', s.ends ? Math.round((s.gaveUp / s.ends) * 100) + '%' : '–'),
        cell('Days', fmt(s.days.size)),
      );
      card.append(head, meter, cells);
      if (s.best > 0 || finished > 0) {
        const bestLine = document.createElement('div');
        bestLine.className = 'meter';
        const bl = document.createElement('div');
        bl.className = 'lbl';
        const a = document.createElement('span');
        a.textContent = 'Best score';
        const bb = document.createElement('b');
        bb.textContent = fmt(Math.max(s.best, bestOf(g.id)));
        bl.append(a, bb);
        bestLine.append(bl);
        card.append(bestLine);
      }
      list.append(card);
    }
    body.append(list);
  }
  function openInsights(push) {
    renderInsights();
    $('dataOut').hidden = true;
    $('clearYes').hidden = true;
    $('insights').hidden = false;
    $('insights').scrollTop = 0;
    if (push) { try { history.pushState({ page: 'insights' }, '', '#insights'); } catch (e) { /* ignore */ } }
    log('insights_view');
  }
  function closeInsights() {
    if (history.state && history.state.page === 'insights') { try { history.back(); return; } catch (e) { /* ignore */ } }
    $('insights').hidden = true;
  }
  $('insightsBtn').addEventListener('click', () => openInsights(true));
  $('insightsBack').addEventListener('click', closeInsights);
  $('copyData').addEventListener('click', () => {
    const text = JSON.stringify(Log.all());
    const out = $('dataOut');
    const fallback = () => { out.value = text; out.hidden = false; out.focus(); out.select(); };
    try {
      navigator.clipboard.writeText(text).then(() => { $('copyData').textContent = 'Copied'; setTimeout(() => { $('copyData').textContent = 'Copy raw data'; }, 1600); }, fallback);
    } catch (e) { fallback(); }
  });
  $('clearData').addEventListener('click', () => { $('clearYes').hidden = false; $('clearYes').focus(); });
  $('clearYes').addEventListener('click', () => { Log.clear(); ls.del('sent_ts'); $('clearYes').hidden = true; renderInsights(); });

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!$('settings').hidden) closeSettings();
    else if (!$('insights').hidden) closeInsights();
  });

  /* ---------- boot ---------- */
  syncSettingsUi();
  renderHome();
  log('app_open', { games: GAMES.length });
  const start = (location.hash || '').slice(1);
  if (start === 'insights') openInsights(false);
  else if (GAMES.some(g => g.id === start)) {
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ignore */ }
    openGame(start, true);
  }
  if (/[?&]debug\b/.test(location.search)) window.__kiln = { GAMES, openGame, closeGame: () => closeGame(false), computeStats, Log, settings: () => settings };

  // The Android app ships its files inside the APK, so it never registers the offline cache.
  if ('serviceWorker' in navigator && !window.Capacitor && window.top === window.self && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();
</script>
</body>
</html>
