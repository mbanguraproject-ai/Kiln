# Builds the Android app (debug APK) on every push and publishes it to the "android-preview" release,
# so the latest build can be installed on a phone from:
#   https://github.com/<owner>/<repo>/releases/download/android-preview/kiln-debug.apk
name: Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install web and Capacitor dependencies
        run: npm ci

      - name: Copy the web app into the Android project
        run: npm run android:sync

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/kiln-debug.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: kiln-debug-apk
          path: out/kiln-debug.apk
          retention-days: 14

      - name: Publish to the android-preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Debug build of ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}, built $(date -u '+%Y-%m-%d %H:%M UTC'). Install kiln-debug.apk on an Android phone (allow installs from your browser when asked)."
          if gh release view android-preview >/dev/null 2>&1; then
            gh release edit android-preview --notes "$notes"
          else
            gh release create android-preview --prerelease --title "Android preview" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload android-preview out/kiln-debug.apk --clobber
