<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Long Ball Night</title>
<meta name="description" content="Long Ball Night: a home run derby at a seaside ballpark as dusk turns to night. Aim the bat, let go to swing, light up the boardwalk.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=Unbounded:wght@600;800&display=swap">
<style>
/* The ballpark keeps its dusk-to-night world in both themes; the shell's cream panels read on either. */
:root {
  --night: #1A1230; --violet: #5B2A86; --peach: #F4A259; --cream: #FFF3D6; --ketchup: #D62828; --mustard: #F7B32B;
  --ink: #2B140C; --panel: #FFF3D6; --scrim: rgba(26, 18, 48, 0.52);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --night: #120C24; --scrim: rgba(12, 8, 26, 0.62); color-scheme: dark; }
}
:root[data-theme="dark"] { --night: #120C24; --scrim: rgba(12, 8, 26, 0.62); color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: var(--night);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
#game { display: block; width: 100%; height: 100%; outline: none; touch-action: none; cursor: crosshair; }
#safe { position: fixed; inset: 0; pointer-events: none; visibility: hidden;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
</style>
</head>
<body>
<canvas id="game" aria-label="Long Ball Night: a seaside home run derby"></canvas>
<div id="safe" aria-hidden="true"></div>
<script src="../../hub/sdk.js"></script>
<script src="../../hub/kit.js"></script>
<script>
(() => {
  'use strict';
  Arcade.init({ id: 'long-ball-night', title: 'Long Ball Night', version: '1.0.0' });
  const { gfx, fx } = Kit;
  const view = Kit.view(document.getElementById('game'), { alpha: false });
  const ctx = view.ctx;
  const DISP = '"Unbounded", "Arial Black", "Segoe UI", system-ui, sans-serif';
  const BODY = '"Figtree", "Segoe UI", system-ui, sans-serif';
  const C = {
    cream: '#FFF3D6', ketchup: '#D62828', mustard: '#F7B32B', peach: '#F4A259', violet: '#5B2A86', night: '#1A1230',
    grass: '#2D6A4F', stripe: '#357A5A', clay: '#C8794A', sea: '#1F4E79', board: '#1C4733', ink: '#2B140C',
  };
  const clamp = Kit.clamp, lerp = Kit.lerp;
  const TAU = Math.PI * 2;

  /* ---------- Camera: one fixed pinhole behind the plate, with a soft depth squeeze past the infield ---------- */
  const P = { w: 1, h: 1, f: 1, cx: 0, cy: 0, H: 7.5, D: 9, th: 0.12, c: 1, s: 0, camX: -0.55, hor: 0 };
  const zr = z => (z <= 20 ? z : 20 + 0.5 * (z - 20) + 7.5 * (1 - Math.exp(-(z - 20) / 15)));
  function pr(x, y, z, o) {
    const ry = y - P.H, rz = zr(z) + P.D;
    const zc = Math.max(0.6, rz * P.c - ry * P.s), yc = ry * P.c + rz * P.s, k = P.f / zc;
    o.x = P.cx + (x - P.camX) * k; o.y = P.cy - yc * k; o.k = k;
    return o;
  }
  // screen point -> the plate plane (z = 0)
  function unplate(sx, sy, o) {
    const d = sy - P.cy, Y = -P.D * (P.f * P.s + d * P.c) / (P.f * P.c - d * P.s);
    const zc = P.D * P.c - Y * P.s;
    o.x = P.camX + (sx - P.cx) * zc / P.f; o.y = Y + P.H;
    return o;
  }
  const T0 = {}, T1 = {}, T2 = {}, T3 = {};
  const safe = { t: 0, r: 0, b: 0, l: 0 };
  function readSafe() {
    const cs = getComputedStyle(document.getElementById('safe'));
    safe.t = parseFloat(cs.paddingTop) || 0; safe.r = parseFloat(cs.paddingRight) || 0;
    safe.b = parseFloat(cs.paddingBottom) || 0; safe.l = parseFloat(cs.paddingLeft) || 0;
  }

  /* ---------- World geometry (feet; x right, y up, z toward centre field) ---------- */
  const fenceDist = a => 400 - 70 * Math.pow(Math.min(1, Math.abs(a) / (Math.PI / 4)), 1.5);
  const WALL_H = 10;
  const TIERS = 8, TIER_D = 7.5;
  const tierH = i => 5 + i * 3.4;
  const EYE = 0.1; // batter's eye half-angle (radians)
  function standHeight(r, a) {
    const d = r - fenceDist(a) - 6;
    if (d < 0) return 0;
    if (Math.abs(a) < EYE) return d < 8 ? 28 : 0;
    const i = Math.floor(d / TIER_D);
    return i < TIERS ? tierH(i) : 4;
  }
  const WHEEL = { x: 44, y: 64, z: 500, r: 46 };
  const FISH = { x: -46, y: 52, z: 470 };
  const LIGHTHOUSE = { x: -172, z: 900, h: 78 };
  const TOWERS = [{ x: -70, z: 465, h: 66 }, { x: 96, z: 455, h: 80 }];
  const COASTER = { x0: -150, x1: -66, z: 540 };

  /* ---------- Sound ---------- */
  const N = Kit.audio.note;
  const S = Kit.sfx.define;
  S('rustle', { wave: 'noise', filter: 'bandpass', freq: 2600, cut: 2600, q: 1.1, attack: 0.07, hold: 0.12, release: 0.2, vol: 0.1 });
  S('whoosh2', o => ({ wave: 'noise', filter: 'bandpass', freq: 600, cut: 500, cutTo: 1400 + 1400 * (o.s || 1), q: 2.2, attack: 0.12, hold: 0.06, release: 0.2, vol: 0.2 }));
  S('crack', o => {
    const q = o.q || 0.5;
    return [
      { wave: 'noise', filter: 'highpass', freq: 2400 + 3200 * q, cut: 2400 + 3200 * q, attack: 0.001, hold: 0.004, release: 0.05 + 0.04 * q, vol: 0.5 + 0.2 * q },
      { wave: 'triangle', freq: 820 + 520 * q, to: 480, slide: 0.07, attack: 0.001, hold: 0.012, release: 0.16, vol: 0.32 },
      { wave: 'sine', freq: 190, to: 70, slide: 0.09, attack: 0.001, hold: 0.02, release: 0.12, vol: 0.42 },
      { wave: 'sine', freq: 2300 + 900 * q, attack: 0.001, hold: 0, decay: 0.1, sustain: 0.001, release: 0.12, vol: 0.14 * q, verb: 0.45 },
    ];
  });
  S('whiff', { wave: 'noise', filter: 'bandpass', freq: 2200, cut: 2400, cutTo: 420, q: 1.4, attack: 0.02, hold: 0.09, release: 0.14, vol: 0.3 });
  S('foul', [
    { wave: 'noise', filter: 'highpass', freq: 3200, cut: 3200, attack: 0.001, hold: 0.003, release: 0.03, vol: 0.32 },
    { wave: 'triangle', freq: 1700, to: 1100, slide: 0.05, attack: 0.001, hold: 0.01, release: 0.06, vol: 0.2 },
  ]);
  S('mitt', [
    { wave: 'noise', filter: 'lowpass', freq: 1500, cut: 1500, attack: 0.001, hold: 0.012, release: 0.07, vol: 0.55 },
    { wave: 'sine', freq: 170, to: 80, slide: 0.06, attack: 0.001, hold: 0.02, release: 0.09, vol: 0.5 },
  ]);
  S('roar', o => ({ wave: 'noise', filter: 'bandpass', freq: 800, cut: 650, cutTo: 1250, q: 0.55, attack: 0.4, hold: o.n || 1.4, release: 1.5, vol: 0.12 + 0.12 * (o.v || 0), verb: 0.35 }));
  S('cheer', { wave: 'noise', filter: 'bandpass', freq: 1300, cut: 1300, q: 0.7, attack: 0.05, hold: 0.25, release: 0.7, vol: 0.13, verb: 0.3 });
  S('groan', { wave: 'noise', filter: 'bandpass', freq: 500, cut: 700, cutTo: 380, q: 0.9, attack: 0.08, hold: 0.25, release: 0.4, vol: 0.12 });
  S('chase', { wave: 'sine', freq: N('C6'), arp: [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 28], arpStep: 0.055, attack: 0.002, hold: 0.68, release: 0.3, vol: 0.09, verb: 0.5 });
  S('target', [
    { wave: 'sine', freq: N('E6'), attack: 0.001, hold: 0, decay: 0.7, sustain: 0.001, release: 0.6, vol: 0.22, verb: 0.55 },
    { wave: 'sine', freq: N('B6'), at: 0.07, attack: 0.001, hold: 0, decay: 0.6, sustain: 0.001, release: 0.6, vol: 0.13, verb: 0.55 },
    { wave: 'sawtooth', freq: 110, filter: 'lowpass', cut: 900, attack: 0.01, hold: 0.4, release: 0.1, vol: 0.06, vib: 0.4, vibRate: 55 },
  ]);
  S('clunk', [
    { wave: 'square', freq: 110, to: 70, slide: 0.05, attack: 0.001, hold: 0.03, release: 0.06, vol: 0.2, filter: 'lowpass', cut: 700 },
    { wave: 'noise', filter: 'lowpass', freq: 900, cut: 900, attack: 0.001, hold: 0.01, release: 0.05, vol: 0.28 },
  ]);
  S('organ', { wave: 'square', freq: N('C5'), arp: [0, 4, 7, 12], arpStep: 0.085, attack: 0.005, hold: 0.42, release: 0.25, vol: 0.12, filter: 'lowpass', cut: 2300, vib: 0.12, vibRate: 6 });
  S('pitcher', { wave: 'square', freq: N('G4'), arp: [0, 0, 5, 9, 12], arpStep: 0.13, attack: 0.005, hold: 0.66, release: 0.3, vol: 0.11, filter: 'lowpass', cut: 1900, vib: 0.1 });
  S('flip', { wave: 'noise', filter: 'bandpass', freq: 3600, cut: 3600, q: 3, attack: 0.001, hold: 0.004, release: 0.025, vol: 0.09 });
  S('land', [
    { wave: 'sine', freq: 120, to: 60, slide: 0.08, attack: 0.001, hold: 0.02, release: 0.1, vol: 0.3 },
    { wave: 'noise', filter: 'lowpass', freq: 700, cut: 700, attack: 0.001, hold: 0.02, release: 0.08, vol: 0.18 },
  ]);
  S('wallhit', [
    { wave: 'noise', filter: 'lowpass', freq: 600, cut: 600, attack: 0.001, hold: 0.03, release: 0.12, vol: 0.4 },
    { wave: 'sine', freq: 90, to: 50, slide: 0.1, attack: 0.001, hold: 0.04, release: 0.15, vol: 0.4 },
  ]);
  S('golden', { wave: 'triangle', freq: N('E6'), arp: [0, 7, 12, 19, 24], arpStep: 0.05, attack: 0.002, hold: 0.28, release: 0.4, vol: 0.11, verb: 0.6 });
  S('boom', [
    { wave: 'noise', filter: 'lowpass', freq: 520, cut: 520, attack: 0.002, hold: 0.06, release: 0.6, vol: 0.24, verb: 0.55 },
    { wave: 'noise', filter: 'highpass', freq: 4000, cut: 4000, at: 0.08, attack: 0.05, hold: 0.25, release: 0.5, vol: 0.05 },
  ]);
  S('ballcall', { wave: 'noise', filter: 'lowpass', freq: 1100, cut: 1100, attack: 0.001, hold: 0.01, release: 0.05, vol: 0.3 });

  const SONG = {
    bpm: 112, swing: 0.24, key: 'F', scale: 'major', steps: 16,
    chords: [0, 0, 3, 4, 0, 5, 1, 4],
    tracks: [
      { name: 'kick', inst: 'kick', hits: 'x.......x.....x.', vol: 0.5 },
      { name: 'snare', inst: 'snare', hits: '..g.x..g..g.x.gg', vol: 0.28 },
      { name: 'hat', inst: 'hat', hits: 'x.gxx.gxx.gxx.gx', vol: 0.26 },
      { name: 'bass', inst: 'bass', notes: '0 . 2 . 4 . 5 . 7 . 5 . 4 . 2 .', follow: true, wave: 'triangle', cutoff: 820, vol: 0.72 },
      { name: 'organ', inst: 'pad', chord: true, every: 4, gate: 0.4, wave: 'square', cutoff: 1900, attack: 0.008, release: 0.12, vol: 0.2, verb: 0.2 },
      { name: 'lead', inst: 'lead', notes: '0 . 4 . 7 . 4 . 9 - 7 . 4 . 2 . 4 . 5 . 7 . 9 . 7 - - . . . . .', wave: 'square', cutoff: 2100, vol: 0.2, delay: 0.12 },
      { name: 'charge', inst: 'lead', notes: '0 . 2 . 4 . 5 . 7 - - . 7 . 9 . 11 - - . 11 . 12 - 14 - - - . . . .', wave: 'square', cutoff: 3000, vol: 0.24, oct: 1, on: false },
    ],
  };

  /* ---------- Pitches and pitchers ---------- */
  const KIND = {
    fb: { name: 'FASTBALL', T: 0.98, mph: 86, off: (u, o) => { o.x = 0; o.y = 0.22 * u * u; } },
    ch: { name: 'CHANGEUP', T: 1.32, mph: 76, off: (u, o) => { o.x = -0.3 * u * u; o.y = -0.65 * u * u; } },
    cu: { name: 'CURVEBALL', T: 1.2, mph: 73, off: (u, o) => { o.x = -0.45 * u * u; o.y = -1.55 * u * u; } },
    sl: { name: 'SLIDER', T: 1.05, mph: 82, off: (u, o) => { const v = u * u * u; o.x = 1.05 * v; o.y = -0.45 * v; } },
    kn: { name: 'KNUCKLER', T: 1.34, mph: 66, off: (u, o, ph) => { o.x = Math.sin(u * 8 + ph) * 0.3 * u + Math.sin(u * 21 + ph) * 0.12 * u * u; o.y = Math.cos(u * 6.5 + ph * 1.3) * 0.22 * u; } },
  };
  const ROSTER = [
    { kinds: ['fb'], speed: 0.72, jersey: '#B9C4CF', trim: '#1F4E79' },
    { kinds: ['fb', 'ch'], speed: 0.8, jersey: '#D8E2C8', trim: '#2D6A4F' },
    { kinds: ['fb', 'ch', 'cu'], speed: 0.86, jersey: '#C9B7E0', trim: '#5B2A86' },
    { kinds: ['fb', 'ch', 'cu', 'sl'], speed: 0.95, jersey: '#F2D0B0', trim: '#B5541F' },
    { kinds: ['fb', 'cu', 'sl', 'kn'], speed: 1.02, jersey: '#BFE3E6', trim: '#0F6B73' },
    { kinds: ['fb', 'ch', 'cu', 'sl', 'kn'], speed: 1.08, jersey: '#3A3550', trim: '#F7B32B' },
  ];
  function makePitcher(i, rnd) {
    const b = ROSTER[Math.min(i, ROSTER.length - 1)];
    const extra = Math.max(0, i - ROSTER.length + 1);
    const weights = b.kinds.map((k, j) => (j === b.kinds.length - 1 && b.kinds.length > 1 ? 1.4 : 1) * rnd.range(0.7, 1.3));
    return { i, kinds: b.kinds, weights, speed: Math.min(1.25, b.speed * rnd.range(0.97, 1.03) + extra * 0.04), jersey: b.jersey, trim: b.trim, acc: Math.max(0.62, 0.86 - i * 0.03) };
  }
  const ZONE = { x: 0.83, y0: 1.6, y1: 3.4 };
  const LAG = 0.1;        // seconds from letting go to the bat reaching the zone
  const SWEET = 0.62;     // ft: the reticle's reach
  const DRAG = 0.16, GRAV = 32.2, FLY_SPEED = 1.3;

  /* ---------- Saved ---------- */
  let tutDone = !!Kit.save.get('tut', false);
  let longestEver = +Kit.save.get('longest', 0) || 0;

  /* ---------- Run state ---------- */
  let G = null, rand = Kit.rng(1), nextSeed, autopilot = false;
  const crowd = { ex: 0 };
  const hold = { on: false, id: -1, x: 0, y: 0 };
  const ret = { x: 0, y: 2.5, show: false, kb: false };
  const test = { plan: null, zone: null, golden: false };
  function newRun(seed, auto) {
    rand = Kit.rng(seed === undefined || seed === null ? (Date.now() & 0xfffffff) : seed);
    G = {
      auto: !!auto, t: 0, score: 0, shown: 0, outs: 0, hr: 0, streak: 0, bestStreak: 0, longest: 0, targets: 0, contacts: 0,
      pitchNo: 0, pIdx: 0, pitcher: null, phase: 'ready', timer: 1.1, pitch: null, ball: null, swing: null, flight: null,
      night: 0, lift: 0, banner: null, sub: null, label: null, dist: 0, over: false, golden: false, pitcherIn: 0,
      chase: 0, wheelSpin: 0, wheelFlare: 0, fishFlare: 0, lampFlare: 0, kiteFlare: 0, fireworks: [], fielders: makeFielders(),
      wind: 0, mult: 1, tutShown: false, prevOuts: 0, kite: { x: 0, ph: rand.range(0, 6) }, stitchPop: 0,
    };
    G.pitcher = makePitcher(0, rand);
    ret.x = 0; ret.y = 2.5; ret.show = false;
    hold.on = false;
    lastTiles = null;
  }
  function makeFielders() {
    const pos = [[0, 300], [-150, 250], [150, 250], [-30, 145], [30, 145], [-85, 110], [85, 110]];
    return pos.map(([x, z], i) => ({ x, z, hx: x, hz: z, ph: i * 1.7, run: 0 }));
  }
  const multFor = s => Math.min(4, 1 + 0.5 * Math.max(0, s - 1));
  const isTut = () => G && !G.auto && !tutDone && G.pitchNo <= 2;

  function nextPitch() {
    G.pitchNo++;
    const pi = Math.floor(G.hr / 5);
    if (pi !== G.pIdx) { G.pIdx = pi; G.pitcher = makePitcher(pi, rand); }
    G.golden = test.golden || (G.pitchNo % 7 === 0);
    test.golden = false;
    G.phase = 'windup'; G.timer = 0.78;
    G.wind = 0;
    if (G.golden && !G.auto) { banner('GOLDEN PITCH', 'Worth triple', C.mustard, 1.4); Kit.sfx('golden'); }
    if (!G.auto) Kit.sfx('rustle', { delay: 120 });
  }
  function throwPitch() {
    const pc = G.pitcher;
    let kind, tx, ty, T;
    const meat = G.pitchNo <= 2;
    if (meat) { kind = 'fb'; tx = rand.range(-0.15, 0.15); ty = rand.range(2.35, 2.65); T = 1.55; }
    else {
      let tot = 0; for (const w of pc.weights) tot += w;
      let r = rand.next() * tot, j = 0;
      while (j < pc.kinds.length - 1 && (r -= pc.weights[j]) > 0) j++;
      kind = pc.kinds[j];
      const inZone = test.zone !== null ? test.zone : (G.golden || rand.chance(pc.acc));
      test.zone = null;
      if (inZone) { tx = rand.range(-ZONE.x + 0.15, ZONE.x - 0.15); ty = rand.range(ZONE.y0 + 0.15, ZONE.y1 - 0.15); }
      else {
        const side = rand.int(0, 3);
        tx = side === 0 ? -ZONE.x - rand.range(0.35, 0.9) : side === 1 ? ZONE.x + rand.range(0.35, 0.9) : rand.range(-0.6, 0.6);
        ty = side === 2 ? ZONE.y0 - rand.range(0.4, 0.9) : side === 3 ? ZONE.y1 + rand.range(0.35, 0.8) : rand.range(1.8, 3.2);
      }
      T = KIND[kind].T / pc.speed * rand.range(0.97, 1.03);
    }
    const K = KIND[kind], ph = rand.range(0, 6), o = {};
    K.off(1, o, ph);
    const rel = { x: -1.6, y: 6.1, z: 54 };
    const p = { kind, K, T, t: 0, ph, rel, tgt: { x: tx, y: ty }, aim: { x: tx - o.x, y: ty - o.y }, golden: G.golden, swung: false, called: false,
      inZone: Math.abs(tx) <= ZONE.x + 0.12 && ty >= ZONE.y0 - 0.12 && ty <= ZONE.y1 + 0.12, pos: { x: rel.x, y: rel.y, z: rel.z }, trail: [], mph: Math.round(K.mph * (meat ? 0.7 : G.pitcher.speed)) };
    G.pitch = p; G.phase = 'pitch';
    G.label = { text: K.name + '  ·  ' + p.mph + ' MPH', t: 1.6 };
    if (!G.auto) Kit.sfx('whoosh2', { s: 1 / (T / 1.1), vol: 0.9 });
    if (p.golden) p.spark = fx.fountain(0, 0, { rate: 40, follow: p.pos2 = { x: 0, y: 0 }, color: ['#FFE08A', '#FFF3D6', C.mustard], glow: true, size: [1.5, 3.5], life: [0.25, 0.5], speed: [10, 50] });
    // the unseen hand: attract mode, capture scenes and test plans swing for you
    const plan = test.plan || (G.auto ? autoPlan(p) : null);
    test.plan = null;
    if (plan && plan !== 'take') {
      p.plan = plan;
      const b = {}; pitchAt(p, 1, b);
      p.plan.rx = b.x + (plan.dx || 0); p.plan.ry = b.y + (plan.dy || 0);
      p.plan.at = p.T - LAG + (plan.e || 0);
    }
  }
  function autoPlan(p) {
    if (G.scenePlan) { const s = G.scenePlan; G.scenePlan = null; return s; }
    if (!p.inZone && rand.chance(0.75)) return 'take';
    const good = rand.chance(0.78);
    return good ? { e: rand.range(-0.035, 0.05), dx: rand.range(-0.1, 0.1), dy: rand.range(-0.18, 0.02) }
                : { e: rand.range(-0.12, 0.12), dx: rand.range(-0.5, 0.5), dy: rand.range(-0.5, 0.5) };
  }
  // position along the pitch: u = 0 at release, 1 at the plate, beyond into the mitt
  function pitchAt(p, u, o) {
    const uc = Math.min(u, 1), oo = T3;
    p.K.off(uc, oo, p.ph);
    o.x = p.rel.x + (p.aim.x - p.rel.x) * uc + oo.x;
    o.y = p.rel.y + (p.aim.y - p.rel.y) * uc + oo.y;
    o.z = p.rel.z * (1 - u);
    if (u > 1) { o.y -= (u - 1) * 1.2; o.x += (u - 1) * 0.3; }
    return o;
  }

  /* ---------- Swinging and contact ---------- */
  function trySwing(rx, ry) {
    if (!G || G.over) return;
    const p = G.pitch;
    if (G.phase !== 'pitch' || !p || p.swung) {
      if (!G.auto && (G.phase === 'windup' || G.phase === 'ready') && !G.swing) { G.sub = { text: 'Wait for the pitch', t: 0.9 }; }
      return;
    }
    const u = p.t / p.T;
    if (u > 1.12) return;
    p.swung = true;
    G.swing = { t: 0, rx, ry, res: null, applied: false };
    const e = p.t + LAG - p.T;
    const b = pitchAt(p, 1, {});
    const d = Math.hypot(rx - b.x, ry - b.y);
    const ae = Math.abs(e);
    let res;
    if (ae > 0.2 || d > SWEET) res = { type: 'whiff', e, d };
    else {
      const qt = 1 - Math.pow(clamp(ae / 0.2, 0, 1), 1.6), qd = 1 - Math.pow(clamp(d / SWEET, 0, 1), 1.6);
      const q = Math.min(qt, qd) * 0.4 + qt * qd * 0.6;
      const perfect = ae < 0.035 && d < 0.24;
      const spray = (e / 0.2) * 52 + (rx - b.x) * 6 + (G.auto ? 0 : rand.range(-4, 4)) * (1 - q);

  const stars = gfx.starfield({ count: 110, seed: 9, size: [0.4, 1.6], twinkle: 0.6 });
  function makeCanvas(w, h) {

    ctx.lineTo(ex2 + nx * w1, ey2 + ny * w1);
    ctx.arc(ex2, ey2, w1, pose.a + Math.PI / 2, pose.a - Math.PI / 2, true);
    ctx.lineTo(hX + Math.cos(pose.a) * L * 0.45 - nx * w0 * 1.3, hY + Math.sin(pose.a) * L * 0.45 - ny * w0 * 1.3);
    ctx.lineTo(hX - nx * w0, hY - ny * w0);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,220,170,0.6)'; ctx.lineWidth = Math.max(1, 0.05 * k);
    ctx.beginPath(); ctx.moveTo(hX + Math.cos(pose.a) * L * 0.5 + nx * w0, hY + Math.sin(pose.a) * L * 0.5 + ny * w0); ctx.lineTo(ex2 + nx * w1 * 0.8, ey2 + ny * w1 * 0.8); ctx.stroke();
    if (flash > 0) gfx.light(ctx, ex2, ey2, 60 * flash + 20, '#FFF3D6', flash);
    ctx.fillStyle = '#2B140C'; ctx.beginPath(); ctx.arc(hX, hY, 0.2 * k, 0, TAU); ctx.fill();
    // gloved hands
    ctx.fillStyle = '#F4F1EA'; ctx.beginPath(); ctx.arc(hX + Math.cos(pose.a) * 0.22 * k, hY + Math.sin(pose.a) * 0.22 * k, 0.21 * k, 0, TAU); ctx.fill();
    // head: neck, ear, red cap with the brim turned toward the pitcher
    const hx2 = X(0.05 + tw * 1.1), hy2 = Y(5.55);
    ctx.fillStyle = '#C98A68'; ctx.fillRect(hx2 - 0.2 * k, hy2 + 0.2 * k, 0.4 * k, 0.4 * k);
    ctx.fillStyle = '#3A2416'; ctx.beginPath(); ctx.ellipse(hx2, hy2 + 0.05 * k, 0.37 * k, 0.42 * k, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#C98A68'; ctx.beginPath(); ctx.ellipse(hx2 - 0.36 * k, hy2 + 0.1 * k, 0.09 * k, 0.15 * k, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = red;
    ctx.beginPath(); ctx.ellipse(hx2, hy2 - 0.1 * k, 0.42 * k, 0.36 * k, 0, Math.PI, 0); ctx.lineTo(hx2 + 0.42 * k, hy2 + 0.02 * k); ctx.lineTo(hx2 - 0.42 * k, hy2 + 0.02 * k); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#A51E1E'; ctx.beginPath(); ctx.ellipse(hx2 + 0.5 * k, hy2 - 0.02 * k, 0.32 * k, 0.08 * k, -0.15, 0, TAU); ctx.fill();
    ctx.fillStyle = '#FFF3D6'; ctx.beginPath(); ctx.arc(hx2, hy2 - 0.45 * k, 0.06 * k, 0, TAU); ctx.fill();
    ctx.fillStyle = night > 0.5 ? 'rgba(255,240,200,0.4)' : 'rgba(255,180,110,0.5)';
    ctx.beginPath(); ctx.ellipse(hx2 - 0.28 * k, hy2 - 0.14 * k, 0.08 * k, 0.2 * k, 0.4, 0, TAU); ctx.fill();
    // dust from the plate on a whiff
    if (sw && sw.whiff && !sw.dusted && sw.t > LAG + 0.15) { sw.dusted = true; fx.burst(X(0.6), Y(0.2), { count: 14, color: ['#C8794A', '#E5C9A0'], speed: [20, 70], angle: -Math.PI / 2, spread: 1.6, life: [0.4, 0.8], size: [2, 4], gravity: -10 }); }
  }

  /* ---------- Cached HUD text: stroked type is rasterised once, then blitted ---------- */
  const textCache = new Map();
  const measureCtx = document.createElement('canvas').getContext('2d');
  function ctext(c, str, x, y, o) {
    str = String(str);
    const key = str + '|' + o.size + '|' + o.color + '|' + (o.stroke || '') + '|' + (o.strokeWidth || 0) + '|' + (o.weight || 800);
    let e = textCache.get(key);
    if (!e) {
      measureCtx.font = (o.weight || 800) + ' ' + o.size + 'px ' + (o.font || DISP);
      const sw = o.stroke ? (o.strokeWidth || 3) : 0;
      const tw = Math.ceil(measureCtx.measureText(str).width + sw * 2 + 6), th = Math.ceil(o.size * 1.5 + sw * 2 + 4);
      const dpr = gfx.dpr || 1, cv = gfx.offscreen(Math.ceil(tw * dpr), Math.ceil(th * dpr)), g = cv.getContext('2d');
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      gfx.text(g, str, tw / 2, th / 2, Object.assign({}, o, { align: 'center', baseline: 'middle', alpha: 1 }));
      e = { cv, tw, th };
      if (textCache.size > 90) textCache.delete(textCache.keys().next().value);
      textCache.set(key, e);
    }
    const ox = o.align === 'left' ? 0 : o.align === 'right' ? -e.tw : -e.tw / 2;
    const a0 = c.globalAlpha;
    if (o.alpha !== undefined) c.globalAlpha = a0 * o.alpha;
    c.drawImage(e.cv, x + ox + (o.align === 'left' ? -3 : o.align === 'right' ? 3 : 0), y - e.th / 2, e.tw, e.th);
    c.globalAlpha = a0;
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { textCache.clear(); gfx.clearSprites('dg'); gfx.clearSprites('board'); });

  /* ---------- HUD: a hand-turned scoreboard, a baseball of stitches ---------- */
  let tiles = [];
  function drawHud(t) {
    const w = P.w, h = P.h;
    const x0 = Math.max(10, safe.l + 10), y0 = Math.max(10, safe.t + 10);
    const bw = Math.min(196, w * 0.52), bh = 86;
    // board (painted once, with its shadow)
    const pad = 14;
    gfx.blit(ctx, gfx.sprite('board' + bw, bw + pad * 2, bh + pad * 2, g => {
      g.save(); g.shadowColor = 'rgba(10,5,24,0.55)'; g.shadowBlur = 12; g.shadowOffsetY = 4;
      g.fillStyle = '#1C4733'; gfx.roundRect(g, pad, pad, bw, bh, 6).fill(); g.restore();
      g.strokeStyle = '#0F2A1E'; g.lineWidth = 3; gfx.roundRect(g, pad + 1.5, pad + 1.5, bw - 3, bh - 3, 5).stroke();
      g.strokeStyle = 'rgba(255,243,214,0.35)'; g.lineWidth = 1; gfx.roundRect(g, pad + 5, pad + 5, bw - 10, bh - 10, 3).stroke();
      g.fillStyle = C.ketchup; g.fillRect(pad + 5, pad + 5, bw - 10, 4);
      for (const [bx, by] of [[9, 14], [bw - 9, 14], [9, bh - 9], [bw - 9, bh - 9]]) { g.fillStyle = '#0F2A1E'; g.beginPath(); g.arc(pad + bx, pad + by, 1.6, 0, TAU); g.fill(); }
      gfx.text(g, 'OUTS', pad + 14, pad + 21, { size: 8, color: C.cream, font: DISP, weight: 800, align: 'left' });
    }), x0 + bw / 2, y0 + bh / 2);
    // outs: ten bulbs, half-lit for half an out
    const bx0 = x0 + 52, bsp = (bw - 64) / 9, by = y0 + 21;
    for (let i = 0; i < 10; i++) {
      const x = bx0 + i * bsp, lit = clamp(G.outs - i, 0, 1);
      ctx.fillStyle = '#0B2017'; ctx.beginPath(); ctx.arc(x, by, 5.2, 0, TAU); ctx.fill();
      if (lit > 0) {
        const pop = (i === Math.ceil(G.outs) - 1) ? bulbPop : 0;
        gfx.light(ctx, x, by, 13 + pop * 10, '#FF7A3D', 0.7);
        ctx.fillStyle = '#FFB27A';
        ctx.beginPath();
        if (lit >= 1) ctx.arc(x, by, 4.4 + pop * 1.5, 0, TAU); else { ctx.arc(x, by, 4.4 + pop, Math.PI / 2, Math.PI * 1.5); ctx.closePath(); }
        ctx.fill();
      } else { ctx.strokeStyle = 'rgba(255,243,214,0.25)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, by, 4, 0, TAU); ctx.stroke(); }
    }
    // score: cream flip tiles
    const val = Math.floor(G.shown), digits = String(val).padStart(6, '0').slice(-7);
    if (!lastTiles || lastTiles.length !== digits.length) { lastTiles = digits.split(''); tiles = digits.split('').map(() => 0); }
    const tw = Math.min(22, (bw - 26) / digits.length - 3), th = 30, tx0 = x0 + 13, ty = y0 + 33;
    let flips = 0;
    for (let i = 0; i < digits.length; i++) {
      if (digits[i] !== lastTiles[i]) { lastTiles[i] = digits[i]; tiles[i] = 1; flips++; }
      tiles[i] = Math.max(0, tiles[i] - 0.12);
      const x = tx0 + i * (tw + 3);
      const squash = Math.abs(Math.cos(tiles[i] * Math.PI));
      const lead = val < Math.pow(10, digits.length - 1 - i) && i < digits.length - 1;
      ctx.fillStyle = '#0B2017'; gfx.roundRect(ctx, x - 1, ty - 1, tw + 2, th + 2, 3).fill();
      ctx.fillStyle = lead ? '#C9BDA0' : C.cream;
      gfx.roundRect(ctx, x, ty + th / 2 - (th / 2) * squash, tw, th * squash, 2.5).fill();
      ctx.fillStyle = 'rgba(43,20,12,0.25)'; ctx.fillRect(x, ty + th / 2 - 0.5, tw, 1);
      if (squash > 0.3) {
        const spr = gfx.sprite('dg' + digits[i] + (lead ? 'l' : '') + tw, tw, th, (g, sw, shh) => gfx.text(g, digits[i], sw / 2, shh / 2 + 1, { size: 19, color: lead ? '#9E9078' : C.ink, font: DISP, weight: 800 }));
        ctx.drawImage(spr, x, ty + th / 2 - (th / 2) * squash, tw, th * squash);
      }
    }
    if (flips && !G.auto) Kit.sfx('flip', { pitch: Kit.rng().range(-2, 2) });
    ctext(ctx, 'PITCHER ' + (G.pIdx + 1), x0 + 14, y0 + bh - 9, { size: 8, color: 'rgba(255,243,214,0.8)', font: DISP, weight: 600, align: 'left' });
    const nightLbl = G.night < 0.25 ? 'DUSK' : G.night < 0.7 ? 'TWILIGHT' : 'NIGHT';
    ctext(ctx, nightLbl, x0 + bw - 14, y0 + bh - 9, { size: 8, color: 'rgba(247,179,43,0.9)', font: DISP, weight: 600, align: 'right' });

    // streak: a baseball rising from the bottom edge, one stitch pair per home run in a row
    drawStreakBall(t);

    // the flight distance races up
    if (G.phase === 'flight' || (G.phase === 'after' && G.dist > 0 && G.lastWasFlight)) {
      const f = G.flight;
      const y = Math.max(y0 + bh + 44, h * 0.17);
      const big = f && f.hr && f.landed;
      const s = 1 + (big ? 0.15 * Math.max(0, 1 - (f.post > 0 ? 1.5 - f.post : 1) * 3) : 0);
      ctext(ctx, G.dist + ' FT', w / 2, y, { size: 44 * s, color: f && f.hr ? C.mustard : C.cream, stroke: '#5A0F0F', strokeWidth: 7, font: DISP, weight: 800 });
      if (G.ball && G.ball.res) ctext(ctx, Math.round(G.ball.res.ev) + ' MPH  ·  ' + Math.round(G.ball.res.la) + '°', w / 2, y + 32, { size: 12, color: C.cream, stroke: 'rgba(26,18,48,0.8)', strokeWidth: 4, font: DISP, weight: 600 });
    }
    G.lastWasFlight = G.phase === 'flight' || (G.phase === 'after' && G.lastWasFlight && G.timer > 0);
    // pitch label
    if (G.label && G.phase !== 'flight') {
      const a = clamp(G.label.t * 2, 0, 1);
      ctx.globalAlpha = a;
      ctext(ctx, G.label.text, w / 2, Math.max(y0 + bh + 24, h * 0.15), { size: 12, color: C.cream, stroke: 'rgba(26,18,48,0.85)', strokeWidth: 4, font: DISP, weight: 600 });
      ctx.globalAlpha = 1;
    }
    // banner
    if (G.banner) {
      const b = G.banner, u = b.t;
      const pop = u < 0.25 ? Kit.ease.backOut(u / 0.25) : 1, out = clamp((b.life - u) / 0.3, 0, 1);
      const y = h * 0.4;
      ctx.save(); ctx.globalAlpha = out; ctx.translate(w / 2, y); ctx.rotate(-0.06); ctx.scale(pop, pop);
      const big = b.text === 'HOME RUN';
      ctext(ctx, b.text, 0, 0, { size: big ? Math.min(54, w * 0.13) : Math.min(40, w * 0.1), color: b.color, stroke: '#5A0F0F', strokeWidth: big ? 9 : 7, font: DISP, weight: 800 });
      if (b.sub) ctext(ctx, b.sub, 0, big ? 42 : 34, { size: big ? 18 : 14, color: C.cream, stroke: 'rgba(26,18,48,0.9)', strokeWidth: 5, font: DISP, weight: 800 });
      ctx.restore();
    }
    if (G.sub) ctext(ctx, G.sub.text, w / 2, h * 0.47, { size: 14, color: C.cream, stroke: 'rgba(26,18,48,0.85)', strokeWidth: 4, font: DISP, weight: 600, alpha: clamp(G.sub.t * 3, 0, 1) });
    // one-line hint while learning
    if (!tutDone && G.pitchNo <= 3 && G.phase !== 'flight') {
      ctext(ctx, 'Hold to aim, let go to swing', w / 2, h - Math.max(66, safe.b + 66), { size: 15, color: C.cream, stroke: 'rgba(26,18,48,0.85)', strokeWidth: 5, font: DISP, weight: 600 });
    }
  }
  function drawStreakBall(t) {
    const w = P.w, h = P.h;
    const R = Math.min(w * 0.42, 190), cx = w / 2, cy = h + R - Math.max(40, safe.b + 34) - G.stitchPop * 6;
    const seamR = R * 0.82, a0 = -Math.PI / 2 - 0.62, a1 = -Math.PI / 2 + 0.62, n = 10;
    const vis = Math.ceil(Math.max(40, safe.b + 34)) + 16, sw2 = Math.ceil(R * 2 + 32);
    gfx.blit(ctx, gfx.sprite('sball' + R + '_' + vis, sw2, vis, (g, W2) => {
      const ox = W2 / 2, oy = R + 16;
      g.save(); g.shadowColor = 'rgba(10,5,24,0.5)'; g.shadowBlur = 14;
      g.fillStyle = '#F4EBD6'; g.beginPath(); g.arc(ox, oy, R, 0, TAU); g.fill(); g.restore();
      g.fillStyle = 'rgba(120,90,60,0.12)'; g.beginPath(); g.arc(ox + R * 0.1, oy + R * 0.08, R * 0.95, 0, TAU); g.fill();
      g.strokeStyle = 'rgba(214,40,40,0.35)'; g.lineWidth = 1.5;
      g.beginPath(); g.arc(ox, oy + R * 0.12, seamR, a0, a1); g.stroke();
    }), cx, cy - R - 16 + vis / 2);
    const st = Math.min(G.streak, n);
    for (let i = 0; i < n; i++) {
      const a = a0 + (a1 - a0) * (i + 0.5) / n, x = cx + Math.cos(a) * seamR, y = cy + R * 0.12 + Math.sin(a) * seamR;
      const lit = i < st, pop = lit && i === st - 1 ? G.stitchPop : 0;
      ctx.save(); ctx.translate(x, y); ctx.rotate(a + Math.PI / 2); ctx.scale(1 + pop, 1 + pop);
      ctx.strokeStyle = lit ? C.ketchup : 'rgba(214,40,40,0.22)'; ctx.lineWidth = lit ? 2.6 : 2;
      ctx.beginPath(); ctx.moveTo(-6, -5); ctx.lineTo(0, 0); ctx.lineTo(6, -5); ctx.stroke();
      ctx.restore();
      if (lit) gfx.light(ctx, x, y, 12 + pop * 20, '#FF5D5D', 0.25 + pop * 0.5);
    }
    const mult = multFor(G.streak);
    const topY = cy - R;
    ctext(ctx, G.streak ? 'STREAK ' + G.streak + '   ×' + mult.toFixed(1) : 'STREAK', cx, topY + 26, { size: 12, color: G.streak ? C.ketchup : 'rgba(43,20,12,0.5)', font: DISP, weight: 800 });
  }

  /* ---------- Loop, input, shell ---------- */
  const loop = Kit.loop({ view, update, draw });
  const input = Kit.input(view.canvas);
  function canAim() { return G && !G.auto && shell.phase === 'play' && !G.over; }
  function aimFromPointer() {
    unplate(hold.x, hold.y - 80 - (G ? G.lift : 0), T0);
    ret.x = clamp(T0.x, -2.4, 2.4); ret.y = clamp(T0.y, 0.4, 5);
  }
  input.on('down', p => { if (!canAim()) return; hold.on = true; hold.id = p.id; hold.x = p.x; hold.y = p.y; ret.kb = false; aimFromPointer(); });
  input.on('move', p => { if (!hold.on || p.id !== hold.id) return; hold.x = p.x; hold.y = p.y; aimFromPointer(); });
  input.on('up', p => { if (!hold.on || p.id !== hold.id) return; hold.x = p.x; hold.y = p.y; aimFromPointer(); hold.on = false; trySwing(ret.x, ret.y); });

  const shell = Kit.shell({
    title: 'Long Ball Night',
    kicker: 'A seaside home run derby',
    tagline: 'Hold to aim, let go to swing. Light up the boardwalk.',
    playLabel: 'Play ball',
    how: [
      'Hold anywhere: the sweet spot appears above your thumb. Slide to put it where the pitch will cross.',
      'Let go to swing. Early pulls the ball left, late pushes it right. Too far off is a whiff.',
      'Whiffs, fouls and called strikes are an out. A ball kept in the park is half an out. 10 outs ends the derby.',
      'Home runs in a row raise the multiplier. Hit the Ferris wheel, the neon fish, the kite or the lighthouse lamp for a bonus. Golden pitches pay triple.',
      'Keys: arrows aim, Space swings.',
    ],
    loop,
    score: () => (G && !G.auto ? Math.round(G.score) : 0),
    lose: () => { if (G && !G.auto) { G.outs = 10; endRun(); } },
    theme: {
      panel: 'solid', layout: 'bottom', button: 'rounded', titleStyle: 'stamp', font: 'house', radius: 14,
      colors: { ink: '#2B140C', inkSoft: '#6B4A3A', panel: '#FFF3D6', accent: '#F7B32B', accentInk: '#2B140C', scrim: 'var(--scrim)', line: '#D62828' },
    },
    runProps: () => ({ pitcher: G ? G.pIdx + 1 : 1 }),
    onStart() {
      newRun(nextSeed, autopilot); nextSeed = undefined;
      Kit.music.play(SONG, { restart: true });
      Kit.music.layer('charge', false);
    },
    onOver() { Kit.music.layer('charge', false); },
  });

  /* ---------- Test hooks ---------- */
  Arcade.test({
    seed(n) { nextSeed = n; },
    perfect() { test.plan = { e: 0, dx: 0, dy: -0.1 }; },
    swing(e, dx, dy) { test.plan = { e: e || 0, dx: dx || 0, dy: dy || 0 }; },
    whiff() { test.plan = { e: 0, dx: 2.2, dy: 0 }; },
    take() { test.plan = 'take'; },
    zone(inZone) { test.zone = !!inZone; },
    golden() { test.golden = true; },
    pitcher(n) { if (G) { G.hr = 5 * n; G.pIdx = n; G.pitcher = makePitcher(n, rand); } },
    night(v) { if (G) { G.nightLock = v; G.night = v; } },
    step(sec) { loop.step(Math.round((sec || 1) * 60)); },
    // play until the next pitch has been decided (ready -> result)
    pitchOut() { let n = 0; const start = G.pitchNo; while (n++ < 900 && !(G.pitchNo > start && G.phase === 'ready') && !G.over) loop.step(1); loop.step(1); return n; },
    info: () => (G ? { phase: G.phase, outs: G.outs, hr: G.hr, streak: G.streak, score: G.score, pitchNo: G.pitchNo, pitcher: G.pIdx, night: G.night, targets: G.targets, longest: G.longest, kind: G.pitch && G.pitch.kind, auto: G.auto, best: shell.best } : null),
    geom: () => ({ fence0: fenceDist(0), fence45: fenceDist(Math.PI / 4), hor: P.hor, f: P.f }),
  });

  /* ---------- Capture scenes ---------- */
  function scene(seed, opts) {
    fx.seed(seed);
    nextSeed = seed; autopilot = true;
    shell.start();
    newRun(seed, true);
    G.scene = true;
    if (opts.night !== undefined) { G.nightLock = opts.night; G.night = opts.night; }
    if (opts.pre) opts.pre();
    G.pitchNo = opts.pitchNo || 4;
    G.phase = 'ready'; G.timer = 0.05;
    if (opts.golden) test.golden = true;
    if (opts.zone !== undefined) test.zone = opts.zone;
    G.scenePlan = opts.plan || null;
    const until = opts.until;
    let n = 0;
    while (n++ < 1200 && !until()) loop.step(1);
    if (opts.post) opts.post();
    if (opts.keep) return;
    loop.render();
    loop.stop();
  }
  Arcade.scenes({
    art: () => scene(41, {
      night: 0.18, plan: { e: 0.035, dx: 0, dy: -0.32 }, zone: true, golden: false,
      until: () => G.phase === 'flight' && G.ball && G.ball.z > 170,
      post: () => { G.swing = { t: 0.36, rx: 0.1, ry: 2.6, res: { type: 'hit' }, applied: true }; G.chase = 1.5; crowd.ex = 0.8; G.banner = null; G.label = null; },
    }),
    shot1: () => scene(12, {
      night: 0.08, zone: true, pitchNo: 5,
      pre: () => { G.score = 1290; G.shown = 1290; G.outs = 2.5; G.hr = 3; G.streak = 2; G.auto = false; G.scenePlan = 'take'; test.plan = 'take'; G.pitchNo = 4; },
      until: () => G.phase === 'pitch' && G.pitch && G.pitch.t / G.pitch.T > 0.8,
      post: () => { hold.on = true; pr(G.pitch.tgt.x + 0.1, G.pitch.tgt.y + 0.05, 0, T0); hold.x = T0.x; hold.y = T0.y + 80; aimFromPointer(); ret.show = true; G.label.t = 1; },
    }),
    shot2: () => scene(77, shot2Opts(SHOT2)),
  });
  const SHOT2 = { e: -0.025, dx: 0, dy: -0.1 };
  function shot2Opts(plan, keep) {
    return {
      night: 0.95, golden: true, zone: true, pitchNo: 20, keep,
      plan: Object.assign({}, plan),
      pre: () => { G.score = 14820; G.shown = 14820; G.outs = 6; G.hr = 12; G.pIdx = 2; G.pitcher = makePitcher(2, rand); G.streak = 3; G.bestStreak = 3; },
      until: () => (G.flight && G.flight.hitTarget) || G.pitchNo > 21,
      post: () => { if (keep) return; for (let i = 0; i < 8; i++) loop.step(1); G.auto = false; homeRunScene(); },
    };
  }
  Arcade.test({ tryShot2(e, dx, dy) { scene(77, shot2Opts({ e, dx, dy }, true)); const r = { hit: G.flight && G.flight.hitTarget, pn: G.pitchNo, res: G.ball && G.ball.res, dist: G.flight && G.flight.dist, last: window.__lastHit }; loop.start(); return JSON.stringify(r); } });
  function homeRunScene() {
    // the streak climbs as the golden ball lights the sign
    G.streak = 4; G.stitchPop = 0.6; G.score += 2400; G.shown = G.score - 600;
    G.banner = { text: 'HOME RUN', sub: '+' + Kit.fmt(1272 * 3) + '  ×2.5  ×3 GOLD', color: C.mustard, t: 0.5, life: 2 };
    crowd.ex = 1;
  }

  // attract mode: the derby plays itself behind the title
  newRun(3, true);
  G.night = 0.12; G.nightLock = undefined;
  layout();
  loop.step(200);
  Kit.music.play(SONG);
  loop.start();
})();
</script>
</body>
</html>
