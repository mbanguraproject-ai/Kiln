<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Crosswake</title>
<meta name="description" content="Crosswake: drop two stones in a garden pond at dusk. Where their ripples cross, a spark runs across the water and lights every lantern it touches.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=Unbounded:wght@500;600;800&display=swap">
<style>
/* World: a temple-garden koi pond at blue hour, seen from above. Raked gravel, moss, red maples,
   floating paper lanterns. The world keeps one palette in both themes; panels are washi paper. */
:root {
  --night: #0A1D21;
  --ink: #F3EAD7;
  --ink-soft: rgba(243, 234, 215, 0.72);
  --paper: #F1E7D3;
  --paper-ink: #2A2019;
  --paper-soft: #6B5A48;
  --seal: #CF4128;
  --seal-ink: #FFF6E8;
  --lacquer: #1E1612;
  --lacquer-2: #2E221B;
  --brass: #C99A5B;
  --bamboo: #A9BC6A;
  --bamboo-2: #6F8A3E;
  --scrim: rgba(6, 18, 20, 0.46);
  --font-display: "Unbounded", "Arial Black", "Helvetica Neue", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #ECE1CA; --scrim: rgba(3, 11, 13, 0.6); }
}
:root[data-theme="dark"] { --paper: #ECE1CA; --scrim: rgba(3, 11, 13, 0.6); }
:root[data-theme="light"] { --paper: #F4EBD8; --scrim: rgba(10, 26, 28, 0.42); }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: var(--night); }
body { color: var(--ink); font: 600 16px/1.4 var(--font-body); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
#pond { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

/* ---------- the control tray: a lacquered board with a bamboo water-clock and a vermilion seal ---------- */
#controls {
  position: fixed; z-index: 10; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  transform: translateX(-50%); width: min(540px, calc(100% - 20px));
  display: grid; grid-template-columns: 48px minmax(0, 1fr) 84px; gap: 12px; align-items: center;
  padding: 10px 10px 10px 10px; border-radius: 26px;
  background: linear-gradient(180deg, rgba(46, 34, 27, 0.94), rgba(24, 17, 14, 0.96));
  box-shadow: inset 0 1px 0 rgba(255, 228, 186, 0.14), inset 0 0 0 1px rgba(201, 154, 91, 0.32), 0 18px 40px -14px rgba(0, 0, 0, 0.75);
  transition: opacity 0.25s ease, transform 0.3s ease;
}
#controls::before { content: ""; position: absolute; inset: 4px; border-radius: 22px; pointer-events: none; box-shadow: inset 0 0 0 1px rgba(201, 154, 91, 0.12); }
body.cw-hide #controls { opacity: 0; pointer-events: none; transform: translate(-50%, 18px); }
.cw-round {
  width: 48px; height: 48px; border: 0; border-radius: 50%; cursor: pointer; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #5B6462, #2F3536 70%); color: var(--ink);
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 4px 10px -4px rgba(0, 0, 0, 0.6);
  transition: transform 0.08s, opacity 0.2s;
}
.cw-round svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.cw-round:active { transform: scale(0.94); }
.cw-round:disabled { opacity: 0.35; cursor: default; transform: none; }
.wait { display: grid; gap: 4px; min-width: 0; }
.wait label { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font: 800 10.5px/1 var(--font-body); letter-spacing: 0.14em; text-transform: uppercase; color: rgba(243, 234, 215, 0.62); white-space: nowrap; }
.wait label b { font: 600 13px/1 var(--font-display); letter-spacing: 0; color: var(--ink); font-variant-numeric: tabular-nums; }
#delay { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; margin: 0; background: transparent; cursor: pointer; }
#delay::-webkit-slider-runnable-track {
  height: 10px; border-radius: 6px;
  background: repeating-linear-gradient(90deg, transparent 0 46px, rgba(40, 52, 20, 0.7) 46px 48px), linear-gradient(180deg, #C9D98A, var(--bamboo) 45%, var(--bamboo-2));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 1px 0 rgba(0, 0, 0, 0.4);
}
#delay::-moz-range-track { height: 10px; border-radius: 6px; background: linear-gradient(180deg, #C9D98A, var(--bamboo) 45%, var(--bamboo-2)); }
#delay::-webkit-slider-thumb {
  -webkit-appearance: none; width: 30px; height: 26px; margin-top: -8px; border-radius: 50%;
  background: radial-gradient(circle at 36% 30%, #A8B0AC, #4A5250 62%, #2C3131); border: 0;
  box-shadow: 0 3px 6px rgba(0, 0, 0, 0.5), inset 0 -2px 0 rgba(0, 0, 0, 0.3);
}
#delay::-moz-range-thumb { width: 30px; height: 26px; border: 0; border-radius: 50%; background: radial-gradient(circle at 36% 30%, #A8B0AC, #4A5250 62%, #2C3131); }
#delay:disabled { opacity: 0.38; cursor: default; }
#delay:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 8px; }
#dropBtn {
  position: relative; height: 62px; border: 0; border-radius: 18px; cursor: pointer;
  background: radial-gradient(circle at 40% 25%, #E9654A, var(--seal) 55%, #9E2C1A);
  color: var(--seal-ink); font: 800 15px/1 var(--font-display); letter-spacing: 0.02em;
  box-shadow: inset 0 0 0 3px rgba(255, 236, 214, 0.9), inset 0 0 0 5px var(--seal), inset 0 -4px 0 rgba(0, 0, 0, 0.25), 0 8px 18px -8px rgba(207, 65, 40, 0.9);
  transition: transform 0.08s, filter 0.2s;
}
#dropBtn:active { transform: translateY(2px) scale(0.97); }
#dropBtn:disabled { cursor: default; filter: grayscale(0.85) brightness(0.62); transform: none; }
#dropBtn.ready { animation: seal 1.6s ease-in-out infinite; }
#dropBtn:focus-visible, .cw-round:focus-visible { outline: 3px solid var(--brass); outline-offset: 3px; }
@keyframes seal { 0%, 100% { box-shadow: inset 0 0 0 3px rgba(255, 236, 214, 0.9), inset 0 0 0 5px var(--seal), inset 0 -4px 0 rgba(0, 0, 0, 0.25), 0 8px 18px -8px rgba(207, 65, 40, 0.9); }
  50% { box-shadow: inset 0 0 0 3px rgba(255, 236, 214, 0.9), inset 0 0 0 5px var(--seal), inset 0 -4px 0 rgba(0, 0, 0, 0.25), 0 0 26px 2px rgba(255, 140, 90, 0.55); } }
@media (max-height: 650px) {
  #controls { grid-template-columns: 44px minmax(0, 1fr) 78px; padding: 8px; border-radius: 22px; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); }
  #controls::before { border-radius: 18px; }
  .cw-round { width: 44px; height: 44px; }
  #dropBtn { height: 56px; }
}
@media (prefers-reduced-motion: reduce) { #dropBtn.ready { animation: none; } #controls { transition: none; } }

/* ---------- the kit shell, dressed as washi paper and ink ---------- */
.k-shell { --k-radius: 20px; }
.k-shell .k-title { background: radial-gradient(130% 60% at 50% 42%, rgba(4, 14, 16, 0.55), transparent 72%), linear-gradient(to bottom, rgba(4, 14, 16, 0.25), transparent 30%, transparent 62%, rgba(4, 14, 16, 0.6)); }
.k-shell .k-title-h { font: 600 clamp(34px, 10vw, 64px)/1 var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); text-shadow: 0 2px 0 rgba(0, 0, 0, 0.25), 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 60px rgba(255, 190, 110, 0.25); padding-left: 0.12em; }
.k-shell .k-title-head::before {
  content: ""; width: 54px; height: 54px; border-radius: 12px; margin: 0 auto 4px;
  background: radial-gradient(circle, transparent 5px, var(--seal-ink) 5.5px 7.5px, transparent 8px 12px, var(--seal-ink) 12.5px 14.5px, transparent 15px 19px, var(--seal-ink) 19.5px 21px, transparent 21.5px), var(--seal);
  box-shadow: 0 6px 18px -6px rgba(207, 65, 40, 0.8), inset 0 0 0 2px rgba(255, 246, 232, 0.25); transform: rotate(-4deg);
}
.k-shell .k-kicker { color: rgba(243, 234, 215, 0.78); letter-spacing: 0.3em; }
.k-shell .k-tagline { color: rgba(243, 234, 215, 0.86); font-weight: 600; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7); }
.k-shell .k-best { color: rgba(243, 234, 215, 0.7); }
.k-shell .k-title .k-btn.k-primary { border-radius: 18px; }
.k-shell[data-panel=paper] .k-panel {
  transform: none; border: 0; color: var(--paper-ink);
  background:
    radial-gradient(120% 80% at 100% 0%, rgba(207, 65, 40, 0.08), transparent 50%),
    repeating-linear-gradient(97deg, rgba(120, 96, 64, 0.035) 0 2px, transparent 2px 9px),
    repeating-linear-gradient(-8deg, rgba(120, 96, 64, 0.03) 0 1px, transparent 1px 13px),
    var(--paper);
  box-shadow: inset 0 0 0 1px rgba(43, 33, 24, 0.18), inset 0 0 0 6px var(--paper), inset 0 0 0 7px rgba(43, 33, 24, 0.12), 0 30px 70px -24px rgba(0, 0, 0, 0.75);
}
.k-shell[data-panel=paper] .k-panel::after {
  content: ""; position: absolute; top: 14px; right: 14px; width: 26px; height: 26px; border-radius: 6px; transform: rotate(6deg);
  background: radial-gradient(circle, transparent 3px, var(--seal-ink) 3.5px 4.5px, transparent 5px 7px, var(--seal-ink) 7.5px 8.5px, transparent 9px), var(--seal); opacity: 0.9;
}
.k-shell[data-panel=paper] .k-btn { box-shadow: inset 0 0 0 1.5px rgba(43, 33, 24, 0.45); }
.k-shell[data-panel=paper] .k-btn.k-primary { box-shadow: inset 0 0 0 2px rgba(255, 236, 214, 0.75), inset 0 0 0 4px var(--seal), inset 0 -4px 0 rgba(0, 0, 0, 0.2), 0 10px 22px -10px rgba(207, 65, 40, 0.9); }
.k-shell[data-panel=paper] .k-btn.k-primary:active { transform: translateY(2px) scale(0.98); box-shadow: inset 0 0 0 2px rgba(255, 236, 214, 0.75), inset 0 0 0 4px var(--seal); }
.k-shell .k-panel h2, .k-shell .k-score { font-family: var(--font-display); font-weight: 600; letter-spacing: 0.02em; }
.k-shell .k-stat { background: rgba(43, 33, 24, 0.07); }
.k-shell .k-pausebtn { border-radius: 50%; background: radial-gradient(circle at 36% 30%, rgba(80, 90, 88, 0.85), rgba(26, 32, 33, 0.85) 70%); color: var(--ink); box-shadow: inset 0 0 0 1.5px rgba(243, 234, 215, 0.28), 0 6px 14px -6px rgba(0, 0, 0, 0.7); }
.k-shell .k-toast { background: var(--paper); color: var(--paper-ink); }
.kiln-keyart #controls { display: none !important; }
</style>
</head>
<body class="cw-hide">
<canvas id="pond" aria-label="The pond. Tap twice to place two stones, set how long the second waits, then press Drop."></canvas>
<div id="controls" role="group" aria-label="Drop controls">
  <button class="cw-round" id="clearBtn" type="button" aria-label="Pick up the stones" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4v4h4"/></svg>
  </button>
  <div class="wait">
    <label for="delay"><span>Second stone waits</span><b id="delayVal">0.00 s</b></label>
    <input type="range" id="delay" min="0" max="1000" step="1" value="0" disabled>
  </div>
  <button id="dropBtn" type="button" disabled>Drop</button>
</div>

<script src="../../hub/sdk.js"></script>
<script src="../../hub/kit.js"></script>
<script>
(() => {
  'use strict';
  Arcade.init({ id: 'crosswake', title: 'Crosswake', version: '1.0.0' });
  const { gfx, fx } = Kit;
  const store = Arcade.store;

  /* ---------- rules (distances in pond units: the pond is 420 units wide) ---------- */
  const PW = 420;               // pond width in units
  const V = 0.32 * PW;          // ripple speed, units per second
  const R_STONE = 0.9 * PW;     // a stone's ripple fades at this radius
  const R_LANTERN = 0.3 * PW;   // a lantern's ripple fades at this radius
  const LANTERN_R = 15;         // lantern hit radius
  const STONE_GAP = 34;         // minimum distance between the two stones
  const MAX_WAIT = 0.92;        // delay slider maximum, as a share of the time a ripple takes to cross between the stones
  const WM = 20;                // open water beyond the play area, in units
  const FALL = 0.2;             // seconds a stone takes to fall before it hits the water

  const clamp = Kit.clamp;
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const TAU = Math.PI * 2;
  const reduced = () => Kit.reducedMotion;
  function mulberry32(a) {
    return () => {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ---------- geometry ---------- */
  function circleX(c1, r1, c2, r2) {
    const d = dist(c1, c2);
    if (d < 1e-9 || d > r1 + r2 || d < Math.abs(r1 - r2)) return [];
    const a = (r1 * r1 - r2 * r2 + d * d) / (2 * d);
    const h2 = r1 * r1 - a * a;
    if (h2 < 0) return [];
    const h = Math.sqrt(h2);
    const ux = (c2.x - c1.x) / d, uy = (c2.y - c1.y) / d;
    const px = c1.x + a * ux, py = c1.y + a * uy;
    return [{ x: px - h * uy, y: py + h * ux }, { x: px + h * uy, y: py - h * ux }];
  }
  // The spark path of two ripples: centre A starting at tA and centre B starting at tB (two branches).
  function sparkPath(A, tA, RA, B, tB, RB, step = 1 / 90) {
    const out = [[], []];
    const t0 = Math.max(tA, tB);
    const tEnd = Math.min(tA + RA / V, tB + RB / V);
    for (let t = t0; t <= tEnd + 1e-9; t += step) {
      const ps = circleX(A, V * (t - tA), B, V * (t - tB));
      if (ps.length === 2) { out[0].push(ps[0]); out[1].push(ps[1]); }
    }
    return out;
  }
  // When (if ever) the crossing of ripples a and b passes over point L.
  function crossingAt(a, b, L) {
    const da = dist(a, L), db = dist(b, L);
    if (da < 1e-6 || db < 1e-6 || da > a.R + LANTERN_R || db > b.R + LANTERN_R) return null;
    const ta = a.t + da / V, tb = b.t + db / V;
    const mismatch = Math.abs(ta - tb) * V;
    const gx = (L.x - a.x) / da - (L.x - b.x) / db, gy = (L.y - a.y) / da - (L.y - b.y) / db;
    const off = mismatch / Math.max(0.35, Math.hypot(gx, gy));
    return off < LANTERN_R ? Math.max(ta, tb) : null;
  }
  // Runs one drop: returns the ripples and the lanterns it lights, in order.
  function simulate(stones, lanterns, litBefore) {
    const rings = stones.map(s => ({ x: s.x, y: s.y, t: s.t, R: R_STONE, depth: 0, parents: null }));
    const lit = new Map();
    const queue = [];
    const consider = (a, b) => {
      lanterns.forEach((L, i) => {
        if (litBefore.has(i) || lit.has(i)) return;
        const t = crossingAt(a, b, L);
        if (t != null) queue.push({ i, t, depth: Math.max(a.depth, b.depth) + 1, a, b });
      });
    };
    for (let i = 0; i < rings.length; i++) for (let j = i + 1; j < rings.length; j++) consider(rings[i], rings[j]);
    const events = [];
    while (queue.length) {
      let k = 0;
      for (let q = 1; q < queue.length; q++) if (queue[q].t < queue[k].t) k = q;
      const ev = queue.splice(k, 1)[0];
      if (lit.has(ev.i)) continue;
      lit.set(ev.i, ev);
      events.push(ev);
      const L = lanterns[ev.i];
      const ring = { x: L.x, y: L.y, t: ev.t, R: R_LANTERN, depth: ev.depth, parents: [ev.a, ev.b] };
      for (const r of rings) consider(ring, r);
      rings.push(ring);
      if (events.length > 64) break;
    }
    const end = Math.max(...rings.map(r => r.t + r.R / V));
    return { rings, events, end };
  }

  /* ---------- ponds (built backwards from a hidden solution, so every pond can be cleared) ---------- */
  function makePond(n, seed, teach) {
    for (let attempt = 0; attempt < 30; attempt++) {
      const rng = mulberry32(seed + attempt * 7919);
      const ph = pondH;
      const pairs = teach ? 1 : n <= 3 ? 1 : n <= 8 ? 2 : 3;
      const margin = 34;
      const lanterns = [];
      const solution = [];
      const randPt = (m = margin) => ({ x: m + rng() * (PW - 2 * m), y: m + rng() * (ph - 2 * m) });
      const freeSpot = p => p.x > 22 && p.x < PW - 22 && p.y > 22 && p.y < ph - 22 && lanterns.every(l => dist(l, p) > LANTERN_R * 2.9);
      for (let p = 0; p < pairs; p++) {
        let placed = false;
        for (let tries = 0; tries < 60 && !placed; tries++) {
          const A = randPt(48), B = randPt(48);
          const sep = dist(A, B);
          if (sep < 0.3 * PW || sep > 0.72 * PW) continue;
          let wait;
          if (teach === 1) wait = 0;
          else if (teach === 2) wait = 0.55 + rng() * 0.2;
          else if (teach === 3) wait = 0;
          else wait = rng() < 0.3 ? 0 : (0.15 + rng() * 0.7) * MAX_WAIT;
          const delay = (wait * sep) / V;
          const path = sparkPath(A, 0, R_STONE, B, delay, R_STONE, 1 / 60);
          const pts = path[0].slice().reverse().concat(path[1]).filter(q => q.x > 26 && q.x < PW - 26 && q.y > 26 && q.y < ph - 26 && dist(q, A) > 46 && dist(q, B) > 46);
          if (pts.length < 12) continue;
          const want = teach ? 5 : 3 + ((rng() * 3) | 0);
          const mine = [];
          const stepIdx = Math.max(3, Math.floor(pts.length / (want + 1)));
          let idx = Math.floor(rng() * stepIdx);
          for (; idx < pts.length && mine.length < want; idx += stepIdx + ((rng() * 3) | 0)) {
            const q = pts[idx];
            if (freeSpot(q) && mine.every(m => dist(m, q) > LANTERN_R * 2.9)) mine.push({ x: q.x, y: q.y });
          }
          if (mine.length < 3) continue;
          const chain = teach === 3 || (!teach && n >= 4 && rng() < 0.55);
          const extra = [];
          if (chain) {
            const L = mine[(rng() * mine.length) | 0];
            for (const S of rng() < 0.5 ? [A, B] : [A]) {
              const d = dist(S, L);
              const ux = (L.x - S.x) / d, uy = (L.y - S.y) / d;
              const s = 0.14 * PW + rng() * 0.11 * PW;
              const q = { x: L.x + ux * s, y: L.y + uy * s };
              if (freeSpot(q) && mine.concat(extra).every(m => dist(m, q) > LANTERN_R * 2.9) && dist(S, q) < R_STONE - 10) extra.push(q);
            }
            if (teach === 3 && !extra.length) continue;
          }
          mine.concat(extra).forEach(q => lanterns.push(q));
          solution.push({ A, B, delay });
          placed = true;
        }
        if (!placed) break;
      }
      if (solution.length < pairs) continue;
      const lit = new Set();
      for (const s of solution) simulate([{ x: s.A.x, y: s.A.y, t: 0 }, { x: s.B.x, y: s.B.y, t: s.delay }], lanterns, lit).events.forEach(e => lit.add(e.i));
      const kept = lanterns.filter((_, i) => lit.has(i));
      if (kept.length < 4) continue;
      const spare = teach || n <= 5 ? 2 : n <= 10 ? 2 : 0;
      return { n, seed, lanterns: kept.map(l => ({ x: l.x, y: l.y })), solution, stones: solution.length * 2 + spare, pads: makePads(rng, ph) };
    }
    return null;
  }
  function makePads(rng, ph) {
    const pads = [];
    for (let i = 0; i < 3; i++) pads.push({ x: 20 + rng() * (PW - 40), y: 20 + rng() * (ph - 40), r: 14 + rng() * 12, a: rng() * 6.28 });
    return pads;
  }

  /* ---------- view and layout ---------- */
  const $ = id => document.getElementById(id);
  const canvas = $('pond');
  const view = Kit.view(canvas, { alpha: false });
  const ctx = view.ctx;
  const delayEl = $('delay'), delayVal = $('delayVal'), dropBtn = $('dropBtn'), clearBtn = $('clearBtn');
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
  document.body.appendChild(probe);

  let W = 1, H = 1, S = 1, OX = 0, OY = 0, pondH = PW * 1.4;
  let safe = { t: 0, r: 0, b: 0, l: 0 }, area = { x: 0, y: 0, w: 1, h: 1 }, hud = { h: 64, hintY: 80, x0: 16 };
  let bg = null, waterPath = null, shore = null;
  function measure() {
    W = Math.max(1, view.w); H = Math.max(1, view.h);
    const cs = getComputedStyle(probe);
    safe = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
    const short = H < 650;
    hud.h = short ? 54 : 62;
    hud.hintY = safe.t + hud.h + (short ? 12 : 16);
    hud.x0 = Math.max(16 + safe.l, W / 2 - 320);
    const top = Kit.keyart ? 22 : safe.t + hud.h + (short ? 36 : 46);
    const bot = Kit.keyart ? 22 : safe.b + (short ? 72 : 82) + (short ? 22 : 30);
    area = { x: 12 + safe.l, y: top, w: Math.max(40, W - 24 - safe.l - safe.r), h: Math.max(40, H - top - bot) };
  }
  function fit() {
    S = Math.min(area.w / PW, area.h / pondH);
    OX = area.x + (area.w - PW * S) / 2;
    OY = area.y + (area.h - pondH * S) / 2;
    bg = null;
  }
  function layout() { measure(); fit(); }
  function pondHeightFor() {
    measure();
    const ratio = area.w > 0 ? area.h / area.w : 1.4;
    return clamp(PW * ratio, Kit.keyart ? PW * 0.5 : PW * 1.0, PW * 1.9);
  }
  const sx = x => OX + x * S, sy = y => OY + y * S;
  const toPond = (x, y) => ({ x: (x - OX) / S, y: (y - OY) / S });

  /* ---------- palette ---------- */
  const C = {
    water0: '#1B5653', water1: '#103E41', water2: '#082429',
    gravel0: '#5A6262', gravel1: '#454D4F',
    moss0: '#24402A', moss1: '#36592F', moss2: '#5C8A3C',
    lit: '#FFC765', lit2: '#FF7A4D', spark: '#FFD37A', ripple: '#CDEFE6',
    ink: '#F3EAD7', paper: '#F1E7D3', paperInk: '#2A2019', seal: '#CF4128',
    maple: ['#7A2216', '#9C2E1B', '#B9361F', '#D04A25', '#E2673A', '#EE8C47'],
  };

  /* ---------- the pond's shoreline (pond units), built per pond ---------- */
  function rrPoints(x, y, w, h, R, step) {
    const pts = [];
    const seg = (ax, ay, bx, by, nx, ny) => {
      const n = Math.max(1, Math.round(Math.hypot(bx - ax, by - ay) / step));
      for (let i = 0; i < n; i++) { const t = i / n; pts.push({ x: ax + (bx - ax) * t, y: ay + (by - ay) * t, nx, ny }); }
    };
    const arc = (cx, cy, a0) => {
      const n = Math.max(2, Math.round((R * Math.PI) / 2 / step));
      for (let i = 0; i < n; i++) { const a = a0 + (i / n) * Math.PI / 2; pts.push({ x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R, nx: Math.cos(a), ny: Math.sin(a) }); }
    };
    seg(x + R, y, x + w - R, y, 0, -1); arc(x + w - R, y + R, -Math.PI / 2);
    seg(x + w, y + R, x + w, y + h - R, 1, 0); arc(x + w - R, y + h - R, 0);
    seg(x + w - R, y + h, x + R, y + h, 0, 1); arc(x + R, y + h - R, Math.PI / 2);
    seg(x, y + h - R, x, y + R, -1, 0); arc(x + R, y + R, Math.PI);
    return pts;
  }
  function smoothPath(pts, close = true) {
    const p = new Path2D();
    const n = pts.length;
    const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
    const m0 = mid(pts[n - 1], pts[0]);
    p.moveTo(m0.x, m0.y);
    for (let i = 0; i < n; i++) { const a = pts[i], m = mid(a, pts[(i + 1) % n]); p.quadraticCurveTo(a.x, a.y, m.x, m.y); }
    if (close) p.closePath();
    return p;
  }
  function buildShore() {
    const rng = mulberry32(((P ? P.seed : 7) * 31 + 11) >>> 0);
    const base = rrPoints(-WM, -WM, PW + 2 * WM, pondH + 2 * WM, 46, 9);
    const N = base.length, p1 = rng() * TAU, p2 = rng() * TAU, p3 = rng() * TAU;
    const pts = base.map((q, i) => {
      const u = (i / N) * TAU;
      const off = Math.max(0, 4.5 + 2.6 * Math.sin(u * 3 + p1) + 1.8 * Math.sin(u * 7 + p2) + 1.1 * Math.sin(u * 13 + p3));
      return { x: q.x + q.nx * off, y: q.y + q.ny * off, nx: q.nx, ny: q.ny };
    });
    waterPath = smoothPath(pts);
    const rocks = [], moss = [], pebbles = [];
    let acc = rng() * 30;
    for (let i = 0; i < N; i++) {
      const q = pts[i];
      acc += 9;
      if (acc > 30 + rng() * 34) {
        acc = 0;
        if (rng() < 0.8) {
          const r = 8 + rng() * 13;
          rocks.push({ x: q.x + q.nx * (r * 0.5 + 1), y: q.y + q.ny * (r * 0.5 + 1), r, seed: (rng() * 1e9) | 0, moss: rng() < 0.45 });
        }
      }
      if (i % 2 === 0) moss.push({ x: q.x + q.nx * (6 + rng() * 14), y: q.y + q.ny * (6 + rng() * 14), r: 9 + rng() * 15, c: rng() });
      if (rng() < 0.18) pebbles.push({ x: q.x - q.nx * (4 + rng() * 22), y: q.y - q.ny * (4 + rng() * 22), r: 1.8 + rng() * 3.2, c: rng() });
    }
    // Decorative lily pads (the pond's own three plus a few more), kept clear of the lanterns.
    const pads = [];
    const padRng = mulberry32(((P ? P.seed : 3) ^ 0x2f6b) >>> 0);
    const want = 6 + ((padRng() * 3) | 0);
    for (let k = 0; k < 60 && pads.length < want; k++) {
      const p = k < 3 && P && P.pads[k] ? { x: P.pads[k].x, y: P.pads[k].y, r: P.pads[k].r, a: P.pads[k].a } : { x: padRng() * PW, y: padRng() * pondH, r: 11 + padRng() * 13, a: padRng() * TAU };
      p.flower = padRng() < 0.3;
      p.ph = padRng() * TAU;
      if (P && P.lanterns.some(L => dist(L, p) < p.r + 22)) continue;
      if (pads.some(o => dist(o, p) < o.r + p.r + 6)) continue;
      pads.push(p);
    }
    // Pebbles on the pond floor, seen through the water.
    const floor = [];
    for (let k = 0; k < 26; k++) floor.push({ x: rng() * PW, y: rng() * pondH, r: 3 + rng() * 7, a: rng() * TAU });
    shore = { pts, rocks, moss, pebbles, pads, floor };
    bg = null;
  }

  /* ---------- painters ---------- */
  function maplePath(g, r) {
    const R = [[0, -1], [0.14, -0.6], [0.55, -0.78], [0.38, -0.3], [0.92, -0.2], [0.52, 0.1], [0.66, 0.45], [0.18, 0.28], [0.06, 0.5], [0.025, 0.95]];
    g.beginPath();
    R.forEach(([x, y], i) => (i ? g.lineTo(x * r, y * r) : g.moveTo(x * r, y * r)));
    for (let i = R.length - 1; i >= 1; i--) g.lineTo(-R[i][0] * r, R[i][1] * r);
    g.closePath();
  }
  function rockShape(g, r, seed) {
    const rr = mulberry32(seed);
    const n = 9, pts = [];
    for (let i = 0; i < n; i++) { const a = (i / n) * TAU; const k = 0.78 + rr() * 0.3; pts.push({ x: Math.cos(a) * r * k * 1.08, y: Math.sin(a) * r * k * 0.9 }); }
    return smoothPath(pts);
  }
  function paintRock(g, x, y, r, seed, mossy, sc) {
    const path = rockShape(g, r, seed);
    g.save();
    g.translate(x, y);
    // cast shadow (soft, layered)
    for (let k = 3; k >= 1; k--) {
      g.save(); g.translate(r * 0.18 * k, r * 0.26 * k); g.globalAlpha = 0.16; g.fillStyle = '#020A0C'; g.fill(path); g.restore();
    }
    const grd = g.createLinearGradient(-r, -r, r, r);
    grd.addColorStop(0, '#9AA39E'); grd.addColorStop(0.45, '#69726E'); grd.addColorStop(1, '#2E3534');
    g.fillStyle = grd; g.fill(path);
    g.save(); g.clip(path);
    g.fillStyle = 'rgba(255,255,255,0.12)'; g.beginPath(); g.ellipse(-r * 0.3, -r * 0.35, r * 0.55, r * 0.35, -0.5, 0, TAU); g.fill();
    const rr = mulberry32(seed + 5);
    g.fillStyle = 'rgba(20,26,26,0.25)';
    for (let i = 0; i < 6; i++) { g.beginPath(); g.arc((rr() - 0.5) * r * 1.4, (rr() - 0.5) * r * 1.2, 0.6 + rr() * 1.4 / (sc || 1), 0, TAU); g.fill(); }
    if (mossy) {
      g.fillStyle = C.moss1; g.globalAlpha = 0.9;
      g.beginPath(); g.ellipse(-r * 0.35, -r * 0.45, r * 0.7, r * 0.42, -0.4, 0, TAU); g.fill();
      g.fillStyle = C.moss2; g.globalAlpha = 0.55;
      g.beginPath(); g.ellipse(-r * 0.45, -r * 0.55, r * 0.38, r * 0.2, -0.4, 0, TAU); g.fill();
      g.globalAlpha = 1;
    }
    g.restore();
    g.strokeStyle = 'rgba(210,225,220,0.22)'; g.lineWidth = 1.2 / (sc || 1);

    g.restore();
  }
  function paintMoss(g, x, y, r, c) {
    const grd = g.createRadialGradient(x - r * 0.2, y - r * 0.2, 0, x, y, r);
    grd.addColorStop(0, c > 0.5 ? '#4B7536' : '#3D6431');
    grd.addColorStop(0.7, C.moss0);
    grd.addColorStop(1, 'rgba(36,64,42,0)');
    g.fillStyle = grd;
    g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
  function rakeRings(g, cx, cy, rx, ry, from, count, gap, round) {
    for (let k = 0; k < count; k++) {
      const o = from + k * gap;
      for (const [col, d] of [['rgba(8,14,16,0.26)', 1.4], ['rgba(225,235,230,0.11)', 0]]) {
        g.strokeStyle = col; g.lineWidth = 1.3;
        g.beginPath();
        if (round) g.ellipse(cx, cy + d, rx + o, ry + o, 0, 0, TAU);
        else gfx.roundRect(g, cx - rx - o, cy - ry - o + d, (rx + o) * 2, (ry + o) * 2, Math.min(rx, ry, 60) * 0.0 + 40 + o);
        g.stroke();
      }
    }
  }
  function gravelFill(g, x, y, w, h) {
    const grd = g.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, C.gravel0); grd.addColorStop(1, C.gravel1);
    g.fillStyle = grd; g.fillRect(x, y, w, h);
    g.fillStyle = g.createPattern(gfx.noiseTexture(128, 128, { seed: 4, alpha: 0.28, color: '#0b1112' }), 'repeat'); g.fillRect(x, y, w, h);
    g.fillStyle = g.createPattern(gfx.noiseTexture(96, 96, { seed: 9, alpha: 0.1, color: '#ffffff' }), 'repeat'); g.fillRect(x, y, w, h);
  }

  // Garden spots for the margins (screen px), placed once per layout.
  let garden = null;
  function planGarden() {
    const rng = mulberry32(1234 + Math.round(W) * 7 + Math.round(H));
    const wx0 = sx(-WM), wy0 = sy(-WM), wx1 = sx(PW + WM), wy1 = sy(pondH + WM);
    const rocks = [];
    const u = clamp(Math.min(W, H) / 420, 0.8, 1.5);
    for (let k = 0; k < 120 && rocks.length < 9; k++) {
      const r = (16 + rng() * 26) * u;
      const x = rng() * W, y = rng() * H;
      const dx = Math.max(wx0 - x, 0, x - wx1), dy = Math.max(wy0 - y, 0, y - wy1);
      if (Math.hypot(dx, dy) < r + 46) continue;
      if (rocks.some(o => Math.hypot(o.x - x, o.y - y) < o.r + r + 60)) continue;
      rocks.push({ x, y, r, seed: (rng() * 1e9) | 0, moss: rng() < 0.6 });
    }
    // The stone lantern (toro) stands on the bank at a corner of the pond.
    const wide = W > H * 1.05;
    const toro = wide ? { x: wx0 - 46 * u, y: wy0 + (wy1 - wy0) * 0.22 } : { x: Math.max(28 * u, wx0 + 18 * u), y: Math.max(safe.t + hud.h + 8, wy0 + 2) };
    toro.r = 21 * u;
    garden = { rocks, toro, u, wide };
  }

  function buildBg() {
    planGarden();
    const dpr = view.dpr || 1;
    const c = gfx.offscreen(W * dpr, H * dpr);
    const g = c.getContext('2d');
    g.scale(dpr, dpr);
    const u = garden.u;
    // Raked gravel: straight furrows everywhere...
    gravelFill(g, 0, 0, W, H);
    for (let y = 3; y < H; y += 7) {
      for (const [col, d] of [['rgba(8,14,16,0.24)', 1.4], ['rgba(225,235,230,0.10)', 0]]) {
        g.strokeStyle = col; g.lineWidth = 1.3;
        g.beginPath();
        for (let x = 0; x <= W; x += 24) { const yy = y + d + Math.sin(x * 0.012 + y * 0.05) * 0.8; x ? g.lineTo(x, yy) : g.moveTo(x, yy); }
        g.stroke();
      }
    }
    // ...then circles raked around the pond and around each garden rock.
    const wx0 = sx(-WM), wy0 = sy(-WM), wx1 = sx(PW + WM), wy1 = sy(pondH + WM);
    const cx = (wx0 + wx1) / 2, cy = (wy0 + wy1) / 2, rx = (wx1 - wx0) / 2, ry = (wy1 - wy0) / 2;
    g.save();
    g.beginPath(); gfx.roundRect(g, cx - rx - 70, cy - ry - 70, (rx + 70) * 2, (ry + 70) * 2, 110); g.clip();
    gravelFill(g, 0, 0, W, H);
    g.restore();
    rakeRings(g, cx, cy, rx, ry, 12, 9, 7, false);
    for (const r of garden.rocks) {
      g.save(); g.beginPath(); g.ellipse(r.x, r.y, r.r * 1.1 + 34, r.r * 0.9 + 34, 0, 0, TAU); g.clip();
      gravelFill(g, 0, 0, W, H); g.restore();
      rakeRings(g, r.x, r.y, r.r * 1.1, r.r * 0.9, 8, 5, 6.5, true);
    }
    for (const r of garden.rocks) {
      if (r.moss) for (let k = 0; k < 4; k++) paintMoss(g, r.x + Math.cos(k * 1.7 + r.seed) * r.r, r.y + Math.sin(k * 1.7 + r.seed) * r.r * 0.8 + 4, r.r * 0.55, k / 4);
      paintRock(g, r.x, r.y, r.r, r.seed, r.moss, 1);
    }
    // Pond space: moss bank, water, floor, shoreline rocks.
    g.save();
    g.translate(OX, OY); g.scale(S, S);
    for (const m of shore.moss) paintMoss(g, m.x, m.y, m.r, m.c);
    // dark wet rim just outside the water
    g.strokeStyle = 'rgba(6,16,16,0.55)'; g.lineWidth = 7; g.stroke(waterPath);
    g.save();
    g.clip(waterPath);
    const deep = g.createRadialGradient(PW * 0.48, pondH * 0.46, 10, PW / 2, pondH / 2, Math.max(PW, pondH) * 0.72);
    deep.addColorStop(0, C.water0); deep.addColorStop(0.55, C.water1); deep.addColorStop(1, C.water2);
    g.fillStyle = deep; g.fillRect(-WM - 20, -WM - 20, PW + 2 * WM + 40, pondH + 2 * WM + 40);
    // pebbles on the pond floor
    for (const p of shore.floor) { g.fillStyle = 'rgba(150,185,170,0.07)'; g.beginPath(); g.ellipse(p.x, p.y, p.r, p.r * 0.7, p.a, 0, TAU); g.fill(); }
    for (const p of shore.pebbles) { g.fillStyle = p.c > 0.5 ? 'rgba(170,190,175,0.16)' : 'rgba(110,130,120,0.18)'; g.beginPath(); g.ellipse(p.x, p.y, p.r, p.r * 0.75, p.c * 3, 0, TAU); g.fill(); }
    // dusk sky reflected on the surface: warm from the upper left, cool to the lower right
    const sky = g.createLinearGradient(0, 0, PW, pondH);
    sky.addColorStop(0, 'rgba(255,168,118,0.16)'); sky.addColorStop(0.35, 'rgba(255,190,150,0.04)');
    sky.addColorStop(0.6, 'rgba(120,150,220,0.0)'); sky.addColorStop(1, 'rgba(110,130,230,0.10)');
    g.fillStyle = sky; g.fillRect(-WM - 20, -WM - 20, PW + 2 * WM + 40, pondH + 2 * WM + 40);
    // the moon's reflection
    const mx = PW * 0.74, my = pondH * 0.17;
    const moon = g.createRadialGradient(mx, my, 0, mx, my, 70);
    moon.addColorStop(0, 'rgba(230,240,235,0.30)'); moon.addColorStop(0.18, 'rgba(220,235,232,0.20)'); moon.addColorStop(0.2, 'rgba(200,225,222,0.08)'); moon.addColorStop(1, 'rgba(200,225,222,0)');

    const rg = g.createLinearGradient(-tr, -tr, tr, tr); rg.addColorStop(0, '#9AA39C'); rg.addColorStop(1, '#3B4240');
    g.fillStyle = rg; hexPath(g, tr); g.fill();
    g.strokeStyle = 'rgba(20,26,26,0.45)'; g.lineWidth = 1.2;
    for (let k = 0; k < 6; k++) { const a = k * TAU / 6 - Math.PI / 2; g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a) * tr, Math.sin(a) * tr); g.stroke(); }
    g.fillStyle = C.moss1; g.globalAlpha = 0.7; g.beginPath(); g.ellipse(-tr * 0.4, -tr * 0.3, tr * 0.45, tr * 0.25, -0.6, 0, TAU); g.fill(); g.globalAlpha = 1;
    g.fillStyle = '#7E8782'; g.beginPath(); g.arc(0, 0, tr * 0.26, 0, TAU); g.fill();
    g.fillStyle = '#B9C0BA'; g.beginPath(); g.arc(-tr * 0.06, -tr * 0.08, tr * 0.12, 0, TAU); g.fill();
    g.restore();

  }
  function hexPath(g, r) {
    g.beginPath();
    for (let k = 0; k < 6; k++) {
      const a = k * TAU / 6 - Math.PI / 2, a2 = (k + 0.5) * TAU / 6 - Math.PI / 2;
      const x = Math.cos(a) * r * 1.08, y = Math.sin(a) * r * 1.08;

      g.quadraticCurveTo(Math.cos(a2) * r * 0.8, Math.sin(a2) * r * 0.8, Math.cos(a + TAU / 6) * r * 1.08, Math.sin(a + TAU / 6) * r * 1.08);
    }
    g.closePath();
  }

  // Sprites (CSS px, cached at the view's DPR).
  const LAN = 30; // lantern sprite size in units
  function lanternSprite(kind, px) {
    px = Math.max(12, Math.round(px));
    return gfx.sprite(`cw-lan-${kind}-${px}`, px, px, (g, w) => {
      const u = w / 30, c = w / 2;
      g.translate(c, c);
      // wooden raft
      g.fillStyle = '#2B1C12';
      gfx.roundRect(g, -11 * u, -9 * u, 22 * u, 21 * u, 3 * u).fill();
      g.fillStyle = '#4A3020';
      gfx.roundRect(g, -10.5 * u, -9.5 * u, 21 * u, 19 * u, 3 * u).fill();
      // paper box: the near face (a strip) and the top face
      const lit = kind !== 'off';
      const deep = kind === 'chain';
      const face = g.createLinearGradient(0, 2 * u, 0, 10 * u);
      if (lit) { face.addColorStop(0, deep ? '#FF9A63' : '#FFD27A'); face.addColorStop(1, deep ? '#C8331F' : '#E8862A'); }
      else { face.addColorStop(0, '#D7CDB6'); face.addColorStop(1, '#A39780'); }
      g.fillStyle = face;
      gfx.roundRect(g, -8 * u, 0, 16 * u, 9.5 * u, 1.5 * u).fill();
      const top = g.createRadialGradient(0, -3 * u, 0, 0, -3 * u, 10 * u);
      if (lit) { top.addColorStop(0, '#FFFBEA'); top.addColorStop(0.45, deep ? '#FFB27A' : '#FFE29A'); top.addColorStop(1, deep ? '#F0643A' : '#F5A740'); }
      else { top.addColorStop(0, '#F2EBDA'); top.addColorStop(1, '#C9BEA6'); }
      g.fillStyle = top;
      gfx.roundRect(g, -8 * u, -10 * u, 16 * u, 12 * u, 1.5 * u).fill();
      // frame
      g.strokeStyle = lit ? 'rgba(90,40,10,0.55)' : 'rgba(60,44,30,0.7)';
      g.lineWidth = 1.1 * u;
      gfx.roundRect(g, -8 * u, -10 * u, 16 * u, 19.5 * u, 1.5 * u).stroke();
      g.beginPath(); g.moveTo(-8 * u, 2 * u); g.lineTo(8 * u, 2 * u); g.stroke();
      // opening and wick
      g.fillStyle = lit ? '#FFFFFF' : '#5B4A38';
      g.beginPath(); g.arc(0, -4 * u, lit ? 2.2 * u : 2.4 * u, 0, TAU); g.fill();
      // a brush mark on the near face
      g.strokeStyle = lit ? 'rgba(150,30,10,0.55)' : 'rgba(170,50,30,0.65)';
      g.lineWidth = 1.4 * u; g.lineCap = 'round';
      g.beginPath(); g.moveTo(-2.5 * u, 4 * u); g.quadraticCurveTo(0, 6.5 * u, 2.8 * u, 4.5 * u); g.stroke();
    });
  }
  function stoneSprite(px, mark) {
    px = Math.max(10, Math.round(px));
    return gfx.sprite(`cw-stone-${mark}-${px}`, px, px, (g, w) => {
      const c = w / 2, r = w * 0.42;
      const grd = g.createRadialGradient(c - r * 0.35, c - r * 0.4, r * 0.1, c, c, r * 1.1);
      grd.addColorStop(0, '#A9B2AE'); grd.addColorStop(0.35, '#5E6866'); grd.addColorStop(1, '#22292A');
      g.fillStyle = grd;
      g.beginPath(); g.ellipse(c, c, r, r * 0.84, -0.25, 0, TAU); g.fill();

        gfx.light(ctx, L.x, L.y - 2, 26 * pop, (L.depth || 1) > 1 ? C.lit2 : C.lit, 0.55 * fl);
        if (litAge < 0.6) gfx.light(ctx, L.x, L.y, 60 * (1 - litAge / 0.6) + 10, '#FFF3CF', 0.8 * (1 - litAge / 0.6));
      }
    });
  }
  function drawTeach(t) {
    if (!P.teach || P.teach !== 1 || phase !== 'place' || placed.length >= 2 || shell.phase !== 'play') return;
    const sol = P.solution[0];
    const todo = [sol.A, sol.B].filter(s => !placed.some(p => dist(p, s) < 20));
    for (const s of todo) {
      const k = 0.5 + 0.5 * Math.sin(t * 4);
      gfx.light(ctx, s.x, s.y, 34, '#CDEFE6', 0.25 + 0.2 * k);
      ctx.strokeStyle = `rgba(243,234,215,${0.45 + 0.35 * k})`; ctx.lineWidth = 2; ctx.setLineDash([4, 5]);
      ctx.beginPath(); ctx.arc(s.x, s.y, 16 + 4 * k, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    }
    // a ghost hand taps the next spot
    const s = todo[0];
    if (!s) return;
    const c = (t % 1.8) / 1.8;
    const press = c > 0.45 && c < 0.65 ? 1 : 0;
    const hx = s.x + 26 * (1 - Math.min(1, c / 0.45)) + 8, hy = s.y + 34 * (1 - Math.min(1, c / 0.45)) + 12;
    const a = c < 0.1 ? c / 0.1 : c > 0.85 ? (1 - c) / 0.15 : 1;
    ctx.save(); ctx.translate(hx, hy); ctx.scale(press ? 0.9 : 1, press ? 0.9 : 1); ctx.globalAlpha = 0.85 * a;
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(4, 6, 11, 15, -0.4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#F6EFE2';
    ctx.beginPath(); ctx.ellipse(0, 0, 5, 9, -0.35, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(6, 13, 10, 11, -0.35, 0, TAU); ctx.fill();
    ctx.restore();
    if (press) { ctx.strokeStyle = 'rgba(243,234,215,0.6)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(s.x, s.y, 8 + (c - 0.45) * 60, 0, TAU); ctx.stroke(); }
  }
  function drawStoneAt(x, y, mark, hov, active, t) {
    // the shadow marks the exact spot it will drop on
    const r = 15;
    gfx.softShadow(ctx, x, y, r * 1.05, r * 0.8, 0.5 - Math.min(0.25, hov * 0.012));
    ctx.strokeStyle = 'rgba(205,239,230,0.35)'; ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.arc(x, y, r + 3, 0, TAU); ctx.stroke();
    const spr = stoneSprite(34 * S, mark);
    const sc = (active ? 1.15 : 1) * (1 + hov * 0.012);
    ctx.save(); ctx.translate(x - hov * 0.45, y - hov * 0.9); ctx.scale(sc / S, sc / S);
    ctx.drawImage(spr, -17 * S, -17 * S, 34 * S, 34 * S);
    ctx.restore();
  }
  function drawStones(t) {
    const bob = k => 7 + 1.6 * Math.sin(t * 2.4 + k * 1.3) * (reduced() ? 0.2 : 1);
    if (phase === 'place') {
      placed.forEach((s, k) => drawStoneAt(s.x, s.y, k + 1, bob(k), dragging && dragging.idx === k, t));
      if (placed.length === 2 && wait > 0) {
        const s = placed[1];
        ctx.strokeStyle = 'rgba(255,214,140,0.9)'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(s.x, s.y, 23, -Math.PI / 2, -Math.PI / 2 + TAU * wait); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,214,140,0.22)';
        ctx.beginPath(); ctx.arc(s.x, s.y, 23, 0, TAU); ctx.stroke();
      }
    } else if (drop) {
      drop.stones.forEach((s, k) => {
        const hit = k ? drop.delay : 0;
        if (drop.t >= hit) return;
        const f = clamp((drop.t - (hit - FALL)) / FALL, 0, 1);
        drawStoneAt(s.x, s.y, k + 1, bob(k) * (1 - f * f), false, t);
        if (k === 1 && drop.delay > 0 && f === 0) {
          const left = clamp((hit - FALL - drop.t) / Math.max(0.01, drop.delay), 0, 1);
          ctx.strokeStyle = 'rgba(255,214,140,0.9)'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.arc(s.x, s.y, 23, -Math.PI / 2, -Math.PI / 2 + TAU * left); ctx.stroke();
        }
      });
    }
  }
  function wrapLines(text, maxW) {
    const words = text.split(' '), lines = [];
    let cur = '';
    for (const w of words) {
      const test = cur ? cur + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test;
    }
    if (cur) lines.push(cur);
    return lines;
  }
  const FD = gfx.fonts.display, FB = gfx.fonts.body;
  function drawHud(t) {
    if (shell.phase === 'title' || !run) return;
    // shade behind the HUD and the tray
    const g1 = ctx.createLinearGradient(0, 0, 0, safe.t + hud.h + 40);
    g1.addColorStop(0, 'rgba(2,10,12,0.62)'); g1.addColorStop(1, 'rgba(2,10,12,0)');
    ctx.fillStyle = g1; ctx.fillRect(0, 0, W, safe.t + hud.h + 40);
    const x0 = hud.x0, y0 = safe.t + (H < 650 ? 22 : 26);
    ctx.letterSpacing = '2px';
    gfx.text(ctx, 'POND ' + P.n, x0, y0, { size: 12, weight: 800, font: FB, color: 'rgba(243,234,215,0.8)', align: 'left' });
    ctx.letterSpacing = '0px';
    // stones left, as pebbles in pairs
    const total = P.stones, spr = stoneSprite(16, 0);
    const warn = phase !== 'over' && stonesLeft === 2 && total > 2 ? 0.5 + 0.5 * Math.sin(t * 5) : 0;
    for (let i = 0; i < total; i++) {
      const x = x0 + 8 + i * 17 + Math.floor(i / 2) * 6, y = y0 + 22;
      if (i < stonesLeft) {
        if (warn) gfx.light(ctx, x, y, 14, C.seal, 0.5 * warn);
        ctx.drawImage(spr, x - 8, y - 8, 16, 16);
      } else { ctx.strokeStyle = 'rgba(243,234,215,0.28)'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.ellipse(x, y, 6, 5, -0.25, 0, TAU); ctx.stroke(); }
    }
    // score
    const sc = run.score;
    if (shownScore !== sc) { shownScore += Math.ceil((sc - shownScore) * 0.25); if (Math.abs(sc - shownScore) < 1) shownScore = sc; }
    const pop = 1 + hudPop * 0.22;
    ctx.save(); ctx.translate(W / 2, y0 + 4); ctx.scale(pop, pop);
    gfx.text(ctx, Kit.fmt(shownScore), 0, 0, { size: H < 650 ? 26 : 30, weight: 600, font: FD, color: C.ink, shadow: 'rgba(0,0,0,0.6)', shadowBlur: 10 });
    ctx.restore();
    ctx.letterSpacing = '1.5px';
    gfx.text(ctx, 'BEST ' + Kit.fmt(Math.max(shell.best, sc)), W / 2, y0 + 27, { size: 10.5, weight: 800, font: FB, color: 'rgba(243,234,215,0.62)' });
    ctx.letterSpacing = '0px';
    // the hint, on a strip of washi paper
    const want = hintText();
    if (want !== hint.text) { if (hint.a <= 0.02) { hint.text = want; } hint.a = Math.max(0, hint.a - 0.12); }
    else hint.a = Math.min(1, hint.a + 0.08);
    if (hint.text && hint.a > 0) {
      ctx.font = `600 ${H < 650 ? 12.5 : 13.5}px ${FB}`;
      const maxW = Math.min(W - 40, 460);
      const lines = wrapLines(hint.text, maxW - 30);
      const lh = H < 650 ? 16 : 17.5;
      const bw = Math.min(maxW, Math.max(...lines.map(l => ctx.measureText(l).width)) + 34), bh = lines.length * lh + 14;
      const bx = W / 2 - bw / 2, by = hud.hintY - 4;
      ctx.save(); ctx.globalAlpha = hint.a; ctx.translate(0, (1 - hint.a) * -6);
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; gfx.roundRect(ctx, bx + 2, by + 3, bw, bh, 7).fill();
      ctx.fillStyle = 'rgba(241,231,211,0.94)'; gfx.roundRect(ctx, bx, by, bw, bh, 7).fill();
      ctx.fillStyle = C.seal; ctx.beginPath(); ctx.arc(bx + 12, by + bh / 2, 3.2, 0, TAU); ctx.fill();
      lines.forEach((l, i) => gfx.text(ctx, l, W / 2 + 7, by + 7 + lh / 2 + i * lh, { size: H < 650 ? 12.5 : 13.5, weight: 600, font: FB, color: C.paperInk }));
      ctx.restore();
    }
  }
  function drawBanners(t) {
    for (const b of banners) {
      const k = (t - b.t) / b.dur;
      if (k < 0 || k > 1) continue;
      const sc = k < 0.18 ? Math.max(0.01, Kit.ease.backOut(k / 0.18)) : 1;
      const a = k > 0.75 ? 1 - (k - 0.75) / 0.25 : 1;
      const cx = W / 2, cy = sy(pondH * 0.45);
      ctx.save(); ctx.globalAlpha = a; ctx.translate(cx, cy); ctx.scale(sc, sc);
      if (b.kind === 'pond') {
        ctx.letterSpacing = '6px';
        gfx.text(ctx, b.text.toUpperCase(), 0, 0, { size: 26, weight: 600, font: FD, color: C.ink, shadow: 'rgba(0,0,0,0.7)', shadowBlur: 16 });
        ctx.letterSpacing = '0px';
        ctx.restore();
        continue;
      }
      const fs = b.small ? 15 : b.big ? 24 : 21, ss = 12.5;
      ctx.font = `${b.small ? 700 : 600} ${fs}px ${b.small ? FB : FD}`;
      const w1 = ctx.measureText(b.text).width;
      ctx.font = `700 ${ss}px ${FB}`;
      const w2 = b.sub ? ctx.measureText(b.sub).width : 0;
      const w = Math.max(w1, w2) + (b.small ? 34 : 70), h = fs * 1.9 + (b.sub ? ss * 1.6 : 0);
      ctx.rotate(-0.012);
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; gfx.roundRect(ctx, -w / 2 + 3, -h / 2 + 5, w, h, 6).fill();
      ctx.fillStyle = C.paper; gfx.roundRect(ctx, -w / 2, -h / 2, w, h, 6).fill();
      ctx.strokeStyle = 'rgba(43,33,24,0.15)'; ctx.lineWidth = 1; gfx.roundRect(ctx, -w / 2 + 4, -h / 2 + 4, w - 8, h - 8, 4).stroke();
      if (!b.small) {
        // the seal
        ctx.save(); ctx.translate(w / 2 - 18, -h / 2 + 2); ctx.rotate(0.12);
        ctx.fillStyle = C.seal; gfx.roundRect(ctx, -11, -11, 22, 22, 4).fill();
        ctx.strokeStyle = '#FFF6E8'; ctx.lineWidth = 1.4;
        for (const r of [3, 7]) { ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke(); }
        ctx.restore();
      }
      gfx.text(ctx, b.text, 0, b.sub ? -ss * 0.75 : 1, { size: fs, weight: b.small ? 700 : 600, font: b.small ? FB : FD, color: b.small ? C.paperInk : C.seal });
      if (b.sub) gfx.text(ctx, b.sub, 0, fs * 0.62, { size: ss, weight: 700, font: FB, color: '#6B5A48' });
      ctx.restore();
    }
  }
  let bodyHidden = null;
  function syncBodyClass() {
    const hide = Kit.keyart || shell.phase === 'title' || shell.phase === 'over' || phase === 'over';
    if (hide !== bodyHidden) { bodyHidden = hide; document.body.classList.toggle('cw-hide', hide); }
  }

  /* ---------- loop ---------- */
  function update(dt) {
    amb += dt;
    if (hudPop > 0) hudPop = Math.max(0, hudPop - dt * 4);
    if (shell.phase === 'title' && !scene) stepDemo(dt);
    else if (demo) { demo.t += dt; if (demo.t > demo.sim.end) demo = null; }
    if (!manual) stepGame(dt); else stepTimers(dt);
    banners = banners.filter(b => amb - b.t < b.dur + 0.1);
  }
  const loop = Kit.loop({ view, update, draw });

  /* ---------- input ---------- */
  function inPond(p) { return p.x >= 14 && p.x <= PW - 14 && p.y >= 14 && p.y <= pondH - 14; }
  function local(e) { const r = canvas.getBoundingClientRect(); return toPond(e.clientX - r.left, e.clientY - r.top); }
  canvas.addEventListener('pointerdown', e => {
    if (shell.phase !== 'play' || !P) return;
    if (phase === 'drop' && drop) { if (drop.speed < 3) { drop.speed = 3; Kit.sfx('cw-hurry'); } return; }
    if (phase !== 'place') return;
    const p = local(e);
    e.preventDefault();
    const near = placed.findIndex(s => dist(s, p) < 32);
    if (near >= 0) {
      dragging = { idx: near, id: e.pointerId, touch: e.pointerType !== 'mouse' };
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      Kit.sfx('cw-lift');
      syncControls();
      return;
    }
    if (placed.length < 2 && inPond(p) && placed.every(s => dist(s, p) >= STONE_GAP)) {
      placed.push(p);
      startRunOnce();
      Kit.sfx('cw-place', { pitch: placed.length === 2 ? 3 : 0 });
      Kit.haptic(8);
      fx.burst(e.clientX - canvas.getBoundingClientRect().left, e.clientY - canvas.getBoundingClientRect().top, { count: 8, color: ['#CDEFE6', '#FFFFFF'], speed: [20, 70], life: [0.2, 0.45], size: [1, 2.4] });
      previewCache = null;
      dragging = { idx: placed.length - 1, id: e.pointerId, touch: e.pointerType !== 'mouse', fresh: true, start: p };
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      syncControls();
      save();
    } else if (placed.length < 2 || !inPond(p)) {
      Kit.sfx('cw-deny');
    } else {
      Kit.sfx('cw-deny');
      banners.push({ kind: 'word', text: 'Drag a stone to move it', sub: '', t: amb, dur: 1.1, small: true });
    }
  });
  canvas.addEventListener('pointermove', e => {
    if (!dragging || e.pointerId !== dragging.id || phase !== 'place') return;
    const p = local(e);
    // On touch, hold the stone above the finger once it moves, so it stays visible.
    const lift = dragging.touch && !(dragging.fresh && dist(p, dragging.start) < 10) ? 40 / S : 0;
    const q = { x: clamp(p.x, 14, PW - 14), y: clamp(p.y - lift, 14, pondH - 14) };
    const other = placed[1 - dragging.idx];
    if (other && dist(other, q) < STONE_GAP) return;
    if (!placed[dragging.idx]) return;
    if (dist(placed[dragging.idx], q) > 6 && performance.now() - lastTick > 70) { lastTick = performance.now(); Kit.sfx('cw-tick', { pitch: (q.y / pondH) * -6 + 3, vol: 0.6 }); }
    placed[dragging.idx] = q;
    previewCache = null;
  });
  const endDrag = e => { if (dragging && e.pointerId === dragging.id) { dragging = null; syncControls(); } };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  delayEl.addEventListener('input', () => {
    wait = (+delayEl.value || 0) / 1000; previewCache = null;
    delayVal.textContent = delaySeconds().toFixed(2) + ' s';
    if (performance.now() - lastTick > 60) { lastTick = performance.now(); Kit.sfx('cw-wait', { pitch: wait * 12 }); }
  });
  dropBtn.addEventListener('click', () => { if (shell.phase === 'play') release(); });
  clearBtn.addEventListener('click', () => {
    if (shell.phase !== 'play' || phase !== 'place') return;
    placed.forEach(s => fx.burst(sx(s.x), sy(s.y), { count: 8, color: ['#CDEFE6', '#FFFFFF'], speed: [20, 80], life: [0.2, 0.4], size: [1, 2.4] }));
    placed = []; wait = 0; previewCache = null; Kit.sfx('cw-lift', { pitch: -4 }); syncControls();
  });
  document.addEventListener('keydown', e => {
    if (shell.phase !== 'play' || phase !== 'place' || e.target === delayEl) return;
    if (e.key === 'Enter' && e.target !== dropBtn && e.target !== clearBtn) { e.preventDefault(); release(); }
    else if (e.key === '[' || e.key === ']') { wait = clamp(wait + (e.key === ']' ? 0.05 : -0.05), 0, 1); previewCache = null; syncControls(); Kit.sfx('cw-wait', { pitch: wait * 12 }); }
  });

  /* ---------- shell ---------- */
  if (!restore()) { run = freshRun(); startPond(1); }
  const savedRun = run.started;
  const shell = Kit.shell({
    title: 'Crosswake',
    kicker: savedRun ? `Pond ${P.n} · saved` : 'A lantern pond at dusk',
    tagline: 'Drop two stones. Where their ripples cross, lanterns light.',
    playLabel: savedRun ? 'Continue' : 'Play',
    how: [
      'Tap the pond twice to place two stones, then press Drop.',
      'Where the two ripples cross, a spark runs over the water and lights every lantern it touches.',
      'Dropped together, the spark runs straight, halfway between the stones. Make the second stone wait and the line bends around it.',
      'A lit lantern ripples too: its sparks fly straight out, away from each stone.',
      'Each drop costs two stones. Light every lantern to clear the pond; spare stones score 50 each.',
    ],
    loop,
    score: () => (run ? run.score : 0),
    lose: () => gameOver('lose'),
    theme: {
      panel: 'paper', layout: 'center', button: 'rounded', titleStyle: 'solid', radius: 20,
      font: { display: gfx.fonts.display, body: gfx.fonts.body },
      colors: { ink: '#2A2019', inkSoft: '#6B5A48', panel: 'var(--paper)', accent: '#CF4128', accentInk: '#FFF6E8', scrim: 'var(--scrim)', line: 'rgba(43,33,24,0.55)' },
    },
    onStart() {
      if (resumeOnStart) resumeOnStart = false;
      else newRunInternal();
      Kit.music.play(SONG);
      Kit.music.layer('bell', false);
      syncControls();
    },
    onPause() { save(); },
  });
  Arcade.on('pause', () => save());

  /* ---------- tests and capture scenes ---------- */
  function solvePair(sol) {
    placed = [{ x: sol.A.x, y: sol.A.y }, { x: sol.B.x, y: sol.B.y }];
    wait = clamp((sol.delay * V) / (MAX_WAIT * dist(sol.A, sol.B)), 0, 1);
    previewCache = null;
    release();
    let g = 0; while (drop && g++ < 4000) stepGame(1 / 30);
  }
  function autoplayTo(n) {
    while (P.n < n && phase !== 'over') {
      for (const sol of P.solution) if (phase === 'place') solvePair(sol);
      if (phase === 'cleared') startPond(P.n + 1);
    }
  }
  function sceneRun(seed, t0) {
    scene = true; manual = true;
    Kit.fx.seed(seed);
    nextSeed = seed; resumeOnStart = false;
    if (shell.phase === 'play') newRunInternal(); else shell.start();
    amb = t0; demo = null;
  }
  function hold() { Kit.fx.update(0); loop.render(); loop.stop(); }
  const steps = (sec) => { const n = Math.max(1, Math.round(sec * 60)); for (let i = 0; i < n; i++) { stepGame(1 / 60); fx.update(1 / 60); amb += 1 / 60; } };
  Arcade.scenes({
    art: () => {
      taught = 3;
      sceneRun(41, 20);
      autoplayTo(7);
      fx.clear();
      pondBorn = -99; banners = [];
      solvePair(P.solution[1] || P.solution[0]);
      fx.clear();
      const s = P.solution[0];
      placed = [{ x: s.A.x, y: s.A.y }, { x: s.B.x, y: s.B.y }];
      wait = clamp((s.delay * V) / (MAX_WAIT * dist(s.A, s.B)), 0, 1);
      release();
      steps(1.6 + FALL);
      hold();
    },
    shot1: () => {
      sceneRun(12, 8);
      autoplayTo(2);
      pondBorn = -99; banners = [];
      const s = P.solution[0];
      placed = [{ x: s.A.x, y: s.A.y }, { x: s.B.x, y: s.B.y }];
      wait = clamp((s.delay * V) / (MAX_WAIT * dist(s.A, s.B)), 0, 1) * 0.8;
      previewCache = null; syncControls();
      hint.text = hintText(); hint.a = 1; shownScore = run.score;
      steps(0.5);
      hold();
    },
    shot2: () => {
      taught = 3;
      sceneRun(29, 33);
      autoplayTo(9);
      fx.clear();
      pondBorn = -99; banners = [];
      solvePair(P.solution[2] || P.solution[0]);
      fx.clear();
      const s = P.solution[0];
      placed = [{ x: s.A.x, y: s.A.y }, { x: s.B.x, y: s.B.y }];
      wait = clamp((s.delay * V) / (MAX_WAIT * dist(s.A, s.B)), 0, 1);
      release();
      steps(1.75 + FALL);
      shownScore = run.score; hint.text = ''; hint.a = 0;
      hold();
    },
  });
  Arcade.test({
    seed(n) { nextSeed = n; resumeOnStart = false; },
    pond(n) { ensureStarted(); startPond(n); },
    win() { ensureStarted(); for (const sol of P.solution) if (phase === 'place') solvePair(sol); },
    step(sec) { steps(sec); loop.render(); },
    info: () => ({ pond: P.n, phase, stones: stonesLeft, lanterns: P.lanterns.length, lit: lit.size, score: run.score }),
  });

  if (Kit.debug) {
    window.__crosswake = {
      get P() { return P; }, get run() { return run; }, get lit() { return lit; }, get phase() { return phase; },
      get stonesLeft() { return stonesLeft; }, get placed() { return placed; }, get best() { return shell.best; },
      get drop() { return drop; }, get paused() { return shell.phase === 'paused'; }, get pondH() { return pondH; },
      get shell() { return shell; },
      manual(on) { manual = !!on; },
      place(A, B, w) { ensureStarted(); placed = [{ x: A.x, y: A.y }, { x: B.x, y: B.y }]; wait = w || 0; previewCache = null; syncControls(); },
      placeDelay(A, B, delay) { const sep = dist(A, B); this.place(A, B, clamp((delay * V) / (MAX_WAIT * sep), 0, 1)); },
      release, finish() { let g = 0; while (drop && g++ < 2000) stepGame(1 / 30); loop.render(); },
      advance(sec) { const n = Math.max(1, Math.round(sec * 60)); for (let i = 0; i < n; i++) if (shell.phase !== 'paused') { stepGame(1 / 60); fx.update(1 / 60); amb += 1 / 60; } loop.render(); },
      makePond, simulate, sparkPath, crossingAt,
      startPond(n) { ensureStarted(); startPond(n); },
      newRun() { resumeOnStart = false; if (shell.phase === 'play' || shell.phase === 'paused') shell.restart(); else shell.start(); },
      toScreen(p) { const r = canvas.getBoundingClientRect(); return { x: r.left + sx(p.x), y: r.top + sy(p.y) }; },
      V, R_STONE, R_LANTERN, MAX_WAIT,
    };
  }

  layout();
  loop.step(1);
  Kit.music.play(SONG);
  loop.start(); // the first frame calls Arcade.ready()
})();
</script>
</body>
</html>
