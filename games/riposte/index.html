<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* A lamplit puppet theatre: the world keeps its lamp in both themes; only the menus' paper shifts. */
:root {
  --wood: #2a160c; --wood-hi: #5a3218; --curtain: #1d2340; --curtain-hi: #3a467e;
  --paper-hi: #fbdc94; --paper: #f3c46b; --paper-edge: #e08a2e; --ink: #170d07;
  --verm: #e0442f; --jade: #3fae8a; --brass: #d9a441; --gold: #ffe6a6;
  --menu-panel: #f6e6c2; --menu-ink: #2a160c; --menu-soft: #6b4a2c; --menu-scrim: rgba(20, 10, 4, 0.5);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --menu-panel: #ecd7a8; --menu-scrim: rgba(8, 4, 2, 0.62); color-scheme: dark; }
}
:root[data-theme="dark"] { --menu-panel: #ecd7a8; --menu-scrim: rgba(8, 4, 2, 0.62); color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; background: #120905; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: #120905;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
#game { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }

/* Shell: rice-paper panels in a carved wood frame, indigo tassels, vermilion seal buttons. */
.k-shell { --k-btn-radius: 6px; }
.k-shell .k-title { background: linear-gradient(to bottom, rgba(18, 9, 5, 0) 30%, rgba(18, 9, 5, 0.78) 78%); }
.k-shell .k-title-h { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif !important; font-weight: 700 !important;
  letter-spacing: 0.04em !important; color: #fff1d0 !important; text-shadow: 0 0 22px rgba(255, 196, 107, 0.55), 3px 3px 0 #e0442f, 6px 6px 0 rgba(0, 0, 0, 0.45) !important; }
.k-shell .k-kicker { color: #ffd98a; letter-spacing: 0.3em; }
.k-shell .k-tagline { color: #ffe9c2; font-weight: 600; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8); }
.k-shell .k-best { color: #f3c46b; }
.k-shell .k-best b { color: #fff1d0; }
.k-shell .k-panel { background:
    radial-gradient(120% 90% at 50% 35%, rgba(255, 250, 230, 0.75), rgba(255, 250, 230, 0) 70%),
    repeating-linear-gradient(83deg, rgba(120, 80, 30, 0.05) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(-12deg, rgba(120, 80, 30, 0.04) 0 1px, transparent 1px 11px),
    var(--menu-panel) !important;
  border: 7px solid #2a160c !important; outline: 2px solid #c8963e; outline-offset: -12px;
  box-shadow: 0 0 0 2px #7a4a22, 0 18px 50px rgba(0, 0, 0, 0.6) !important; transform: none !important; border-radius: 4px !important; }
.k-shell .k-panel::before, .k-shell .k-panel::after { content: ""; position: absolute; top: -7px; width: 10px; height: 46px;
  background: linear-gradient(#3a467e, #1d2340 60%, #e0442f 61%, #e0442f 70%, transparent 71%); border-radius: 0 0 5px 5px; }
.k-shell .k-panel::before { left: 18px; } .k-shell .k-panel::after { right: 18px; }
.k-shell .k-panel h2, .k-shell .k-eyebrow { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; color: #2a160c; }
.k-shell .k-score { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif !important; color: #e0442f !important; }
.k-shell .k-btn { box-shadow: inset 0 0 0 2px #2a160c !important; color: #2a160c; background: rgba(255, 248, 230, 0.55); }
.k-shell .k-btn.k-primary { background: #e0442f !important; color: #fff4e0 !important; box-shadow: inset 0 0 0 2px #2a160c, 3px 3px 0 #2a160c !important;
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-size: 19px; letter-spacing: 0.06em; }
.k-shell .k-title .k-btn.k-primary { min-width: 220px; box-shadow: inset 0 0 0 2px #2a160c, 0 0 0 3px #c8963e, 0 12px 30px rgba(224, 68, 47, 0.45) !important; }
.k-shell .k-pausebtn { background: radial-gradient(circle at 40% 35%, #6a3c1c, #2a160c 70%) !important; color: #f3c46b !important;
  border-radius: 50% !important; box-shadow: 0 0 0 2px #c8963e, 0 4px 12px rgba(0, 0, 0, 0.5) !important; }
.k-shell .k-stat dd { color: #2a160c; }
</style>

<script>
(() => {
  'use strict';
  Arcade.init({ id: 'riposte', title: 'Riposte', version: '1.0.0' });
  const { gfx, fx, cam } = Kit;
  const TAU = Math.PI * 2, D2R = Math.PI / 180;
  const clamp = Kit.clamp, lerp = Kit.lerp;
  const SERIF = '"Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif';
  const RM = Kit.reducedMotion ? 0.35 : 1;

  const view = Kit.view(document.getElementById('game'), { alpha: false });
  const ctx = view.ctx;

  /* ------------------------------------------------------------ palette */
  const C = {};
  function readPalette() {
    for (const k of ['wood', 'wood-hi', 'curtain', 'curtain-hi', 'paper-hi', 'paper', 'paper-edge', 'ink', 'verm', 'jade', 'brass', 'gold']) C[k.replace('-', '_')] = Kit.css('--' + k);
  }
  readPalette();
  const INK = '#170d07';

  /* ------------------------------------------------------------ layout */
  const S = {};
  function layout() {
    const w = view.w, h = view.h;
    S.w = w; S.h = h;
    S.top = Math.round(clamp(h * 0.12, 64, 104));
    S.bot = Math.round(clamp(h * 0.075, 44, 66));
    S.side = Math.max(8, Math.round(w * 0.022));
    S.sh = h - S.top - S.bot;
    S.sw = Math.min(w - S.side * 2, Math.round(S.sh * 1.3));
    S.sx = Math.round((w - S.sw) / 2); S.sy = S.top;
    S.cx = S.sx + S.sw / 2;
    S.U = Math.min(S.sw / 370, S.sh / 600);
    S.K = S.U * 1.08;
    S.fx = S.cx; S.fy = S.sy + S.sh * 0.53;
    S.lowY = S.sy + S.sh * 0.64;
    S.lampX = S.cx; S.lampY = S.sy + S.sh * 0.42;
    S.hs = clamp(Math.min(S.top / 100, w / 390), 0.62, 1.15);
    cam.x = w / 2; cam.y = h / 2;
  }

  /* ------------------------------------------------------------ the gauntlet */
  const GAUNTLET = [
    { look: 'bandit', name: 'The Bandit', hp: 14, style: 'bandit', scene: 'bamboo' },
    { look: 'spear', name: 'The Spearman', hp: 16, style: 'spear', scene: 'castle' },
    { look: 'daggers', name: 'The Twin Daggers', hp: 16, style: 'daggers', scene: 'roofs' },
    { look: 'archer', name: 'The Archer', hp: 16, style: 'archer', scene: 'peaks' },
    { look: 'ogre', name: 'The Ogre', hp: 22, style: 'ogre', scene: 'bridge' },
    { look: 'masked', name: 'The Masked Bandit', hp: 20, style: 'masked', scene: 'bamboo' },
    { look: 'captain', name: 'The Spear Captain', hp: 22, style: 'captain', scene: 'castle' },
    { look: 'twins', name: 'The Shadow Twins', hp: 22, style: 'twins', scene: 'roofs' },
    { look: 'rain', name: 'The Rain Archer', hp: 22, style: 'rain', scene: 'peaks' },
    { look: 'grasp', name: 'The Grasping Ogre', hp: 28, style: 'grasp', scene: 'bridge' },
    { look: 'ronin', name: 'The Ronin', hp: 28, style: 'ronin', scene: 'castle' },
    { look: 'dragon', name: 'The Paper Dragon', hp: 44, style: 'dragon', scene: 'clouds' },
  ];
  const CHARMS = {
    crane: { name: 'Crane', text: 'Perfect window +40 ms' },
    tortoise: { name: 'Tortoise', text: 'Parries cost half stamina' },
    fox: { name: 'Fox', text: 'Riposte lasts 0.5 s longer' },
    koi: { name: 'Koi', text: 'Seam cuts deal triple' },
    ember: { name: 'Ember', text: 'Shrug off each foe\'s first hit' },
    moth: { name: 'Moth', text: 'Tap anywhere to turn thrusts and arrows' },
  };
  const CHARM_IDS = Object.keys(CHARMS);

  /* ------------------------------------------------------------ looks and poses */
  const LOOKS = {
    bandit: { fam: 'blade', hat: 'straw', body: 'cloak', wA: 'dao', lace: 'diamond', scale: 1 },
    masked: { fam: 'blade', hat: 'straw', mask: true, body: 'cloak', wA: 'dao', lace: 'cross', scale: 1.03 },
    ronin: { fam: 'blade', hat: 'kabuto', body: 'lamellar', wA: 'katana', lace: 'slit', scale: 1.07 },
    spear: { fam: 'spear', hat: 'helmet', body: 'lamellar', wA: 'spear', lace: 'slit', scale: 1 },
    captain: { fam: 'spear', hat: 'kabuto', body: 'lamellar', wA: 'glaive', lace: 'diamond', scale: 1.05 },
    daggers: { fam: 'dual', hat: 'hood', body: 'slim', wA: 'dagger', wB: 'dagger', lace: 'crescent', scale: 0.96 },
    twins: { fam: 'dual', hat: 'hood', mask: true, body: 'slim', wA: 'dagger', wB: 'dagger', lace: 'flame', scale: 0.98 },
    archer: { fam: 'blade', hat: 'topknot', body: 'robe', wA: 'knife', wB: 'bow', lace: 'circle', scale: 1 },
    rain: { fam: 'blade', hat: 'straw', body: 'robe', wA: 'knife', wB: 'bow', lace: 'rain', scale: 1 },
    ogre: { fam: 'blade', hat: 'horns', body: 'ogre', wA: 'club', lace: 'circle', scale: 1.2, heavy: true },
    grasp: { fam: 'blade', hat: 'horns', body: 'ogre', wA: 'club', lace: 'flame', scale: 1.24, heavy: true },
  };
  const DIMS = {
    normal: { torsoH: 100, shW: 36, hipW: 15, uLen: 46, fLen: 42, tLen: 56, sLen: 54 },
    ogre: { torsoH: 104, shW: 50, hipW: 20, uLen: 48, fLen: 44, tLen: 50, sLen: 48 },
    slim: { torsoH: 98, shW: 32, hipW: 13, uLen: 46, fLen: 44, tLen: 58, sLen: 56 },
  };
  const PF = ['x', 'y', 's', 'tor', 'hd', 'aU', 'aF', 'aW', 'bU', 'bF', 'bW', 'lT', 'lS', 'rT', 'rS'];
  const ANG = { tor: 1, hd: 1, aU: 1, aF: 1, aW: 1, bU: 1, bF: 1, bW: 1, lT: 1, lS: 1, rT: 1, rS: 1 };
  function mkPose(base, d) {
    const p = Object.assign({}, base, d);
    return p;
  }
  function toRad(p) { const o = {}; for (const k of PF) o[k] = ANG[k] ? p[k] * D2R : p[k]; return o; }
  function mirror(p) {
    return { x: -p.x, y: p.y, s: p.s, tor: -p.tor, hd: -p.hd, aU: 180 - p.bU, aF: 180 - p.bF, aW: 180 - p.bW, bU: 180 - p.aU, bF: 180 - p.aF, bW: 180 - p.aW,
      lT: 180 - p.rT, lS: 180 - p.rS, rT: 180 - p.lT, rS: 180 - p.lS };
  }
  const IDLE = { x: 0, y: 0, s: 1, tor: 0, hd: 0, aU: 105, aF: 25, aW: -60, bU: 72, bF: 112, bW: 80, lT: 102, lS: 94, rT: 78, rS: 86 };
  function family(idle, set) {
    const out = { idle: toRad(idle) };
    for (const k in set) {
      if (k === 'mirror') continue;
      out[k] = set[k].map(d => toRad(mkPose(idle, d)));
    }
    if (set.mirror) for (const [a, b] of set.mirror) out[b] = set[a].map(d => toRad(mirror(mkPose(idle, d))));
    return out;
  }
  const BLADE = {
    L: [{ tor: -9, hd: -6, y: -4, aU: -150, aF: -115, aW: -150, bU: 40, bF: 10, lT: 110, rT: 74 }, { tor: 6, s: 1.08, aU: 178, aF: 12, aW: 4, bU: 60, bF: 80, lT: 104, rT: 72 }, { tor: 12, s: 1.04, aU: 40, aF: 30, aW: 35, bU: 80, bF: 120 }],
    R: [{ tor: 9, hd: 6, y: -4, aU: -35, aF: -62, aW: -28, bU: 115, bF: 150 }, { tor: -5, s: 1.08, aU: 2, aF: -8, aW: 192, bU: 80, bF: 100 }, { tor: -12, aU: 140, aF: 165, aW: 200 }],
    O: [{ y: -10, s: 0.96, hd: -8, aU: -108, aF: -96, aW: -100, bU: -72, bF: -88 }, { s: 1.06, aU: -72, aF: -12, aW: 176, bU: -60, bF: -140 }, { y: 6, s: 1.1, aU: 65, aF: 85, aW: 100, bU: 110, bF: 95 }],
    SL: [{ y: 20, tor: -15, aU: 162, aF: 172, aW: 188, bU: 40, bF: -10, lT: 125, lS: 100, rT: 55, rS: 80 }, { y: 22, tor: 6, s: 1.06, aU: 120, aF: 60, aW: 8, lT: 122, rT: 58 }, { y: 18, tor: 14, aU: 60, aF: 20, aW: 20, lT: 122, rT: 58 }],
    SR: [{ y: 20, tor: 15, aU: 25, aF: -10, aW: -8, bU: 120, bF: 170, lT: 125, lS: 100, rT: 55, rS: 80 }, { y: 22, tor: -6, s: 1.06, aU: 75, aF: 150, aW: 172, lT: 122, rT: 58 }, { y: 18, tor: -14, aU: 130, aF: 170, aW: 185, lT: 122, rT: 58 }],
    T: [{ s: 0.93, tor: -8, aU: 125, aF: -165, aW: 8, bU: 60, bF: 20 }, { s: 1.16, tor: 4, aU: 40, aF: 15, aW: 10 }, { s: 1.12, aU: 35, aF: 10, aW: 8 }],
    G: [{ hd: 10, aU: -150, aF: -125, aW: -140, bU: -30, bF: -55, bW: -60 }, { s: 1.32, y: -8, aU: 25, aF: -5, aW: -30, bU: 155, bF: 185 }, { s: 1.26, aU: 40, aF: 10, aW: -10, bU: 140, bF: 170 }],
    A: [{ tor: -4, aU: 175, aF: 182, aW: 10, bU: 20, bF: 8, bW: -90 }, { tor: -4, aU: 172, aF: 188, aW: 8, bU: 22, bF: 10, bW: -90 }, { aU: 120, aF: 60, bU: 40, bF: 40, bW: -80 }],
    stag: [{ tor: -14, hd: 18, y: 6, s: 0.96, aU: -160, aF: -170, aW: -200, bU: 20, bF: -20, lT: 112, rT: 72 }],
    win: [{ y: -6, aU: -120, aF: -95, aW: -80, bU: -60, bF: -80, hd: -10 }],
  };
  const SPEAR_IDLE = mkPose(IDLE, { aU: 100, aF: 15, aW: -78, bU: 78, bF: 150 });
  const SPEAR = {
    L: [{ tor: -10, aU: -150, aF: -150, aW: -165, bU: -100, bF: -160 }, { tor: 6, s: 1.08, aU: 178, aF: 5, aW: 2, bU: 120, bF: 40 }, { tor: 12, aU: 40, aF: 20, aW: 20, bU: 80, bF: 60 }],
    R: [{ tor: 10, aU: -30, aF: -20, aW: -15, bU: -60, bF: -30 }, { tor: -6, s: 1.08, aU: 5, aF: -170, aW: 182, bU: 100, bF: 175 }, { tor: -12, aU: 140, aF: 170, aW: 190, bU: 120, bF: 170 }],
    O: [{ y: -8, s: 0.96, aU: -100, aF: -100, aW: -95, bU: -80, bF: -85 }, { s: 1.06, aU: -70, aF: -20, aW: 178, bU: -40, bF: -150 }, { y: 6, s: 1.1, aU: 60, aF: 80, aW: 95, bU: 100, bF: 100 }],
    SL: [{ y: 22, tor: -16, aU: 165, aF: 170, aW: 185, bU: 140, bF: 175, lT: 125, rT: 55 }, { y: 24, tor: 6, s: 1.06, aU: 120, aF: 40, aW: 6, bU: 80, bF: 20, lT: 122, rT: 58 }, { y: 20, tor: 14, aU: 60, aF: 10, aW: 12, bU: 60, bF: 10 }],
    SR: [{ y: 22, tor: 16, aU: 20, aF: 5, aW: -5, bU: 50, bF: 10, lT: 125, rT: 55 }, { y: 24, tor: -6, s: 1.06, aU: 80, aF: 165, aW: 175, bU: 100, bF: 170, lT: 122, rT: 58 }, { y: 20, tor: -14, aU: 140, aF: 175, aW: 185, bU: 130, bF: 175 }],
    T: [{ s: 0.92, tor: -10, aU: 150, aF: 178, aW: 4, bU: 110, bF: 175 }, { s: 1.2, tor: 5, aU: 35, aF: 8, aW: 6, bU: 60, bF: -5 }, { s: 1.15, aU: 30, aF: 5, aW: 4, bU: 55, bF: 0 }],
    G: [{ hd: 10, aU: -150, aF: -125, aW: -100, bU: -30, bF: -55 }, { s: 1.32, y: -8, aU: 25, aF: -5, aW: -60, bU: 155, bF: 185 }, { s: 1.26, aU: 40, aF: 10, aW: -40, bU: 140, bF: 170 }],
    stag: [{ tor: -14, hd: 18, y: 6, s: 0.96, aU: -160, aF: -170, aW: -120, bU: 20, bF: -20 }],
    win: [{ y: -6, aU: -100, aF: -90, aW: -88, bU: -60, bF: -80, hd: -10 }],
  };
  const DUAL_IDLE = mkPose(IDLE, { aU: 100, aF: -25, aW: -80, bU: 80, bF: 205, bW: -100 });
  const DUAL = {
    L: [{ tor: -10, hd: -6, y: -4, aU: -150, aF: -115, aW: -150, lT: 110, rT: 74 }, { tor: 6, s: 1.08, aU: 178, aF: 12, aW: 4 }, { tor: 12, s: 1.04, aU: 40, aF: 30, aW: 35 }],
    O: [{ y: -10, s: 0.96, aU: -108, aF: -96, aW: -100, bU: -72, bF: -84, bW: -80 }, { s: 1.06, aU: -60, aF: -5, aW: 170, bU: -120, bF: -175, bW: 10 }, { y: 6, s: 1.1, aU: 65, aF: 85, aW: 100, bU: 115, bF: 95, bW: 80 }],
    SL: [{ y: 20, tor: -15, aU: 162, aF: 172, aW: 188, lT: 125, lS: 100, rT: 55, rS: 80 }, { y: 22, tor: 6, s: 1.06, aU: 120, aF: 60, aW: 8, lT: 122, rT: 58 }, { y: 18, tor: 14, aU: 60, aF: 20, aW: 20, lT: 122, rT: 58 }],
    T: [{ s: 0.93, tor: -8, aU: 125, aF: -165, aW: 8 }, { s: 1.16, tor: 4, aU: 40, aF: 15, aW: 10 }, { s: 1.12, aU: 35, aF: 10, aW: 8 }],
    G: BLADE.G,
    stag: BLADE.stag,
    win: [{ y: -6, aU: -120, aF: -95, aW: -80, bU: -60, bF: -85, bW: -100, hd: -10 }],
    mirror: [['L', 'R'], ['SL', 'SR']],
  };
  const FAMS = { blade: family(IDLE, BLADE), spear: family(SPEAR_IDLE, SPEAR), dual: family(DUAL_IDLE, DUAL) };
  // Arrows use the blade family's A poses, with the bow held in arm B.
  FAMS.blade.A = BLADE.A.map(d => toRad(mkPose(IDLE, d)));

  /* ------------------------------------------------------------ sprites */
  const parts = new Map();
  let partRes = 0;
  function part(key, x0, y0, x1, y1, paint) {
    const k = key + '|' + partRes.toFixed(3);
    let p = parts.get(k);
    if (p) return p;
    const w = x1 - x0, h = y1 - y0, c = document.createElement('canvas');
    c.width = Math.max(2, Math.ceil(w * partRes)); c.height = Math.max(2, Math.ceil(h * partRes));
    const g = c.getContext('2d');
    g.scale(partRes, partRes); g.translate(-x0, -y0);
    g.fillStyle = INK; g.strokeStyle = INK; g.lineJoin = 'round'; g.lineCap = 'round';
    paint(g);
    p = { c, x0, y0, w, h };
    parts.set(k, p);
    return p;
  }
  function blitPart(p, x, y, ang, k) {
    ctx.save(); ctx.translate(x, y); if (ang) ctx.rotate(ang);
    ctx.drawImage(p.c, p.x0 * k, p.y0 * k, p.w * k, p.h * k);
    ctx.restore();
  }
  // Punch lace: everything drawn by fn is cut out of the silhouette, so the lamp shows through.
  function punch(g, fn) { g.save(); g.globalCompositeOperation = 'destination-out'; g.fillStyle = '#000'; g.strokeStyle = '#000'; fn(g); g.restore(); }
  function lace(g, type, x0, y0, x1, y1, step) {
    step = step || 10;
    let row = 0;
    for (let y = y0; y <= y1; y += step * 0.86, row++) {
      for (let x = x0 + (row % 2 ? step / 2 : 0); x <= x1; x += step) {
        g.beginPath();
        if (type === 'diamond') { g.moveTo(x, y - 3.2); g.lineTo(x + 2.4, y); g.lineTo(x, y + 3.2); g.lineTo(x - 2.4, y); }
        else if (type === 'slit') { g.rect(x - 3.6, y - 0.9, 7.2, 1.8); }

  /* ------------------------------------------------------------ the player's blade */
  function bladeRest() {

  }
  function blockBlade(pt, k) {

  function swingBlade(dir, x, y) {

  function updateBlade(dt) {

  /* ------------------------------------------------------------ arrows */
  function loose(F, a) {
    const P = rig(F, F.pose);
    const r = F.rng;
    const x1 = S.cx + r.range(-0.36, 0.36) * S.sw, y1 = S.sy + S.sh * r.range(0.5, 0.78);
    const flight = G.cycle > 1 ? 0.6 : 0.72;

  }
  function arrowPos(ar) {

  /* ------------------------------------------------------------ update */
  function update(dt) {
    T += dt;
    ambient(dt);
    if (!G) return;
    G.t += dt; G.phaseT += dt;
    const F = G.F;

    G.lock = Math.max(0, G.lock - dt);

  }
  function idleAnim(F, dt) {

  function duel(F, dt) {

    idleAnim(F, dt);
    F.posture = Math.max(0, F.posture - dt * 6);
    const now = G.t;
    // threats: glints, feints, side swaps, landing
    for (const th of G.threats) {
      if (th.done) continue;
      if (!th.glinted && th.impact - now <= perfWin() && !th.feint) { th.glinted = true; sfx('glint'); }
      if (th.swapAt && now >= th.swapAt && !th.swapped) {

      }

    }

  // the unseen hand: attract mode, demos and capture scenes
  function autoAnswer(th) {

  /* keyboard */
  function keys() {

  }

  /* ------------------------------------------------------------ drawing */

  function draw() {

    const res = Math.round(S.K * 1.3 * view.dpr * 100) / 100;

    view.clear('#120905');

    god(on) { if (G) G.god = on !== false; },
    auto(on) { if (G) G.auto = !!on; },
    skipTutorial() { for (const k in tut) tut[k] = true; Kit.save.set('tut', tut); if (G) { G.demo = false; G.hint = ''; } },
    info() {
      if (!G) return null;
      const F = G.F, th = pendingThreat();
      return { phase: G.phase, foe: G.foe + 1, cycle: G.cycle, name: F.def.name, hp: F.hp, maxHp: F.maxHp, state: F.state, posture: Math.round(F.posture), seals: G.seals, stamina: Math.round(G.stamina),
        score: G.score, combo: G.combo, perfects: G.perfects, charms: G.charms.slice(), choice: G.choice ? G.choice.ids.slice() : null, t: G.t,
        next: th ? { k: th.k, answer: threatAnswer(th), in: +(th.impact - G.t).toFixed(3), feint: !!th.feint, arrow: !!th.arrow } : null,
        script: F.queue.map(a => ({ k: a.k, wind: +a.wind.toFixed(2), feint: !!a.feint })), demo: G.demo, riposte: F.state === 'stagger' ? +F.ripT.toFixed(2) : 0 };
    },
    // run until the next threat is this far (s) from impact; returns the threat info
    until(lead) {
      for (let i = 0; i < 1200; i++) {
        const th = G && G.phase === 'duel' && pendingThreat();
        if (th && th.impact - G.t <= lead && !th.feint) return api.info().next;
        loop.step(1);
      }
      return null;
    },
    state: () => ({ phase: shell.phase, score: G && !G.auto ? G.score : 0, paused: shell.phase === 'paused', frame: loop.frame, foe: G ? G.foe + 1 : 0 }),
  };
  Arcade.test(api);
  if (Kit.debug) window.__game = api;

  /* ------------------------------------------------------------ capture scenes */
  function scene(opts) {
    sceneMode = true;
    fx.seed(opts.seed);
    api.skipTutorial();
    nextSeed = opts.seed; autoNext = true; forceFoe = { foe: opts.foe, cycle: 1, charms: opts.charms || [] };
    shell.start();
    autoNext = false;
    G.auto = true; G.god = true;
    return G;
  }
  Arcade.scenes({
    art() {
      scene({ seed: 12, foe: 11 });
      G.phase = 'duel'; G.F.state = 'idle'; G.F.ox = 0; G.F.timer = 0.2;
      for (let i = 0; i < 300; i++) loop.step(1);
      G.F.segs[3].tears.push({ pts: [[-18, -6], [-8, -2], [0, -7], [10, -1], [20, -5]], seam: true }, { pts: [[-10, 8], [0, 4], [12, 9]], seam: false });
      G.F.segs[6].tears.push({ pts: [[-14, -4], [-2, 2], [12, -3]], seam: false });
      // hold the frame just after a perfect parry
      let caught = false;
      const was = G.perfects;
      for (let i = 0; i < 900 && !caught; i++) { loop.step(1); if (G.perfects > was) caught = true; }
      loop.step(3);
      loop.stop();
    },
    shot1() {
      scene({ seed: 3, foe: 1 });
      G.auto = false; G.god = true;
      G.phase = 'duel'; G.F.state = 'idle'; G.F.ox = 0; G.F.timer = 0.3; G.banner = null;
      G.score = 240; G.combo = 2; G.stamina = 82;
      for (let i = 0; i < 400; i++) { loop.step(1); const th = pendingThreat(); if (th && th.impact - G.t < 0.42 && th.impact - G.t > 0.3) break; }
      G.F.tears.push({ pts: [[-14, -70], [-6, -64], [2, -68], [12, -60]], seam: false });
      loop.stop();
    },
    shot2() {
      scene({ seed: 9, foe: 4, charms: ['crane', 'koi'] });
      G.phase = 'duel'; G.F.state = 'idle'; G.F.ox = 0; G.F.timer = 0.2; G.banner = null;
      G.score = 6830; G.seals = 2; G.foe = 4;
      G.F.tears.push({ pts: [[-24, -78], [-14, -72], [-8, -76], [2, -68]], seam: false }, { pts: [[6, -44], [14, -36], [20, -40], [28, -30]], seam: false });
      let caught = false;
      for (let i = 0; i < 900 && !caught; i++) { loop.step(1); if (G.F.state === 'stagger') caught = true; }
      G.auto = false; G.combo = 6; G.stamina = 64;
      loop.step(16);
      loop.stop();
    },
  });

  /* ------------------------------------------------------------ boot */
  layout();
  Kit.onTheme(() => { readPalette(); bgKey = ''; loop.render(); });
  newRun(4, true);
  G.foe = 0;
  loop.step(100);
  syncPlayLabel();
  Kit.music.play(MAIN_SONG);
  loop.start();
})();
</script>
