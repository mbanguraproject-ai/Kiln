<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Thimblekeep</title>
<meta name="description" content="A mouse knight with a needle sword. Swipe to dash-strike through a castle of beasts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Unbounded:wght@600;800&display=swap">
<style>
:root {
  --cloth: #6e1726; --cloth-2: #4a0d18; --gold: #e8b04b; --gold-hi: #ffe8a3; --gold-lo: #a8741f;
  --ink: #2a1a12; --parch: #f7e8c6; --parch-soft: rgba(247,232,198,.78); --scrim: rgba(36,10,14,.5);
  --page: #1d120c; color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --cloth: #5e1220; --cloth-2: #3a0912; --scrim: rgba(14,4,6,.62); --page: #140c08; }
}
:root[data-theme="dark"] { --cloth: #5e1220; --cloth-2: #3a0912; --scrim: rgba(14,4,6,.62); --page: #140c08; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: var(--page); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#game { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
[hidden] { display: none !important; }
#safe { position: fixed; left: 0; top: 0; width: 1px; height: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); visibility: hidden; pointer-events: none; }

/* Shell: an illuminated manuscript, gold leaf on a deep red cloth binding */
.k-shell { --tk-serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "DejaVu Serif", serif; }
.k-shell .k-title-h { font-family: var(--tk-serif) !important; font-weight: 800; letter-spacing: -.01em !important; font-style: italic;
  background: linear-gradient(180deg, #fff6d0 8%, #ffd76e 38%, #d99a2b 62%, #ffe08a 80%, #b07a22 100%); -webkit-background-clip: text; background-clip: text; color: transparent !important;
  -webkit-text-stroke: 1.5px var(--ink); filter: drop-shadow(0 3px 0 var(--ink)) drop-shadow(0 10px 22px rgba(0,0,0,.55)); text-shadow: none !important; padding: 0 .1em; }
.k-shell .k-kicker { color: var(--gold-hi); text-shadow: 0 1px 0 var(--ink), 0 0 12px rgba(0,0,0,.6); font-family: var(--tk-serif); letter-spacing: .3em; }
.k-shell .k-tagline { color: var(--parch); text-shadow: 0 1px 0 var(--ink), 0 2px 12px rgba(0,0,0,.75); font-family: var(--tk-serif); font-style: italic; font-size: 18px; }
.k-shell .k-best { color: var(--gold-hi); text-shadow: 0 1px 0 var(--ink); }
.k-shell .k-best b { color: #fff; font-family: var(--tk-serif); }
.k-shell .k-panel { background:
    radial-gradient(120% 60% at 50% 0%, rgba(255,214,120,.16), transparent 60%),
    repeating-linear-gradient(45deg, rgba(0,0,0,.07) 0 2px, transparent 2px 5px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.035) 0 2px, transparent 2px 5px),
    linear-gradient(180deg, var(--cloth), var(--cloth-2)) !important;
  border: 3px solid var(--gold) !important; border-radius: 10px !important; transform: none !important;
  box-shadow: 0 0 0 2px var(--ink), inset 0 0 0 5px var(--cloth), inset 0 0 0 6.5px rgba(255,214,120,.75), 0 28px 70px -24px rgba(0,0,0,.85) !important; color: var(--parch); }
.k-shell .k-panel::before, .k-shell .k-panel::after { content: ""; position: absolute; width: 26px; height: 26px; pointer-events: none;
  background: radial-gradient(circle at 50% 50%, var(--gold-hi) 0 3px, var(--gold) 3.5px 5px, transparent 5.5px),
    conic-gradient(from 45deg, transparent 0 25%, rgba(232,176,75,.9) 25% 26%, transparent 26% 50%, rgba(232,176,75,.9) 50% 51%, transparent 51%); }
.k-shell .k-panel::before { top: 8px; left: 8px; }
.k-shell .k-panel::after { top: 8px; right: 8px; }
.k-shell .k-panel h2, .k-shell .k-eyebrow { font-family: var(--tk-serif) !important; color: var(--gold-hi) !important; text-shadow: 0 2px 0 var(--ink); }
.k-shell .k-panel h2 { font-style: italic; font-size: 30px; }
.k-shell .k-score { font-family: var(--tk-serif) !important; color: #fff3cf; text-shadow: 0 3px 0 var(--ink), 0 0 26px rgba(255,200,90,.45); }
.k-shell .k-btn { font-family: var(--tk-serif); font-weight: 700; color: var(--parch); box-shadow: inset 0 0 0 2px rgba(232,176,75,.85) !important; border-radius: 8px !important; background: rgba(0,0,0,.14); }
.k-shell .k-btn.k-primary { background: linear-gradient(180deg, #fff1b8 0%, #f2c35c 40%, #c98d2e 100%) !important; color: var(--ink) !important;
  box-shadow: inset 0 0 0 2px var(--ink), inset 0 2px 0 rgba(255,255,255,.7), 0 4px 0 var(--ink), 0 12px 26px -10px rgba(255,190,80,.7) !important; text-shadow: 0 1px 0 rgba(255,255,255,.5); }
.k-shell .k-btn.k-primary:active { transform: translateY(3px); box-shadow: inset 0 0 0 2px var(--ink), 0 1px 0 var(--ink) !important; }
.k-shell .tk-new { min-width: min(220px, 100%); }
.k-shell .k-stat { background: rgba(0,0,0,.2) !important; box-shadow: inset 0 0 0 1px rgba(232,176,75,.35); border-radius: 6px !important; }
.k-shell .k-stat dt { color: var(--parch-soft) !important; font-family: var(--tk-serif); }
.k-shell .k-stat dd { font-family: var(--tk-serif) !important; color: var(--gold-hi); }
.k-shell .k-how { color: var(--parch) !important; font-family: var(--tk-serif); }
.k-shell .k-bestline { color: var(--parch-soft); }
.k-shell .k-newbest { background: linear-gradient(180deg, #fff1b8, #e8b04b) !important; color: var(--ink) !important; box-shadow: 0 0 0 2px var(--ink); }
.k-shell .k-pausebtn { background: linear-gradient(180deg, #fff1b8 0%, #e8b04b 45%, #b07a22 100%) !important; color: var(--ink) !important; border-radius: 50% !important; box-shadow: 0 0 0 2px var(--ink), inset 0 0 0 3px rgba(255,255,255,.35), 0 4px 10px rgba(0,0,0,.45) !important; }
.k-shell .k-toast { background: var(--cloth) !important; color: var(--gold-hi) !important; box-shadow: 0 0 0 2px var(--gold), 0 0 0 4px var(--ink) !important; font-family: var(--tk-serif); }
.k-shell .k-switch { background: rgba(0,0,0,.35); }
</style>
</head>
<body>
<canvas id="game" aria-label="Thimblekeep game"></canvas>
<div id="safe"></div>
<script src="../../hub/sdk.js"></script>
<script src="../../hub/kit.js"></script>
<script>
(() => {
  'use strict';
  Arcade.init({ id: 'thimblekeep', title: 'Thimblekeep', version: '1.0.0' });
  const { gfx, fx, cam } = Kit;
  const TAU = Math.PI * 2, PI = Math.PI;
  const INK = '#2a1a12';
  const SERIF = '"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"DejaVu Serif",serif';
  const clamp = Kit.clamp, lerp = Kit.lerp, dist = Kit.dist;
  const adiff = (a, b) => { let d = (b - a) % TAU; if (d > PI) d -= TAU; if (d < -PI) d += TAU; return d; };
  const WT = 54;           // height of the top wall face (doors live in it)
  const MAXDASH = 180;
  const view = Kit.view(document.getElementById('game'), { alpha: false });
  const ctx = view.ctx;
  const safeEl = document.getElementById('safe');
  let vr = Kit.rng(5);     // visual-only randomness (re-seeded by scenes)

  /* ---------------------------------------------------------------- floors */
  const FLOORS = [
    { key: 'pantry', name: 'Pantry', num: 'I', boss: 'crow', bossName: 'The Crow', bossSub: 'Keeper of the Pantry', foes: ['beetle'], late: ['brute'], lateAt: 5, hazard: 'trap',
      props: ['jar', 'egg', 'sugar'], shell: '#7a2e1c', shell2: '#c4572e', mote: '#ffe2a8',
      pal: { a: '#d9a04a', b: '#c58c3c', c: '#e8b04b', grout: '#8a5a28', wall: '#6a3e1f', wallHi: '#8e5a2e', wallLo: '#45260f', outer: '#2a180c', outer2: '#3d2412', light: '#ffcf7a' } },
    { key: 'sewing', name: 'Sewing Room', num: 'II', boss: 'cat', bossName: 'The Cat', bossSub: 'Paw of the Sewing Room', foes: ['spider', 'beetle'], late: ['brute'], lateAt: 4, hazard: 'pins',
      props: ['cushion', 'spool', 'thimble'], shell: '#4e2a66', shell2: '#9a5cc0', mote: '#ffd0dc',
      pal: { a: '#d9738c', b: '#c4627c', c: '#f2d6c4', grout: '#8c3a52', wall: '#7d3348', wallHi: '#a44c64', wallLo: '#4c1a2a', outer: '#2a0e18', outer2: '#3e1624', light: '#ffd29a' } },
    { key: 'library', name: 'Library', num: 'III', boss: 'owl', bossName: 'The Owl', bossSub: 'Warden of the Library', foes: ['centipede', 'beetle', 'spider'], late: [], lateAt: 9, hazard: 'books',
      props: ['books', 'inkwell', 'seal'], shell: '#29503a', shell2: '#7fb27a', mote: '#f6e2a6',
      pal: { a: '#3f6b4f', b: '#355d44', c: '#d8b45a', grout: '#22402e', wall: '#3a2416', wallHi: '#5a3a22', wallLo: '#20130a', outer: '#0f1c14', outer2: '#18291e', light: '#ffd68a' } },
    { key: 'chimney', name: 'Chimney', num: 'IV', boss: 'sootrat', bossName: 'The Soot Rat', bossSub: 'Lord of the Flue', foes: ['wasp', 'beetle', 'brute'], late: ['spider'], lateAt: 4, hazard: 'embers',
      props: ['pot', 'brick', 'coal'], shell: '#2b2424', shell2: '#ff7a2f', mote: '#ff9a4a',
      pal: { a: '#4a3b3b', b: '#3f3232', c: '#ff7a2f', grout: '#241a1a', wall: '#3a2c2c', wallHi: '#5a4444', wallLo: '#1e1616', outer: '#140d0c', outer2: '#221615', light: '#ff9a4a' } },
    { key: 'attic', name: 'Attic', num: 'V', boss: 'tomrat', bossName: 'The Tom Rat', bossSub: 'King under the Rafters', foes: ['beetle', 'spider', 'wasp', 'brute', 'centipede'], late: [], lateAt: 9, hazard: 'mix',
      props: ['trunk', 'button', 'candle'], shell: '#2c3566', shell2: '#8fa6e0', mote: '#cfdcff',
      pal: { a: '#6f86b5', b: '#5f749f', c: '#ffc070', grout: '#3a4870', wall: '#3c4668', wallHi: '#56628c', wallLo: '#1f2640', outer: '#10152a', outer2: '#1a2140', light: '#ffc070' } },
  ];
  const COST = { beetle: 1, spider: 1.2, wasp: 1.1, brute: 2, centipede: 2.3 };

  /* room layouts: [u, v, size] in room fractions; mirrored and resized per seed */
  const TPL = [
    [],
    [[0.22, 0.42, 'm'], [0.78, 0.42, 'm']],
    [[0.5, 0.45, 'l']],
    [[0.2, 0.24, 'm'], [0.8, 0.24, 'm'], [0.2, 0.7, 's'], [0.8, 0.7, 's']],
    [[0.26, 0.3, 's'], [0.5, 0.48, 'm'], [0.74, 0.66, 's']],
    [[0.5, 0.3, 's'], [0.3, 0.5, 's'], [0.7, 0.5, 's'], [0.5, 0.7, 's']],
    [[0.16, 0.3, 's'], [0.16, 0.52, 's'], [0.84, 0.3, 's'], [0.84, 0.52, 's'], [0.5, 0.72, 'm']],
    [[0.3, 0.26, 'm'], [0.74, 0.4, 's'], [0.24, 0.6, 's'], [0.68, 0.68, 'l']],
    [[0.34, 0.3, 'l'], [0.7, 0.36, 'm']],
    [[0.18, 0.36, 's'], [0.4, 0.52, 'm'], [0.62, 0.34, 's'], [0.82, 0.56, 'm']],
    [[0.5, 0.26, 'm'], [0.2, 0.66, 's'], [0.8, 0.66, 's']],
    [[0.1, 0.48, 'm'], [0.9, 0.48, 'm']],
  ];

  const RELICS = {
    spool: { name: 'Thread Spool', desc: 'Dashes leave a cutting thread' },
    shield: { name: 'Button Shield', desc: 'Blocks the first hit in each room' },
    pepper: { name: 'Pepper Seed', desc: 'Perfect hits set foes burning' },
    bell: { name: 'Brass Bell', desc: 'Foes are stunned as you enter' },
    helm: { name: 'Thimble Helm', desc: 'One more cheese wedge' },
    needle: { name: 'Long Needle', desc: 'Longer dashes, wider cuts' },
    feather: { name: 'Wren Feather', desc: 'Recover from dashes twice as fast' },
    honey: { name: 'Honey Drop', desc: 'Combos heal every 6 hits' },
    bead: { name: 'Lucky Bead', desc: 'Half again as many beads' },
    sugar: { name: 'Sugar Cube', desc: 'Dazed foes take perfect hits too' },
    top: { name: 'Spinning Top', desc: 'Spins reach further and hit twice' },
    cork: { name: 'Cork Boots', desc: 'Traps, embers and webs cannot hurt you' },
  };
  const RELIC_IDS = Object.keys(RELICS);

  /* ---------------------------------------------------------------- sound */
  const S = Kit.sfx.define;
  S('dash', [{ wave: 'noise', freq: 900, filter: 'bandpass', cut: 700, cutTo: 4200, q: 1.4, attack: 0.004, hold: 0.05, release: 0.09, vol: 0.26 },
    { wave: 'sine', freq: 520, to: 1300, slide: 0.08, release: 0.06, vol: 0.06 }]);
  S('ting', [{ wave: 'sine', freq: 2637, release: 0.32, hold: 0.01, vol: 0.16, vib: 0.4, vibRate: 32, verb: 0.3 }, { wave: 'triangle', freq: 3951, release: 0.18, vol: 0.08 }]);
  S('crunch', [{ wave: 'noise', freq: 3200, filter: 'lowpass', cut: 3600, cutTo: 500, hold: 0.03, release: 0.13, vol: 0.36 }, { wave: 'square', freq: 190, to: 55, slide: 0.09, release: 0.08, vol: 0.14 }]);
  S('shing', [{ wave: 'sawtooth', freq: 1700, to: 3400, slide: 0.12, filter: 'highpass', cut: 1400, hold: 0.04, release: 0.4, vol: 0.14, verb: 0.55 }, { wave: 'sine', freq: 4186, release: 0.6, vol: 0.13, verb: 0.6 }, { wave: 'sine', freq: 2093, release: 0.35, vol: 0.1 }]);
  S('squeak', { wave: 'square', freq: 1500, to: 2400, slide: 0.06, hold: 0.05, release: 0.09, vol: 0.13, vib: 1.5, vibRate: 28, filter: 'lowpass', cut: 3500 });
  S('munch', [{ wave: 'noise', freq: 1000, filter: 'lowpass', cut: 1400, hold: 0.04, release: 0.05, vol: 0.32 }, { wave: 'noise', freq: 1000, filter: 'lowpass', cut: 1200, hold: 0.04, release: 0.05, vol: 0.3, at: 0.12 }, { wave: 'noise', freq: 900, filter: 'lowpass', cut: 1000, hold: 0.05, release: 0.06, vol: 0.28, at: 0.25 }, { wave: 'sine', freq: 660, to: 990, slide: 0.1, release: 0.15, vol: 0.1, at: 0.32 }]);
  S('creak', { wave: 'sawtooth', freq: 170, to: 120, slide: 0.45, filter: 'bandpass', cut: 700, q: 7, hold: 0.36, release: 0.2, vol: 0.13, vib: 0.6, vibRate: 13 });
  S('snap', [{ wave: 'noise', freq: 5000, filter: 'highpass', cut: 2200, hold: 0.01, release: 0.06, vol: 0.42 }, { wave: 'square', freq: 110, to: 60, slide: 0.05, release: 0.07, vol: 0.22 }]);
  S('thwip', { wave: 'triangle', freq: 280, to: 1500, slide: 0.08, release: 0.06, vol: 0.18 });
  S('yowl', [{ wave: 'sawtooth', freq: 320, to: 640, slide: 0.32, hold: 0.42, release: 0.32, vib: 1.4, vibRate: 6, filter: 'lowpass', cut: 1700, vol: 0.17 }, { wave: 'square', freq: 640, to: 900, slide: 0.4, hold: 0.3, release: 0.3, vib: 1, vibRate: 7, filter: 'lowpass', cut: 1400, vol: 0.06 }]);
  S('spin', { wave: 'noise', freq: 1600, filter: 'bandpass', cut: 2400, cutTo: 700, q: 2, hold: 0.12, release: 0.1, vol: 0.2 });
  S('bead', { wave: 'sine', freq: 1975, release: 0.09, hold: 0.01, vol: 0.09, jitter: 3 });
  S('clang', [{ wave: 'square', freq: 640, release: 0.28, hold: 0.01, vol: 0.12, vib: 0.4, vibRate: 45, filter: 'bandpass', cut: 1800, q: 3 }, { wave: 'sine', freq: 1290, release: 0.35, vol: 0.12 }, { wave: 'noise', freq: 6000, filter: 'highpass', cut: 3000, release: 0.05, vol: 0.18 }]);
  S('caw', { wave: 'sawtooth', freq: 760, to: 480, slide: 0.16, hold: 0.12, release: 0.08, filter: 'bandpass', cut: 1300, q: 3, vib: 3, vibRate: 26, vol: 0.2 });
  S('hoot', [{ wave: 'sine', freq: 392, to: 350, slide: 0.2, hold: 0.22, release: 0.2, vol: 0.2, vib: 0.3, vibRate: 5 }, { wave: 'sine', freq: 392, to: 330, slide: 0.3, hold: 0.3, release: 0.25, vol: 0.2, at: 0.42 }]);
  S('chitter', { wave: 'square', freq: 260, hold: 0.28, release: 0.05, vol: 0.06, vib: 4, vibRate: 34, filter: 'lowpass', cut: 1200 });
  S('drop', { wave: 'sine', freq: 1500, to: 380, slide: 0.75, hold: 0.7, release: 0.05, vol: 0.06 });
  S('fire', [{ wave: 'noise', freq: 700, filter: 'lowpass', cut: 500, cutTo: 2600, hold: 0.18, release: 0.25, vol: 0.28 }, { wave: 'sine', freq: 90, to: 50, slide: 0.2, release: 0.2, vol: 0.12 }]);
  S('chime', { wave: 'sine', freq: 1046, arp: [0, 4, 7, 12, 16], arpStep: 0.07, hold: 0.36, release: 0.5, vol: 0.12, verb: 0.6 });
  S('fanfare', [{ wave: 'square', freq: 523, arp: [0, 4, 7, 12, 7, 12, 16], arpStep: 0.11, hold: 0.8, release: 0.4, vol: 0.1, filter: 'lowpass', cut: 2600 }, { wave: 'triangle', freq: 262, arp: [0, 7, 12], arpStep: 0.25, hold: 0.8, release: 0.5, vol: 0.14 }]);
  S('relic', { wave: 'triangle', freq: 660, arp: [0, 7, 12, 19, 24], arpStep: 0.06, hold: 0.32, release: 0.5, vol: 0.15, verb: 0.5 });
  S('door', [{ wave: 'sawtooth', freq: 150, to: 110, slide: 0.5, filter: 'bandpass', cut: 600, q: 8, hold: 0.45, release: 0.2, vol: 0.12, vib: 0.7, vibRate: 11 }, { wave: 'noise', freq: 400, filter: 'lowpass', cut: 500, hold: 0.05, release: 0.2, vol: 0.18, at: 0.45 }]);
  S('rumble', { wave: 'noise', freq: 200, filter: 'lowpass', cut: 260, hold: 0.25, release: 0.35, vol: 0.45 });
  S('poof', { wave: 'noise', freq: 1800, filter: 'bandpass', cut: 1500, cutTo: 600, hold: 0.04, release: 0.12, vol: 0.14 });
  S('nope', { wave: 'square', freq: 220, to: 160, slide: 0.12, hold: 0.08, release: 0.06, vol: 0.1, filter: 'lowpass', cut: 900 });
  S('step', { wave: 'noise', freq: 1500, filter: 'bandpass', cut: 1600, hold: 0.01, release: 0.03, vol: 0.05 });
  let sceneMode = false;
  const audible = () => !sceneMode && shell && shell.phase === 'play' && G && G.mode === 'play';
  function sfx(name, o) { if (audible()) Kit.sfx(name, o); }
  function buzz(p) { if (audible()) Kit.haptic(p); }

  /* music: baroque harpsichord and a recorder, a minor mode per floor; bosses go to 140 bpm with timpani */
  const MEL_A = ['4 - 7 - 6 7 4 - 2 - 4 - 2 1 0 -', '3 - 5 - 7 - 5 3 5 - 8 - 7 - 5 -', '4 - 6 - 8 - 6 4 1 - 6 - 4 - 1 -', '2 - 4 - 7 - 4 2 0 - - - . . . .'].join(' ');
  const MEL_B = ['7 - - 4 2 - 4 - 7 - 9 - 8 - 7 -', '5 - 7 - 9 - 7 5 4 - 5 - 7 - - -', '3 - 5 - 7 - 8 7 5 - 3 - 5 - 3 -', '4 - - - 6 - 8 - 6 - 4 - 1 - . .'].join(' ');
  function floorSong(i) {
    const keys = ['D', 'G', 'E', 'C', 'A'], scales = ['harmonic', 'minor', 'dorian', 'harmonic', 'minor'];
    const chords = [[0, 3, 4, 0], [0, 5, 3, 4], [0, 3, 4, 0], [0, 3, 4, 0], [0, 5, 3, 4]][i];
    const harp = ['0 4 2 4 0 4 2 4 0 4 2 4 0 4 2 4', '0 2 4 7 4 2 0 2 4 7 4 2 0 2 4 2', '0 4 7 4 2 4 7 4 0 4 7 4 2 4 7 4', '0 7 4 7 2 7 4 7 0 7 4 7 2 7 4 7', '0 2 4 2 7 4 2 4 0 2 4 2 7 4 2 4'][i];
    return {
      bpm: [120, 116, 112, 124, 108][i], swing: 0, key: keys[i], scale: scales[i], steps: 16, chords,
      tracks: [
        { name: 'harp', inst: 'pluck', wave: 'square', notes: harp, follow: true, vol: 0.2, gate: 0.4, cutoff: 3000, delay: 0.1, verb: 0.22 },
        { name: 'bass', inst: 'bass', wave: 'triangle', notes: '0 . . . . . . . 0 . . . -3 . . .', follow: true, vol: 0.34, cutoff: 700 },
        { name: 'lead', inst: 'lead', wave: 'triangle', notes: i % 2 ? MEL_B : MEL_A, vol: 0.14, cutoff: 2200, gate: 0.85, verb: 0.3, delay: 0.18 },
        { name: 'tick', inst: 'hat', hits: 'x...g...x...g...', vol: 0.12 },
      ],
    };
  }
  const SONGS = FLOORS.map((_, i) => floorSong(i));
  const BOSS_SONG = {
    bpm: 140, swing: 0, key: 'E', scale: 'harmonic', steps: 16, chords: [0, 0, 5, 4],
    tracks: [
      { name: 'ost', inst: 'pluck', wave: 'square', notes: '0 7 0 6 0 7 0 4 0 7 0 6 0 4 3 1', follow: true, vol: 0.2, gate: 0.4, cutoff: 3200, delay: 0.08 },
      { name: 'timp', inst: 'bass', wave: 'sine', notes: '0 . . 0 . . 0 . 4 . . . 4 . 0 .', follow: true, vol: 0.5, cutoff: 320, oct: -2 },
      { name: 'kick', inst: 'kick', hits: 'X...x..xX...x.x.', vol: 0.5 },
      { name: 'hat', inst: 'hat', hits: 'x.x.x.x.x.x.xxx.', vol: 0.12 },
      { name: 'lead', inst: 'lead', wave: 'square', notes: ['7 - 6 - 7 - 9 - 8 - 7 - 6 - 4 -', '5 - 4 - 3 - 4 - 6 - - - - - 8 -'].join(' '), vol: 0.1, cutoff: 1800, gate: 0.8 },
    ],

  /* ---------------------------------------------------------------- room painting */
  function paintFloor(g, R) {

        if (k === 2) { g.fillStyle = 'rgba(200,90,110,.35)'; for (let i = 0; i < 4; i++) { circ(g, x + 15 + (i % 2) * 30, y + 15 + Math.floor(i / 2) * 30, 5); g.fill(); } }
      }

      for (let i = -H; i < W; i += 6) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + H, H); g.stroke(); }
      g.strokeStyle = '#fff1dc'; g.lineWidth = 2; g.setLineDash([6, 5]);

      g.fillStyle = g.createPattern(tex, 'repeat'); g.fillRect(0, 0, W, H);
      g.fillStyle = 'rgba(255,255,255,.04)'; for (let i = 0; i < 9; i++) { ell(g, rnd.range(0, W), rnd.range(0, H), rnd.range(30, 70), rnd.range(20, 50)); g.fill(); }
      g.strokeStyle = p.c; g.lineWidth = 2; g.strokeRect(16, 16, W - 32, H - 32); g.lineWidth = 1; g.strokeRect(22, 22, W - 44, H - 44);
      for (const [cx, cy] of [[16, 16], [W - 16, 16], [16, H - 16], [W - 16, H - 16]]) { star(g, cx, cy, 7, 4); g.fillStyle = p.c; g.fill(); }
      g.save(); g.globalAlpha = 0.5; star(g, W / 2, H / 2, 46, 8, 0.6); g.strokeStyle = p.c; g.lineWidth = 1.5; g.stroke(); circ(g, W / 2, H / 2, 30); g.stroke(); g.restore();

        }
      }
      g.fillStyle = 'rgba(0,0,0,.28)'; for (let i = 0; i < 8; i++) { ell(g, rnd.range(0, W), rnd.range(0, H), rnd.range(25, 60), rnd.range(15, 35)); g.fill(); }
      g.strokeStyle = 'rgba(255,122,47,.55)'; g.lineWidth = 1.5;
      for (let i = 0; i < 5; i++) { let x = rnd.range(20, W - 20), y = rnd.range(20, H - 20); g.beginPath(); g.moveTo(x, y); for (let k = 0; k < 4; k++) { x += rnd.range(-14, 14); y += rnd.range(-14, 14); g.lineTo(x, y); } g.stroke(); }

  function paintWalls(g, R) {
    const F = R.F, p = F.pal, W = R.W, H = R.H, rnd = Kit.rng(R.seed + 9);

    g.fillStyle = p.wallLo; g.fillRect(-22, -WT - 8, W + 44, 8); g.fillRect(-22, -WT, 22, H + WT + 22); g.fillRect(W, -WT, 22, H + WT + 22); g.fillRect(0, H, W, 22);
    g.fillStyle = p.wallHi; g.fillRect(-16, -WT, 12, H + WT + 12); g.fillRect(W + 4, -WT, 12, H + WT + 12); g.fillRect(-4, H + 4, W + 8, 12);

    g.fillStyle = 'rgba(255,255,255,.12)'; for (let y = -WT + 12; y < H; y += 34) { g.fillRect(-14, y, 8, 2); g.fillRect(W + 6, y, 8, 2); }

    if (F.key === 'pantry') {
      g.fillStyle = p.wall; g.fillRect(0, -WT, W, WT);
      for (let x = 0; x < W; x += 58) { g.fillStyle = p.wallHi; g.fillRect(x + 5, -WT + 8, 48, WT - 22); g.strokeStyle = INK; g.lineWidth = 1.5; g.strokeRect(x + 5, -WT + 8, 48, WT - 22); g.fillStyle = 'rgba(255,220,160,.15)'; g.fillRect(x + 7, -WT + 10, 44, 3); }
    } else if (F.key === 'sewing') {
      for (let x = 0, i = 0; x < W; x += 14, i++) { g.fillStyle = i % 2 ? '#f0d0c0' : p.wall; g.fillRect(x, -WT, 14, WT); }

    } else if (F.key === 'library') {

  function buildRoomCanvas() {
    const R = G.R; if (!R) return;
    const dpr = view.dpr || 1, M = 30;

  }

  /* ---------------------------------------------------------------- run + rooms */

  }
  function mkPlayer() {
    const P = { x: 180, y: 400, r: 12, vx: 0, vy: 0, face: 1, aim: -PI / 2, state: 'idle', t: 0, dash: null, iframes: 0, spinT: 0, spinCd: 0, slow: 0, sq: 1, sqv: 0, blink: 2, cape: [], streak: null, walk: 0, hurtT: 0, flash: 0 };
    for (let i = 0; i < 7; i++) P.cape.push({ x: 180, y: 400, px: 180, py: 400 });
    return P;
  }
  function resetCape(P) { for (const c of P.cape) { c.x = c.px = P.x; c.y = c.py = P.y - 4; } }
  const has = id => G && G.relics.indexOf(id) >= 0;

  function roomSeed(f, i) { return ((G.seed * 31 + G.loop * 977 + f * 101 + i * 13) >>> 0) || 1; }

  function rollRewards(rr, n, F) {
    const out = [];
    const pool = () => {
      const w = [['cheese', G.hp < G.maxHp ? 3 : 1], ['beads', 3], ['chest', 2.4], ['shop', G.lastShop ? 0 : 1.4]];
      let tot = 0; for (const x of w) tot += x[1];
      let r = rr.next() * tot; for (const x of w) { r -= x[1]; if (r <= 0) return x[0]; } return 'beads';
    };
    while (out.length < n) { const k = pool(); if (out.indexOf(k) < 0 || rr.chance(0.15)) out.push(k); }
    return out;
  }

  // kind: 'fight' | 'shop' | 'boss' | 'attract'
  function makeRoom(f, i, kind) {
    const F = FLOORS[f - 1];
    const rr = Kit.rng(roomSeed(f, i) + (kind === 'shop' ? 555 : 0));
    const dims = roomDims();
    const R = { floor: f, idx: i, kind, F, W: dims.W, H: dims.H, seed: roomSeed(f, i), rr, obstacles: [], enemies: [], boss: null, traps: [], embers: [], fallers: [], shots: [], beads: [], debris: [], decals: [], trails: [], doors: [], items: [], candles: [], waves: [], cleared: false, clearT: 0, t: 0, fallT: 3.5, shieldUsed: false, flare: 0, rug: false, minions: 0 };
    const W = R.W, H = R.H;
    R.rug = kind === 'shop' || (kind !== 'boss' && rr.chance(0.35));
    // template
    const tutorial = G.loop === 0 && f === 1 && i <= 2 && kind === 'fight';
    const ti = kind === 'boss' ? 11 : kind === 'shop' ? 11 : tutorial ? 0 : rr.int(1, 10);
    const mir = rr.chance(0.5);
    for (const [u, v, s] of TPL[ti]) {
      const r = s === 's' ? rr.range(12, 15) : s === 'm' ? rr.range(17, 21) : rr.range(25, 30);
      const kindP = s === 'l' ? F.props[0] : s === 'm' ? F.props[1] : F.props[2];
      R.obstacles.push({ x: (mir ? 1 - u : u) * W, y: 24 + v * (H - 90), r, kind: kindP, seed: rr.int(0, 99999) });
    }
    // doors (rolled now, revealed on clear)
    const last = i >= 6;
    if (kind === 'boss') R.doors.push({ x: W / 2, reward: 'stairs', open: 0 });
    else if (last) R.doors.push({ x: W / 2, reward: 'boss', open: 0 });
    else if (tutorial && i === 1) R.doors.push({ x: W / 2, reward: 'beads', open: 0 });
    else { const rw = rollRewards(rr, 2, F); R.doors.push({ x: W * 0.27, reward: rw[0], open: 0 }, { x: W * 0.73, reward: rw[1], open: 0 }); }
    // candles: on the top wall between doors, plus floor candles in the attic
    const cx = R.doors.length === 2 ? [0.07, 0.5, 0.93] : [0.08, 0.3, 0.7, 0.92];
    for (const u of cx) R.candles.push({ x: u * W, y: -36, wall: true, ph: rr.range(0, 6) });
    R.candles.push({ x: -8, y: H * 0.62, wall: false, side: true, ph: rr.range(0, 6) }, { x: W + 8, y: H * 0.62, wall: false, side: true, ph: rr.range(0, 6) });
    for (const o of R.obstacles) if (o.kind === 'candle') R.candles.push({ x: o.x, y: o.y - o.r * 1.6 - 9, wall: false, prop: true, ph: rr.range(0, 6) });
    return R;
  }

  function freeSpot(R, rr, minY, maxY, avoid) {
    for (let k = 0; k < 60; k++) {
      const x = rr.range(34, R.W - 34), y = rr.range(minY, maxY);
      let ok = Kit.dist(x, y, R.W / 2, R.H - 30) > (avoid || 150);
      for (const o of R.obstacles) if (Kit.dist(x, y, o.x, o.y) < o.r + 26) ok = false;
      for (const e of R.enemies) if (Kit.dist(x, y, e.x, e.y) < 44) ok = false;
      for (const t of R.traps) if (Kit.dist(x, y, t.x, t.y) < 36) ok = false;
      if (ok) return { x, y };
    }
    return { x: rr.range(40, R.W - 40), y: rr.range(minY, maxY) };
  }

  function planFoes(R) {
    const f = R.floor, i = R.idx, F = R.F, rr = R.rr;
    if (G.loop === 0 && f === 1 && i === 1) return [{ t: 'beetle', sleep: true, x: R.W / 2, y: R.H * 0.42 }];
    if (G.loop === 0 && f === 1 && i === 2) return [{ t: 'beetle', x: R.W / 2, y: R.H * 0.3 }];
    let budget = 1.2 + i * 0.7 + (f - 1) * 0.85 + G.loop * 1.6;
    const pool = F.foes.slice(); if (i >= F.lateAt) pool.push(...F.late);
    const list = [];
    if (i === 1 && f > 1) { list.push({ t: F.foes[0] }); budget -= COST[F.foes[0]] + 0.5; }
    while (budget > 0.5 && list.length < 8) { const t = rr.pick(pool); list.push({ t }); budget -= COST[t]; }
    return list;
  }

  function enterRoom(f, i, kind, opts) {
    opts = opts || {};
    const R = makeRoom(f, i, kind);
    G.R = R; G.floor = f; G.idx = i;
    const P = G.P;
    P.x = R.W / 2; P.y = R.H - 26; P.vx = P.vy = 0; P.state = 'idle'; P.t = 0; P.dash = null; P.streak = null; P.spinT = 0; P.iframes = 0.6; P.slow = 0; P.face = 1; P.aim = -PI / 2;
    resetCape(P);
    G.queued = null; G.ghost = false;
    // hazards
    const F = R.F, rr = R.rr;
    const hz = F.hazard === 'mix' ? rr.pick(['trap', 'books', 'embers']) : F.hazard;
    R.hz = hz;
    if (kind === 'fight' || kind === 'attract') {
      if (hz === 'trap' && !(G.loop === 0 && f === 1 && i <= 2)) { const n = clamp(1 + Math.floor(i / 2), 1, 3); for (let k = 0; k < n; k++) { const s = freeSpot(R, rr, 60, R.H - 90, 110); R.traps.push({ x: s.x, y: s.y, armed: true, t: rr.range(0, 3), snap: 0 }); } }
      if (hz === 'embers') { const n = 2 + Math.min(2, Math.floor(i / 2)); for (let k = 0; k < n; k++) { const s = freeSpot(R, rr, 50, R.H - 100, 120); R.embers.push({ x: s.x, y: s.y, r: 34, t: k * 1.3 + rr.range(0, 1), st: 'idle' }); } }
      R.fallOn = (hz === 'pins' || hz === 'books') && !(i === 1 && f === 2);
      const plan = planFoes(R);
      const wave1 = plan.length > 4 ? plan.slice(0, Math.ceil(plan.length / 2) + 1) : plan;
      R.waves = plan.length > 4 ? [plan.slice(wave1.length)] : [];
      spawnList(R, wave1, true);
      if (G.mode === 'play' && G.loop === 0 && f === 1 && i === 1) G.ghost = true;
    } else if (kind === 'boss') {
      R.boss = mkBoss(F.boss, R);
      R.introT = 1.6;
    } else if (kind === 'shop') {
      R.cleared = true; R.clearT = 1;
      for (const d of R.doors) d.open = 1;
      const cost = k => Math.round({ cheese: 14, relic: 36, helm: 44 }[k] * (1 + (f - 1) * 0.2 + G.loop * 0.4));
      const pool = RELIC_IDS.filter(id => !has(id) && id !== 'helm');
      const relic = pool.length ? rr.pick(pool) : null;
      const items = [{ k: 'cheese' }, relic ? { k: 'relic', relic } : { k: 'cheese' }, has('helm') ? { k: 'cheese' } : { k: 'helm' }];
      items.forEach((it, n) => R.items.push({ x: R.W * (0.24 + n * 0.26), y: R.H * (n === 1 ? 0.4 : 0.46), k: it.k, relic: it.relic || (it.k === 'helm' ? 'helm' : null), price: cost(it.k), sold: false, cool: 0 }));
    }
    if (has('bell') && R.enemies.length) for (const e of R.enemies) { e.stun = Math.max(e.stun, 1.6); }
    layout();
    dirty = true;
    buildOuter();
    if (G.mode === 'play') {
      if (kind === 'boss') { Kit.music.play(BOSS_SONG, { restart: true }); }
      else Kit.music.play(SONGS[f - 1], { restart: !!opts.restartMusic });
      Kit.music.layer('lead', kind !== 'shop');
      saveRun();
    }
  }

  function spawnList(R, list, first) {
    for (const sp of list) {
      let pos = sp.x != null ? { x: sp.x, y: sp.y } : freeSpot(R, R.rr, 50, R.H * 0.62, first ? 170 : 110);
      const e = mkEnemy(sp.t, pos.x, pos.y, sp);
      R.enemies.push(e);
    }
  }

  function mkEnemy(t, x, y, o) {
    o = o || {};
    const nm = G.loop;
    const base = { beetle: [14, 2], spider: [12, 2], wasp: [11, 1], brute: [18, 3], centipede: [12, 4], minion: [13, 1] }[t] || [14, 2];
    const e = { t, x, y, r: base[0], hp: base[1] + nm, maxHp: base[1] + nm, state: 'idle', t0: 0, st: 0, ang: Math.atan2(G.P.y - y, G.P.x - x), cd: G.R ? G.R.rr.range(0.9, 2.2) : 1.5, vx: 0, vy: 0, kx: 0, ky: 0, flash: 0, stun: 0, burn: 0, spawn: 0.6, h: 0, id: Math.random(), wob: Math.random() * 6, hitBy: 0, sp: 1 + nm * 0.15, legs: 0 };
    if (t === 'minion') { e.t = 'beetle'; e.hp = e.maxHp = 1 + nm; }
    if (o.sleep) { e.state = 'sleep'; e.hp = e.maxHp = 1; e.spawn = 0; e.ang = PI / 2 + 0.3; }
    if (t === 'spider') { e.state = 'hang'; e.h = 90; e.spawn = 0; e.cd = G.R ? G.R.rr.range(1.2, 2.6) : 2; }
    if (t === 'wasp') { e.h = 18; e.oa = Math.random() * TAU; e.dir = Math.random() < 0.5 ? -1 : 1; e.state = 'circle'; }
    if (t === 'brute') { e.state = 'walk'; }
    if (t === 'centipede') { e.state = 'crawl'; e.segs = []; e.path = []; for (let k = 0; k < 6; k++) e.segs.push({ x, y: y - k * 14 }); for (let k = 0; k < 120; k++) e.path.push({ x, y: y - k * 0.8 }); }
    return e;
  }

  function mkBoss(kind, R) {
    const W = R.W, H = R.H, nm = G.loop;
    if (kind === 'crow' || kind === 'owl') return { kind: 'bird', owl: kind === 'owl', x: W / 2, y: H * 0.3, r: 30, hp: (kind === 'owl' ? 20 : 14) + nm * 6, maxHp: (kind === 'owl' ? 20 : 14) + nm * 6, state: 'intro', t: 0, ang: PI / 2, h: 0, flash: 0, seq: 0, stun: 0, tx: 0, ty: 0, hop: null, burn: 0 };
    if (kind === 'cat') return { kind: 'cat', x: W / 2, y: -20, r: 0, hp: 18 + nm * 6, maxHp: 18 + nm * 6, state: 'intro', t: 0, seq: 0, paws: [], nose: 0, noseHit: 0, sweep: null, flash: 0, stun: 0, burn: 0 };
    return { kind: 'rat', tom: kind === 'tomrat', x: W / 2, y: H * 0.3, r: 28, hp: (kind === 'tomrat' ? 30 : 22) + nm * 6, maxHp: (kind === 'tomrat' ? 30 : 22) + nm * 6, state: 'intro', t: 0, ang: PI / 2, flash: 0, seq: 0, stun: 0, vx: 0, vy: 0, burn: 0 };
  }

  /* ---------------------------------------------------------------- save */
  function saveRun() {
    if (!G || G.mode !== 'play' || G.dead) return;
    const R = G.R;
    Kit.save.set('run', { seed: G.seed, loop: G.loop, floor: G.floor, idx: G.idx, kind: R.kind, hp: G.hp, maxHp: G.maxHp, relics: G.relics.slice(), beads: G.beads, earned: G.earned, fc: G.floorsCleared, stats: G.stats, lastShop: G.lastShop });
    Arcade.progress(progressOf(G.floor, G.idx, R.kind, G.loop));
  }
  function progressOf(f, i, kind, lp) {
    const F = FLOORS[f - 1];
    const label = (lp ? 'New Moon · ' : '') + F.name + ' ' + (kind === 'boss' ? 'boss' : kind === 'shop' ? 'shop' : i);
    if (lp) return { label };
    return { label, pct: ((f - 1) * 7 + (i - 1)) / 35 * 100 };
  }
  function clearRun() { Kit.save.set('run', null); Arcade.progress(null); }
  function continueRun(sv) {
    newRun(sv.seed);
    Object.assign(G, { loop: sv.loop || 0, hp: sv.hp, maxHp: sv.maxHp, relics: sv.relics || [], beads: sv.beads || 0, earned: sv.earned || 0, floorsCleared: sv.fc || 0, stats: Object.assign(G.stats, sv.stats || {}), lastShop: !!sv.lastShop });
    enterRoom(sv.floor, sv.idx, sv.kind || 'fight', { restartMusic: true });
    banner(FLOORS[sv.floor - 1].num, FLOORS[sv.floor - 1].name, 'The tale continues');
  }

  /* ---------------------------------------------------------------- player actions */
  function maxDash() { return MAXDASH + (has('needle') ? 40 : 0); }
  function canControl() { return G && G.mode === 'play' && !G.dead && !G.iris && shell.phase === 'play'; }
  function queue(a) { G.queued = a; G.queuedT = 0.4; }

  function obstacleCut(R, sx, sy, ex, ey, rad) {
    // first obstacle hit along the segment: returns fraction t in 0..1
    let best = 1;
    const dx = ex - sx, dy = ey - sy, L2 = dx * dx + dy * dy || 1;
    for (const o of R.obstacles) {
      const rr = o.r + rad;
      const fx0 = sx - o.x, fy0 = sy - o.y;
      const b = 2 * (fx0 * dx + fy0 * dy), c = fx0 * fx0 + fy0 * fy0 - rr * rr;
      if (c < 0) continue; // already inside: let the push-out deal with it
      const disc = b * b - 4 * L2 * c; if (disc < 0) continue;
      const t = (-b - Math.sqrt(disc)) / (2 * L2);
      if (t >= 0 && t < best) best = t;
    }
    return best;
  }

  function startDash(ang, len) {
    const P = G.P, R = G.R;
    if (P.slow > 0 && !has('cork')) len *= 0.6;
    len = clamp(len, 30, maxDash());
    let ex = P.x + Math.cos(ang) * len, ey = P.y + Math.sin(ang) * len;
    // walls: clamp to the room (but let the top edge reach doors)
    const m = P.r;
    const tx = ex < m ? (m - P.x) / (ex - P.x) : ex > R.W - m ? (R.W - m - P.x) / (ex - P.x) : 1;
    const ty = ey < m - 4 ? (m - 4 - P.y) / (ey - P.y) : ey > R.H - m ? (R.H - m - P.y) / (ey - P.y) : 1;
    let tt = Math.min(1, isFinite(tx) ? tx : 1, isFinite(ty) ? ty : 1);
    tt = Math.min(tt, obstacleCut(R, P.x, P.y, ex, ey, P.r * 0.85));
    tt = Math.max(0, tt);
    ex = P.x + (ex - P.x) * tt; ey = P.y + (ey - P.y) * tt;
    const L = Kit.dist(P.x, P.y, ex, ey);
    P.state = 'dash'; P.t = 0;
    P.dash = { sx: P.x, sy: P.y, ex, ey, len: L, dur: Math.max(0.05, L / 1500), ang, hit: [], blocked: false, struck: false };
    P.aim = ang; if (Math.abs(Math.cos(ang)) > 0.2) P.face = Math.cos(ang) > 0 ? 1 : -1;
    P.sq = 1.35; P.sqv = 0;
    P.streak = { sx: P.x, sy: P.y, ex: P.x, ey: P.y, life: 1 };
    if (G.ghost) { G.ghost = false; }
    G.hint = null;
    sfx('dash', { pitch: (L / 180) * 3 - 2 });
    buzz(8);
    // dust kick at the start
    fx.burst(P.x, P.y + 6, { count: Kit.reducedMotion ? 3 : 7, color: ['#f3e2c2', '#d8c09a'], speed: [30, 90], angle: ang + PI, spread: 1.2, life: [0.25, 0.5], size: [2, 4], sizeEnd: 0.4, drag: 4 });
    if (has('spool')) R.trails.push({ sx: P.x, sy: P.y, ex, ey, life: 1.2, hit: [] });
  }

  function startSpin() {
    const P = G.P;
    if (P.spinCd > 0 || P.state === 'dash' || P.state === 'dead') return false;
    P.state = 'spin'; P.t = 0; P.spinT = 0.3; P.spinCd = 0.55;
    sfx('spin'); buzz(10);
    const rad = has('top') ? 52 : 38, dmg = has('top') ? 2 : 1;
    fx.shockwave(P.x, P.y, { radius: rad, color: '#fff3cf', ms: 260, width: 3 });
    const R = G.R;
    for (const e of R.enemies) {
      if (e.dead || !hittable(e)) continue;
      if (Kit.dist(P.x, P.y, e.x, e.y) < rad + e.r) {
        const atk = attacking(e);
        hitEnemy(e, dmg, Math.atan2(e.y - P.y, e.x - P.x), { spin: true, perfect: e.state === 'wind' });
        if (atk && !e.dead) { e.state = 'recover'; e.st = 0; e.stun = 1.0; }
      }
    }
    if (R.boss) bossSpin(R.boss, rad, dmg);
    for (const s of R.shots) {
      if (s.friendly) continue;
      if (Kit.dist(P.x, P.y, s.x, s.y) < rad + s.r + 6) {
        // deflect toward the nearest foe
        let tgt = null, bd = 1e9;
        for (const e of R.enemies) { if (e.dead) continue; const d = Kit.dist(s.x, s.y, e.x, e.y); if (d < bd) { bd = d; tgt = e; } }
        if (R.boss && R.boss.hp > 0 && bossTarget(R.boss)) { const bt = bossTarget(R.boss); const d = Kit.dist(s.x, s.y, bt.x, bt.y); if (d < bd) { bd = d; tgt = bt; } }
        const sp = Math.hypot(s.vx, s.vy) * 1.5 + 60;
        const a = tgt ? Math.atan2(tgt.y - s.y, tgt.x - s.x) : Math.atan2(s.y - P.y, s.x - P.x);
        s.vx = Math.cos(a) * sp; s.vy = Math.sin(a) * sp; s.friendly = true; s.life = 1.6;
        fx.burst(s.x, s.y, { count: 8, color: ['#fff', '#ffe08a'], shape: 'spark', speed: [80, 200], life: [0.15, 0.3] });
        sfx('ting', { pitch: 4 });
      }
    }
    return true;
  }

  function hittable(e) { return !e.dead && e.spawn <= 0 && !(e.t === 'spider' && e.h > 30); }
  function attacking(e) { return e.state === 'charge' || e.state === 'dive' || e.state === 'swipe' || e.state === 'lunge'; }

  function hitEnemy(e, dmg, ang, o) {
    o = o || {};
    const R = G.R, P = G.P;
    const dazed = e.state === 'recover' || e.stun > 0;
    const perfect = !!o.perfect || (!o.trail && (e.state === 'wind' || (has('sugar') && dazed)));
    if (e.t === 'brute' && !o.trail && !o.burn && e.state !== 'recover' && e.stun <= 0) {
      const toP = Math.atan2(P.y - e.y, P.x - e.x);
      if (Math.abs(adiff(e.ang, toP)) < 1.15) { blockHit(e.x + Math.cos(e.ang) * e.r, e.y + Math.sin(e.ang) * e.r, e); return 'block'; }
    }
    let d = perfect ? Math.max(2, dmg + 1) : dmg;
    e.hp -= d; e.flash = 1; e.kx = Math.cos(ang) * (perfect ? 220 : 150); e.ky = Math.sin(ang) * (perfect ? 220 : 150);
    if (e.state === 'wind' || attacking(e)) { e.state = 'recover'; e.st = 0; }
    if (e.state === 'sleep') { e.state = 'idle'; }
    if (perfect && has('pepper')) e.burn = 1.4;
    if (!o.burn) {
      G.combo++; G.comboT = 2.6; G.comboPop = 1; G.stats.bestCombo = Math.max(G.stats.bestCombo, G.combo);
      const healAt = has('honey') ? 6 : 10;
      if (G.combo % healAt === 0 && G.hp < G.maxHp && G.mode === 'play') { G.hp++; G.hpPop[Math.floor((G.hp - 1) / 2)] = 1; fx.float('+ cheese', P.x, P.y - 30, { color: '#ffd25a', size: 13, font: SERIF }); sfx('munch'); }
    }
    hitFx(e.x, e.y, ang, perfect, e);
    if (e.t === 'centipede' && e.segs.length > 1 && e.hp > 0) { const s = e.segs.pop(); burstBits(s.x, s.y, ang, e, 6); }
    if (e.hp <= 0) killEnemy(e, ang);
    return perfect ? 'perfect' : 'hit';
  }

  function blockHit(x, y, e) {
    const P = G.P;
    sfx('clang'); buzz(20);
    fx.burst(x, y, { count: 14, color: ['#fff', '#ffe08a', '#c8ccd6'], shape: 'spark', speed: [120, 320], life: [0.15, 0.35], glow: true });
    fx.shake(5, 140);
    loop.hitstop(50);
    if (P.state === 'dash') { P.dash.blocked = true; }
    const a = Math.atan2(P.y - e.y, P.x - e.x);
    P.vx = Math.cos(a) * 260; P.vy = Math.sin(a) * 260;
    fx.float('CLANG', x, y - 16, { color: '#c8ccd6', size: 12, font: SERIF });
    if (!G.seenBlock) { G.seenBlock = true; hint('Armoured in front. Strike from behind!'); }
  }

  function hitFx(x, y, ang, perfect, e) {
    loop.hitstop(perfect ? 95 : 65);
    if (perfect) {
      sfx('shing'); buzz([12, 20, 30]);
      fx.flash('#ffffff', 110, 0.55);
      fx.shake(7, 180);
      slowmo(0.3, 260);
      fx.burst(x, y, { count: Kit.reducedMotion ? 6 : 22, color: ['#ffffff', '#fff3b0', '#ffd76e'], shape: 'star', speed: [90, 300], life: [0.3, 0.6], glow: true, size: [2, 5] });
      fx.float('PERFECT', x, y - 22, { color: '#fff3b0', size: 15, font: SERIF, stroke: INK });
      G.stats.perfects++;
      if (!G.firstPerfect && G.mode === 'play') { G.firstPerfect = true; G.starPop = { x, y: y - 36, t: 0 }; }
    } else {
      sfx('ting', { pitch: vr.range(-1.5, 1.5) }); buzz(14);
      fx.shake(3.5, 110);
    }

  function dropBeads(x, y, n) {

  /* ---------------------------------------------------------------- update */
  function update(dt) {

    if (G.hint) { G.hint.t += dt; if (G.hint.t > G.hint.life) G.hint = null; }

    P.flash = Math.max(0, P.flash - dt * 4); P.hurtT = Math.max(0, P.hurtT - dt);

  function endDash() {

  function springTrap(t, who) {

    if (who === G.P) { if (!has('cork')) hurt(1, null, 'trap'); else fx.float('CORK!', t.x, t.y - 16, { color: '#d8ae7e', size: 12, font: SERIF }); }

  function pushOut(o, R, r) {

  function updateCape(P, dt) {

  const R_t = () => (loop ? loop.time : 0);

  function updatePlayerDead(dt) {
    const P = G.P; P.t += dt; P.sq = 1;

  /* ---------------------------------------------------------------- enemies */
  const WIND = () => 0.6;

    if (e.kx || e.ky) { moveE(e, e.kx, e.ky, dt); e.kx *= Math.pow(0.001, dt); e.ky *= Math.pow(0.001, dt); if (Math.abs(e.kx) + Math.abs(e.ky) < 4) e.kx = e.ky = 0; }
    if (e.burn > 0) { e.burn -= dt; if (vr.chance(dt * 20)) fx.burst(e.x, e.y - 6, { count: 1, color: ['#ff7a2f', '#ffd23f'], speed: [10, 30], angle: -PI / 2, spread: 0.6, life: [0.3, 0.5], glow: true }); if (e.burn <= 0) { hitEnemy(e, 1, -PI / 2, { burn: true, trail: true }); sfx('fire'); } }

        } else if (e.state === 'recover') {

        case 'stunned': if (B.t > 1.6 / Math.min(spd, 1.15)) { B.state = 'idle'; B.t = 0; } break;
        case 'recover': if (B.t > 0.6) { B.state = 'idle'; B.t = 0; } break;
        case 'ringWind': if (B.t > BW) {
          const n = (B.tom ? 10 : 8) + (p2 ? 4 : 0);
          for (let k = 0; k < n; k++) { const a = k / n * TAU + B.t; R.shots.push({ x: B.x, y: B.y, vx: Math.cos(a) * 150, vy: Math.sin(a) * 150, r: 7, kind: B.tom ? 'ember' : 'coal', life: 3, friendly: false }); }
          sfx('fire'); fx.shockwave(B.x, B.y, { radius: 60, color: '#ff9a4a' }); B.state = 'recover'; B.t = 0;
        } break;
        case 'summonWind': if (B.t > BW) {

        } break;
      }

    }
  }

  function bossDefeated(B) {
    const R = G.R, t = bossTarget(B) || { x: B.kind === 'cat' ? R.W / 2 : B.x, y: B.kind === 'cat' ? 10 : B.y };
    B.hp = 0; B.state = 'dead'; B.t = 0; B.dx = t.x; B.dy = t.y;

    slowmo(0.3, 650);
    fx.shockwave(t.x, t.y, { radius: 160, color: '#ffe08a', width: 6, ms: 700 });
    // a confetti of buttons and beads

      R.debris.push({ x: t.x, y: t.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, z: 0, vz: vr.range(120, 320), rot: vr.range(0, 6), vr: vr.range(-10, 10), s: vr.range(4, 8), col: vr.pick(['#e8604a', '#4fc3d8', '#f2c94c', '#7bd389', '#c78bf0', '#ffffff']), kind: k % 2 ? 'button' : 'bead' });
    }
    fx.burst(t.x, t.y, { count: Kit.reducedMotion ? 10 : 40, color: ['#ffe08a', '#ffffff', '#ff9a4a'], shape: 'star', speed: [120, 420], life: [0.5, 1.1], glow: true, size: [3, 6] });
    dropBeads(t.x, t.y, 18);

    G.stats.rooms++;
    setTimeout(() => { if (G && G.R === R) { grantRelic(null, true); G.hp = Math.min(G.maxHp, G.hp + 2); } }, 900);
    R.cleared = true; R.clearT = -1.2; R.flare = 1;
  }

  /* ---------------------------------------------------------------- shots, hazards, pickups */
  function updateShots(dt) {
    const R = G.R, P = G.P;
    for (const s of R.shots) {
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
      if (s.kind === 'ember' || s.kind === 'coal') { if (vr.chance(dt * 18)) fx.burst(s.x, s.y, { count: 1, color: ['#ff7a2f', '#ffd23f'], speed: [5, 20], life: [0.2, 0.4], glow: true, size: [1.5, 3] }); }
      if (s.x < -20 || s.x > R.W + 20 || s.y < -20 || s.y > R.H + 20) s.life = 0;
      for (const o of R.obstacles) if (Kit.dist(s.x, s.y, o.x, o.y) < o.r + s.r * 0.5) { s.life = 0; fx.burst(s.x, s.y, { count: 4, color: ['#fff'], speed: [30, 80], life: [0.15, 0.3] }); }
      if (s.life <= 0) continue;
      if (s.friendly) {
        for (const e of R.enemies) if (!e.dead && hittable(e) && Kit.dist(s.x, s.y, e.x, e.y) < e.r + s.r) { hitEnemy(e, 1, Math.atan2(s.vy, s.vx), { trail: true }); s.life = 0; break; }
        const bt = R.boss && bossTarget(R.boss);
        if (s.life > 0 && bt && Kit.dist(s.x, s.y, bt.x, bt.y) < (R.boss.r || 26) + s.r) { damageBoss(R.boss, 1, Math.atan2(s.vy, s.vx), false, bt.x, bt.y); s.life = 0; }
      } else if (Kit.dist(s.x, s.y, P.x, P.y) < s.r + P.r * 0.7) {
        if (s.kind === 'web') {
          if (P.state !== 'dash' && P.iframes <= 0 && !(P.state === 'spin')) { s.life = 0; if (!has('cork')) { P.slow = 1.8; sfx('thwip', { pitch: -5 }); fx.float('webbed', P.x, P.y - 24, { color: '#f0f0f0', size: 11, font: SERIF }); if (!G.seenWeb) { G.seenWeb = true; hint('Webs slow your dashes. Tap to spin them away!'); } } }
        } else if (hurt(1, s, s.kind)) s.life = 0;
      }
    }
    R.shots = R.shots.filter(s => s.life > 0);
  }

  function spawnFaller(x, y, kind) {
    G.R.fallers.push({ x, y, kind, t: 0, dur: 1.05, r: kind === 'books' ? 26 : 17 });
    sfx('drop', { pitch: kind === 'books' ? -6 : 0 });
  }
  function updateHazards(dt) {
    const R = G.R, P = G.P;
    for (const t of R.traps) { t.t += dt; t.snap = Math.max(0, t.snap - dt * 3); }
    // falling pins and books, aimed near you, always with a shadow first
    if (R.fallOn && !R.cleared && R.kind !== 'shop') {
      R.fallT -= dt;
      if (R.fallT <= 0) { R.fallT = vr.range(2.4, 3.8) / (1 + G.loop * 0.2); spawnFaller(clamp(P.x + vr.range(-50, 50), 24, R.W - 24), clamp(P.y + vr.range(-50, 50), 24, R.H - 24), R.hz === 'books' ? 'books' : 'pins'); }
    }
    for (const f of R.fallers) {
      f.t += dt;
      if (f.t >= f.dur && !f.done) {
        f.done = true;
        fx.shake(f.kind === 'books' ? 7 : 4, 180); sfx(f.kind === 'books' ? 'thud' : 'snap', { pitch: f.kind === 'books' ? -4 : 6 });
        fx.burst(f.x, f.y, { count: 10, color: f.kind === 'books' ? ['#efe2c2', '#8a2e2e'] : ['#e8ecf4', '#fff'], speed: [60, 180], life: [0.2, 0.5], size: [2, 4] });
        fx.shockwave(f.x, f.y, { radius: f.r * 1.6, color: '#f3e2c2', width: 3 });
        if (Kit.dist(P.x, P.y, f.x, f.y) < f.r + P.r * 0.6) hurt(1, f, f.kind);
        for (const e of R.enemies) if (!e.dead && hittable(e) && Kit.dist(e.x, e.y, f.x, f.y) < f.r + e.r * 0.6) hitEnemy(e, 1, -PI / 2, { trail: true });
        bakeDecal(f.kind === 'books' ? { kind: 'page', x: f.x, y: f.y, rot: vr.range(-0.5, 0.5), s: 9 } : { kind: 'pin', x: f.x, y: f.y, rot: vr.range(0, 6), s: 9, col: vr.pick(['#ffd23f', '#3fa7ff', '#e8604a']) });
      }
    }
    R.fallers = R.fallers.filter(f => f.t < f.dur + 0.5);
    // ember floor patches: idle, glow (telegraph), flare
    for (const e of R.embers) {
      e.t += dt;
      if (R.cleared) { e.st = 'idle'; continue; }
      const cyc = e.t % 4.4;
      const st = cyc < 2.6 ? 'idle' : cyc < 3.6 ? 'glow' : 'flare';
      if (st === 'flare' && e.st !== 'flare') { sfx('fire', { vol: 0.6 }); fx.burst(e.x, e.y, { count: Kit.reducedMotion ? 6 : 18, color: ['#ff7a2f', '#ffd23f', '#ff4a1a'], speed: [40, 140], angle: -PI / 2, spread: 1.4, life: [0.3, 0.7], glow: true, size: [2, 5] }); }
      e.st = st;
      if (st === 'flare') {
        if (Kit.dist(P.x, P.y, e.x, e.y) < e.r && !has('cork')) hurt(1, e, 'embers');
        for (const en of R.enemies) if (!en.dead && en.t !== 'wasp' && hittable(en) && Kit.dist(en.x, en.y, e.x, e.y) < e.r && !en.burnt) { en.burnt = 0.8; hitEnemy(en, 1, -PI / 2, { trail: true }); }
      }
    }
    for (const en of R.enemies) if (en.burnt) en.burnt = Math.max(0, en.burnt - dt);
  }

  function updateTrails(dt) {
    const R = G.R;
    for (const tr of R.trails) {
      tr.life -= dt;
      for (const e of R.enemies) if (!e.dead && hittable(e) && tr.hit.indexOf(e) < 0 && Kit.segCircle(tr.sx, tr.sy, tr.ex, tr.ey, e.x, e.y, e.r)) {
        tr.hit.push(e); if (G.P.dash && G.P.dash.hit.indexOf(e) >= 0) continue; hitEnemy(e, 1, Math.atan2(tr.ey - tr.sy, tr.ex - tr.sx), { trail: true });
      }
    }
    R.trails = R.trails.filter(t => t.life > 0);
  }

  function updateBeads(dt) {
    const R = G.R, P = G.P;
    for (const b of R.beads) {
      b.t += dt;
      const d = Kit.dist(b.x, b.y, P.x, P.y);
      if (b.t > 0.45 && (d < 120 || R.cleared || G.dead === false && b.t > 2.5)) {
        const a = Math.atan2(P.y - b.y, P.x - b.x), sp = 260 + b.t * 200;
        b.vx = lerp(b.vx, Math.cos(a) * sp, Math.min(1, dt * 8)); b.vy = lerp(b.vy, Math.sin(a) * sp, Math.min(1, dt * 8));
      } else { b.vx *= Math.pow(0.02, dt); b.vy *= Math.pow(0.02, dt); }
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.t > 0.3 && d < P.r + 8) {
        b.got = true;
        const v = has('bead') ? 1.5 : 1;
        G.beads += v; G.earned += v; G.beadPop = 1;
        sfx('bead', { pitch: Math.min(12, (G.beadChain = (G.beadChain || 0) + 1) * 0.5) });
        fx.burst(b.x, b.y, { count: 3, color: [b.col, '#fff'], speed: [30, 80], life: [0.15, 0.3], size: [1.5, 3], glow: true });
      }
    }
    R.beads = R.beads.filter(b => !b.got);
    if (!R.beads.length) G.beadChain = 0;
    G.beads = Math.round(G.beads * 2) / 2; G.earned = Math.round(G.earned * 2) / 2;
  }

  function updateDebris(dt) {
    const R = G.R;
    for (const d of R.debris) {
      d.x += d.vx * dt; d.y += d.vy * dt; d.vz -= 600 * dt; d.z += d.vz * dt; d.rot += d.vr * dt;
      if (d.x < 4 || d.x > R.W - 4) { d.vx *= -0.5; d.x = clamp(d.x, 4, R.W - 4); }
      if (d.y < 4 || d.y > R.H - 4) { d.vy *= -0.5; d.y = clamp(d.y, 4, R.H - 4); }
      if (d.z <= 0) { d.z = 0; if (Math.abs(d.vz) > 60) { d.vz = -d.vz * 0.35; d.vx *= 0.6; d.vy *= 0.6; } else { d.vz = 0; d.vx *= Math.pow(0.0005, dt); d.vy *= Math.pow(0.0005, dt); d.vr *= 0.8; if (Math.abs(d.vx) + Math.abs(d.vy) < 6) { d.done = true; bakeDecal({ kind: d.kind, x: d.x, y: d.y, rot: d.rot, s: d.s, col: d.col }); } } }
    }
    R.debris = R.debris.filter(d => !d.done);
  }

  function updateItems(dt) {
    const R = G.R, P = G.P;
    for (const it of R.items) { it.cool = Math.max(0, it.cool - dt); if (!it.sold && P.state !== 'dash' && Kit.dist(P.x, P.y, it.x, it.y) < 20) tryBuy(it); }
  }
  function tryBuy(it) {
    if (it.cool > 0 || it.sold) return;
    it.cool = 1.2;
    const P = G.P;
    if (G.beads < it.price) { sfx('nope'); fx.float('Need ' + it.price + ' beads', it.x, it.y - 30, { color: '#ffb0a0', size: 12, font: SERIF }); fx.shake(2, 80); return; }
    G.beads -= it.price; it.sold = true;
    sfx('coin'); buzz(15);
    fx.burst(it.x, it.y - 10, { count: 16, color: ['#ffe08a', '#fff'], shape: 'star', speed: [60, 200], life: [0.3, 0.6], glow: true });
    if (it.k === 'cheese') heal(2, it.x, it.y);
    else grantRelic(it.relic, false, it.x, it.y);
    saveRun();
  }
  function heal(n, x, y) {
    const before = G.hp; G.hp = Math.min(G.maxHp, G.hp + n);
    for (let i = Math.floor(before / 2); i < Math.ceil(G.hp / 2); i++) G.hpPop[i] = 1;
    sfx('munch'); fx.float('+ cheese', x || G.P.x, (y || G.P.y) - 26, { color: '#ffd25a', size: 13, font: SERIF });
  }
  function grantRelic(id, fromBoss, x, y) {
    if (!id) { const pool = RELIC_IDS.filter(r => !has(r)); if (!pool.length) { G.beads += 25; G.earned += 25; return; } id = G.rng.pick(pool); }
    if (has(id)) return;
    G.relics.push(id);
    if (id === 'helm') { G.maxHp += 2; G.hp = Math.min(G.maxHp, G.hp + 2); }
    sfx('relic'); buzz([10, 30, 10]);
    G.relicCard = { id, t: 0 };
    const P = G.P;
    fx.burst(x || P.x, (y || P.y) - 10, { count: 18, color: ['#ffe08a', '#fff'], shape: 'star', speed: [60, 220], life: [0.4, 0.8], glow: true });
    saveRun();
  }

  function clearRoom() {
    const R = G.R;
    R.cleared = true; R.clearT = 0; R.flare = 1;
    G.stats.rooms++;
    if (G.mode === 'play') {
      sfx('chime'); setTimeout(() => sfx('door'), 350);
      Kit.music.layer('lead', false);
      if (R.floor === 1 && R.idx === 2 && G.loop === 0) Arcade.track('tutorial_complete');
      if (R.floor === 1 && R.idx === 1 && G.loop === 0) hint('Dash into a door to go on', 4);
      else if (R.floor === 1 && R.idx === 2 && G.loop === 0) hint('Pick a door. Its prize is yours.', 4);
    }
    for (const d of R.doors) {
      for (let k = 0; k < 6; k++) fx.burst(d.x + vr.range(-20, 20), -2, { count: 2, color: ['#e8d8b8', '#cbb894'], speed: [20, 70], angle: PI / 2, spread: 1.4, life: [0.5, 0.9], size: [3, 7], sizeEnd: 1.6, drag: 3 });
    }
    // the floor's traps and embers go quiet
    for (const t of R.traps) t.armed = false;
  }

  function checkDoors() {
    const P = G.P, R = G.R;
    if (R.clearT < 0.4 || G.iris || G.dead) return;
    for (const d of R.doors) {
      if (d.open < 0.6) continue;
      if (P.y < P.r + 8 && Math.abs(P.x - d.x) < 24) { takeDoor(d); return; }
    }
  }
  function takeDoor(d) {
    const R = G.R, P = G.P;
    sfx('creak');
    P.state = 'idle'; P.dash = null;
    const go = () => {
      let f = R.floor, i = R.idx, kind = 'fight';
      if (d.reward === 'stairs') {
        f++; i = 1;
        if (f > 5) { f = 1; G.loop++; }
      } else if (d.reward === 'boss') { i = 7; kind = 'boss'; }
      else { i = i + (R.kind === 'shop' ? 0 : 1); if (d.reward === 'shop') kind = 'shop'; }
      if (R.kind === 'shop' && d.reward !== 'boss') { i = R.idx + 1; if (i >= 7) { i = 7; kind = 'boss'; } }
      G.lastShop = kind === 'shop';
      if (kind === 'shop') i = R.idx; // the shop sits between rooms
      enterRoom(f, i, kind);
      if (d.reward === 'cheese') heal(2);
      else if (d.reward === 'beads') { const n = Math.round((10 + f * 4) * (has('bead') ? 1.5 : 1)); dropBeads(G.P.x, G.P.y - 40, n); }
      else if (d.reward === 'chest') grantRelic(null);
      if (d.reward === 'stairs') banner(FLOORS[f - 1].num, (G.loop ? 'New Moon · ' : '') + FLOORS[f - 1].name, G.loop && f === 1 ? 'The castle stirs again, fiercer' : 'Floor ' + f + ' of 5');
      if (kind === 'boss') banner('', FLOORS[f - 1].bossName, FLOORS[f - 1].bossSub, true);
      if (kind === 'shop') banner('', 'The Thimble Shop', 'Dash onto a ware to buy it');
    };
    if (G.mode !== 'play') { go(); return; }
    G.iris = { t: 0, phase: 'close', x: d.x, y: 0, go };
  }
  function updateIris(dt) {
    const I = G.iris; I.t += dt;
    if (I.phase === 'close' && I.t > 0.38) { I.go(); I.phase = 'open'; I.t = 0; I.x = G.R.W / 2; I.y = G.R.H - 26; }
    else if (I.phase === 'open' && I.t > 0.42) G.iris = null;
  }

  /* ---------------------------------------------------------------- autopilot (attract mode, capture scenes) */
  function autopilot(dt) {
    const P = G.P, R = G.R;
    if (P.state !== 'idle' || G.queued) return;
    G.apT = (G.apT || 0) - dt; if (G.apT > 0) return;
    G.apT = 0.28 + vr.range(0, 0.3);
    if (R.cleared) { if (G.mode !== 'attract') { const d = R.doors[0]; if (d) queue({ type: 'dash', ang: Math.atan2(0 - P.y, d.x - P.x), len: 180 }); } return; }
    let tgt = null, bd = 1e9;
    for (const e of R.enemies) { if (!hittable(e)) continue; let d = Kit.dist(P.x, P.y, e.x, e.y); if (e.state === 'wind') d -= 120; if (d < bd) { bd = d; tgt = e; } }
    if (!tgt && R.boss) tgt = bossTarget(R.boss);
    if (!tgt) { queue({ type: 'dash', ang: vr.range(0, TAU), len: 80 }); return; }
    const a = Math.atan2(tgt.y - P.y, tgt.x - P.x), d = Kit.dist(P.x, P.y, tgt.x, tgt.y);
    queue({ type: 'dash', ang: a + vr.range(-0.05, 0.05), len: Math.min(180, d + 40) });
  }
  function attractNext() {
    G.attractFloor = (G.attractFloor + 1) % 5;
    attractRoom(G.attractFloor);
  }
  function attractRoom(fi) {
    const f = fi + 1;
    const R = makeRoom(f, 3, 'attract');
    G.R = R; G.floor = f;
    const P = G.P; P.x = R.W / 2; P.y = R.H - 40; P.state = 'idle'; resetCape(P);
    const F = FLOORS[fi];
    const list = [F.foes[0], F.foes[F.foes.length > 1 ? 1 : 0], F.foes[0]].map(t => ({ t: t === 'centipede' ? 'beetle' : t }));
    spawnList(R, list, true);
    for (const e of R.enemies) { e.spawn = 0; if (e.t === 'spider') { e.state = 'ground'; e.h = 0; e.cd = 1; } }
    layout(); dirty = true; buildOuter();
  }

  /* ---------------------------------------------------------------- ambience */
  function updateMotes(dt) {
    const R = G && G.R; if (!R) return;
    const F = R.F;
    while (motes.length < (Kit.reducedMotion ? 14 : 34)) motes.push({ x: vr.range(-20, 400), y: vr.range(-40, 640), z: vr.range(0.4, 1.7), ph: vr.range(0, 6), v: vr.range(4, 14) });
    const ember = F.key === 'chimney';
    for (const m of motes) {
      m.ph += dt;
      m.x += Math.sin(m.ph * 0.7) * 6 * dt + (ember ? Math.sin(m.ph * 2) * 10 * dt : 3 * dt);
      m.y += ember ? -m.v * 2.4 * dt : Math.cos(m.ph * 0.5) * 3 * dt + m.v * 0.25 * dt;
      if (m.y < -WT - 40) { m.y = R.H + 20; m.x = vr.range(-20, R.W + 20); }
      if (m.y > R.H + 30) { m.y = -WT - 20; }
      if (m.x > R.W + 30) m.x = -20;
    }
  }

  /* ---------------------------------------------------------------- input */
  const input = Kit.input(view.canvas);
  let drag = null;
  input.on('down', p => { if (!canControl()) return; drag = { sx: p.x, sy: p.y, x: p.x, y: p.y, id: p.id }; });
  input.on('move', p => { if (drag && p.id === drag.id) { drag.x = p.x; drag.y = p.y; } });
  input.on('up', p => {
    if (!drag || p.id !== drag.id) return;
    const dx = p.x - drag.sx, dy = p.y - drag.sy, d = Math.hypot(dx, dy);
    drag = null;
    if (!canControl()) return;
    if (d < 14) queue({ type: 'spin' });
    else queue({ type: 'dash', ang: Math.atan2(dy, dx), len: clamp(d / zoom * 1.35, 50, maxDash()) });
  });

  /* ---------------------------------------------------------------- draw */
  function drawShadow(x, y, r, a) { const L = lightSrc(G.R); shadowBlob(ctx, x, y + 2, r, L.x, L.y, 0.55, a === undefined ? 0.32 : a); }

  function drawPlayer(P) {
    const c = ctx, t = loop.time;
    const dead = P.state === 'dead';
    if (P.iframes > 0 && !dead && Math.floor(t * 20) % 2 === 0 && P.hurtT <= 0 && P.state !== 'dash') c.globalAlpha = 0.55;
    // silver streak
    if (P.streak) {
      const s = P.streak, dx = s.ex - s.sx, dy = s.ey - s.sy, L = Math.hypot(dx, dy);
      if (L > 2) {

        const bw = Math.min(300, w - 30);
        gfx.roundRect(c, -bw / 2, -30, bw, 60, 8); c.fillStyle = '#5e1220'; c.fill(); c.strokeStyle = '#e8b04b'; c.lineWidth = 3; c.stroke(); ink(c, 1.5);
        circ(c, -bw / 2 + 32, 0, 20); const gg = c.createLinearGradient(0, -20, 0, 20); gg.addColorStop(0, '#fff1b8'); gg.addColorStop(1, '#a8741f'); c.fillStyle = gg; c.fill(); ink(c, 2);
        circ(c, -bw / 2 + 32, 0, 15); c.fillStyle = '#3a0912'; c.fill();
        icon(c, rc.id, -bw / 2 + 32, 0, 0.95);
        gfx.text(c, RELICS[rc.id].name, -bw / 2 + 62, -8, { size: 16, font: SERIF, weight: 800, color: '#ffe8a3', align: 'left' });
        gfx.text(c, RELICS[rc.id].desc, -bw / 2 + 62, 12, { size: 12, font: SERIF, weight: 600, color: '#f7e8c6', align: 'left' });
        c.restore();
      }
    }
    if (G.hint) {
      const hn = G.hint, a = Math.min(1, hn.t * 4, (hn.life - hn.t) * 3);
      c.save(); c.globalAlpha = clamp(a, 0, 1);
      const y = h - 34 - sb;
      gfx.text(c, hn.text, w / 2, y, { size: Math.min(16, w / 26), font: SERIF, weight: 700, color: '#fff3cf', stroke: INK, strokeWidth: 4 });
      c.restore();
    }
    if (G.starPop) {
      const sp = G.starPop, k = sp.t;
      const s = (sp.x - cam.x) * zoom + w / 2, y = (sp.y - cam.y) * zoom + h / 2 - k * 30;
      c.save(); c.globalAlpha = clamp(1.6 - k, 0, 1); c.translate(s, y); c.scale(1 + Kit.ease.elasticOut(Math.min(1, k * 2)) * 0.4, 1 + Kit.ease.elasticOut(Math.min(1, k * 2)) * 0.4);
      star(c, 0, 0, 16, 5); c.fillStyle = '#ffd76e'; c.fill(); ink(c, 2);
      c.restore();
    }
    if (G.ghost && G.R.enemies[0]) gfx.text(c, 'Swipe through the beetle', w / 2, h - 34 - sb, { size: 16, font: SERIF, weight: 700, color: '#fff3cf', stroke: INK, strokeWidth: 4 });
  }

  /* ---------------------------------------------------------------- loop + shell */
  const loop = Kit.loop({ view, update, draw });

  shell = Kit.shell({
    title: 'Thimblekeep',
    kicker: 'A tale of a very small knight',
    tagline: 'Swipe to dash-strike. Hit them as they glint.',
    playLabel: 'Begin the tale',
    how: [
      'Swipe anywhere: the mouse dashes that way, as far as you swipe, cutting every foe on the path. Dashing is safe.',
      'Foes glint red before they attack. Dash through them during the glint for a PERFECT hit (double damage).',
      'Tap to spin: it parries foes and bats webs and embers back. Armoured rats only take hits from behind.',
      'Clear a room and pick a door by its prize. Six rooms, then the floor\'s boss. Keys: arrows/WASD dash, Space spins.',
    ],
    loop,
    focus: view.canvas,
    score: () => (G && G.mode === 'play' ? score() : 0),
    lose: () => { if (G && G.mode === 'play' && !G.dead) { G.god = false; G.P.iframes = 0; G.P.state = 'idle'; G.hp = 0; die('lose'); clearTimeout(finishRunSoon.tm); finishRunSoon.tm = 0; const F = FLOORS[G.floor - 1]; shell.over({ title: 'The knight falls', stats: [{ label: 'Reached', value: F.name + ' ' + G.idx }, { label: 'Floors cleared', value: String(G.floorsCleared) }], delay: 400 }); } },
    theme: {
      panel: 'paper', layout: 'bottom', button: 'rounded', titleStyle: 'solid', radius: 10,
      font: { display: SERIF, body: SERIF },
      colors: { accent: '#e8b04b', accentInk: INK, ink: '#f7e8c6', inkSoft: 'rgba(247,232,198,.78)', panel: 'var(--cloth)', scrim: 'var(--scrim)', line: '#e8b04b' },
    },
    onStart() {
      const sv = Kit.save.get('run', null);
      sceneMode = sceneMode && true;
      if (!forceNew && nextSeed == null && sv && sv.seed != null && sv.floor >= 1) continueRun(sv);
      else {
        clearRun();
        newRun(nextSeed);
        enterRoom(1, 1, 'fight', { restartMusic: true });
        banner('I', 'The Pantry', 'Floor 1 of 5');
      }
      nextSeed = null; forceNew = false;
      drag = null;
      loop.timeScale = 1;
      syncTitle();
    },
    onPause() { drag = null; },
    onOver() { Kit.music.duck(0.35); clearRun(); syncTitle(); startAttract(); },
  });
  const playBtn = shell.el.querySelector('[data-k=play]');
  const newBtn = document.createElement('button');
  newBtn.type = 'button'; newBtn.className = 'k-btn tk-new'; newBtn.textContent = 'New tale';
  playBtn.insertAdjacentElement('afterend', newBtn);
  newBtn.addEventListener('click', () => { Kit.sfx('click'); forceNew = true; shell.start(); });
  shell.el.querySelectorAll('[data-k=restart],[data-k=again]').forEach(b => b.addEventListener('click', () => { forceNew = true; }, true));
  function syncTitle() {
    const sv = Kit.save.get('run', null), ok = !!(sv && sv.floor);
    playBtn.querySelector('span').textContent = ok ? 'Continue · ' + progressOf(sv.floor, sv.idx, sv.kind, sv.loop).label : 'Begin the tale';
    newBtn.hidden = !ok;
    if (ok) Arcade.progress(progressOf(sv.floor, sv.idx, sv.kind, sv.loop));
  }
  syncTitle();
  addEventListener('pagehide', () => { if (G && G.mode === 'play' && !G.dead && (shell.phase === 'play' || shell.phase === 'paused')) saveRun(); });

  function startAttract() {
    const keep = G;
    setTimeout(() => {
      if (shell.phase !== 'title' && shell.phase !== 'over') return;
      if (G !== keep && G && G.mode === 'attract') return;
      newRun(11, true); attractRoom(0);
      Kit.music.play(TITLE_SONG);
    }, shell.phase === 'over' ? 2500 : 0);
  }

  /* ---------------------------------------------------------------- test hooks */
  function jump(f, i, kind) { if (!G || G.mode !== 'play') return; G.iris = null; enterRoom(f, i, kind || 'fight'); }
  const api = {
    seed(n) { nextSeed = n; forceNew = true; },
    run(n) { nextSeed = n == null ? 1 : n; forceNew = true; if (shell.phase === 'play' || shell.phase === 'paused') shell.restart(); else shell.start(); },
    floor(n) { jump(clamp(n | 0, 1, 5), 1); },
    room(n) { jump(G.floor, clamp(n | 0, 1, 6)); },
    boss(f) { jump(f ? clamp(f | 0, 1, 5) : G.floor, 7, 'boss'); if (G.R.boss) G.R.boss.t = 1.6; },
    shop() { jump(G.floor, G.idx, 'shop'); },
    win() { if (!G || !G.R) return; const R = G.R; if (R.boss && R.boss.hp > 0) { bossDefeated(R.boss); return; } for (const e of R.enemies) e.dead = true; R.enemies = []; R.waves = []; },
    door(k) { const R = G.R; if (!R.cleared) return false; const d = R.doors[k | 0] || R.doors[0]; for (const dd of R.doors) dd.open = 1; R.clearT = Math.max(R.clearT, 1); G.P.x = d.x; G.P.y = G.P.r; takeDoor(d); if (G.iris) { G.iris.go(); G.iris = null; } return d.reward; },
    give(k) { if (k === 'cheese') heal(2); else if (k === 'beads') { G.beads += 50; G.earned += 50; } else if (RELICS[k]) grantRelic(k); },
    god(on) { if (G) G.god = !!on; },
    auto(on) { if (G) G.auto = !!on; },
    dash(angDeg, len) { if (!G) return; G.P.state = 'idle'; startDash(angDeg * PI / 180, len == null ? 150 : len); },
    dashAt(x, y, extra) { const P = G.P; P.state = 'idle'; startDash(Math.atan2(y - P.y, x - P.x), Kit.dist(P.x, P.y, x, y) + (extra == null ? 30 : extra)); },
    spin() { G.P.spinCd = 0; G.P.state = 'idle'; return startSpin(); },
    step(sec) { loop.step(Math.max(1, Math.round((sec == null ? 1 / 60 : sec) * 60))); },
    frames(n) { loop.step(n | 0); },
    hurt(n) { if (!G) return; G.god = false; G.P.iframes = 0; G.P.state = 'idle'; return hurt(n == null ? 1 : n, null, 'test'); },
    teleport(x, y) { G.P.x = x; G.P.y = y; G.P.vx = G.P.vy = 0; resetCape(G.P); },
    place(type, x, y, state) { const e = mkEnemy(type, x, y); e.spawn = 0; if (state) { e.state = state; e.st = 0; } if (type === 'spider' && state !== 'hang') e.h = 0; G.R.enemies.push(e); return G.R.enemies.length - 1; },
    clearFoes() { G.R.enemies = []; G.R.waves = []; },
    info: () => (G ? {
      mode: G.mode, floor: G.floor, room: G.idx, kind: G.R && G.R.kind, loop: G.loop, hp: G.hp, maxHp: G.maxHp, beads: G.beads, earned: G.earned, relics: G.relics.slice(), combo: G.combo,
      floorsCleared: G.floorsCleared, cleared: G.R && G.R.cleared, W: G.R && G.R.W, H: G.R && G.R.H, iris: !!G.iris, dead: G.dead,
      player: { x: G.P.x, y: G.P.y, state: G.P.state, slow: G.P.slow },
      enemies: G.R ? G.R.enemies.map(e => ({ t: e.t, x: e.x, y: e.y, hp: e.hp, state: e.state, h: e.h })) : [],
      boss: G.R && G.R.boss ? { kind: G.R.boss.kind, hp: G.R.boss.hp, maxHp: G.R.boss.maxHp, state: G.R.boss.state } : null,
      doors: G.R ? G.R.doors.map(d => d.reward) : [], traps: G.R ? G.R.traps.length : 0, perfects: G.stats.perfects, kills: G.stats.kills,
      items: G.R ? G.R.items.map(i => ({ k: i.k, price: i.price, sold: i.sold, x: i.x, y: i.y })) : [],
    } : null),
    score: () => score(),
  };
  Arcade.test(api);
  if (Kit.debug) window.__game = Object.assign({ start(seed, floor) { api.run(seed); if (floor > 1) api.floor(floor); }, state: () => Object.assign({}, window.__kilnTest.state(), api.info()) }, api);

  /* ---------------------------------------------------------------- capture scenes */
  function sceneRun(seed, floor, idx, kind) {
    sceneMode = true;
    fx.seed(seed); vr = Kit.rng(seed);
    nextSeed = seed; forceNew = true;
    shell.start();
    G.god = true;
    G.banner = null; G.hint = null; G.ghost = false;
    if (floor !== 1 || idx !== 1 || kind) enterRoom(floor, idx, kind || 'fight');
    G.banner = null; G.hint = null; G.ghost = false;
    for (const e of G.R.enemies) e.spawn = 0;
  }
  Arcade.scenes({
    art: () => {
      sceneRun(7, 1, 3);
      const R = G.R, W = R.W, H = R.H;
      R.enemies = []; R.waves = []; R.traps = [];
      R.obstacles = [{ x: W * 0.2, y: H * 0.3, r: 28, kind: 'jar', seed: 3 }, { x: W * 0.84, y: H * 0.56, r: 27, kind: 'jar', seed: 4 }, { x: W * 0.72, y: H * 0.2, r: 18, kind: 'egg', seed: 5 }, { x: W * 0.24, y: H * 0.74, r: 14, kind: 'sugar', seed: 6 }];
      R.rug = true; dirty = true;
      const b1 = mkEnemy('beetle', W * 0.52, H * 0.5); b1.spawn = 0; b1.hp = 9; b1.state = 'wind'; b1.st = 0.3; b1.ang = PI * 0.75; R.enemies.push(b1);
      const b2 = mkEnemy('beetle', W * 0.7, H * 0.36); b2.spawn = 0; b2.ang = PI * 0.9; b2.state = 'idle'; b2.cd = 99; R.enemies.push(b2);
      const sp = mkEnemy('spider', W * 0.86, H * 0.22); sp.state = 'hang'; sp.h = 80; sp.cd = 99; R.enemies.push(sp);
      for (let k = 0; k < 14; k++) bakeDecal({ kind: 'bit', x: W * 0.4 + vr.range(-60, 60), y: H * 0.6 + vr.range(-50, 50), rot: vr.range(0, 6), s: vr.range(2.5, 4.5), col: vr.pick([R.F.shell, R.F.shell2]) });
      G.P.x = W * 0.3; G.P.y = H * 0.7; resetCape(G.P);
      G.auto = false;
      loop.step(20);
      api.dashAt(b1.x, b1.y, 60);
      loop.step(5);
      for (const e of R.enemies) e.cd = 99;
      loop.stop();
    },
    shot1: () => {
      sceneRun(3, 1, 3);
      const R = G.R, W = R.W, H = R.H;
      G.relics = ['needle', 'bell']; G.beads = 23; G.earned = 41; G.hp = 5;
      R.enemies = []; R.waves = [];
      const b1 = mkEnemy('beetle', W * 0.5, H * 0.38); b1.spawn = 0; R.enemies.push(b1);
      const b2 = mkEnemy('beetle', W * 0.22, H * 0.55); b2.spawn = 0; b2.cd = 99; R.enemies.push(b2);
      const b3 = mkEnemy('brute', W * 0.76, H * 0.26); b3.spawn = 0; b3.cd = 99; R.enemies.push(b3);
      G.P.x = W * 0.45; G.P.y = H * 0.72; resetCape(G.P);
      G.auto = false;
      loop.step(40);
      b1.state = 'wind'; b1.st = 0.35; b1.ang = Math.atan2(G.P.y - b1.y, G.P.x - b1.x);
      G.combo = 4; G.comboT = 2; dropBeads(W * 0.6, H * 0.6, 5); for (const b of R.beads) b.t = -9;
      loop.step(3);
      loop.stop();
    },
    shot2: () => {
      sceneRun(9, 2, 7, 'boss');
      const R = G.R, W = R.W, H = R.H, B = R.boss;
      G.relics = ['spool', 'shield', 'pepper', 'feather']; G.beads = 87; G.earned = 160; G.hp = 4; G.floorsCleared = 1;
      B.state = 'nose'; B.t = 0.3; B.nose = 1; B.hp = 11;
      B.paws.push({ x: W * 0.28, y: H * 0.55, side: 'l', st: 'tele', t: 0.75, dur: 1.0 });
      for (let k = 0; k < 18; k++) bakeDecal({ kind: k % 2 ? 'bead' : 'button', x: vr.range(30, W - 30), y: vr.range(H * 0.35, H - 30), rot: vr.range(0, 6), s: vr.range(4, 6), col: vr.pick(['#e8604a', '#4fc3d8', '#f2c94c', '#7bd389']) });
      G.P.x = W * 0.55; G.P.y = H * 0.48; resetCape(G.P);
      G.auto = false;
      loop.step(2);
      B.state = 'nose'; B.t = 0.3;
      api.dashAt(W / 2, 4, 0);
      loop.step(3);
      G.combo = 7; G.comboT = 2;
      loop.stop();
    },
  });

  /* ---------------------------------------------------------------- boot: attract mode behind the title */
  newRun(11, true);
  attractRoom(0);
  layout();
  loop.step(90);
  Kit.music.play(TITLE_SONG);
  loop.start();
})();
</script>
