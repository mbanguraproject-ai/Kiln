    for (const gu of L.gusts) {
      if (!inView(gu.x, (gu.y0 + gu.y1) / 2, 300) || gu.state === 0) continue;
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = '#cfe8ff';
      ctx.globalAlpha = gu.state === 2 ? 0.16 : 0.08;
      ctx.lineWidth = 1;
      for (let k = -2; k <= 2; k++) {
        const xx = gu.x + k * 12, off = (t * (gu.state === 2 ? 520 : 200) + k * 37) % 80;
        ctx.setLineDash([22, 58]); ctx.lineDashOffset = off;
        ctx.beginPath(); ctx.moveTo(xx, gu.y1); ctx.lineTo(xx, gu.y0); ctx.stroke();
      }
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  function drawWeb(w, t, a) {
    ctx.save();
    ctx.translate(w.x, w.y);
    const wob = Math.sin(t * 30) * w.wob * 2;
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = P.web;
    ctx.lineWidth = 0.9;
    ctx.globalAlpha = 0.55 * a;
    const n = 8;
    ctx.beginPath();
    for (let k = 0; k < n; k++) { const an = k / n * TAU + w.ph; ctx.moveTo(0, 0); ctx.lineTo(Math.cos(an) * w.r + wob, Math.sin(an) * w.r); }
    for (let ring = 1; ring <= 4; ring++) {
      const rr = w.r * ring / 4.4;
      for (let k = 0; k <= n; k++) {
        const an = k / n * TAU + w.ph, sag = rr * (k % 2 ? 0.9 : 1);
        const px = Math.cos(an) * sag + wob * ring / 4, py = Math.sin(an) * sag;
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawMoth(x, y, t, a, ang) {
    const f = Math.abs(Math.sin(t * 34));
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.cos(ang) * 0.2);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#ffe6a3';
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.ellipse(s * 3.6 * (0.4 + f * 0.6), -1.2, 3.8 * (0.4 + f * 0.6), 2.8, s * 0.5, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(s * 2.4 * (0.4 + f * 0.6), 2, 2.2 * (0.4 + f * 0.6), 1.8, -s * 0.4, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = '#b8762e';
    ctx.fillRect(-0.8, -3, 1.6, 6.5);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawHeart(x, y, s, c, a) {
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = c;
    ctx.translate(x, y);
    ctx.scale(s / 6, s / 6);
    ctx.beginPath();
    ctx.moveTo(0, 5); ctx.bezierCurveTo(-7, 0, -5, -6, 0, -2.6); ctx.bezierCurveTo(5, -6, 7, 0, 0, 5);
    ctx.fill();
    ctx.restore();
  }

  function drawOwl(o, t, a) {
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.globalAlpha = a;
    const swoop = o.state === 'swoop';
    if (swoop) ctx.rotate(Math.atan2(o.vy, o.vx) * 0.25);
    const bob = o.state === 'alert' ? Math.sin(t * 20) * 1.5 : Math.sin(t * 1.5 + o.ph) * 0.8;
    // wings
    ctx.fillStyle = '#3a2a24';
    if (swoop || o.state === 'back') {
      const fl = Math.sin(t * 14) * 8;
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * 6, -4); ctx.quadraticCurveTo(s * 22, -16 - fl, s * 34, -6 - fl); ctx.quadraticCurveTo(s * 22, 2, s * 6, 6); ctx.fill(); }
    }
    ctx.fillStyle = P.owl;
    ctx.beginPath(); ctx.ellipse(0, bob, 12, 15, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-10, -9 + bob); ctx.lineTo(-12, -19 + bob); ctx.lineTo(-4, -12 + bob); ctx.moveTo(10, -9 + bob); ctx.lineTo(12, -19 + bob); ctx.lineTo(4, -12 + bob); ctx.fill();
    ctx.strokeStyle = gfx.alpha(P.red, 0.8); ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(0, bob, 12, 15, 0, 0, TAU); ctx.stroke();
    ctx.fillStyle = '#4a3a33';
    ctx.beginPath(); ctx.ellipse(0, 5 + bob, 7, 8, 0, 0, TAU); ctx.fill();
    // eyes: shut lines asleep, burning when awake
    if (o.state === 'sleep') {
      ctx.strokeStyle = '#8a6a5a'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-7, -4 + bob); ctx.quadraticCurveTo(-4.5, -2 + bob, -2, -4 + bob); ctx.moveTo(2, -4 + bob); ctx.quadraticCurveTo(4.5, -2 + bob, 7, -4 + bob); ctx.stroke();
    } else {
      ctx.restore();
      gfx.light(ctx, o.x - 4.5, o.y - 4 + bob, 12, '#ff6a3a', 0.9);
      gfx.light(ctx, o.x + 4.5, o.y - 4 + bob, 12, '#ff6a3a', 0.9);
      ctx.save(); ctx.translate(o.x, o.y);
      ctx.fillStyle = '#ffd36a';
      ctx.beginPath(); ctx.arc(-4.5, -4 + bob, 3.4, 0, TAU); ctx.arc(4.5, -4 + bob, 3.4, 0, TAU); ctx.fill();
      ctx.fillStyle = '#1a0a08';
      ctx.beginPath(); ctx.arc(-4.5 + o.face, -4 + bob, 1.6, 0, TAU); ctx.arc(4.5 + o.face, -4 + bob, 1.6, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = '#c99a4a';
    ctx.beginPath(); ctx.moveTo(-1.5, 0 + bob); ctx.lineTo(1.5, 0 + bob); ctx.lineTo(0, 3 + bob); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawRings(t) {
    ctx.globalCompositeOperation = 'lighter';
    for (const rg of G.rings) {
      const age = t - rg.t0, rad = age * RING_SPEED;
      if (rad > rg.R || rad < 1) continue;
      const k = 1 - rad / rg.R, col = COL[rg.c];
      ctx.strokeStyle = col;
      ctx.globalAlpha = (rg.kind === 'shriek' ? 0.6 : 0.45) * k;
      ctx.lineWidth = rg.kind === 'shriek' ? 3 : 1.8;
      ctx.beginPath(); ctx.arc(rg.x, rg.y, rad, 0, TAU); ctx.stroke();
      if (rg.kind === 'shriek') { ctx.globalAlpha = 0.3 * k; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(rg.x, rg.y, rad * 0.86, 0, TAU); ctx.stroke(); }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  // Echo dots and contour lines: the cave painted in sound.
  const LB = 6, lBuckets = [];
  for (let c = 0; c < COL.length; c++) { lBuckets.push([]); for (let b = 0; b < LB; b++) lBuckets[c].push(new Int32Array(LN)); }
  const lCount = new Int32Array(COL.length * LB);
  function drawEcho(t, x0, y0, x1, y1) {
    ctx.globalCompositeOperation = 'lighter';
    // contour lines, bucketed by colour and brightness so each bucket is one stroke
    lCount.fill(0);
    for (let i = 0; i < LN; i++) {
      const a = t - lt[i];
      if (a < 0 || a > ECHO_LIFE) continue;
      if ((lx1[i] < x0 && lx2[i] < x0) || (lx1[i] > x1 && lx2[i] > x1) || (ly1[i] < y0 && ly2[i] < y0) || (ly1[i] > y1 && ly2[i] > y1)) continue;
      const v = a < 0.1 ? 1 : 1 - (a - 0.1) / (ECHO_LIFE - 0.1);
      const bk = Math.min(LB - 1, Math.floor(v * LB)), c = lc[i], slot = c * LB + bk;
      lBuckets[c][bk][lCount[slot]++] = i;
    }
    ctx.lineCap = 'round';
    for (let c = 0; c < COL.length; c++) for (let bk = 0; bk < LB; bk++) {
      const n = lCount[c * LB + bk];
      if (!n) continue;
      const list = lBuckets[c][bk];
      ctx.strokeStyle = COL[c];
      ctx.globalAlpha = ((bk + 0.5) / LB) * 0.42;
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      for (let k = 0; k < n; k++) { const i = list[k]; ctx.moveTo(lx1[i], ly1[i]); ctx.lineTo(lx2[i], ly2[i]); }
      ctx.stroke();
      if (bk === LB - 1) { ctx.globalAlpha = 0.1; ctx.lineWidth = 6; ctx.stroke(); }
    }
    // dots
    for (let i = 0; i < EN; i++) {
      const a = t - et[i];
      if (a < 0 || a > ECHO_LIFE) continue;
      const x = ex[i], y = ey[i];
      if (x < x0 || x > x1 || y < y0 || y > y1) continue;
      const fresh = a < 0.12 ? 1 - a / 0.12 : 0;
      const v = a < 0.06 ? 1 : Math.pow(1 - (a - 0.06) / (ECHO_LIFE - 0.06), 1.4);
      const al = Math.min(1, v * (0.75 + fresh * 0.5));
      if (al < 0.03) continue;
      const r = es[i] * (4.2 + fresh * 4.2);
      ctx.globalAlpha = al;
      ctx.drawImage(dotSprites[ec[i]], x - r, y - r, r * 2, r * 2);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---------- the bat: membrane wings with finger bones, big ears, tiny fangs ---------- */
  function wingPath(s, a, span) {
    // shoulder, wrist, three finger tips, hip; scalloped trailing edge
    const sx = s * 4, sy = -3;
    const wx = sx + s * Math.cos(a) * 12 * span, wy = sy - Math.sin(a) * 12;
    const f = [[a + 0.55, 17], [a - 0.15, 20], [a - 0.85, 15]];
    const tips = f.map(([fa, l]) => [wx + s * Math.cos(fa) * l * span, wy - Math.sin(fa) * l]);
    const hx = s * 3.5, hy = 7;
    return { sx, sy, wx, wy, tips, hx, hy };
  }
  function drawWing(W, rim, s) {
    const { sx, sy, wx, wy, tips, hx, hy } = W;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.quadraticCurveTo((sx + wx) / 2, Math.min(sy, wy) - 3, wx, wy);
    ctx.lineTo(tips[0][0], tips[0][1]);
    ctx.quadraticCurveTo((tips[0][0] + tips[1][0]) / 2 - s * 1, (tips[0][1] + tips[1][1]) / 2 + 2, tips[1][0], tips[1][1]);
    ctx.quadraticCurveTo((tips[1][0] + tips[2][0]) / 2 - s * 3, (tips[1][1] + tips[2][1]) / 2 + 1, tips[2][0], tips[2][1]);
    ctx.quadraticCurveTo((tips[2][0] + hx) / 2 + s * 1, (tips[2][1] + hy) / 2 + 4, hx, hy);
    ctx.closePath();
    ctx.fillStyle = P.wing;
    ctx.fill();
    ctx.fillStyle = 'rgba(150,96,104,0.35)';
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(wx, wy); ctx.lineTo(tips[0][0], tips[0][1]); ctx.lineTo(tips[1][0], tips[1][1]); ctx.closePath(); ctx.fill();
    // bones
    ctx.strokeStyle = P.bone;
    ctx.lineWidth = 1.15;
    ctx.beginPath();
    ctx.moveTo(sx, sy); ctx.lineTo(wx, wy);
    for (const tp of tips) { ctx.moveTo(wx, wy); ctx.lineTo(tp[0], tp[1]); }
    ctx.stroke();
    ctx.fillStyle = P.bone;
    ctx.beginPath(); ctx.arc(wx, wy, 1.3, 0, TAU); ctx.fill();
    if (rim > 0.01) {
      ctx.strokeStyle = gfx.alpha(P.rimLight, Math.min(1, rim));
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(wx, wy); ctx.lineTo(tips[0][0], tips[0][1]); ctx.stroke();
    }
  }
  function drawBatAt(b, t, scale) {
    if (!b) return;
    const x = b.x, y = b.y + Math.sin(t * 3.1) * 1.2;
    // warm glow, and the light it throws
    const glowA = b.dead ? Math.max(0, 1 - G.deadT * 0.8) : clamp(0.55 + G.energy / 220, 0.4, 1);
    gfx.light(ctx, x, y, 92, P.warm, 0.07 * glowA);
    gfx.light(ctx, x, y, 34, P.warm, 0.42 * glowA);
    if (b.rim > 0) gfx.light(ctx, x, y, 46, P.teal, 0.3 * Math.min(1, b.rim));
    if (b.charge > 0) {
      ctx.strokeStyle = P.teal; ctx.globalAlpha = 0.25 + b.charge * 0.5; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, 30 - b.charge * 8, -Math.PI / 2, -Math.PI / 2 + TAU * b.charge); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.save();
    ctx.translate(x, y);
    const tilt = clamp(b.vx / 900, -0.3, 0.3) + (b.dead ? G.deadT * 3 : 0);
    ctx.rotate(tilt);
    ctx.scale(scale * b.sx * 1.05, scale * b.sy * 1.05);
    // six-pose flap: wing bone angles stepped through a beat, with a glide pose when coasting
    const ph = b.flap % TAU;
    let a = Math.sin(ph) * 0.85 + 0.12, span = 0.82 + 0.18 * Math.cos(ph);
    if (b.glide > 0.25 && !b.web) { a = 0.18 + Math.sin(t * 2) * 0.05; span = 1; }
    if (b.web) { a = Math.sin(t * 22) * 0.4 + 0.1; span = 0.7; }
    if (b.dead) { a = -0.4 + Math.sin(t * 9) * 0.2; span = 0.6; }
    const rim = b.rim;
    for (const s of [-1, 1]) drawWing(wingPath(s, a, span), rim, s);
    // ears
    const hx = b.face * 1.3;
    ctx.fillStyle = P.body;
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(hx + s * 1.5, -10); ctx.quadraticCurveTo(hx + s * 7.5, -20, hx + s * 6.2, -21.5); ctx.quadraticCurveTo(hx + s * 7.8, -14, hx + s * 6, -8); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#d98a8f';
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(hx + s * 3, -11); ctx.quadraticCurveTo(hx + s * 6.5, -18, hx + s * 5.8, -19); ctx.quadraticCurveTo(hx + s * 6.4, -14, hx + s * 5.2, -10); ctx.closePath(); ctx.fill(); }
    // body and head
    ctx.fillStyle = P.body;
    ctx.beginPath(); ctx.ellipse(0, 2.5, 5.6, 8, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = P.belly;
    ctx.beginPath(); ctx.ellipse(0, 4, 3.4, 5.4, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = P.body;
    ctx.beginPath(); ctx.arc(hx, -6.5, 6.4, 0, TAU); ctx.fill();
    // cheeks puff when it eats
    if (b.puff > 0.02) {
      ctx.fillStyle = '#c98a6c';
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(hx + s * 4.6, -4.2, 2.2 + b.puff * 2.4, 0, TAU); ctx.fill(); }
    }
    // eyes (they blink), snout and fangs
    const blink = b.blink < 0 || b.stun > 0 ? 0.15 : 1;
    ctx.fillStyle = '#120a0a';
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(hx + s * 2.6 + b.face * 0.6, -7.4, 1.6, 1.9 * blink, 0, 0, TAU); ctx.fill(); }
    if (blink > 0.5) { ctx.fillStyle = '#ffffff'; for (const s of [-1, 1]) ctx.fillRect(hx + s * 2.6 + b.face * 0.6 - 0.2, -8.6, 0.9, 0.9); }
    ctx.fillStyle = '#5a3328';
    ctx.beginPath(); ctx.ellipse(hx + b.face * 0.8, -3.6, 2.2, 1.5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(hx - 1.6 + b.face * 0.8, -2.4); ctx.lineTo(hx - 1 + b.face * 0.8, -0.6); ctx.lineTo(hx - 0.4 + b.face * 0.8, -2.4); ctx.moveTo(hx + 0.4 + b.face * 0.8, -2.4); ctx.lineTo(hx + 1 + b.face * 0.8, -0.6); ctx.lineTo(hx + 1.6 + b.face * 0.8, -2.4); ctx.fill();
    // feet
    ctx.strokeStyle = P.bone; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-2, 10); ctx.lineTo(-3, 12.5); ctx.moveTo(2, 10); ctx.lineTo(3, 12.5); ctx.stroke();
    if (rim > 0.01) {
      ctx.strokeStyle = gfx.alpha(P.rimLight, Math.min(1, rim));
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(hx, -6.5, 6.4, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, 2.5, 5.6, 8, 0, Math.PI * 1.1, Math.PI * 1.45); ctx.stroke();
    }
    ctx.restore();
    if (b.stun > 0 && !b.dead) {
      for (let k = 0; k < 3; k++) { const an = t * 8 + k * TAU / 3; gfx.light(ctx, x + Math.cos(an) * 12, y - 20 + Math.sin(an) * 4, 5, '#fff2a8', 0.9); }
    }
  }
  function drawPup(x, y, t, upright, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.PI * (1 - upright));
    ctx.scale(s * 0.62, s * 0.62);
    const sw = Math.sin(t * 2) * 0.12;
    ctx.rotate(sw);
    ctx.fillStyle = '#5a3a40';
    for (const sd of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sd * 3, -2); ctx.quadraticCurveTo(sd * 10, 2, sd * 6, 10); ctx.quadraticCurveTo(sd * 3, 7, sd * 2, 6); ctx.fill(); }
    ctx.fillStyle = '#9a6a52';
    ctx.beginPath(); ctx.ellipse(0, 3, 5, 7, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -5, 5.5, 0, TAU); ctx.fill();
    for (const sd of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sd * 1.5, -8); ctx.lineTo(sd * 5.5, -15); ctx.lineTo(sd * 5, -6); ctx.fill(); }
    ctx.fillStyle = '#120a0a';
    ctx.beginPath(); ctx.arc(-2.1, -5.5, 1.3, 0, TAU); ctx.arc(2.1, -5.5, 1.3, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-2.4, -6.4, 0.8, 0.8); ctx.fillRect(1.8, -6.4, 0.8, 0.8);
    ctx.fillStyle = '#ffb3c7';
    ctx.beginPath(); ctx.arc(-3.4, -3.2, 1.2, 0, TAU); ctx.arc(3.4, -3.2, 1.2, 0, TAU); ctx.fill();
    ctx.restore();
  }
  function drawTrailPups(t) {
    for (let k = G.trail.length - 1; k >= 0; k--) {
      const p = G.trail[k];
      gfx.light(ctx, p.x, p.y, 22, P.pink, 0.18);
      // a little flapping pup: wings beat out of phase with yours
      const fl = Math.sin(t * 16 + k * 1.7);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.fillStyle = '#5a3a40';
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * 2, -1); ctx.quadraticCurveTo(s * 9, -6 - fl * 5, s * 14, -2 - fl * 6); ctx.quadraticCurveTo(s * 8, 2, s * 2, 3); ctx.fill(); }
      ctx.restore();
      drawPup(p.x, p.y, t + k, p.flip, 1);
      if (p.heart > 0.02) drawHeart(p.x, p.y - 18 - (1 - p.heart) * 14, 6, P.pink, p.heart);
    }
  }

  /* ---------- night sky bonus ---------- */
  const stars = gfx.starfield({ count: 140, seed: 5, layers: 3, size: [0.5, 2.1] });
  let trees = null;
  function buildTrees() {
    const paint = (seed, color, base, sz, rim) => (g, w, h) => {
      const r = Kit.rng(seed);
      g.fillStyle = color;
      const y0 = h * base;
      g.fillRect(0, y0 + sz * 0.6, w, h - y0);
      for (let x = -sz; x < w + sz; x += sz * r.range(0.5, 0.9)) {
        const top = y0 - r.range(0, sz * 1.3);
        const draw = xx => {
          for (let k = 0; k < 4; k++) { g.beginPath(); g.arc(xx + r.range(-sz * 0.4, sz * 0.4), top + k * sz * 0.35 + r.range(0, sz * 0.2), sz * r.range(0.35, 0.6), 0, TAU); g.fill(); }
          if (rim) { g.fillStyle = gfx.alpha(P.moon, 0.12); g.beginPath(); g.arc(xx + sz * 0.1, top - 2, sz * 0.4, Math.PI * 1.1, Math.PI * 1.9); g.fill(); g.fillStyle = color; }
        };
        draw(x);
        if (x < sz) draw(x + w);
        if (x > w - sz) draw(x - w);
      }
    };
    trees = gfx.layers([
      { depth: 0.15, paint: paint(4, '#1a2c55', 0.72, 46) },
      { depth: 0.4, paint: paint(9, '#0f1c3a', 0.8, 56, true) },
      { depth: 0.85, paint: paint(14, '#060c1d', 0.88, 70, true) },
    ]);
  }
  function drawNight(w, h, t) {
    const N = G.night;
    gfx.sky(ctx, NIGHT_SKY);
    stars.draw(ctx, w, h, t, N.scroll * 0.05, 0);
    const mx = w * 0.72, my = h * 0.24;
    gfx.light(ctx, mx, my, 260, P.moon, 0.35);
    gfx.lightRays(ctx, mx, my, { count: 6, length: h * 0.9, spread: 1.1, angle: Math.PI * 0.62, width: 60, color: P.moon, alpha: 0.05, t });
    gfx.blit(ctx, moonSprite(), mx, my, Math.min(0.95, w / 460));
    trees.draw(ctx, w, h, N.scroll * zoom, 0);
    const fog = fogSprite();
    for (let k = 0; k < 3; k++) {
      const fx0 = -Kit.wrap(N.scroll * zoom * (0.3 + k * 0.2) + k * 300, 0, w * 1.4);
      ctx.globalAlpha = 0.28 - k * 0.06;
      ctx.drawImage(fog, fx0, h * (0.7 + k * 0.06), w * 1.4, h * 0.16);
      ctx.drawImage(fog, fx0 + w * 1.4, h * (0.7 + k * 0.06), w * 1.4, h * 0.16);
    }
    ctx.globalAlpha = 1;
    cam.apply(ctx);
    for (const m of N.moths) {
      if (m.dead) continue;
      gfx.light(ctx, m.x, m.y, m.gold ? 30 : 18, P.gold, m.gold ? 0.8 : 0.55);
      drawMoth(m.x, m.y, t + m.ph, 1, 0);
    }
    drawTrailPups(t);
    G.bat.rim = Math.max(G.bat.rim, 0.5);
    drawBatAt(G.bat, t, 1.4);
    fx.draw(ctx);
    cam.restore(ctx);
    gfx.vignette(ctx, 0.45, '#020414');
  }

  const fogSprite = () => gfx.sprite('pp-fog', 256, 64, (g, w, h) => {
    g.save(); g.scale(1, h / w);
    const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
    gr.addColorStop(0, 'rgba(159,198,255,0.55)'); gr.addColorStop(1, 'rgba(159,198,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, w); g.restore();
  });

  /* ---------- overlays: moonlight wipe, fades, banners, tutorial ---------- */
  const wipeSprite = () => gfx.sprite('pp-wipe', 128, 128, g => {
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(225,238,255,1)'); gr.addColorStop(0.55, 'rgba(159,198,255,0.92)'); gr.addColorStop(1, 'rgba(159,198,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  });
  // Reaching the exit floods the screen with moonlight from the arch; the bat and pups fly out over it.
  function drawWipe(w, h) {
    const big = Math.hypot(w, h) * 1.25;
    const r = Kit.ease.quadIn(G.wipe) * big * 1.3 + 60;
    ctx.globalAlpha = Math.min(1, 0.25 + G.wipe * 0.75);
    ctx.drawImage(wipeSprite(), G.wipeX - r, G.wipeY - r, r * 2, r * 2);
    ctx.globalAlpha = 1;
    gfx.lightRays(ctx, G.wipeX, G.wipeY, { count: 9, length: big, spread: TAU, angle: 0, width: 70, color: '#ffffff', alpha: 0.12 * (1 - G.wipe * 0.6), t: G.t });
  }
  function drawOverlays(w, h) {
    if (G.wipe > 0) {
      if (G.sub === 'exit') {
        /* drawn under the bat in draw() */
      } else {
        ctx.globalAlpha = G.wipe * 0.9;
        ctx.fillStyle = '#c9dcff';
        ctx.fillRect(0, 0, w, h);
      }
      ctx.globalAlpha = 1;
    }
    if (G.fade > 0) { ctx.globalAlpha = G.fade; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h); ctx.globalAlpha = 1; }
  }

  /* ---------- HUD: sonar arcs, moth-wing energy pips, hanging pup icons; thin glowing lines on black ---------- */
  const DISPLAY = 'Unbounded, "Arial Black", system-ui, sans-serif';
  function drawHud(w, h) {
    if (Kit.keyart || !G || G.mode !== 'play') return;
    const t = G.t, left = Math.max(16, (w - 1100) / 2 + 16), top = 14;
    const cx = left + 26, cy = top + 28;
    ctx.lineCap = 'round';
    // sonar waves ")))" spreading from a dot: the two inner waves are the chirp, the wide outer one the shriek.
    // Each wave grows out from its middle as its cooldown recovers, and brightens when ready.
    const ox = cx - 12;
    const wave = (r, k, col, wdt, span) => {
      ctx.strokeStyle = gfx.alpha(col, 0.2); ctx.lineWidth = wdt;
      ctx.beginPath(); ctx.arc(ox, cy, r, -span, span); ctx.stroke();
      if (k <= 0) return;
      ctx.strokeStyle = col; ctx.globalAlpha = k >= 1 ? 1 : 0.75;
      ctx.beginPath(); ctx.arc(ox, cy, r, -span * k, span * k); ctx.stroke();
      ctx.globalAlpha = 1;
    };
    const ck = 1 - G.cd / CHIRP_CD, sk = 1 - G.scd / SHRIEK_CD;
    gfx.light(ctx, ox + 8, cy, 34, P.teal, 0.12 + (ck >= 1 ? 0.06 : 0));
    wave(9, clamp(ck * 2, 0, 1), ck >= 1 ? '#bffff4' : P.teal, 3, 0.8);
    wave(16, clamp(ck * 2 - 1, 0, 1), ck >= 1 ? '#bffff4' : P.teal, 3, 0.75);
    wave(24, sk, sk >= 1 ? '#e6fbff' : '#58a8a0', 2.4, 0.72);

    playLabel: 'Fly',
    how: [
      'Drag anywhere (or arrow keys) to fly; let go to glide. Walls stun you, never kill.',
      'Tap (Space) to chirp and see. Hold still, or press Shift, to shriek twice as far.',
      'Fly into hanging pups: each one multiplies the moths you bank at the moonlit exit.',
      'Moths are energy. Webs, stalactites, rivers and owls all warn you first: listen.',
    ],
    loop,
    focus: view.canvas,
    score: () => (G && G.mode === 'play' ? G.score : 0),
    lose: () => { if (G && G.mode === 'play') { safeFlag = false; G.energy = 0; die(); G.deadT = 2; finishRun(); } },
    theme: {
      panel: 'neon', layout: 'bottom', button: 'pill', titleStyle: 'solid', radius: 26, font: 'house',
      colors: { accent: '#4ff0d8', accentInk: '#03100e', ink: '#ecfbff', inkSoft: 'rgba(214,240,246,0.74)', panel: 'var(--panel)', scrim: 'var(--scrim)', line: 'var(--line)' },
    },
    onStart() {
      const sv = Kit.save.get('run', null);
      resetTouch();
      normalTime();
      safeFlag = false; autopilotFlag = false;
      if (!forceNew && nextSeed == null && sv && sv.seed != null && sv.cave >= 1) continueRun(sv);
      else newRun(nextSeed);
      nextSeed = null; forceNew = false;
      Kit.save.set('runs', Kit.save.get('runs', 0) + 1);
      Kit.music.play(G.cave >= 6 ? SONG_DEEP : SONG, { restart: true });
      Kit.sfx('select');
      syncTitle();
    },
    onPause() { resetTouch(); saveRun(true); },
    onOver() { Kit.music.duck(0.35); syncTitle(); },
  });
  // Title: continue a saved run, or start fresh
  const playBtn = shell.el.querySelector('[data-k=play]');
  const newBtn = document.createElement('button');
  newBtn.type = 'button'; newBtn.className = 'k-btn pp-new'; newBtn.textContent = 'New run';
  playBtn.insertAdjacentElement('afterend', newBtn);
  newBtn.addEventListener('click', () => { Kit.sfx('click'); forceNew = true; shell.start(); });
  shell.el.querySelectorAll('[data-k=restart],[data-k=again]').forEach(b => b.addEventListener('click', () => { forceNew = true; }));
  function syncTitle() {
    const sv = Kit.save.get('run', null), has = !!(sv && sv.cave);
    playBtn.querySelector('span').textContent = has ? 'Continue · Cave ' + sv.cave : 'Fly';
    newBtn.hidden = !has;
    if (has) Arcade.progress({ label: 'Cave ' + sv.cave });
  }
  syncTitle();
  addEventListener('pagehide', () => { if (shell.phase === 'play' || shell.phase === 'paused') saveRun(true); });

  // Test hooks for tools/game-check.cjs, test.cjs and the playtester (on top of start/lose/state).
  Arcade.test({
    seed(n) { nextSeed = n; forceNew = true; },
    run(n) { nextSeed = n; forceNew = true; if (shell.phase === 'play' || shell.phase === 'paused') shell.restart(); else shell.start(); },
    xray(on) { xray = !!on; },
    cave(n) { if (G && G.mode === 'play') { G.sub = 'cave'; G.night = null; enterCave(n, { noFade: true }); G.firstChirp = 0.05; } },
    win() { if (G && G.mode === 'play' && G.sub === 'cave') { G.bat.x = L.W - 60; G.bat.y = L.exitY; camTarget.x = cam.x = L.W - 160; camTarget.y = cam.y = L.exitY; exitCave(); } },
    skipNight() { if (G && G.sub === 'night') G.nightT = 0; },
    step(sec) { loop.step(Math.max(1, Math.round((sec || 1 / 60) * 60))); },
    chirp: () => { if (G) G.cd = 0; return chirp(); },
    shriek: () => { if (G) G.scd = 0; return shriek(); },
    input(dx, dy) { if (G) G.testIn = (dx || dy) ? { x: dx, y: dy } : null; },
    teleport(x, y) { if (G) { G.bat.x = x; G.bat.y = y; G.bat.vx = G.bat.vy = 0; } },
    give(what) {
      if (!G || !L) return;
      if (what === 'energy') G.energy = E_MAX;
      if (what === 'moth') { G.carried++; G.mothsEaten++; }
      if (what === 'pup') { const p = { x: G.bat.x, y: G.bat.y, hx: 0, hy: 0, state: 'hang', lit: -99, flip: 0, ph: 0, heart: 0 }; L.pups.push(p); rescuePup(p); }
    },
    energy(v) { if (G) G.energy = v; },
    drainEnergy() { if (G) { safeFlag = false; G.energy = 0.01; } },
    autopilot(on) { autopilotFlag = !!on; },
    safe(on) { safeFlag = !!on; },
    info: () => (G && L ? {
      mode: G.mode, sub: G.sub, cave: G.cave, energy: G.energy, score: G.score, carried: G.carried, pups: G.trail.length, pupsTotal: G.pupsTotal,
      x: G.bat.x, y: G.bat.y, vx: G.bat.vx, vy: G.bat.vy, W: L.W, H: L.H, exitY: L.exitY, startY: L.startY, chirps: G.chirps, cd: G.cd, scd: G.scd,
      moths: L.moths.filter(m => !m.dead).length, mothList: L.moths.filter(m => !m.dead).map(m => [Math.round(m.x), Math.round(m.y)]),
      pupList: L.pups.filter(p => p.state === 'hang').map(p => [Math.round(p.x), Math.round(p.y)]),
      webs: L.webs.length, stals: L.stals.length, rivers: L.rivers.length, crystals: L.crystals.length, gusts: L.gusts.length, owls: L.owls.length, drips: L.drips.length,
      echoes: (() => { let n = 0; for (let i = 0; i < EN; i++) if (G.t - et[i] >= 0 && G.t - et[i] < ECHO_LIFE) n++; return n; })(),
      bumps: G.bumps || 0, lastBumpCost: G.lastBumpCost || 0, webbed: !!G.bat.web, stun: G.bat.stun, nightT: G.nightT, runSeed: G.runSeed, solidAtBat: solidAt(G.bat.x, G.bat.y),
    } : null),
    path: () => (L ? L.path.filter((p, i) => i % 4 === 0).map(p => [Math.round(p.x), Math.round(p.y)]) : null),
    stalList: () => (L ? L.stals.map(s => ({ x: s.x, y: s.y, state: s.state })) : null),
    webList: () => (L ? L.webs.map(w => ({ x: w.x, y: w.y, r: w.r, torn: w.torn })) : null),
    debugNear(x, y, r) { const out = { dots: [], crystals: L.crystals.map(c => [Math.round(c.x), Math.round(c.y), Math.round(c.r)]), minis: G.minis.length, rings: G.rings.map(g => [Math.round(g.x), Math.round(g.y), g.kind]) }; for (let i = 0; i < EN; i++) if (Math.hypot(ex[i] - x, ey[i] - y) < r && G.t - et[i] < ECHO_LIFE && G.t >= et[i]) out.dots.push([ec[i], +es[i].toFixed(1)]); return out; },
    owlList: () => (L ? L.owls.map(o => ({ x: o.x, y: o.y, state: o.state })) : null),
    wallDist(dx, dy) { if (!G || !L) return null; const d = Math.hypot(dx, dy) || 1; return cast(G.bat.x, G.bat.y, dx / d, dy / d, 900); },
    fingerprint: () => { if (!L) return null; let h = 0; for (let i = 0; i < L.field.length; i += 7) h = (h * 31 + Math.round(L.field[i] * 9)) >>> 0; return h + ':' + L.W + ':' + L.moths.length + ':' + L.pups.length; },
  });

  /* ---------- capture scenes: deterministic, hand-placed moments ---------- */
  function sceneRun(seed, cave) {
    fx.seed(seed);
    nextSeed = seed; forceNew = true;
    shell.start();
    safeFlag = true;
    Kit.save.set('taught', true);
    G.tut = 0;
    if (cave !== 1) { G.sub = 'cave'; enterCave(cave, { noFade: true }); }
    G.fade = 0; G.fadeDir = 0; G.banner = null;
    G.firstChirp = 0;
  }
  function placeBat(x, y, vx, vy) { const b = G.bat; b.x = x; b.y = y; b.vx = vx; b.vy = vy; for (let i = 0; i < HIST; i++) { G.hx[i] = x - vx * i / 60; G.hy[i] = y - vy * i / 60; } cam.x = x; cam.y = y; }
  function nearestOpen(x, y, minClear) {
    let best = [x, y], bd = 1e9;
    for (let j = 0; j < L.rows; j++) for (let i = 0; i < L.cols; i++) {
      if (L.dist[j * L.cols + i] < minClear || L.type[j * L.cols + i] !== 0) continue;
      const px = (i + 0.5) * CELL, py = (j + 0.5) * CELL, d = (px - x) ** 2 + (py - y) ** 2;
      if (d < bd) { bd = d; best = [px, py]; }
    }
    return best;
  }
  Arcade.scenes({
    // a big chirp mid-expansion in a crystal grotto by the moonlit exit; moths glinting
    art: () => {
      sceneRun(4, 5);
      const ax = L.W - 340, ay = L.exitY + 40;
      const [bx, by] = nearestOpen(ax, ay, 5);
      const cl = L.addCrystals(bx + 60, by, 300);
      buildCaveArt(L);
      cl.lit = -99;
      placeBat(bx - 20, by, 120, -20);
      for (let k = 0; k < 6; k++) {
        const [mx, my] = nearestOpen(bx + 40 + k * 46, by - 60 + (k % 3) * 50, 3);
        L.moths.push(newMoth(mx, my, G.rng));
      }
      G.bat.flap = 1.2;
      loop.step(2);
      G.cd = 0; sonar(G.bat.x - 140, G.bat.y + 40, CHIRP_R, CHIRP_RAYS, 'chirp');
      loop.step(70);
      fx.clear();
      G.cd = 0; chirp();
      loop.step(25);
      const tall = view.h > view.w;
      camTarget.x = tall ? (G.bat.x + L.W + 34) / 2 : G.bat.x + 135; camTarget.y = G.bat.y - (tall ? 40 : 10);
      cam.x = camTarget.x; cam.y = camTarget.y;
      cam.zoom = zoom * (tall ? 0.95 : 1.3);
      G.bat.glide = 1; G.bat.flap = 1.4;
      loop.stop();
      loop.render();
    },
    // cave 1: an echo ring opening up the first tunnel and two moths
    shot1: () => {
      sceneRun(3, 1);
      G.energy = 82;
      autopilotFlag = true;
      loop.step(150);
      autopilotFlag = false;
      const b = G.bat;
      for (let k = 0; k < 2; k++) { const [mx, my] = nearestOpen(b.x + 110 + k * 70, b.y - 40 + k * 60, 3); L.moths.push(newMoth(mx, my, G.rng)); }
      G.carried = 6; G.score = 0;
      G.cd = 0; chirp();
      loop.step(26);
      loop.stop();
      loop.render();
    },
    // cave 5: a river in blue echoes, a stalactite mid-fall, three pups trailing
    shot2: () => {
      sceneRun(9, 5);
      G.score = 214; G.energy = 64; G.carried = 11;
      const rv = L.rivers[0];
      const rx = rv ? (rv.x0 + rv.x1) / 2 : L.path[Math.floor(L.path.length / 2)].x;
      const ry = rv ? rv.y - 46 : L.path[Math.floor(L.path.length / 2)].y;
      const [bx, by] = nearestOpen(rx - 40, ry, 3);
      placeBat(bx, by, 150, -10);
      for (let k = 0; k < 3; k++) { const p = { x: bx - 30 * (k + 1), y: by, hx: 0, hy: 0, state: 'hang', lit: -99, flip: 1, ph: k, heart: 0 }; L.pups.push(p); p.state = 'trail'; p.flip = 1; G.trail.push(p); }
      // a stalactite just ahead, already falling
      let sy = null;
      for (let d = 0; d < 300; d += 4) if (solidAt(bx + 70, by - d)) { sy = by - d; break; }
      if (sy !== null) L.stals.push({ x: bx + 70, y: sy, len: 40, w: 12, state: 'fall', t: 0, fy: sy + 26, vy: 260, lit: G.t, floor: by + 200, tick: 0 });
      G.cd = 0; sonar(bx - 180, by - 60, CHIRP_R, CHIRP_RAYS, 'chirp');
      loop.step(40);
      G.cd = 0; sonar(bx + 140, by - 80, CHIRP_R, CHIRP_RAYS, 'chirp');
      loop.step(16);
      G.cd = 0; chirp();
      loop.step(20);
      for (const s of L.stals) if (s.state === 'fall' && Math.abs(s.x - (bx + 70)) < 2) { s.fy = Math.min(s.fy, by - 70); s.vy = 300; }
      loop.step(2);
      camTarget.x = cam.x = G.bat.x + 30; camTarget.y = cam.y = G.bat.y - 70;
      loop.stop();
      loop.render();
    },
  });

  /* ---------- boot ---------- */
  buildSprites();
  buildBg();
  buildTrees();
  attract(7);
  loop.step(40);
  Kit.music.play(SONG);
  loop.start();
})();
</script>
</body>
</html>
