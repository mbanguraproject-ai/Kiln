<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Napwalk</title>
<meta name="description" content="Napwalk: swipe and every cat steps the same way. Get each cat curled up on its cushion.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Unbounded:wght@600;800&display=swap">
<style>
/* A cosy dollhouse living room in late-afternoon sun; in dark mode the same room at evening under a lamp. */
:root {
  --bg1: #f3dcc0; --bg2: #e9c6a0; --bg3: #d9a97f; --paper: #efd9bd;
  --wall: #e9dcc3; --leaf: #9bb28a; --floor1: #d9a066; --floor2: #c4884f; --cap: #f6ecdc; --beam: #ffe2a8;
  --sage: #7a9e7e; --terra: #c8643b; --mustard: #d7a443; --cream: #fff4e3;
  --panel: #f6ead6; --panel2: #efdcc0; --ink: #4a2f25; --ink-soft: #7d5a48; --line: #c79a6b; --scrim: rgba(74, 40, 22, 0.42);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg1: #2a2030; --bg2: #221a29; --bg3: #17121c; --paper: #2f2434;
    --wall: #6f5f68; --leaf: #56684f; --floor1: #8e6141; --floor2: #774e32; --cap: #9d8a86; --beam: #ffb35c;
    --panel: #3a2b3d; --panel2: #2f2232; --ink: #f6e7d6; --ink-soft: #cdb5a6; --line: #7a5f72; --scrim: rgba(14, 8, 18, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg1: #2a2030; --bg2: #221a29; --bg3: #17121c; --paper: #2f2434;
  --wall: #6f5f68; --leaf: #56684f; --floor1: #8e6141; --floor2: #774e32; --cap: #9d8a86; --beam: #ffb35c;
  --panel: #3a2b3d; --panel2: #2f2232; --ink: #f6e7d6; --ink-soft: #cdb5a6; --line: #7a5f72; --scrim: rgba(14, 8, 18, 0.6);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; background: var(--bg2); }
body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: var(--bg2); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
#game { display: block; width: 100%; height: 100%; outline: none; touch-action: none; cursor: grab; }

/* ---- Kit shell as felt and knit: stitched panels, felt-patch buttons ---- */
.k-shell .k-title-h { font-family: "Unbounded", ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif !important; font-weight: 800 !important;
  color: #fff4e3 !important; letter-spacing: -0.01em; text-shadow: 0 3px 0 #c8643b, 0 5px 0 #8a3f22, 0 12px 24px rgba(60, 25, 10, 0.5) !important; }
.k-shell .k-kicker { color: #fff4e3 !important; letter-spacing: 0.3em; text-shadow: 0 1px 2px rgba(60, 25, 10, 0.9), 0 2px 10px rgba(60, 25, 10, 0.8); }
.k-shell .k-tagline { color: #fff4e3 !important; font-weight: 700; text-shadow: 0 2px 10px rgba(60, 25, 10, 0.85), 0 1px 2px rgba(60, 25, 10, 0.7); }
.k-shell .k-best { color: #fff4e3 !important; text-shadow: 0 2px 8px rgba(60, 25, 10, 0.8); }
.k-shell .k-best b { color: #ffe2a8 !important; }
.k-shell .k-panel { position: relative; border: 0 !important;
  background: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1.6px) 0 0 / 6px 6px, linear-gradient(180deg, var(--panel), var(--panel2)) !important;
  box-shadow: 0 26px 60px -20px rgba(40, 18, 8, 0.7), inset 0 0 0 3px var(--line) !important; }
.k-shell .k-panel::after { content: ""; position: absolute; inset: 9px; border: 2px dashed var(--line); border-radius: calc(var(--k-radius, 22px) - 7px); pointer-events: none; opacity: 0.9; }
.k-shell .k-panel h2, .k-shell .k-eyebrow { font-family: "Unbounded", ui-rounded, system-ui, sans-serif; letter-spacing: 0.04em; }
.k-shell .k-btn { position: relative; font-weight: 700; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.16), 0 3px 0 rgba(60, 25, 10, 0.18) !important; }
.k-shell .k-btn::after { content: ""; position: absolute; inset: 5px; border: 1.5px dashed currentColor; border-radius: inherit; opacity: 0.4; pointer-events: none; }
.k-shell .k-btn.k-primary { background: linear-gradient(180deg, #d5774d, #c25f36) !important; color: #fff4e3 !important; }
.k-shell .k-stat { background: rgba(122, 158, 126, 0.16) !important; border-radius: 12px; }
.k-shell .k-newbest { background: #d7a443 !important; color: #3a2414 !important; }
.k-shell .k-pausebtn { background: #7a9e7e !important; color: #fff4e3 !important; border-radius: 50% !important;
  box-shadow: inset 0 0 0 2px #5f8263, inset 0 -4px 0 rgba(0, 0, 0, 0.16), 0 4px 10px rgba(60, 25, 10, 0.35) !important; }
.k-shell .k-pausebtn::after { content: ""; position: absolute; inset: 5px; border: 1.5px dashed rgba(255, 244, 227, 0.75); border-radius: 50%; pointer-events: none; }
.k-shell .k-toast { border-radius: 14px !important; background: #7a9e7e !important; color: #fff4e3 !important; font-weight: 700; box-shadow: inset 0 0 0 2px #5f8263, 0 8px 18px rgba(40, 18, 8, 0.35) !important; }
.nw-alt { min-height: 46px !important; font-size: 14px !important; }
.k-title .nw-alt { min-width: min(240px, 100%); color: #fff4e3 !important; background: rgba(74, 40, 22, 0.5) !important; }
</style>
</head>
<body>
<canvas id="game" aria-label="Napwalk: swipe or use the arrow keys to move every cat one step; Z undoes, R restarts the room, H shows a hint."></canvas>
<script src="../../hub/sdk.js"></script>
<script src="../../hub/kit.js"></script>
<script>
(() => {
  'use strict';
  Arcade.init({ id: 'napwalk', title: 'Napwalk', version: '1.0.0' });
  const { gfx, fx, clamp, lerp } = Kit;
  const TAU = Math.PI * 2, PI = Math.PI;
  const FD = '"Unbounded", ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif';
  const FB = '"Figtree", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif';
  const reduced = !!(Kit.reducedMotion || fx.reduced);

  const view = Kit.view(document.getElementById('game'), { alpha: false });
  const ctx = view.ctx;

  /* ================================================================ palette */
  const pal = {};
  let dark = false;
  const SKY = [];
  function readPalette() {
    for (const k of ['bg1', 'bg2', 'bg3', 'paper', 'wall', 'leaf', 'floor1', 'floor2', 'cap', 'beam', 'cream', 'ink']) pal[k] = Kit.css('--' + k);
    dark = Kit.isDark();
    SKY.length = 0; SKY.push(pal.bg1, pal.bg2, pal.bg3);
    gfx.clearSprites && gfx.clearSprites('nw');
    dirtyStatic = true;
  }
  let dirtyStatic = true;

  /* ================================================================ cats and coats */
  const COATS = {
    ginger: { base: '#e8954a', dark: '#b8611f', light: '#f6c48c', belly: '#fbe3c4', eye: '#7bb35a', pat: 'tabby', cush: ['#f0a462', '#d9803c'] },
    grey: { base: '#9ca4ae', dark: '#68707b', light: '#c9cfd6', belly: '#e6e9ed', eye: '#e8b83a', pat: 'tabby', cush: ['#a9b4c4', '#7f8c9e'] },
    black: { base: '#34303a', dark: '#1d1a21', light: '#4f4957', belly: '#f4efe6', eye: '#a6e36a', pat: 'tux', cush: ['#5a4a66', '#3e3249'] },
    calico: { base: '#f6eee2', dark: '#cdbda9', light: '#fffaf2', belly: '#fffaf2', eye: '#e0a03a', pat: 'calico', p1: '#e08a3a', p2: '#3a3236', cush: ['#f2d7b6', '#e0a46a'] },
    white: { base: '#f7f3ec', dark: '#cfc7bb', light: '#ffffff', belly: '#ffffff', eye: '#6cb6e8', pat: 'plain', cush: ['#cfe3ee', '#9ec2d8'] },
  };
  const COAT_LIST = ['ginger', 'grey', 'black', 'calico', 'white'];
  const NEUTRAL_CUSH = [['#e9a3a0', '#cf7d7a'], ['#e7c46d', '#c99c3c'], ['#a7c4a0', '#7f9f78']];

  /* ================================================================ rules: one step() for play, solver and tests */
  const DIRN = ['up', 'right', 'down', 'left'];
  const DXY = { up: [0, -1], right: [1, 0], down: [0, 1], left: [-1, 0] };
  // cell: 0 floor, 1 furniture, 2 rug. door[i] = paired cell index or -1. cush[i] = cushion index or -1.
  function blank(W, H) {
    return { W, H, cell: new Uint8Array(W * H), door: new Int16Array(W * H).fill(-1), cush: new Int8Array(W * H).fill(-1),
      furn: [], rugs: [], doors: [], cushions: [], cats: [], yarn: [], matched: false, win: 2, pic: -1 };
  }
  function addFurn(R, type, x, y, w, h, v) {
    R.furn.push({ type, x, y, w, h, v: v || 0 });
    for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) R.cell[j * R.W + i] = 1;
  }
  function addRug(R, x, y, w, h, v) {
    R.rugs.push({ x, y, w, h, v: v || 0 });
    for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) R.cell[j * R.W + i] = 2;
  }
  function addDoor(R, a, b) { R.door[a] = b; R.door[b] = a; R.doors.push({ a, b, c: R.doors.length }); }
  function addCush(R, x, y, coat, v) { R.cush[y * R.W + x] = R.cushions.length; R.cushions.push({ x, y, coat, v: v || 0 }); }
  function initState(R) {
    return { c: R.cats.map(c => ({ x: c.x, y: c.y, sl: 0, sk: 0 })), y: R.yarn.map(p => ({ x: p.x, y: p.y })) };
  }
  const isDone = s => s.c.every(c => c.sl);
  function key(R, s) {
    let k = 0;
    for (const c of s.c) k = k * 243 + (c.y * R.W + c.x) * 3 + (c.sl ? 1 : c.sk ? 2 : 0);
    for (const p of s.y) k = k * 81 + p.y * R.W + p.x;
    return k;
  }
  // Every awake cat steps one tile in dir. Leading edge first: a cat blocked by a wall, furniture, a sleeping cat or a
  // blocked cat stays put. Rugs slide a cat until it leaves the rug; yarn rolls on and the cat skips the next swipe;
  // a tunnel moves a cat to its twin. A cat on its own cushion (any cushion in early rooms) falls asleep.
  // core() is the one rule implementation: play, the solver, hints and tests all go through it.
  // P: cat cell indices, F: 0 awake / 1 asleep / 2 skips the next swipe, Y: yarn cell indices. Mutated in place.
  const OCC = new Int8Array(256).fill(-1), OCCY = new Int8Array(256).fill(-1), ORD = new Int8Array(8), PRJ = new Int16Array(8);
  function core(R, P, F, Y, dir, ev) {
    const W = R.W, H = R.H, dx = DXY[dir][0], dy = DXY[dir][1], n = P.length, m = Y.length, cell = R.cell, door = R.door, cush = R.cush;
    for (let i = 0; i < n; i++) { OCC[P[i]] = i; ORD[i] = i; PRJ[i] = (P[i] % W) * dx + ((P[i] / W) | 0) * dy; }
    for (let j = 0; j < m; j++) OCCY[Y[j]] = j;
    for (let a = 1; a < n; a++) { const v = ORD[a]; let b = a - 1; while (b >= 0 && PRJ[ORD[b]] < PRJ[v]) { ORD[b + 1] = ORD[b]; b--; } ORD[b + 1] = v; }
    for (let k = 0; k < n; k++) {
      const i = ORD[k];
      if (F[i] === 1) continue;
      if (F[i] === 2) { F[i] = 0; if (ev) ev.push({ i, type: 'skip' }); continue; }
      let x = P[i] % W, y = (P[i] / W) | 0;
      const path = ev ? [] : null;
      let blockedBy = null, steps = 0;
      for (let guard = 0; guard < 40; guard++) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) { blockedBy = 'wall'; break; }
        const ni = ny * W + nx;
        if (cell[ni] === 1) { blockedBy = 'furn'; break; }
        if (OCC[ni] >= 0) { blockedBy = F[OCC[ni]] === 1 ? 'sleeper' : 'cat'; break; }
        const dj = door[ni];
        if (dj >= 0 && (OCC[dj] >= 0 || OCCY[dj] >= 0)) { blockedBy = 'door'; break; }
        const yj = OCCY[ni];
        let batted = false;
        if (yj >= 0) {
          const tx = nx + dx, ty = ny + dy, ti = ty * W + tx;
          if (tx < 0 || ty < 0 || tx >= W || ty >= H || cell[ti] === 1 || OCC[ti] >= 0 || OCCY[ti] >= 0 || cush[ti] >= 0 || door[ti] >= 0) { blockedBy = 'yarn'; break; }
          OCCY[ni] = -1; OCCY[ti] = yj; Y[yj] = ti; batted = true;
          if (ev) ev.push({ i: yj, type: 'yarn', cat: i, fx: nx, fy: ny, tx, ty, at: steps });
        }
        OCC[y * W + x] = -1; x = nx; y = ny; OCC[ni] = i; steps++;
        if (ev) path.push({ x: nx, y: ny, rug: cell[ni] === 2 });
        if (batted) { F[i] = 2; if (ev) path[path.length - 1].yarn = true; break; }
        if (dj >= 0) { OCC[ni] = -1; x = dj % W; y = (dj / W) | 0; OCC[dj] = i; if (ev) path.push({ x, y, tp: true }); break; }
        const ci = cush[ni];
        if (ci >= 0 && (!R.matched || R.cushions[ci].coat === R.cats[i].coat)) { F[i] = 1; break; }
        if (cell[ni] !== 2) break;
      }
      P[i] = y * W + x;
      if (ev) {
        const by = blockedBy ? { kind: blockedBy, x: x + dx, y: y + dy } : null;
        ev.push(steps ? { i, type: 'move', path, sl: F[i] === 1 ? 1 : 0, blockedBy: by } : { i, type: 'bonk', blockedBy: by });
      }
    }
    for (let i = 0; i < n; i++) OCC[P[i]] = -1;
    for (let j = 0; j < m; j++) OCCY[Y[j]] = -1;
  }
  function step(R, s, dir, ev) {
    const W = R.W, n = s.c.length, m = s.y.length;
    const P = new Int16Array(n), F = new Int8Array(n), Y = new Int16Array(m);
    for (let i = 0; i < n; i++) { const c = s.c[i]; P[i] = c.y * W + c.x; F[i] = c.sl ? 1 : c.sk ? 2 : 0; }
    for (let j = 0; j < m; j++) Y[j] = s.y[j].y * W + s.y[j].x;
    core(R, P, F, Y, dir, ev);
    const c = [], y = [];
    for (let i = 0; i < n; i++) c.push({ x: P[i] % W, y: (P[i] / W) | 0, sl: F[i] === 1 ? 1 : 0, sk: F[i] === 2 ? 1 : 0 });
    for (let j = 0; j < m; j++) y.push({ x: Y[j] % W, y: (Y[j] / W) | 0 });
    return { c, y };
  }
  // Breadth-first search over joint states for the optimal swipe sequence. null = no solution; { over } = capped.
  // States live only as their keys (cats: cell*3+flag in base 243, yarn: cell in base 81) and are decoded on the fly.
  function solve(R, s0, cap) {
    if (isDone(s0)) return { path: [], n: 1 };
    const n = s0.c.length, m = s0.y.length;
    const BP = new Int16Array(n), BF = new Int8Array(n), BY = new Int16Array(m), P = new Int16Array(n), F = new Int8Array(n), Y = new Int16Array(m);
    const k0 = key(R, s0);
    const keys = [k0], parent = [-1], dirs = [-1], seen = new Map([[k0, 0]]);
    for (let h = 0; h < keys.length; h++) {
      let k = keys[h];
      for (let j = m - 1; j >= 0; j--) { const r = k % 81; BY[j] = r; k = (k - r) / 81; }
      for (let i = n - 1; i >= 0; i--) { const r = k % 243; BF[i] = r % 3; BP[i] = (r - BF[i]) / 3; k = (k - r) / 243; }
      for (let d = 0; d < 4; d++) {
        P.set(BP); F.set(BF); Y.set(BY);
        core(R, P, F, Y, DIRN[d]);
        let nk = 0, done = true;
        for (let i = 0; i < n; i++) { nk = nk * 243 + P[i] * 3 + F[i]; if (F[i] !== 1) done = false; }
        for (let j = 0; j < m; j++) nk = nk * 81 + Y[j];
        if (seen.has(nk)) continue;
        seen.set(nk, keys.length); keys.push(nk); parent.push(h); dirs.push(d);
        if (done) {
          const path = [];
          for (let j = keys.length - 1; j > 0; j = parent[j]) path.push(dirs[j]);
          path.reverse();
          return { path, n: keys.length };
        }
        if (keys.length > cap) return { over: true, n: keys.length };
      }
    }
    return null;
  }

  /* ================================================================ rooms: two hand-made, then generated from seed */
  function handRoom(n) {
    const R = blank(6, 8);
    R.n = n;
    if (n === 1) {
      addFurn(R, 'bookcase', 0, 0, 2, 1, 1);
      addFurn(R, 'plant', 4, 2, 1, 1, 0);
      addFurn(R, 'armchair', 5, 7, 1, 1, 2);
      addCush(R, 1, 4, null, 0); addCush(R, 3, 3, null, 1);
      R.cats.push({ x: 1, y: 5, coat: 'ginger' }, { x: 4, y: 6, coat: 'grey' });
      R.win = 3; R.pic = 0;
    } else {
      addFurn(R, 'bookcase', 4, 0, 2, 1, 2);
      addFurn(R, 'plant', 5, 5, 1, 1, 1);
      addFurn(R, 'sofa', 2, 7, 3, 1, 0);
      addCush(R, 0, 2, null, 2); addCush(R, 1, 2, null, 0);
      R.cats.push({ x: 2, y: 5, coat: 'calico' }, { x: 4, y: 5, coat: 'black' });
      R.win = 1; R.pic = 3;
    }
    return R;
  }
  function roomSpec(n) {
    const sp = { n, W: 6, H: 8, cats: 2, matched: false, rugs: 0, yarn: 0, doors: 0, furn: [3, 6], band: [3, 6] };
    if (n <= 10) { const lo = 3 + Math.floor((n - 3) / 3); sp.band = [lo, lo + 3]; }
    else if (n <= 20) { sp.cats = 3; sp.matched = true; const lo = 5 + Math.floor((n - 11) / 3); sp.band = [lo, lo + 4]; sp.furn = [4, 8]; }
    else if (n <= 30) { sp.cats = 3; sp.matched = true; sp.rugs = n >= 26 ? 2 : 1; const lo = 6 + Math.floor((n - 21) / 3); sp.band = [lo, lo + 5]; sp.furn = [3, 7]; }
    else if (n <= 40) { sp.cats = 3; sp.matched = true; sp.rugs = 1; sp.yarn = n >= 36 ? 2 : 1; const lo = 7 + Math.floor((n - 31) / 3); sp.band = [lo, lo + 5]; sp.furn = [3, 7]; }
    else if (n <= 50) { sp.W = 7; sp.H = 9; sp.cats = 4; sp.matched = true; sp.doors = 1; sp.rugs = n >= 45 ? 1 : 0; sp.yarn = n >= 48 ? 1 : 0; const lo = 8 + Math.floor((n - 41) / 5); sp.band = [lo, lo + 5]; sp.furn = [6, 12]; }
    else {
      const r = Kit.rng(n * 31 + 7);
      sp.W = 7; sp.H = 9; sp.matched = true;
      sp.cats = n > 60 && r.chance(0.2) ? 5 : 4;
      const pick = r.int(0, 5);
      sp.rugs = [1, 0, 1, 1, 0, 2][pick]; sp.yarn = [1, 1, 0, 2, 1, 0][pick]; sp.doors = [0, 1, 1, 0, 1, 1][pick];
      const lo = Math.min(12, 9 + Math.floor((n - 51) / 12)); sp.band = [lo, lo + 7]; sp.furn = [6, 12];
    }
    return sp;
  }
  const FURN_T = [
    { type: 'sofa', w: 3, h: 1, wt: 2 }, { type: 'sofa', w: 2, h: 1, wt: 2 }, { type: 'armchair', w: 1, h: 1, wt: 3 },
    { type: 'plant', w: 1, h: 1, wt: 4 }, { type: 'bookcase', w: 2, h: 1, top: true, wt: 3 }, { type: 'table', w: 2, h: 2, wt: 1 },
    { type: 'table', w: 2, h: 1, wt: 2 }, { type: 'lamp', w: 1, h: 1, wt: 2 },
  ];
  const FURN_WT = FURN_T.reduce((a, f) => a + f.wt, 0);
  function attempt(sp, rng) {
    const R = blank(sp.W, sp.H), W = sp.W, H = sp.H;
    R.n = sp.n; R.matched = sp.matched;
    const free = (x, y, w, h) => {
      if (x < 0 || y < 0 || x + w > W || y + h > H) return false;
      for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) { const k = j * W + i; if (R.cell[k] !== 0 || R.door[k] >= 0 || R.cush[k] >= 0) return false; }
      return true;
    };
    for (let k = 0; k < sp.rugs; k++) for (let t = 0; t < 30; t++) {
      const rw = rng.int(2, 3), rh = rng.int(2, 4), x = rng.int(0, W - rw), y = rng.int(1, H - rh);
      if (free(x, y, rw, rh)) { addRug(R, x, y, rw, rh, rng.int(0, 2)); break; }
    }
    const target = rng.int(sp.furn[0], sp.furn[1]);
    let cells = 0;
    for (let t = 0; t < 80 && cells < target; t++) {
      let r = rng.next() * FURN_WT, f = FURN_T[0];
      for (const ft of FURN_T) { r -= ft.wt; if (r <= 0) { f = ft; break; } }
      const x = rng.int(0, W - f.w), y = f.top ? 0 : rng.int(0, H - f.h);
      if (f.top && R.furn.some(o => o.type === 'bookcase')) continue;
      if (free(x, y, f.w, f.h)) { addFurn(R, f.type, x, y, f.w, f.h, rng.int(0, 2)); cells += f.w * f.h; }
    }
    const floor = () => { const out = []; for (let i = 0; i < W * H; i++) if (R.cell[i] === 0 && R.door[i] < 0 && R.cush[i] < 0) out.push(i); return out; };
    for (let k = 0; k < sp.doors; k++) {
      const fl = rng.shuffle(floor());
      let done = false;

      const x = (s - 1) * 58, y = -ch / 2 + 112;
      ctx.fillStyle = dark ? 'rgba(255,255,255,0.08)' : 'rgba(74,47,37,0.1)';
      ctx.beginPath(); ctx.arc(x, y, 24, 0, TAU); ctx.fill();
      pawPrint(ctx, x, y + 2, 15, 0, dark ? 'rgba(255,255,255,0.14)' : 'rgba(74,47,37,0.16)');
      if (s < C.stamped && s < C.stars) {
        const age = s === C.stamped - 1 && stampFx ? stampFx.t : 1;
        const sc = age < 0.18 ? 2 - Kit.ease.cubicOut(age / 0.18) : 1;
        ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
        ctx.fillStyle = '#d7a443'; ctx.beginPath(); ctx.arc(0, 0, 24, 0, TAU); ctx.fill();
        ctx.setLineDash([3, 3]); ctx.strokeStyle = '#fff4e3'; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.arc(0, 0, 19, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
        pawPrint(ctx, 0, 2, 15, 0, '#fff4e3');
        ctx.restore();
      }
    }
    ctx.font = `600 14px ${FB}`; ctx.fillStyle = ink;
    const note = C.moves + ' moves · par ' + C.par + (G.hinted ? ' · hinted' : '');
    ctx.fillText(note, 0, -ch / 2 + 152);
    // buttons
    const bw2 = (cw - 60) / 2, bh = 46, by = ch / 2 - 30 - bh / 2 + 4;
    C.btns = [
      { id: 'replay', x: cx - cw / 2 + 24, y: cy + by - bh / 2, w: bw2 - 4, h: bh },
      { id: 'next', x: cx + 4 + 2, y: cy + by - bh / 2, w: bw2 + 10, h: bh },
    ];
    const bx0 = -cw / 2 + 24;
    ctx.fillStyle = dark ? '#4f3a52' : '#efdcc0'; gfx.roundRect(ctx, bx0, by - bh / 2, bw2 - 4, bh, 23).fill();
    ctx.setLineDash([3, 3]); ctx.strokeStyle = soft; ctx.lineWidth = 1.2; gfx.roundRect(ctx, bx0 + 4, by - bh / 2 + 4, bw2 - 12, bh - 8, 19).stroke(); ctx.setLineDash([]);
    ctx.font = `700 15px ${FB}`; ctx.fillStyle = ink; ctx.fillText('Replay', bx0 + (bw2 - 4) / 2, by + 1);
    const nb = 6, glow = 0.5 + 0.5 * Math.sin(time * 4);
    ctx.fillStyle = '#a84f2c'; gfx.roundRect(ctx, nb, by - bh / 2 + 3, bw2 + 10, bh, 23).fill();
    ctx.fillStyle = '#c8643b'; gfx.roundRect(ctx, nb, by - bh / 2, bw2 + 10, bh, 23).fill();

  /* ================================================================ loop, input, shell */
  const loop = Kit.loop({ view, update, draw });

  function hitButton(x, y) {
    if (!G || G.mode !== 'play' || G.card) return null;
    for (const b of L.btns) if (Kit.dist(x, y, b.x, b.y) <= b.r + 12) return b.id;
    return null;
  }
  input.on('down', p => { if (shell.phase !== 'play' || !G) return; pressBtn = hitButton(p.x, p.y); });
  input.on('swipe', p => { if (shell.phase !== 'play' || !G) return; pressBtn = null; onSwipe(p.dir); });
  input.on('up', p => {
    if (shell.phase !== 'play' || !G) return;
    const dx = p.x - p.sx, dy = p.y - p.sy, d = Math.hypot(dx, dy);
    const was = pressBtn; pressBtn = null;
    if (p.swiped) return;
    if (d >= 24) { onSwipe(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up')); return; }
    if (d < 16) onTap(p.x, p.y, was);
  });
  function onTap(x, y, was) {
    if (G.card) {
      if (G.card.t < 0.55) return;
      for (const b of G.card.btns) if (x >= b.x - 6 && x <= b.x + b.w + 6 && y >= b.y - 6 && y <= b.y + b.h + 6) { if (b.id === 'next') nextRoom(); else replayRoom(); return; }
      return;
    }
    const b = hitButton(x, y);
    if (b) { sfx('nw_tap'); haptic(6); if (b === 'undo') undo(); else if (b === 'restart') restartRoom(); else hint(); return; }
    // tap a cat: it looks up and mrrps
    const gx = (x - L.ox) / L.t, gy = (y - L.oy) / L.t;
    for (const c of G.cats) if (Math.abs(c.x + 0.5 - gx) < 0.55 && Math.abs(c.y + 0.35 - gy) < 0.6) {

      const q = tileC(c.x + 0.5, c.y); hearts.push({ x: q.x, y: q.y, vy: -40, t: 0, s: 0.8, ph: 0, life: 1.1 });

  }

  /* ================================================================ test hook */
  function stepSeconds(sec) { loop.step(Math.max(1, Math.round(sec * 60))); }
  function snap() {
    if (!G) return;
    for (let k = 0; k < 400 && (busy() || G.timers.length); k++) loop.step(1);
  }
  const api = {
    seed(n) { fx.seed(n); },
    room(n) { nextStart = { room: n }; if (shell.phase === 'play') { nextStart = null; loadRoom(n, 'play'); } },
    startAt(n) { nextStart = { room: n }; if (shell.phase === 'play' || shell.phase === 'paused') shell.restart(); else shell.start(); },
    swipe(dir) { if (!G) return null; snap(); if (G.card) return null; doMove(dir); return api.info(); },
    press(dir) { onSwipe(dir); },
    undo() { snap(); undo(); return api.info(); },
    restartRoom() { snap(); restartRoom(); return api.info(); },
    hint() { snap(); hint(); return G ? G.hintDir : null; },
    solution() { if (!G) return null; const r = solve(G.R, G.s, 200000); return r && r.path ? r.path.map(d => DIRN[d]) : null; },
    win() { if (!G || G.clear) return false; const sol = api.solution(); if (!sol) return false; for (const d of sol) { snap(); doMove(d); } snap(); stepSeconds(1.6); return !!G.card; },
    next() { if (G && G.card) { G.card.t = 1; nextRoom(); } return api.info(); },
    replay() { if (G && G.card) { G.card.t = 1; replayRoom(); } return api.info(); },
    forfeit() { shell.restart(); },
    end() { endSession(); },
    step: stepSeconds,
    frames(n) { loop.step(n); },
    settle: snap,
    gen(n) { roomCache.delete(n); const t0 = performance.now(); const R = getRoom(n); const j = judge(R); return { n, par: R.par, ms: Math.round(performance.now() - t0), cats: R.cats.length, W: R.W, H: R.H, rugs: R.rugs.length, yarn: R.yarn.length, doors: R.doors.length, every2: j && j.every2, dirsOk: j && j.dirsOk, band: n > 2 ? roomSpec(n).band : null }; },
    load(def) {
      // a hand-made room for rules tests: { W, H, furn: [[x,y,w,h]], rugs: [[x,y,w,h]], doors: [[ax,ay,bx,by]], cushions: [[x,y,coat]], cats: [[x,y,coat]], yarn: [[x,y]], matched }
      const R = blank(def.W || 6, def.H || 8);
      R.n = 999; R.matched = !!def.matched;
      (def.furn || []).forEach(f => addFurn(R, 'table', f[0], f[1], f[2] || 1, f[3] || 1, 0));
      (def.rugs || []).forEach(r => addRug(R, r[0], r[1], r[2], r[3], 0));
      (def.doors || []).forEach(d => addDoor(R, d[1] * R.W + d[0], d[3] * R.W + d[2]));
      (def.cushions || []).forEach(c => addCush(R, c[0], c[1], c[2] || null, 0));
      (def.cats || []).forEach(c => R.cats.push({ x: c[0], y: c[1], coat: c[2] || 'ginger' }));
      (def.yarn || []).forEach(y => R.yarn.push({ x: y[0], y: y[1], v: 0 }));
      const j = solve(R, initState(R), 200000);
      R.par = j && j.path ? j.path.length : 0; R.sol = j && j.path ? j.path : [];
      roomCache.set(999, R);
      loadRoom(999, 'play');
      snap();
      return api.info();
    },
    clearSave() { freshStart(); Kit.save.set('taught', false); },
    toClient(gx, gy) { const r = view.canvas.getBoundingClientRect(); return { x: r.left + L.ox + gx * L.t, y: r.top + L.oy + gy * L.t }; },
    buttons() { const r = view.canvas.getBoundingClientRect(); return L.btns.map(b => ({ id: b.id, x: r.left + b.x, y: r.top + b.y, r: b.r })); },
    cardButtons() { const r = view.canvas.getBoundingClientRect(); return G && G.card ? G.card.btns.map(b => ({ id: b.id, x: r.left + b.x + b.w / 2, y: r.top + b.y + b.h / 2 })) : []; },
    info: () => (G ? {
      mode: G.mode, room: G.n, moves: G.hist.length, par: G.R.par, W: G.R.W, H: G.R.H, matched: G.R.matched, cleared: !!G.card, clearing: !!G.clear,

      cats: G.s.c.map((c, i) => ({ x: c.x, y: c.y, sl: c.sl, sk: c.sk, coat: G.R.cats[i].coat })), yarn: G.s.y.map(p => ({ x: p.x, y: p.y })),
      rugs: G.R.rugs.length, doors: G.R.doors.length, run: runSave(), sol: G.R.sol ? G.R.sol.map(d => DIRN[d]) : null,

  function artRoom(wide) {

      R.cats.push({ x: 2, y: 1, coat: 'ginger' }, { x: 6, y: 3, coat: 'calico' }, { x: 3, y: 3, coat: 'black' }, { x: 5, y: 1, coat: 'grey' });

      R.cats.push({ x: 1, y: 1, coat: 'ginger' }, { x: 4, y: 4, coat: 'calico' }, { x: 2, y: 4, coat: 'black' }, { x: 4, y: 1, coat: 'grey' });
      R.yarn.push({ x: 3, y: 5, v: 1 });
      R.win = 1; R.pic = 4;
    }
    R.par = 3; R.sol = [];
    return R;
  }
  function scene(roomN, setup) {
    fx.seed(roomN + 3);
    nextStart = { room: roomN };
    shell.start();
    G.silent = true;
    stepSeconds(1.2);
    if (setup) setup();
    loop.stop();
  }
  Arcade.scenes({
    art: () => {
      const wide = view.w > view.h;
      const R = artRoom(wide);
      roomCache.set(1000, R);
      scene(1000, () => {
        // two cats already asleep, one mid-hop
        G.s.c[0].sl = 1; G.s.c[1].sl = 1;
        for (const k of [0, 1]) { const c = G.cats[k]; c.pose = 'curl'; c.curl = 1; c.sleepT = 9; }
        G.cats[2].face = 'right'; G.cats[3].face = 'down';
        spawnZ(G.cats[0], 0); spawnZ(G.cats[1], 0);
        stepSeconds(1.1);
        const c = G.cats[2];
        c.segs.push({ type: 'hop', dur: HOP, fx: c.x, fy: c.y, tx: c.x + 1, ty: c.y });
        loop.step(5);
      });
    },
    shot1: () => scene(1, () => { G.silent = true; stepSeconds(1.12); }),
    shot2: () => scene(34, () => {
      const sol = G.R.sol.slice();
      for (let k = 0; k < Math.min(3, sol.length - 2); k++) { snap(); doMove(DIRN[sol[k]]); }
      snap();
      hint();
      stepSeconds(0.9);
    }),
  });

  /* ================================================================ boot */
  readPalette();
  Kit.onTheme(() => { readPalette(); feltPat = null; loop.render(); });
  layout();
  if (!Kit.keyart) loadRoom(24, 'attract');
  else loadRoom(1, 'attract');
  loop.step(60);
  Kit.music.play(SONG);
  loop.start();
})();
</script>
