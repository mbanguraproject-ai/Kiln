<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Scrapwing</title>
<meta name="description" content="Scrapwing: shoot down raiders in a scrapyard nebula and bolt their guns onto your hull. Lose them and you fly bare.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Unbounded:wght@600;800&display=swap">
<style>
/* Scrapyard nebula: the world keeps one warm palette in both themes; the salvage-plate menus switch. */
:root {
  --void: #2a0f2e; --gas: #8a2f4a; --lane: #f08a3c; --wreck: #140812;
  --reactor: #5ff2ff; --blaster: #ffd23f; --fan: #2ec4b6; --seeker: #ff4f8b; --plate: #6b6f7a;
  --cream: #ffe9c8; --amber: #ffb347; --hazard: #f5a623;
  --panel: #e9e2d8; --panel-2: #f6f0e7; --ink: #241820; --ink-soft: #5e4b55; --rim: #2b2129; --bolt: #8b8790;
  --scrim: rgba(30, 10, 28, 0.55);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --panel: #221923; --panel-2: #2f2430; --ink: #ffe9c8; --ink-soft: #d0b29f; --rim: #4a3b48; --bolt: #9a939c;
    --scrim: rgba(16, 4, 16, 0.62);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --panel: #221923; --panel-2: #2f2430; --ink: #ffe9c8; --ink-soft: #d0b29f; --rim: #4a3b48; --bolt: #9a939c;
  --scrim: rgba(16, 4, 16, 0.62);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; background: var(--void); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: var(--void); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
#game { display: block; width: 100%; height: 100%; outline: none; touch-action: none; cursor: crosshair; }

/* ---- Kit shell, re-skinned as riveted salvage plates with hazard stripes ---- */
.k-shell .k-title-h { text-transform: uppercase; letter-spacing: .02em !important; color: var(--cream) !important; text-shadow: 3px 3px 0 #c2410c, 6px 6px 0 rgba(20, 8, 18, .55) !important; }
.k-shell .k-title-head::after { content: ""; display: block; width: min(260px, 70%); height: 10px; margin-top: 4px; align-self: inherit; border-radius: 2px;
  background: repeating-linear-gradient(-45deg, var(--hazard) 0 9px, #1d1218 9px 18px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
.k-shell .k-kicker { color: var(--amber) !important; letter-spacing: .32em; }
.k-shell .k-tagline { color: #f3d9c2 !important; text-shadow: 0 2px 10px rgba(20, 6, 18, .8); }
.k-shell .k-best { color: #f3d9c2 !important; }
.k-shell .k-best b { color: var(--cream) !important; }
.k-shell .k-panel { border: 2px solid var(--rim); padding-top: 36px !important;
  background: linear-gradient(180deg, var(--panel-2), var(--panel)) !important;
  box-shadow: 0 30px 70px -24px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.12), inset 0 -3px 0 rgba(0,0,0,.18) !important; }
.k-shell .k-panel::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 14px; border-radius: calc(var(--k-radius) - 2px) calc(var(--k-radius) - 2px) 0 0;
  background: repeating-linear-gradient(-45deg, var(--hazard) 0 10px, #1d1218 10px 20px); box-shadow: inset 0 -2px 0 rgba(0,0,0,.35); }
.k-shell .k-panel::after { content: ""; position: absolute; inset: 22px 9px 9px 9px; pointer-events: none;
  background:
    radial-gradient(circle at 5px 5px, #d9d4cf 0 1.6px, var(--bolt) 2px 3.4px, rgba(0,0,0,.35) 3.8px, transparent 4.6px) 0 0 / 10px 10px no-repeat,
    radial-gradient(circle at 5px 5px, #d9d4cf 0 1.6px, var(--bolt) 2px 3.4px, rgba(0,0,0,.35) 3.8px, transparent 4.6px) 100% 0 / 10px 10px no-repeat,
    radial-gradient(circle at 5px 5px, #d9d4cf 0 1.6px, var(--bolt) 2px 3.4px, rgba(0,0,0,.35) 3.8px, transparent 4.6px) 0 100% / 10px 10px no-repeat,
    radial-gradient(circle at 5px 5px, #d9d4cf 0 1.6px, var(--bolt) 2px 3.4px, rgba(0,0,0,.35) 3.8px, transparent 4.6px) 100% 100% / 10px 10px no-repeat; }
.k-shell .k-panel h2, .k-shell .k-eyebrow { text-transform: uppercase; letter-spacing: .14em; }
.k-shell .k-btn { text-transform: uppercase; letter-spacing: .08em; font-weight: 800; }
.k-shell .k-btn.k-primary { background: linear-gradient(180deg, #ffc35a, #f08a3c) !important; color: #2a0f12 !important; }
.k-shell .k-stat { background: rgba(127, 110, 120, .14) !important; border-left: 3px solid var(--hazard); }
.k-shell .k-newbest { background: repeating-linear-gradient(-45deg, var(--hazard) 0 8px, #ffd27a 8px 16px) !important; color: #24120e !important; }
.k-shell .k-pausebtn { background: linear-gradient(180deg, #4a4350, #2a242e) !important; color: var(--cream) !important; border-radius: 6px !important;
  box-shadow: inset 0 0 0 1.5px #6c6370, inset 0 -3px 0 rgba(0,0,0,.35), 0 4px 12px rgba(0,0,0,.4) !important; }
.k-shell .k-toast { border-radius: 4px !important; background: #2a222c !important; color: var(--cream) !important; text-transform: uppercase; letter-spacing: .12em; font-size: 13px;
  box-shadow: inset 0 0 0 1.5px #6c6370, 0 8px 20px rgba(0,0,0,.4) !important; }
.sw-alt { min-height: 46px !important; font-size: 14px !important; }
.k-title .sw-alt { min-width: min(220px, 100%); color: var(--cream) !important; box-shadow: inset 0 0 0 2px rgba(255, 233, 200, .45) !important; background: rgba(30, 10, 28, .45) !important; }
</style>
</head>
<body>
<canvas id="game" aria-label="Scrapwing: drag anywhere or use the arrow keys to fly; your ship fires on its own. Catch falling parts to bolt them on."></canvas>
<script src="../../hub/sdk.js"></script>
<script src="../../hub/kit.js"></script>
<script>
(() => {
  'use strict';
  Arcade.init({ id: 'scrapwing', title: 'Scrapwing', version: '1.0.0' });
  const { gfx, fx, cam, clamp, lerp } = Kit;
  const TAU = Math.PI * 2, PI = Math.PI;

  /* ================================================================ palette */
  const C = {
    void: '#2a0f2e', gas: '#8a2f4a', lane: '#f08a3c', wreck: '#140812', reactor: '#5ff2ff',
    blaster: '#ffd23f', fan: '#2ec4b6', seeker: '#ff4f8b', plate: '#6b6f7a',
    cream: '#ffe9c8', amber: '#ffb347', ember: '#ff7a2f', hull: '#1d1224', hull2: '#2c1c38', rim: '#ffa15a',
    threat: '#ff4f8b', hot: '#fff6f0', steel: '#a7adb8', steelDark: '#4b4f5a', gold: '#ffcf5a', hazard: '#f5a623',
  };
  const TCOL = { blaster: C.blaster, fan: C.fan, seeker: C.seeker, plate: '#b9bec8' };
  // Each sector has its own sky, nebula gas and far body, so a long run travels somewhere:
  // neb = [gas, dark lanes, glow lanes, hot streaks], dust = mote tint, body = the far object.
  const SECTORS = [
    { name: 'The Scrapyard', intro: 'Drones and raiders', sky: ['#2a0f2e', '#4c1538', '#6e2340'], tint: '#f08a3c', neb: ['#8a2f4a', '#120514', '#f08a3c', '#ff9f6a'], dust: '#ffb27a', body: 'giant' },
    { name: 'Sweeper Lanes', intro: 'Sweepers cross low', sky: ['#2a0a12', '#5c1422', '#8c2a20'], tint: '#ff6a3a', neb: ['#9c2a28', '#160506', '#ff7038', '#ffb070'], dust: '#ff9a6a', body: 'giant' },
    { name: 'Minefield Drift', intro: 'Mines burst into rings', sky: ['#04161e', '#0b2f3a', '#175056'], tint: '#5fe0c8', neb: ['#1c6a70', '#02080c', '#46d0bc', '#b8fff0'], dust: '#a8fff0', body: 'ice' },
    { name: 'The Gates', intro: 'Laser gates: move when they glow', sky: ['#1c0626', '#44104a', '#7a1a5a'], tint: '#ff5fa0', neb: ['#a02a7a', '#0e0412', '#ff5f9a', '#ffb0d0'], dust: '#ffb0d8', body: 'station' },
    { name: 'Carrier Wake', intro: 'Carriers: shields face down', sky: ['#130b2c', '#2c1c58', '#55387a'], tint: '#b48cff', neb: ['#5a3a9a', '#08051a', '#b890ff', '#ffd0f0'], dust: '#d8c0ff', body: 'station' },
    { name: 'Splinter Field', intro: 'Splitters break apart', sky: ['#261206', '#56290e', '#8a4a18'], tint: '#ffb050', neb: ['#a0522a', '#140804', '#ffb050', '#ffe0a0'], dust: '#ffd090', body: 'moon', debris: true },
    { name: 'Sniper Alley', intro: 'Snipers aim at your parts', sky: ['#10050e', '#2c0816', '#5a0e1e'], tint: '#ff4a5a', neb: ['#7a1a2a', '#050204', '#ff5a60', '#ffe0e0'], dust: '#ffd0d0', body: 'moon', debris: true },
    { name: 'The Dead Fleet', intro: 'Everything at once', sky: ['#0c0e08', '#20241a', '#3c3820'], tint: '#d0c060', neb: ['#4c5a2a', '#060804', '#d0c060', '#f0f0b0'], dust: '#e8e0a0', body: 'eclipse', debris: true },
  ];
  let palSi = 0; // the sector whose palette the painted layers use
  const PAL = () => SECTORS[palSi];

  /* ================================================================ view and field */
  const view = Kit.view(document.getElementById('game'), { alpha: false });
  const ctx = view.ctx;
  let zoom = 1, FW = 380, FH = 700, fieldL = 0;
  let G = null;
  function fit() {
    zoom = clamp(Math.min(view.w / 380, view.h / 680), 0.7, 1.6);
    FW = Math.min(view.w / zoom, 620);
    FH = view.h / zoom;
    cam.zoom = zoom; cam.x = FW / 2; cam.y = FH / 2;
    fieldL = view.w / 2 - (FW / 2) * zoom;
    if (G) { const s = G.ship; s.x = clamp(s.x, 18, FW - 18); s.y = clamp(s.y, FH * 0.22, FH - 30); s.tx = s.x; s.ty = s.y; }
    if (fore) fore.invalidate();
    gfx.clearSprites('giant');
  }

  /* ================================================================ sockets: two hex rings around the core */
  const SOCK = [];
  for (let k = 0; k < 6; k++) { const a = -PI / 2 + k * PI / 3; SOCK.push({ ring: 1, a, x: Math.cos(a) * 24, y: Math.sin(a) * 24 }); }
  for (let k = 0; k < 6; k++) { const a = -PI / 2 + PI / 6 + k * PI / 3; SOCK.push({ ring: 2, a, x: Math.cos(a) * 43, y: Math.sin(a) * 43 }); }
  for (const s of SOCK) {
    s.adj = [];
    s.aim = -PI / 2 + Math.cos(s.a) * 0.62;
  }
  for (let i = 0; i < 12; i++) for (let j = 0; j < 12; j++) if (i !== j && Math.hypot(SOCK[i].x - SOCK[j].x, SOCK[i].y - SOCK[j].y) < 30) SOCK[i].adj.push(j);
  const modR = m => (m.tier === 2 ? 13 : 10);
  const CORE_HIT = 4.5, CORE_R = 13;

  /* ================================================================ sprites */
  const S = {};
  function rimFill(g, path, body, rim, off) {
    off = off || 1.7;
    g.save(); path(g); g.fillStyle = rim; g.fill(); g.clip();
    g.translate(-off, off); path(g); g.fillStyle = body; g.fill();
    g.restore();
  }
  const poly = pts => g => { g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.closePath(); };
  const mirror = half => { // half: [x,y,...] from top centre to bottom centre on the right side; mirrored left
    const out = half.slice();
    for (let i = half.length - 4; i >= 2; i -= 2) out.push(-half[i], half[i + 1]);
    return out;
  };
  function hullGrad(g, h) {
    const gr = g.createLinearGradient(0, -h / 2, 0, h / 2);
    gr.addColorStop(0, '#2e1d3a'); gr.addColorStop(1, '#150c1b');
    return gr;
  }
  function eye(g, x, y, r, col) {
    g.fillStyle = gfx.alpha(col, 0.35); g.beginPath(); g.arc(x, y, r * 1.9, 0, TAU); g.fill();
    g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
    g.fillStyle = '#fff4dc'; g.beginPath(); g.arc(x - r * 0.25, y - r * 0.25, r * 0.4, 0, TAU); g.fill();
  }
  function panelLines(g, lines) {
    g.strokeStyle = 'rgba(255,170,110,0.13)'; g.lineWidth = 1;
    g.beginPath();
    for (let i = 0; i < lines.length; i += 4) { g.moveTo(lines[i], lines[i + 1]); g.lineTo(lines[i + 2], lines[i + 3]); }
    g.stroke();
  }
  // Enemy sprites: matte black-violet, a warm rim on the top-right (the amber star), orange-red eyes. They face down.
  const ENEMY_ART = {
    drone: [32, 32, g => {
      rimFill(g, poly([-5, -6, -15, -9, -13, 3, -5, 5]), '#160c1c', 'rgba(255,161,90,0.45)', 1.2);
      rimFill(g, poly([5, -6, 15, -9, 13, 3, 5, 5]), '#160c1c', 'rgba(255,161,90,0.8)', 1.2);
      g.fillStyle = 'rgba(255,120,60,0.6)'; g.fillRect(-14, -8, 2, 2); g.fillRect(12, -8, 2, 2);
      rimFill(g, g2 => { g2.beginPath(); g2.arc(0, 0, 9, 0, TAU); }, hullGrad(g, 18), C.rim, 2);
      panelLines(g, [-6, -3, 6, -3]);
      eye(g, 0, 3, 3, '#ff5a2a');
    }],
    raider: [42, 38, g => {
      rimFill(g, poly([0, 17, 6, 4, 19, -4, 17, -12, 6, -8, 3, -16, -3, -16, -6, -8, -17, -12, -19, -4, -6, 4]), hullGrad(g, 34), C.rim);
      panelLines(g, [0, -14, 0, 10, -6, -6, -15, -8, 6, -6, 15, -8]);
      g.fillStyle = '#3a2440'; g.beginPath(); g.moveTo(0, 12); g.lineTo(3, 2); g.lineTo(-3, 2); g.closePath(); g.fill();
      eye(g, 0, -2, 2.6, '#ff6a2a');
    }],
    sweeper: [50, 28, g => {
      rimFill(g, poly([-23, -2, -14, -10, 14, -10, 23, -2, 16, 8, -16, 8]), hullGrad(g, 20), C.rim);
      rimFill(g, poly([-6, 8, 6, 8, 3, 13, -3, 13]), '#120a18', C.rim, 1);
      panelLines(g, [-12, -2, 12, -2, -8, -10, -10, 8, 8, -10, 10, 8]);
      eye(g, -9, 2, 2.2, '#ff5a2a'); eye(g, 9, 2, 2.2, '#ff5a2a');
    }],
    miner: [56, 46, g => {
      rimFill(g, poly([-12, -20, 12, -20, 25, -2, 18, 14, -18, 14, -25, -2]), hullGrad(g, 40), C.rim);
      g.fillStyle = '#0d0710'; g.fillRect(-9, 6, 18, 9);
      g.fillStyle = 'rgba(255,90,40,0.5)'; g.fillRect(-7, 12, 14, 3);
      panelLines(g, [-12, -20, -6, 6, 12, -20, 6, 6, -25, -2, 25, -2]);
      for (const x of [-16, 16]) { g.fillStyle = '#6a5a70'; g.beginPath(); g.arc(x, -8, 1.6, 0, TAU); g.fill(); }
      eye(g, 0, -8, 3, '#ff5a2a');
    }],
    pylon: [26, 52, g => {
      rimFill(g, poly([-8, -24, 8, -24, 10, -14, 10, 14, 8, 24, -8, 24, -10, 14, -10, -14]), hullGrad(g, 48), C.rim);
      g.fillStyle = '#0d0710'; g.fillRect(-5, -6, 10, 12);
      panelLines(g, [-10, -14, 10, -14, -10, 14, 10, 14]);
      eye(g, 0, 0, 3.2, '#ff4f8b');
    }],
    carrier: [96, 66, g => {
      rimFill(g, poly([-20, -30, 20, -30, 44, -14, 46, 6, 30, 26, 10, 31, -10, 31, -30, 26, -46, 6, -44, -14]), hullGrad(g, 60), C.rim, 2.2);
      g.fillStyle = '#0c0610';
      g.fillRect(-36, -6, 14, 18); g.fillRect(22, -6, 14, 18);
      g.fillStyle = 'rgba(255,120,50,0.45)'; g.fillRect(-34, 8, 10, 3); g.fillRect(24, 8, 10, 3);
      panelLines(g, [-20, -30, -14, 30, 20, -30, 14, 30, -44, -14, 44, -14, -46, 6, 46, 6]);
      for (const [x, y] of [[-30, -18], [30, -18], [-8, -24], [8, -24]]) { g.fillStyle = '#7a6880'; g.beginPath(); g.arc(x, y, 1.8, 0, TAU); g.fill(); }
      eye(g, 0, 10, 4.5, '#ff5a2a');
    }],
    splitter: [40, 40, g => {
      for (const a of [-PI / 2, PI / 6, PI * 5 / 6]) {
        const x = Math.cos(a) * 7, y = Math.sin(a) * 7;
        rimFill(g, g2 => { g2.beginPath(); g2.arc(x, y, 9.5, 0, TAU); }, hullGrad(g, 30), C.rim, 1.6);
      }
      g.strokeStyle = 'rgba(255,90,60,0.55)'; g.lineWidth = 1.4;
      g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -12); g.moveTo(0, 0); g.lineTo(10, 6); g.moveTo(0, 0); g.lineTo(-10, 6); g.stroke();
      eye(g, 0, 0, 3, '#ff7a2a');
    }],
    mini: [18, 18, g => {
      rimFill(g, poly([0, 8, 7, -2, 4, -7, -4, -7, -7, -2]), hullGrad(g, 16), C.rim, 1.2);
      eye(g, 0, -1, 1.8, '#ff7a2a');
    }],
    sniper: [32, 50, g => {
      g.fillStyle = '#120a18'; g.fillRect(-2.2, 6, 4.4, 18);
      g.fillStyle = C.rim; g.fillRect(1.6, 6, 0.8, 18);
      rimFill(g, poly([-12, -18, 12, -18, 14, -6, 6, 8, -6, 8, -14, -6]), hullGrad(g, 30), C.rim);
      panelLines(g, [-12, -6, 12, -6, 0, -18, 0, -8]);
      eye(g, 0, 0, 3.4, '#ff3a5a');
    }],
    mine: [22, 22, g => {
      g.strokeStyle = '#3a2440'; g.lineWidth = 2.4;
      g.beginPath();
      for (let k = 0; k < 8; k++) { const a = k * TAU / 8; g.moveTo(Math.cos(a) * 5, Math.sin(a) * 5); g.lineTo(Math.cos(a) * 10, Math.sin(a) * 10); }
      g.stroke();
      rimFill(g, g2 => { g2.beginPath(); g2.arc(0, 0, 6.5, 0, TAU); }, '#1d1224', C.rim, 1.3);
    }],
  };
  function enemySprite(type) {
    const a = ENEMY_ART[type];
    return gfx.sprite('e_' + type, a[0], a[1], (g, w, h) => { g.translate(w / 2, h / 2); a[2](g); });
  }
  function whiteOf(key, base) {
    return gfx.sprite(key + '_w', base.w, base.h, (g, w, h) => {
      g.drawImage(base, 0, 0, w, h);
      g.globalCompositeOperation = 'source-in';
      g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
    });
  }
  const hexPath = (g, r) => { g.beginPath(); for (let k = 0; k < 6; k++) { const a = k * PI / 3; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); } g.closePath(); };
  // Modules: a gunmetal hex frame, the part's colour in the middle, warm rim light from the top-right.
  function moduleSprite(type, tier) {
    const R = tier === 2 ? 14 : 10.5, size = Math.ceil(R * 2 + 6);
    return gfx.sprite('m_' + type + tier, size, size, (g, w, h) => {
      g.translate(w / 2, h / 2);
      const col = TCOL[type];
      // frame
      g.save(); hexPath(g, R); g.fillStyle = '#ffd7a8'; g.fill(); g.clip();
      g.translate(-1.3, 1.3); hexPath(g, R);
      const fr = g.createLinearGradient(-R, -R, R, R); fr.addColorStop(0, '#7d8290'); fr.addColorStop(1, '#2f323b');
      g.fillStyle = fr; g.fill(); g.restore();
      if (type === 'plate') {
        const pg = g.createLinearGradient(-R, -R, R, R); pg.addColorStop(0, '#9196a1'); pg.addColorStop(1, '#4f535d');
        hexPath(g, R * 0.78); g.fillStyle = pg; g.fill();
        g.strokeStyle = 'rgba(20,10,20,0.45)'; g.lineWidth = 1; hexPath(g, R * 0.78); g.stroke();
        for (let k = 0; k < 6; k++) { const a = k * PI / 3 + PI / 6, rr = R * 0.6; g.fillStyle = '#d6d9df'; g.beginPath(); g.arc(Math.cos(a) * rr, Math.sin(a) * rr, tier === 2 ? 1.5 : 1.1, 0, TAU); g.fill(); }
        g.fillStyle = 'rgba(255,255,255,0.18)'; g.fillRect(-R * 0.5, -1, R, 2);
        if (tier === 2) { g.strokeStyle = gfx.alpha('#e6ebf2', 0.6); g.lineWidth = 1.2; hexPath(g, R * 0.42); g.stroke(); }
        return;
      }
      const core = g.createRadialGradient(-2, -2, 1, 0, 0, R * 0.7);
      core.addColorStop(0, gfx.mix(col, '#ffffff', 0.55)); core.addColorStop(0.6, col); core.addColorStop(1, gfx.shade(col, -0.45));
      g.fillStyle = core; hexPath(g, R * 0.66); g.fill();
      g.fillStyle = '#1b1220'; g.strokeStyle = '#1b1220'; g.lineWidth = tier === 2 ? 2 : 1.5;
      if (type === 'blaster') {
        // barrel pointing up
        g.fillStyle = '#2a2430'; g.fillRect(-2.2 * (tier === 2 ? 1.5 : 1), -R - 2, 4.4 * (tier === 2 ? 1.5 : 1), R * 0.9);
        g.fillStyle = gfx.mix(col, '#fff', 0.3); g.fillRect(-1 * (tier === 2 ? 1.5 : 1), -R - 2, 1.4, R * 0.8);

      case 'miner': {

  }

  /* ---------------------------------------------------------------- boss */
  const PATS = ['aim3', 'spiral', 'fan', 'ring', 'stream'];
  function spawnBoss() {
    const s = G.sector, r = Kit.rng((G.seed * 31 + s * 997) >>> 0);
    const BW = Math.min(FW * 0.86, 330), BH = BW * 0.5;
    const n = Math.min(6, 1 + s);
    const pairs = [[0.36, 0.08], [0.2, 0.32], [0.42, -0.2]];
    const anchors = [];
    const usePairs = n >> 1, center = n % 2 === 1;
    for (let i = 0; i < usePairs; i++) { const [ax, ay] = pairs[i]; const jx = r.range(-0.03, 0.03), jy = r.range(-0.04, 0.04); anchors.push([ax + jx, ay + jy], [-(ax + jx), ay + jy]); }
    if (center) anchors.push([0, 0.4]);
    const podHp = (30 + 10 * s) * (hard() ? 1.5 : 1), coreHp = (80 + 25 * s) * (hard() ? 1.4 : 1);
    const pods = anchors.map(([ax, ay], i) => ({ ox: ax * BW, oy: ay * BH, hp: podHp, max: podHp, pat: PATS[(r.int(0, 4) + i) % PATS.length], ft: 1 + r.range(0, 1.2), burst: 0, ang: PI / 2, spin: r.range(0, TAU), dead: false, flash: 0, armour: hard() }));
    // mirrored pods share a pattern so the boss reads as one machine
    for (let i = 1; i < pods.length; i += 2) if (i < usePairs * 2) pods[i].pat = pods[i - 1].pat;
    G.boss = { x: FW / 2, y: -BH, ty: BH * 0.55 + 46, t: 0, enter: 2.6, BW, BH, pods, core: { ox: 0, oy: -0.06 * BH, hp: coreHp, max: coreHp, open: 0, flash: 0, ft: 1.2, mode: 0 }, dying: 0, dead: false, seed: s, total: podHp * pods.length + coreHp };
    if (G.mode === 'play') {
      banner('Warning', 'SALVAGE BOSS INBOUND', 2.4, 'warn');
      snd('alarm');
      Kit.music.duck(0.4, 900);
      musicFor('boss');
    }
  }
  function bossSprite(b) {
    const W = Math.ceil(b.BW + 24), H = Math.ceil(b.BH + 30);
    return gfx.sprite('boss' + b.seed + '_' + Math.round(b.BW), W, H, (g) => {
      const r = Kit.rng(b.seed * 13 + 5);
      g.translate(W / 2, H / 2);
      const hw = b.BW / 2, hh = b.BH / 2;
      // a seeded symmetric hull: spine, swept wings, a jaw
      const half = [0, -hh, hw * r.range(0.18, 0.3), -hh * r.range(0.9, 1), hw * r.range(0.55, 0.7), -hh * r.range(0.55, 0.8), hw, -hh * r.range(0.1, 0.35),
        hw * r.range(0.86, 0.98), hh * r.range(0.15, 0.4), hw * r.range(0.55, 0.7), hh * r.range(0.3, 0.5), hw * r.range(0.32, 0.42), hh * r.range(0.75, 0.95), hw * 0.12, hh, 0, hh * 0.86];
      const pts = mirror(half);
      rimFill(g, poly(pts), hullGrad(g, b.BH), C.rim, 3);
      // armour plates
      g.fillStyle = 'rgba(70,40,80,0.45)';
      for (let i = 0; i < 4; i++) {
        const px = r.range(0.15, 0.7) * hw, py = r.range(-0.6, 0.5) * hh, pw = r.range(0.15, 0.3) * hw, ph = r.range(0.15, 0.3) * hh;
        for (const sgn of [-1, 1]) { g.save(); g.translate(sgn * px, py); g.beginPath(); g.moveTo(-pw / 2, -ph / 2); g.lineTo(pw / 2, -ph / 2 + 3); g.lineTo(pw / 2, ph / 2); g.lineTo(-pw / 2, ph / 2 - 3); g.closePath(); g.fill(); g.strokeStyle = 'rgba(255,160,100,0.18)'; g.lineWidth = 1; g.stroke(); g.restore(); }
      }
      // spine and vents
      g.fillStyle = '#100816'; g.fillRect(-hw * 0.07, -hh * 0.95, hw * 0.14, hh * 1.7);
      g.fillStyle = 'rgba(255,110,50,0.4)';
      for (let k = 0; k < 5; k++) g.fillRect(-hw * 0.05, -hh * 0.85 + k * hh * 0.12, hw * 0.1, 2);
      panelLines(g, [-hw * 0.6, -hh * 0.3, hw * 0.6, -hh * 0.3, -hw * 0.8, hh * 0.15, hw * 0.8, hh * 0.15, -hw * 0.3, hh * 0.6, hw * 0.3, hh * 0.6]);
      // hazard stripes on the jaw
      g.save(); g.beginPath(); g.rect(-hw * 0.3, hh * 0.62, hw * 0.6, hh * 0.12); g.clip();
      for (let x = -hw * 0.3 - 20; x < hw * 0.3 + 20; x += 10) { g.fillStyle = 'rgba(245,166,35,0.55)'; g.beginPath(); g.moveTo(x, hh * 0.62); g.lineTo(x + 5, hh * 0.62); g.lineTo(x + 5 - hh * 0.12, hh * 0.74); g.lineTo(x - hh * 0.12, hh * 0.74); g.closePath(); g.fill(); }
      g.restore();
      // rivets
      g.fillStyle = 'rgba(255,200,160,0.3)';
      for (let k = 0; k < 18; k++) { const x = r.range(-0.8, 0.8) * hw, y = r.range(-0.5, 0.5) * hh; g.beginPath(); g.arc(x, y, 1.1, 0, TAU); g.fill(); g.beginPath(); g.arc(-x, y, 1.1, 0, TAU); g.fill(); }
      // rows of lit ports and glowing vents
      for (let k = 0; k < 7; k++) {
        const x = r.range(0.25, 0.75) * hw, y = r.range(-0.45, 0.25) * hh, n = r.int(3, 6);
        for (const sgn of [-1, 1]) for (let j = 0; j < n; j++) { g.fillStyle = (j + k) % 4 === 0 ? 'rgba(255,90,140,0.85)' : 'rgba(255,190,110,0.75)'; g.fillRect(sgn * (x + j * 5) - 1.2, y, 2.4, 1.6); }
      }
      for (const sgn of [-1, 1]) {
        const vg = g.createLinearGradient(0, hh * 0.1, 0, hh * 0.5);
        vg.addColorStop(0, 'rgba(255,79,139,0)'); vg.addColorStop(1, 'rgba(255,79,139,0.55)');
        g.fillStyle = vg;
        for (let k = 0; k < 3; k++) g.fillRect(sgn * hw * (0.55 + k * 0.06) - 1.5, hh * 0.12, 3, hh * 0.32);
      }
      // a warm sheen on the top-right of the hull
      g.save(); poly(pts)(g); g.clip();
      const sh = g.createLinearGradient(hw, -hh, 0, hh * 0.2);
      sh.addColorStop(0, 'rgba(255,170,110,0.28)'); sh.addColorStop(0.5, 'rgba(255,170,110,0.05)'); sh.addColorStop(1, 'rgba(255,170,110,0)');
      g.fillStyle = sh; g.fillRect(-hw, -hh, b.BW, b.BH);
      g.restore();
      // pod sockets
      for (const p of b.pods) { g.fillStyle = '#0b0610'; g.beginPath(); g.arc(p.ox, p.oy, 15, 0, TAU); g.fill(); g.strokeStyle = 'rgba(255,160,100,0.35)'; g.lineWidth = 1.5; g.beginPath(); g.arc(p.ox, p.oy, 15, -1.6, 0.2); g.stroke(); }
      g.fillStyle = '#0b0610'; g.beginPath(); g.arc(b.core.ox, b.core.oy, 21, 0, TAU); g.fill();
    });
  }
  const podSprite = () => gfx.sprite('pod', 34, 34, (g, w, h) => {
    g.translate(w / 2, h / 2);
    rimFill(g, g2 => { g2.beginPath(); g2.arc(0, 0, 12.5, 0, TAU); }, '#2a1a34', C.rim, 1.8);
    g.save(); g.beginPath(); g.arc(0, 0, 12.5, 0, TAU); g.clip();
    for (let k = -20; k < 20; k += 6) { g.fillStyle = 'rgba(245,166,35,0.5)'; g.beginPath(); g.moveTo(k, 8); g.lineTo(k + 3, 8); g.lineTo(k + 7, 13); g.lineTo(k + 4, 13); g.closePath(); g.fill(); }
    g.restore();
    g.fillStyle = '#120a18'; g.beginPath(); g.arc(0, 0, 7, 0, TAU); g.fill();
  });

  /* ---------------------------------------------------------------- ship parts */
  function freeSockets() { const out = []; for (let i = 0; i < 12; i++) if (!G.sockets[i] && (i < 6 || G.ring2)) out.push(i); return out; }
  function moduleCount() { let n = 0; for (const m of G.sockets) if (m) n++; return n; }
  function sockPos(i, out) { const s = G.ship; out.x = s.x + SOCK[i].x; out.y = s.y + SOCK[i].y; return out; }
  const tmp = { x: 0, y: 0 }, tmp2 = { x: 0, y: 0 };

  function attach(p) {
    const free = freeSockets();
    const s = G.ship;
    if (!free.length) {
      // a full hull turns spare parts into scrap points
      const pts = 50 * G.mult * p.tier;
      addScore(pts);
      fx.burst(p.x, p.y, { count: 12, color: [TCOL[p.type], C.cream], speed: [40, 140], life: [0.2, 0.5], shape: 'spark', glow: true });
      floatText('SCRAP +' + pts, p.x, p.y - 10, C.cream, 14);
      snd('scrap');
      return -1;
    }
    // nearest free socket on the side it touched, nudged toward matching neighbours so fusions come naturally
    let best = free[0], bd = 1e9;
    for (const i of free) {
      let d = Kit.dist(s.x + SOCK[i].x, s.y + SOCK[i].y, p.x, p.y);
      if (p.tier === 1) for (const j of SOCK[i].adj) { const m = G.sockets[j]; if (m && m.tier === 1 && m.type === p.type) d -= 16; }
      if (d < bd) { bd = d; best = i; }
    }
    const m = mkMod(p.type, p.tier);
    m.pop = 1.7; m.flash = 1;
    G.sockets[best] = m;
    Kit.tween(m, { pop: 1 }, 380, 'elasticOut');
    sockPos(best, tmp);
    // squash and stretch toward the side that caught it
    const ax = Math.abs(SOCK[best].x) > Math.abs(SOCK[best].y);
    s.sx = ax ? 0.82 : 1.2; s.sy = ax ? 1.2 : 0.82;
    Kit.tween(s, { sx: 1, sy: 1 }, 420, 'elasticOut');
    fx.burst(tmp.x, tmp.y, { count: 18, color: ['#fff6d0', TCOL[p.type], C.amber], shape: 'spark', speed: [90, 280], life: [0.15, 0.4], size: [1, 2.6], glow: true });
    fx.shockwave(tmp.x, tmp.y, { radius: 22, color: TCOL[p.type], width: 2, ms: 240 });
    addLight(tmp.x, tmp.y, 40, TCOL[p.type], 0.25);
    snd('clank', { pitch: p.tier === 2 ? -3 : 0 });
    if (live()) Kit.haptic(10);
    if (G.mode === 'play' && !G.teachDone && moduleCount() >= 1 && G.kills >= 1) { G.teachDone = true; Kit.save.set('taught', true); Arcade.track('tutorial_complete'); }
    tryFuse(best);
    return best;
  }
  function tryFuse(focus) {
    const S_ = G.sockets;
    const order = [focus].concat(SOCK[focus].adj, Array.from({ length: 12 }, (_, i) => i));
    for (const b of order) {
      const mb = S_[b];
      if (!mb || mb.tier !== 1) continue;
      const same = SOCK[b].adj.filter(i => S_[i] && S_[i].tier === 1 && S_[i].type === mb.type && (i < 6 || G.ring2));
      if (same.length < 2) continue;
      same.sort((A, B) => (B === focus) - (A === focus));
      fuse(b, same[0], same[1]);
      return true;
    }
    return false;
  }
  function fuse(b, a, c) {
    const type = G.sockets[b].type;
    G.sockets[a] = null; G.sockets[c] = null;
    const m = mkMod(type, 2);
    m.pop = 0.4; m.flash = 1;
    G.sockets[b] = m;
    G.fuses.push({ type, from: [a, c], to: b, t: 0 });
    G.fusions++;
    Kit.tween(m, { pop: 1 }, 520, 'elasticOut', { delay: 160 });
    sockPos(b, tmp);
    fx.shockwave(tmp.x, tmp.y, { radius: 70, color: '#ffffff', width: 5, ms: 420 });
    fx.shockwave(tmp.x, tmp.y, { radius: 44, color: TCOL[type], width: 3, ms: 520 });
    fx.burst(tmp.x, tmp.y, { count: 30, color: ['#ffffff', TCOL[type], C.cream], shape: 'star', speed: [60, 260], life: [0.3, 0.8], size: [1.5, 4], glow: true, spin: [-6, 6] });
    addLight(tmp.x, tmp.y, 110, TCOL[type], 0.45);
    if (G.mode === 'play') {
      fx.flash('#ffffff', 120, 0.28);
      stopFor(60);
      floatText('FUSED · TIER 2', tmp.x, tmp.y - 28, TCOL[type], 17);
      Kit.music.duck(0.55, 350);
    }
    snd('fuse');
    if (live()) Kit.haptic([15, 30, 25]);
  }
  function knock(i, vx, vy) {
    const m = G.sockets[i];
    if (!m) return;
    sockPos(i, tmp);
    G.sockets[i] = null;
    // it tumbles outward from the core, pushed a little along the hit
    const sp = Math.hypot(vx, vy) || 1, ox = SOCK[i].x / 24, oy = SOCK[i].y / 24;
    let dx = ox * 1.4 + vx / sp * 0.6, dy = oy * 1.4 + vy / sp * 0.6;
    const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
    G.parts.push({ type: m.type, tier: m.tier, x: tmp.x, y: tmp.y, vx: dx * 165 + rand.range(-25, 25), vy: dy * 165 + rand.range(-25, 25), rot: 0, vr: rand.range(-9, 9), loose: true, life: 2, t: 0, noCatch: 0.4, trail: 0 });
    G.lost++;
    fx.burst(tmp.x, tmp.y, { count: 16, color: [TCOL[m.type], '#ffffff', C.steel], shape: 'square', speed: [60, 220], life: [0.3, 0.6], size: [1.2, 3], spin: [-10, 10] });
    fx.shake(5, 180);
    snd('clatter');
    if (live()) Kit.haptic(28);
    if (G.mult > 1 && G.mode === 'play') floatText('CHAIN LOST', G.ship.x, G.ship.y + 40, '#ff8fb3', 13);
    G.chain = 0; G.mult = 1;
  }
  function hitModule(i, b) {
    const m = G.sockets[i];
    if (m.type === 'plate' && m.hp > 1) {
      m.hp--; m.flash = 1; m.hitT = 0.25;
      sockPos(i, tmp);
      fx.burst(tmp.x, tmp.y, { count: 8, color: ['#ffffff', C.steel], shape: 'spark', speed: [60, 180], life: [0.15, 0.3], angle: Math.atan2(-b.vy, -b.vx), spread: 1.4 });
      snd('ding', { pitch: (3 - m.hp) * 2 });
      return;
    }
    knock(i, b.vx, b.vy);
  }

  /* ---------------------------------------------------------------- scoring */
  function addScore(n) { if (G.mode === 'play') G.score += n; }
  function floatText(t, x, y, col, size) { if (G.mode !== 'play') return; fx.float(t, x, y, { color: col, size: size || 15, font: 'display', weight: 800, stroke: 'rgba(30,8,24,0.75)' }); }
  // Additive lights are pure fill cost at DPR 2: keep at most 14, dropping the oldest.
  function addLight(x, y, r, col, life) { if (G.lights.length >= (lite ? 6 : 14)) G.lights.shift(); G.lights.push({ x, y, r, col, t: 0, life }); }
  // Impact frames and slow motion are motion effects: skipped for reduced motion, and only in a real run.
  function stopFor(ms) { if (G.mode === 'play' && !Kit.reducedMotion) loop.hitstop(ms); }
  function slowmo(scale, holdMs, rampMs) {
    if (G.mode !== 'play' || Kit.reducedMotion) return;
    loop.timeScale = scale;
    Kit.tween(loop, { timeScale: 1 }, rampMs, 'quadIn', { delay: holdMs });
  }

  /* ---------------------------------------------------------------- shooting */
  function shot(x, y, vx, vy, dmg, kind, o) {
    const b = { x, y, vx, vy, dmg, kind, life: 2.2, tgt: null, r: kind === 'blaster2' ? 6 : kind === 'seeker' ? 6 : 4 };
    if (o) Object.assign(b, o);
    G.pb.push(b);
    return b;
  }
  function eshot(x, y, ang, speed, big) {
    if (G.eb.length >= 512) return;
    const sp = speed * bulletSpeed();
    G.eb.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, r: big ? 6.5 : 4.5, big: !!big });
  }
  const aimAt = (x, y) => Math.atan2(G.ship.y - y, G.ship.x - x);
  function shipFire(dt) {
    const s = G.ship;
    if ((s.ft -= dt) <= 0) { s.ft = 0.2; shot(s.x, s.y - 14, 0, -640, 1, 'core'); pew('pewC'); }
    for (let i = 0; i < 12; i++) {
      const m = G.sockets[i];
      if (!m) continue;
      m.flash = Math.max(0, m.flash - dt * 5);
      if (m.type === 'plate') continue;
      if ((m.ft -= dt) > 0) continue;
      const x = s.x + SOCK[i].x, y = s.y + SOCK[i].y;
      if (m.type === 'blaster') {
        m.ft = m.tier === 2 ? 0.11 : 0.15;
        if (m.tier === 2) shot(x, y - 14, 0, -720, 2.4, 'blaster2'); else shot(x, y - 10, 0, -680, 1, 'blaster1');
        m.flash = 1; pew('pewB', m.tier === 2 ? -4 : rand.range(-1, 1));
      } else if (m.type === 'fan') {
        m.ft = m.tier === 2 ? 0.3 : 0.34;
        const n = m.tier === 2 ? 5 : 3, spread = m.tier === 2 ? 0.16 : 0.2, a0 = SOCK[i].aim;
        for (let k = 0; k < n; k++) { const a = a0 + (k - (n - 1) / 2) * spread; shot(x, y, Math.cos(a) * 520, Math.sin(a) * 520, m.tier === 2 ? 1.7 : 0.85, m.tier === 2 ? 'fan2' : 'fan1'); }
        m.flash = 1; pew('pewF', m.tier === 2 ? -3 : 0);
      } else if (m.type === 'seeker') {
        m.ft = m.tier === 2 ? 0.75 : 1.2;
        const a = SOCK[i].a;
        shot(x, y, Math.cos(a) * 140, -170, m.tier === 2 ? 10 : 5, 'seeker', { life: 3, spd: 200, r: m.tier === 2 ? 8 : 6, big: m.tier === 2 });
        if (m.tier === 2) shot(x, y, -Math.cos(a) * 140, -150, 10, 'seeker', { life: 3, spd: 200, r: 8, big: true });
        m.flash = 1; pew('pewS', rand.range(-2, 2));
      }
    }
  }
  function nearestTarget(x, y) {
    let best = null, bd = 1e9;
    for (const e of G.enemies) { if (e.dead || e.y < -10 || e.type === 'mine') continue; const d = Kit.dist(x, y, e.x, e.y); if (d < bd) { bd = d; best = e; } }
    const B = G.boss;
    if (B && !B.dying && B.y > 0) {
      for (const p of B.pods) { if (p.dead) continue; const d = Kit.dist(x, y, B.x + p.ox, B.y + p.oy); if (d < bd) { bd = d; best = p; } }
      if (B.core.open > 0.9) { const d = Kit.dist(x, y, B.x + B.core.ox, B.y + B.core.oy); if (d < bd) { bd = d; best = B.core; } }
    }
    return best;
  }
  function targetPos(t, out) {
    if (t.ox !== undefined) { out.x = G.boss.x + t.ox; out.y = G.boss.y + t.oy; } else { out.x = t.x; out.y = t.y; }
    return out;
  }
  function updateShots(dt) {
    const B = G.boss;
    let j = 0;
    for (let i = 0; i < G.pb.length; i++) {
      const b = G.pb[i];
      b.life -= dt;
      if (b.kind === 'seeker') {
        if (!b.tgt || b.tgt.dead || b.tgt.hp <= 0) b.tgt = nearestTarget(b.x, b.y);
        b.spd = Math.min(460, b.spd + 600 * dt);
        let a = Math.atan2(b.vy, b.vx);
        if (b.tgt) { targetPos(b.tgt, tmp2); const want = Math.atan2(tmp2.y - b.y, tmp2.x - b.x); a += clamp(Kit.angleDiff(a, want), -6 * dt, 6 * dt); }
        b.vx = Math.cos(a) * b.spd; b.vy = Math.sin(a) * b.spd;
        if ((b.trail = (b.trail || 0) - dt) <= 0) { b.trail = 0.03; fx.burst(b.x - b.vx * 0.02, b.y - b.vy * 0.02, { count: 1, color: ['#ffb0c8', '#ffffff'], speed: [5, 20], life: [0.15, 0.3], size: [1.5, 2.5] }); }
      }
      b.x += b.vx * dt; b.y += b.vy * dt;
      let hit = false;
      if (b.life > 0 && b.y > -30 && b.y < FH + 30 && b.x > -30 && b.x < FW + 30) {
        for (const e of G.enemies) {
          if (e.dead || e.y < -20) continue;
          const rr = e.r + b.r;
          const dx = e.x - b.x, dy = e.y - b.y;
          if (dx * dx + dy * dy > rr * rr) continue;
          if (e.type === 'carrier' && e.shield > 0 && b.y > e.y + 6) { // the shield faces down
            e.shield -= b.dmg; e.shT = 0.2;
            fx.burst(b.x, b.y - 2, { count: 3, color: ['#ffe9c8', '#ffb347'], shape: 'spark', speed: [40, 120], life: [0.1, 0.25], angle: PI / 2, spread: 1.6 });
            pew('tick', 6);
            if (e.shield <= 0) { snd('shatter'); fx.burst(e.x, e.y + 20, { count: 26, color: ['#ffe9c8', '#ffb347', '#ffffff'], shape: 'square', speed: [60, 220], life: [0.3, 0.7], size: [1.5, 3.5], spin: [-8, 8], gravity: 120 }); fx.shockwave(e.x, e.y + 10, { radius: 60, color: '#ffe9c8', width: 3 }); }
            hit = true; break;
          }
          damage(e, b.dmg, b);
          hit = true; break;
        }
        if (!hit && B && !B.dying && B.y > -B.BH * 0.3) hit = shotVsBoss(b, B);
      } else hit = true;
      if (!hit) G.pb[j++] = b;
      else if (b.kind === 'seeker' && b.life > 0) { fx.burst(b.x, b.y, { count: 8, color: ['#ffd0e0', C.seeker, '#ffffff'], speed: [40, 160], life: [0.15, 0.35], glow: true }); addLight(b.x, b.y, 26, C.seeker, 0.15); }
    }
    G.pb.length = j;
  }
  function shotVsBoss(b, B) {
    for (const p of B.pods) {
      if (p.dead) continue;
      const x = B.x + p.ox, y = B.y + p.oy;
      if (Kit.circleCircle(b.x, b.y, b.r, x, y, 15)) { damagePod(p, b.dmg * (p.armour ? 0.75 : 1), x, y); return true; }
    }
    const cx = B.x + B.core.ox, cy = B.y + B.core.oy;
    if (Kit.circleCircle(b.x, b.y, b.r, cx, cy, 19)) {
      if (B.core.open > 0.9) damageCore(b.dmg, cx, cy);
      else { fx.burst(b.x, b.y + 4, { count: 2, color: ['#ffe9c8', '#ffb347'], shape: 'spark', speed: [60, 160], life: [0.08, 0.2], angle: PI / 2, spread: 1.8 }); pew('tick', 9); }
      return true;
    }
    return false;
  }

  /* ---------------------------------------------------------------- damage and kills */
  function damage(e, dmg, b) {
    e.hp -= dmg; e.flash = 0.06;
    if (b && rand.chance(0.5)) fx.burst(b.x, b.y, { count: 2, color: ['#ffd0a0', '#ffffff'], shape: 'spark', speed: [50, 150], life: [0.08, 0.2], angle: PI / 2, spread: 1.6 });
    pew('tick');
    if (e.hp <= 0) kill(e);
  }
  function explode(x, y, size, colA) {
    const n = Math.round(10 + size * 12);
    fx.burst(x, y, { count: n, color: ['#fff3d6', '#ffb347', C.ember, colA || '#ff5a3a'], speed: [40, 120 + size * 110], life: [0.25, 0.6 + size * 0.2], size: [1.5, 3 + size], glow: true });
    fx.burst(x, y, { count: Math.round(5 + size * 6), color: ['#1d1224', '#3a2440', '#5a3a50'], shape: 'square', speed: [40, 160 + size * 60], life: [0.4, 0.9], size: [1.5, 3 + size], spin: [-10, 10], drag: 1.2 });
    fx.shockwave(x, y, { radius: 22 + size * 26, color: '#ffcf8a', width: 2 + size, ms: 300 + size * 80 });
    addLight(x, y, 40 + size * 50, '#ff9a4a', 0.3 + size * 0.1);
  }
  function kill(e) {
    if (e.dead) return;
    e.dead = true;
    const size = e.type === 'carrier' ? 2.2 : e.type === 'miner' ? 1.5 : e.type === 'mini' || e.type === 'mine' ? 0.4 : 1;
    explode(e.x, e.y, size * (e.elite ? 1.4 : 1));
    if (e.type === 'mine') { snd('boom', { pitch: 6, vol: 0.5 }); addScore(e.v * G.mult); return; }
    G.kills++;
    G.chain++;
    const m = Math.min(12, 1 + Math.floor(G.chain / 6));
    if (m > G.mult) {
      G.mult = m; G.bestMult = Math.max(G.bestMult, m);
      G.multPop = 1.8; Kit.tween(G, { multPop: 1 }, 420, 'elasticOut');
      if (live()) Kit.sfx.combo(m);
    }
    const pts = Math.round(e.v * G.mult);
    addScore(pts);
    floatText('+' + pts, e.x, e.y - e.r, G.mult > 1 ? C.amber : C.cream, 13 + Math.min(8, G.mult));
    snd(size > 1.4 ? 'boomBig' : 'boom', { pitch: rand.range(-3, 3) - (e.elite ? 4 : 0), vol: size < 1 ? 0.6 : 1 });
    fx.shake(e.elite || size > 1.4 ? 7 : 2.5, e.elite ? 240 : 120);
    if (e.elite) stopFor(35);
    if (live()) Kit.haptic(e.elite ? 22 : 6);
    if (e.type === 'splitter') for (let k = 0; k < 3; k++) { const a = PI / 2 + (k - 1) * 0.7; addEnemy('mini', e.x, e.y, { mv: 'mini', vx: Math.cos(a) * 140, vy: Math.sin(a) * 140, t: 0 }); }
    if (e.pair && !e.pair.dead) e.pair.orphan = true;
    // parts: always from elites, 25% otherwise; the very first kill always drops a Blaster
    let drop = null;
    if (G.firstKill) { drop = 'blaster'; G.firstKill = false; }
    else if (e.elite || rand.chance(e.type === 'mini' ? 0.06 : 0.25)) drop = pickPart();
    if (drop) dropPart(drop, 1, e.x, e.y, G.kills === 1 && G.sector === 1);
  }
  function pickPart() {
    // salvage tends to match what you already fly, so builds can grow toward a fusion
    if (rand.chance(0.35)) { const own = G.sockets.filter(m => m && m.tier === 1); if (own.length) return rand.pick(own).type; }
    const x = rand.next();
    return x < 0.36 ? 'blaster' : x < 0.62 ? 'fan' : x < 0.82 ? 'seeker' : 'plate';
  }
  function dropPart(type, tier, x, y, guide) {
    G.parts.push({ type, tier, x, y, vx: rand.range(-20, 20), vy: 40, rot: rand.range(0, TAU), vr: rand.range(-2, 2), loose: false, life: 99, t: 0, noCatch: 0.15, guide: !!guide, ph: rand.range(0, TAU) });
    snd('ping', { pitch: tier === 2 ? -5 : 0 });
  }
  function damagePod(p, dmg, x, y) {
    p.hp -= dmg; p.flash = 0.07;
    pew('tick', 3);
    if (p.hp > 0) return;
    p.dead = true;
    explode(x, y, 1.8, C.seeker);
    G.kills++; G.chain++;
    const pts = Math.round(250 * G.mult);
    addScore(pts);
    floatText('+' + pts, x, y - 20, C.amber, 20);
    snd('boomBig', { pitch: rand.range(-2, 2) });
    fx.shake(9, 260);
    stopFor(80);
    if (live()) Kit.haptic(30);
    dropPart(pickPart(), 2, x, y, false);
    if (G.boss.pods.every(q => q.dead)) { G.boss.core.ft = 1.4; snd('alarm', { pitch: 5, vol: 0.6 }); }
  }
  function damageCore(dmg, x, y) {
    const c = G.boss.core;
    c.hp -= dmg; c.flash = 0.07;
    pew('tick', -2);
    if (c.hp > 0) return;
    bossDie();
  }
  function bossDie() {
    const B = G.boss;
    if (B.dying) return;
    B.dying = 0.001;
    G.kills++;
    const pts = Math.round(1000 * G.sector * G.mult);
    addScore(pts);
    floatText('+' + Kit.fmt(pts), B.x, B.y - 30, C.amber, 26);
    G.eb.length = 0;
    snd('boomBig', { pitch: -6 });
    if (G.mode === 'play') {
      fx.flash('#ffffff', 260, 0.55);
      Kit.music.duck(0.3, 1200);
    }
    fx.shake(16, 900);
    if (live()) Kit.haptic([40, 60, 40, 60, 80]);
  }

  /* ---------------------------------------------------------------- enemies */
  function updateEnemies(dt) {
    const s = G.ship, W = FW;
    for (const e of G.enemies) {
      if (e.dead) continue;
      e.t += dt;
      e.flash = Math.max(0, e.flash - dt);
      const nofire = e.nofire || G.dead;
      switch (e.mv) {
        case 'line':
          e.y += e.vy * dt;
          e.x = e.bx + Math.sin(e.t * e.freq + e.ph) * e.amp;
          e.rot = Math.cos(e.t * e.freq + e.ph) * 0.25 * Math.min(1, e.amp / 30);
          if (e.y > FH + 40) e.gone = true;
          break;
        case 'arc': {
          const k = e.t * e.sp;
          e.x = e.side < 0 ? -20 + Math.sin(k) * W * 0.8 : W + 20 - Math.sin(k) * W * 0.8;
          e.y += 34 * dt;
          if (k > PI) e.gone = true;
          break;
        }
        case 'dive': {
          const k = Math.min(1, e.t / 1.2);
          if (e.t < 1.2) { e.x = lerp(e.sx + (e.x - e.sx) * 0, e.tx, Kit.ease.cubicOut(k)); e.y = lerp(-40, e.ty, Kit.ease.cubicOut(k)); }
          else if (e.t < 1.2 + e.hold) {
            e.x = e.tx + Math.sin(e.t * 2 + e.ph) * 8; e.y = e.ty + Math.sin(e.t * 3) * 3;
            if (!nofire && (e.ft -= dt) <= 0) {
              e.ft = 1.15 / dens(); const n = e.elite ? 5 : 3, base = aimAt(e.x, e.y);
              for (let i = 0; i < n; i++) eshot(e.x, e.y + 10, base + (i - (n - 1) / 2) * 0.22, 150);
              snd('beep', { pitch: -12, vol: 0.6 });
            }
          } else { e.vx = Kit.approach(e.vx, (e.tx < W / 2 ? -1 : 1) * 160, 300 * dt); e.vy = Kit.approach(e.vy, 120, 200 * dt); e.x += e.vx * dt; e.y += e.vy * dt; e.rot = e.vx / 700; }
          if (e.y > FH + 40 || e.x < -60 || e.x > W + 60) e.gone = true;
          break;
        }
        case 'cross':
          e.x += e.vx * dt; e.y = e.by + Math.sin(e.t * 2.4 + e.ph) * 8;
          e.rot = e.vx > 0 ? -0.08 : 0.08;
          if (e.type === 'sweeper' && !nofire && e.x > 10 && e.x < W - 10 && (e.ft -= dt) <= 0) { e.ft = (e.elite ? 0.38 : 0.55) / dens(); eshot(e.x, e.y + 8, PI / 2, 165); }
          if (e.type === 'miner' && !nofire && e.x > 20 && e.x < W - 20 && (e.ft -= dt) <= 0) { e.ft = 1.5 / dens(); addEnemy('mine', e.x, e.y + 16, { mv: 'mine', vy: 38, vx: rand.range(-14, 14) }); snd('beep'); }
          if ((e.vx > 0 && e.x > W + 70) || (e.vx < 0 && e.x < -70)) e.gone = true;
          break;
        case 'mine': {
          e.y += e.vy * dt; e.x += e.vx * dt;
          e.vy = Kit.approach(e.vy, 18, 20 * dt);
          const near = Kit.dist(e.x, e.y, s.x, s.y) < 70;
          if (e.t > 0.6 && !e.arm && near) { e.arm = 1; e.t = Math.max(e.t, 2.2); }
          if (Math.floor(e.t * (e.t > 2 ? 10 : 3)) !== Math.floor((e.t - dt) * (e.t > 2 ? 10 : 3)) && e.t > 0.6) { e.blink = 0.08; if (Kit.dist(e.x, e.y, s.x, s.y) < 220) snd('beep', { vol: 0.35, pitch: e.t > 2 ? 5 : 0 }); }
          e.blink = Math.max(0, (e.blink || 0) - dt);
          if (e.t > 2.8) {
            e.dead = true;
            if (!G.dead) { const n = hard() ? 12 : 9; for (let i = 0; i < n; i++) eshot(e.x, e.y, i / n * TAU + e.ph, 112); }
            explode(e.x, e.y, 0.5, C.seeker); snd('boom', { pitch: 4, vol: 0.6 });
          }
          if (e.y > FH + 30) e.gone = true;
          break;
        }
        case 'pylon': {
          const edge = e.side < 0 ? 24 : W - 24;
          if (e.state === 'enter') { e.x = Kit.smooth(e.x, edge, 6, dt); e.y = e.ty; if (Math.abs(e.x - edge) < 1 && e.lead) { e.state = 'charge'; e.st = 0; e.pair.state = 'charge'; snd('charge'); } else if (Math.abs(e.x - edge) < 1 && !e.lead && e.pair.dead) e.state = 'leave'; }
          else if (e.state === 'leave') { e.x += (e.side < 0 ? -1 : 1) * 120 * dt; if (e.x < -40 || e.x > W + 40) e.gone = true; }
          else if (e.lead) {
            e.st += dt;
            const b = e.pair;
            if (b.dead || e.orphan) { e.state = 'leave'; if (!b.dead) b.state = 'leave'; break; }
            if (e.state === 'charge' && e.st > 1.0) { e.state = 'fire'; e.st = 0; b.state = 'fire'; snd('beam'); fx.shake(4, 900); }
            else if (e.state === 'fire') {
              if (!G.dead) laserHit(e.y);
              if (e.st > 1.0) { e.state = 'cool'; e.st = 0; b.state = 'cool'; e.cycles++; }
            } else if (e.state === 'cool' && e.st > 1.3) {
              if (e.cycles >= 2) { e.state = 'leave'; b.state = 'leave'; }
              else { e.state = 'charge'; e.st = 0; b.state = 'charge'; e.ty = clamp(e.ty + (s.y > e.ty ? 50 : -50), FH * 0.42, FH * 0.8); b.ty = e.ty; snd('charge'); }
            }
          }
          if (e.state !== 'enter' && e.state !== 'leave') e.y = Kit.smooth(e.y, e.ty, 4, dt);
          if (!e.lead && e.orphan && e.state !== 'leave') e.state = 'leave';
          break;
        }
        case 'carrier': {
          e.y = Kit.smooth(e.y, e.t < e.life ? e.ty : FH + 120, e.t < e.life ? 1.2 : 0.6, dt);
          if (e.t > e.life) e.y += 30 * dt;
          e.x += Math.sin(e.t * 0.5 + e.ph) * 22 * dt;
          e.shT = Math.max(0, e.shT - dt);
          if (!e.shieldMax) e.shieldMax = e.shield;
          if (!nofire && e.t > 1.5 && e.t < e.life && (e.ft -= dt) <= 0) {
            e.ft = 2.1 / dens();
            for (const sx of [-30, 30]) { const a = aimAt(e.x + sx, e.y + 8); eshot(e.x + sx, e.y + 8, a - 0.06, 140); eshot(e.x + sx, e.y + 8, a + 0.06, 140); }
            if (e.launched < 4) { e.launched++; addEnemy('drone', e.x + (e.launched % 2 ? -30 : 30), e.y + 10, { mv: 'line', vy: 80, amp: 30, freq: 2, bx: e.x + (e.launched % 2 ? -50 : 50) }); }
          }
          if (e.y > FH + 100) e.gone = true;
          break;
        }
        case 'mini':
          e.x += e.vx * dt; e.y += e.vy * dt;
          if (e.t > 0.5 && !e.dash) { e.dash = 1; const a = aimAt(e.x, e.y); e.vx = Math.cos(a) * 190; e.vy = Math.max(60, Math.sin(a) * 190); }
          else if (!e.dash) { e.vx *= 1 - 3 * dt; e.vy *= 1 - 3 * dt; }
          e.rot = Math.atan2(e.vy, e.vx) - PI / 2;
          if (e.y > FH + 30 || e.x < -30 || e.x > W + 30 || e.y < -60) e.gone = true;
          break;
        case 'sniper': {
          if (e.state === 'enter') { e.y = Kit.smooth(e.y, e.ty, 4, dt); if (Math.abs(e.y - e.ty) < 2) { e.state = 'aim'; e.st = 0; e.tgt = pickSnipeTarget(); if (!nofire) snd('lock'); } }
          else if (e.state === 'aim') {
            e.st += dt;
            const tp = snipePoint(e.tgt, tmp2); e.ax = tp.x; e.ay = tp.y;
            e.rot = Math.atan2(e.ay - e.y, e.ax - e.x) - PI / 2;
            if (e.st > 1.1) { e.state = 'hold'; e.st = 0; }
          } else if (e.state === 'hold') {
            e.st += dt;
            if (e.st > 0.14) {
              if (!nofire) { eshot(e.x, e.y + 10, Math.atan2(e.ay - e.y, e.ax - e.x), 400, true); snd('snipe'); fx.burst(e.x, e.y + 14, { count: 8, color: ['#ffffff', C.seeker], shape: 'spark', speed: [60, 200], life: [0.1, 0.25], angle: Math.atan2(e.ay - e.y, e.ax - e.x), spread: 0.6 }); }
              e.shots++; e.state = e.shots >= (e.elite ? 5 : 3) ? 'leave' : 'cool'; e.st = 0;
            }
          } else if (e.state === 'cool') { e.st += dt; e.rot *= 1 - 4 * dt; if (e.st > 1.5 / Math.sqrt(dens())) { e.state = 'aim'; e.st = 0; e.tgt = pickSnipeTarget(); if (!nofire) snd('lock'); } }
          else { e.y -= 90 * dt; if (e.y < -50) e.gone = true; }
          break;
        }
      }
      // generic aimed fire for the small fry
      if (!nofire && e.y > 10 && e.y < FH * 0.7 && (e.type === 'drone' || e.type === 'splitter')) {
        if ((e.ft -= dt) <= 0) {
          e.ft = (e.type === 'drone' ? rand.range(2.6, 4.2) : 2.2) / dens() / (e.elite ? 1.6 : 1) / (G.sector === 1 && G.wave <= 2 ? 0.55 : 1);
          if (!(G.sector === 1 && G.wave === 1)) eshot(e.x, e.y + 8, aimAt(e.x, e.y), e.type === 'drone' ? 135 : 145);
          if (e.elite) { eshot(e.x, e.y + 8, aimAt(e.x, e.y) + 0.2, 135); eshot(e.x, e.y + 8, aimAt(e.x, e.y) - 0.2, 135); }
        }
      }
      // ramming: modules get knocked off, the core breaks
      if (!G.dead && e.type !== 'mine' && e.y > 0) bodyHit(e);
    }
    let j = 0;
    for (const e of G.enemies) if (!e.dead && !e.gone) G.enemies[j++] = e;
    G.enemies.length = j;
  }
  function bodyHit(e) {
    const s = G.ship;
    if (Kit.circleCircle(e.x, e.y, e.r * 0.7, s.x, s.y, CORE_HIT + 2)) { coreHit(); return; }
    for (let i = 0; i < 12; i++) {
      const m = G.sockets[i];
      if (!m) continue;
      if (Kit.circleCircle(e.x, e.y, e.r * 0.8, s.x + SOCK[i].x, s.y + SOCK[i].y, modR(m))) { knock(i, SOCK[i].x, SOCK[i].y + 0.1); damage(e, 4, null); return; }
    }
  }
  function pickSnipeTarget() {
    const occ = [];
    for (let i = 0; i < 12; i++) if (G.sockets[i]) occ.push(i);
    return occ.length ? rand.pick(occ) : -1;
  }
  function snipePoint(i, out) {
    const s = G.ship;
    if (i >= 0 && G.sockets[i]) { out.x = s.x + SOCK[i].x; out.y = s.y + SOCK[i].y; } else { out.x = s.x; out.y = s.y; }
    return out;
  }
  function laserHit(y) {
    const s = G.ship;
    if (Math.abs(s.y - y) < 6 + CORE_HIT) { coreHit(); return; }
    for (let i = 0; i < 12; i++) { const m = G.sockets[i]; if (m && Math.abs(s.y + SOCK[i].y - y) < 6 + modR(m) * 0.8) { if (m.type === 'plate' && m.hp > 1) { m.hp = 1; m.flash = 1; snd('ding'); } else knock(i, SOCK[i].x * 3, (SOCK[i].y + 0.1) * 3); } }
  }

  /* ---------------------------------------------------------------- boss update */
  function updateBoss(dt) {
    const B = G.boss;
    if (!B) return;
    B.t += dt;
    if (B.dying) {
      B.dying += dt;
      // chained blasts across the hull, each with a hit-stop
      if ((B.chainT = (B.chainT || 0) - dt) <= 0 && B.dying < 1.5) {
        B.chainT = 0.13;
        const i = Math.floor(B.dying / 0.13);
        const p = B.pods[i % B.pods.length];
        const x = B.x + (i < B.pods.length ? p.ox : rand.range(-0.4, 0.4) * B.BW), y = B.y + (i < B.pods.length ? p.oy : rand.range(-0.3, 0.3) * B.BH);
        explode(x, y, 1.6, C.seeker);
        snd('boom', { pitch: rand.range(-6, 0) });
        fx.shake(8, 200);
        stopFor(80);
      }
      if (B.dying > 1.1 && !B.slow) {
        B.slow = true;
        slowmo(0.3, 400, 400);
        explode(B.x, B.y, 4, C.seeker);
        fx.shockwave(B.x, B.y, { radius: 260, color: '#ffffff', width: 8, ms: 700 });
        fx.burst(B.x, B.y, { count: 60, color: ['#ffffff', '#ffd23f', '#ff9a4a', C.seeker], shape: 'star', speed: [80, 420], life: [0.5, 1.3], size: [2, 5], glow: true, spin: [-8, 8] });
        addLight(B.x, B.y, 340, '#ffb070', 0.9);
        snd('boomBig', { pitch: -9 });
        fx.shake(18, 700);
      }
      B.y += 20 * dt;
      if (B.dying > 1.9) { G.boss = null; sectorClear(); }
      return;
    }
    if (B.t < B.enter) { B.y = lerp(-B.BH, B.ty, Kit.ease.cubicOut(B.t / B.enter)); return; }
    B.x = FW / 2 + Math.sin((B.t - B.enter) * 0.45) * Math.min(FW * 0.16, 70);
    B.y = B.ty + Math.sin(B.t * 0.7) * 8;
    if (G.dead) return;
    const dm = dens();
    for (const p of B.pods) {
      p.flash = Math.max(0, p.flash - dt);
      if (p.dead) { if (rand.chance(dt * 6)) fx.burst(B.x + p.ox, B.y + p.oy, { count: 1, color: ['#3a2440', '#5a4050'], speed: [10, 30], angle: -PI / 2, spread: 0.6, life: [0.6, 1.2], size: [3, 6], sizeEnd: 2.5, drag: 0.5 }); continue; }
      const x = B.x + p.ox, y = B.y + p.oy;
      p.ang = Kit.smooth(p.ang, aimAt(x, y), 3, dt);
      podFire(p, x, y, dt, dm);
    }
    const c = B.core;
    c.flash = Math.max(0, c.flash - dt);
    if (B.pods.every(p => p.dead)) {
      c.open = Math.min(1, c.open + dt * 1.5);
      if (c.open >= 1 && (c.ft -= dt) <= 0) {
        const x = B.x + c.ox, y = B.y + c.oy;
        c.mode++;
        if (c.mode % 2) { c.ft = 1.4 / dm; const n = 14 + Math.min(8, G.sector); for (let i = 0; i < n; i++) eshot(x, y, i / n * TAU + c.mode * 0.2, 115, true); }
        else { c.ft = 1.1 / dm; const a = aimAt(x, y); for (let i = -2; i <= 2; i++) eshot(x, y, a + i * 0.12, 175); }

  /* ---------------------------------------------------------------- the ship and its threats */

  function updateEnemyBullets(dt) {

  /* ---------------------------------------------------------------- control and autopilot */

  /* ---------------------------------------------------------------- main update */
  function update(dt) {

    G.t += dt;
    G.scroll += dt * (G.stage === 'boss' ? 26 : 60);

    G.hintT = Math.max(0, G.hintT - dt);
    if (G.expandT > 0 && (G.expandT -= dt) <= 0 && G.mode === 'play' && !G.dead) { snd('expand'); shell.toast('Hull expanded: 6 new sockets', 2400); }
    G.shown = G.shown < G.score ? Math.min(G.score, G.shown + Math.max(1, (G.score - G.shown) * 8 * dt)) : G.score;
    for (const l of G.lights) l.t += dt;
    G.lights = G.lights.filter(l => l.t < l.life);
    for (const f of G.fuses) f.t += dt;
    G.fuses = G.fuses.filter(f => f.t < 0.2);

  /* ================================================================ drawing */
  // Adaptive detail: if frames run long for a while (a slow GPU, a busy boss fight), drop the purely

  let lite = false, frameEma = 16.7, lastFrame = 0;

  }
  // Sky gradient, the amber star's glow and its rays, baked once per sector and size: one cheap blit a frame.
  let skyC = null, skyKey = '';
  function skyCanvas(si, w, h) {

    if (skyC && skyKey === key) return skyC;
    skyKey = key;

    g.fillStyle = gr; g.fillRect(0, 0, w, h);

  // Under the title, a dark band keeps the logo and tagline readable over the attract fight.

        for (let x = -bw / 2 - 12 + (t * 30) % 12; x < bw / 2 + 12; x += 12) { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x, -40); ctx.lineTo(x + 6, -40); ctx.lineTo(x - 30, 60); ctx.lineTo(x - 36, 60); ctx.closePath(); ctx.fill(); }
        ctx.restore();
      }
      stencil(bn.text.toUpperCase(), 0, -6, bn.style === 'wave' ? 26 : 24, bn.style === 'warn' ? (Math.sin(t * 16) > 0 ? '#ff8fb8' : C.cream) : C.cream, 'center', bn.style === 'wave' ? 'rgba(60,20,40,0.9)' : '#2a1020');
      if (bn.sub) { ctx.font = '700 11px ' + gfx.fonts.body; ctx.textAlign = 'center'; ctx.fillStyle = bn.style === 'warn' ? '#ffb0c8' : C.amber; ctx.fillText(bn.sub, 0, 17); }
      ctx.restore();
    }
    // teaching: a ghost hand shows the drag; a one-line warning on wave 2
    if (G.sector === 1 && !G.handDone && G.t < 14 && !G.teachDone) drawHand(w, h, t);
    if (G.hintT > 0) {
      const a = clamp(Math.min((4.5 - G.hintT) * 3, G.hintT), 0, 1);
      ctx.globalAlpha = a;
      const y = h * 0.58, tw = Math.min(w - 24, 330);
      ctx.fillStyle = 'rgba(20,6,18,0.7)'; ctx.fillRect(w / 2 - tw / 2, y - 15, tw, 30);
      ctx.fillStyle = C.hazard; ctx.fillRect(w / 2 - tw / 2, y - 15, 4, 30); ctx.fillRect(w / 2 + tw / 2 - 4, y - 15, 4, 30);
      ctx.font = '700 13px ' + gfx.fonts.body; ctx.textAlign = 'center'; ctx.fillStyle = C.cream; ctx.textBaseline = 'middle';
      ctx.fillText('Bullets knock parts off. Protect the core.', w / 2, y + 1);
      ctx.globalAlpha = 1;
    }
  }
  function drawHand(w, h, t) {
    const s = G.ship;
    const p = cam.toScreen(s.x, s.y, tmp);
    const k = Math.sin(t * 2.2);
    const x = p.x + k * 70, y = Math.min(p.y + 92 * zoom, view.h - 96);
    const a = clamp(G.t * 2, 0, 1) * 0.9;
    ctx.globalAlpha = a * 0.35;
    ctx.strokeStyle = C.cream; ctx.lineWidth = 2; ctx.setLineDash([3, 6]);
    ctx.beginPath(); ctx.moveTo(p.x - 70, y); ctx.lineTo(p.x + 70, y); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha = a;
    // fingertip and hand
    ctx.save(); ctx.translate(x, y); ctx.rotate(-0.25 + k * 0.08);
    ctx.fillStyle = 'rgba(255,233,200,0.92)'; ctx.strokeStyle = 'rgba(40,10,30,0.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(-6, 26); ctx.quadraticCurveTo(-18, 22, -20, 32); ctx.quadraticCurveTo(-12, 52, 2, 58); ctx.lineTo(20, 58); ctx.quadraticCurveTo(26, 44, 24, 30); ctx.lineTo(24, 20); ctx.quadraticCurveTo(18, 14, 12, 20); ctx.lineTo(12, 16); ctx.quadraticCurveTo(6, 10, 0, 14); ctx.lineTo(6, 0); ctx.quadraticCurveTo(0, -8, -6, 0); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
    gfx.light(ctx, x, y, 14, '#ffe9c8', 0.5 + 0.3 * Math.sin(t * 10));
    ctx.font = '700 13px ' + gfx.fonts.body; ctx.textAlign = 'center'; ctx.fillStyle = C.cream; ctx.textBaseline = 'middle';
    ctx.fillText('Drag anywhere to fly', p.x, y + 74);
    ctx.globalAlpha = 1;
  }
  function drawSchematic(x, y, t) {
    const S_ = 82;
    ctx.drawImage(plateSprite(S_, S_, 'h'), x, y, S_, S_);
    const cx = x + S_ / 2, cy = y + S_ / 2 + 4, k = 0.62;
    ctx.fillStyle = gfx.alpha(C.reactor, 0.9); ctx.beginPath(); ctx.arc(cx, cy, 5, 0, TAU); ctx.fill();
    for (let i = 0; i < 12; i++) {
      const sk = SOCK[i], m = G.sockets[i], open = i < 6 || G.ring2;
      const px = cx + sk.x * k, py = cy + sk.y * k;
      ctx.save(); ctx.translate(px, py);
      hexPath(ctx, m && m.tier === 2 ? 8 : 6);
      if (m) {
        ctx.fillStyle = TCOL[m.type]; ctx.fill();
        if (m.tier === 2) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.2; ctx.stroke(); }
        if (m.hitT > 0) { ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fill(); }
      } else {
        ctx.strokeStyle = open ? 'rgba(255,233,200,0.45)' : 'rgba(255,233,200,0.12)'; ctx.lineWidth = 1; ctx.stroke();
      }
      ctx.restore();
    }
    ctx.font = '800 7px ' + HUDF; ctx.textAlign = 'left'; ctx.fillStyle = '#d0b29f'; ctx.textBaseline = 'middle';
    ctx.fillText('HULL', x + 17, y + 9);
  }

  /* ================================================================ loop, input, shell */
  const loop = Kit.loop({ view, update, draw });
  const input = Kit.input(view.canvas);
  input.on('move', p => {
    if (!G || G.mode !== 'play' || G.dead || p !== input.pointer) return;
    // relative drag: the ship moves with the finger, never under it
    G.ship.tx += p.dx / zoom * 1.25; G.ship.ty += p.dy / zoom * 1.25;
    G.dragged += Math.abs(p.dx) + Math.abs(p.dy);
  });

  let titleExtra = null, overExtra = null, pauseExtra = null;
  const shell = Kit.shell({
    title: 'Scrapwing',
    kicker: 'Salvage run',
    tagline: 'Shoot down raiders. Bolt their guns onto your hull.',
    playLabel: 'Launch',
    how: [
      'Drag anywhere (or use the arrow keys / WASD) to fly. You fire on your own.',
      'Wrecked raiders drop parts. Touch one to bolt it to the nearest free socket on that side: Blaster, Fan, Seeker or armour Plate.',
      'Three of a kind side by side fuse into a glowing tier-2 module and free two sockets.',
      'Bullets knock parts off; catch them again within 2 seconds. A bullet on the core ends the run.',
      'Losing a part resets your chain multiplier. Every 5th wave is a boss: shoot its pods, then the core.',
    ],
    loop,
    focus: view.canvas,
    score: () => (G && G.mode === 'play' ? Math.floor(G.score) : 0),
    lose: () => { if (G && G.mode === 'play') { G.god = false; die(); } },
    runProps: () => ({ sector: G ? G.sector : 1 }),
    theme: {
      panel: 'solid', layout: 'bottom', button: 'cut', titleStyle: 'stamp', radius: 6,
      font: { display: HUDF, body: '"Figtree", system-ui, sans-serif' },
      colors: { ink: 'var(--ink)', inkSoft: 'var(--ink-soft)', panel: 'var(--panel)', accent: '#f08a3c', accentInk: '#2a0f12', scrim: 'var(--scrim)', line: 'var(--rim)' },
    },
    onStart() {
      const o = nextStart || {};
      nextStart = null;
      const cp = o.sector ? null : cpGet();
      newRun({ mode: 'play', seed: o.seed, sector: o.sector || (cp ? cp.sector : 1), score: o.score != null ? o.score : (cp ? cp.score : 0), god: !!o.god, auto: autopilot || !!o.auto });
      musicFor('run');
      Kit.music.duck(1);
      fx.flash('#ffe9c8', 240, 0.25);
      Kit.sfx('sw_whoosh');
      if (G.sector === 1) Arcade.progress(null);
    },
    onOver() { syncTitle(); },
  });
  function addAltButton(container, label, fn) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'k-btn sw-alt'; b.textContent = label;
    b.addEventListener('click', () => { Kit.sfx('click'); fn(); });
    container.appendChild(b);
    return b;
  }
  function freshStart() { Kit.save.set('cp', null); Arcade.progress(null); syncTitle(); }
  titleExtra = addAltButton(shell.el.querySelector('.k-title-actions'), 'New run from sector 1', () => { freshStart(); shell.start(); });
  overExtra = addAltButton(shell.el.querySelector('.k-over .k-stack'), 'Restart from sector 1', () => { freshStart(); shell.start(); });
  // Pause: "Restart" resumes the sector checkpoint, so say so, and offer a true fresh start beside it.
  const pauseRestart = shell.el.querySelector('.k-pause [data-k=restart]');
  pauseExtra = addAltButton(pauseRestart.parentNode, 'Restart from sector 1', () => { freshStart(); shell.restart(); });
  pauseRestart.after(pauseExtra);
  function syncTitle() {
    const cp = cpGet();
    const label = shell.el.querySelector('[data-k=play] span');
    if (label) label.textContent = cp ? 'Continue · Sector ' + cp.sector : 'Launch';
    const again = shell.el.querySelector('[data-k=again]');
    if (again) again.textContent = cp ? 'Retry sector ' + cp.sector : 'Play again';
    if (pauseRestart) pauseRestart.textContent = cp ? 'Retry sector ' + cp.sector : 'Restart';
    titleExtra.hidden = !cp; overExtra.hidden = !cp; pauseExtra.hidden = !cp;
  }
  syncTitle();
  { const cp = cpGet(); if (cp) Arcade.progress({ label: 'Sector ' + cp.sector }); }

  /* ---------------------------------------------------------------- test hook */
  function stepSeconds(s) { loop.step(Math.max(1, Math.round(s * 60))); }
  Arcade.test({
    seed(n) { nextStart = Object.assign(nextStart || {}, { seed: n }); },
    sector(n) { nextStart = Object.assign(nextStart || {}, { sector: n }); },
    startAt(seed, sector, o) { nextStart = Object.assign({ seed, sector }, o || {}); if (shell.phase === 'play' || shell.phase === 'paused') shell.restart(); else shell.start(); },
    step: stepSeconds,
    frames(n) { loop.step(n); },
    god(on) { if (G) G.god = !!on; },
    autopilot(on) { autopilot = !!on; if (G) G.auto = !!on; },
    give(type, tier, socket) {
      if (!G) return -1;
      if (socket === undefined) { const free = freeSockets(); socket = free[0]; }
      if (socket === undefined || G.sockets[socket]) return -1;
      G.sockets[socket] = mkMod(type, tier || 1);
      return socket;
    },
    catchPart(type, tier, dx, dy) { if (!G) return -1; return attach({ type, tier: tier || 1, x: G.ship.x + (dx || 0), y: G.ship.y + (dy == null ? -30 : dy) }); },
    dropPart(type, dx, dy) { dropPart(type, 1, G.ship.x + (dx || 0), G.ship.y + (dy == null ? -120 : dy), false); },
    shootAt(socket) {
      // an enemy bullet aimed straight at a socket (or the core with -1)
      const s = G.ship, x = s.x + (socket >= 0 ? SOCK[socket].x : 0), y = s.y + (socket >= 0 ? SOCK[socket].y : 0);
      G.eb.push({ x, y: y - 40, vx: 0, vy: 300, r: 4.5 });
    },
    clearBullets() { if (G) G.eb.length = 0; },
    clearEnemies() { if (G) G.enemies.length = 0; },
    wave(n) { G.enemies.length = 0; G.eb.length = 0; G.boss = null; startWave(n); },
    spawn(type, x, y, o) { return G.enemies.indexOf(addEnemy(type, x == null ? FW / 2 : x, y == null ? 100 : y, Object.assign({ mv: 'line', vy: 0, amp: 0, freq: 0, bx: x == null ? FW / 2 : x, nofire: true }, o || {}))); },
    hitPod(i, dmg) { const B = G.boss; if (!B) return false; const p = B.pods[i]; if (!p || p.dead) return false; damagePod(p, dmg == null ? 1e6 : dmg, B.x + p.ox, B.y + p.oy); return true; },
    hit(i, dmg) { const e = G.enemies[i]; if (e) damage(e, dmg == null ? 999 : dmg, null); },
    // start the boss's death sequence without running time (to test the slow motion and the clear)
    killBoss() { if (!G.boss) return false; for (const p of G.boss.pods) p.dead = true; G.boss.core.open = 1; G.boss.core.hp = 0; bossDie(); return true; },
    win() {
      // finish the current wave (or kill the boss) at once
      if (G.boss) { for (const p of G.boss.pods) p.dead = true; G.boss.core.open = 1; G.boss.core.hp = 0; bossDie(); for (let i = 0; i < 600 && G.stage !== 'clear'; i++) loop.step(1); }
      else { for (const e of G.enemies.slice()) kill(e); G.schedI = G.sched.length; stepSeconds(1.5); }
    },
    nextSector() { if (G.stage === 'clear') nextSector(); },
    info: () => (G ? {
      mode: G.mode, sector: G.sector, wave: G.wave, stage: G.stage, score: Math.floor(G.score), mult: G.mult, chain: G.chain, kills: G.kills, fusions: G.fusions,
      dead: G.dead, ring2: G.ring2, timeScale: loop.timeScale, x: G.ship.x, y: G.ship.y, fw: FW, fh: FH,
      modules: G.sockets.map(m => (m ? { type: m.type, tier: m.tier, hp: m.hp } : null)),
      enemies: G.enemies.length, bullets: G.eb.length, parts: G.parts.map(p => ({ type: p.type, tier: p.tier, loose: p.loose, x: Math.round(p.x), y: Math.round(p.y) })),
      boss: G.boss ? { pods: G.boss.pods.length, alive: G.boss.pods.filter(p => !p.dead).length, core: G.boss.core.hp, open: G.boss.core.open } : null,
      cp: cpGet(), sched: G.sched.map(s => s.type),
    } : null),
    sockets: () => SOCK.map((s, i) => ({ i, ring: s.ring, x: s.x, y: s.y, adj: s.adj.slice() })),
    moveTo(x, y) { G.ship.x = G.ship.tx = x; G.ship.y = G.ship.ty = y; },
    clearSave() { Kit.save.set('cp', null); Kit.save.set('taught', false); syncTitle(); },
  });

  /* ---------------------------------------------------------------- capture scenes */
  function scene(o, setup) {
    fx.seed(o.seed);
    nextStart = { seed: o.seed, sector: o.sector, god: true, auto: true };
    shell.start();
    G.silent = true;
    if (setup) setup();
    loop.stop();
  }
  function build(list) { for (const [i, type, tier] of list) G.sockets[i] = mkMod(type, tier); }
  Arcade.scenes({
    art: () => scene({ seed: 41, sector: 2 }, () => {
      G.sockets.fill(null);
      build([[0, 'blaster', 2], [1, 'fan', 1], [5, 'fan', 1], [2, 'seeker', 1], [4, 'seeker', 1], [3, 'plate', 2], [7, 'blaster', 1], [11, 'blaster', 1]]);
      G.wave = 5; G.enemies.length = 0; G.sched = []; G.schedI = 0; G.stage = 'boss';
      spawnBoss();
      G.banner = null;
      G.boss.t = G.boss.enter; G.boss.y = G.boss.ty;
      G.ship.x = G.ship.tx = FW * 0.52; G.ship.y = G.ship.ty = FH * 0.7;
      loop.step(150);
      G.ship.x = G.ship.tx = FW * 0.5; G.ship.y = G.ship.ty = FH * 0.7;
      G.boss.pods[0].hp = G.boss.pods[0].max * 0.4;
      loop.step(30);
      dropPart('seeker', 2, G.ship.x - 70, G.ship.y - 120, false);
      G.parts[G.parts.length - 1].vy = 0;
      const pd = G.boss.pods[G.boss.pods.length - 1];
      explode(G.boss.x + pd.ox, G.boss.y + pd.oy, 1.8, C.seeker);
      loop.step(10);
      // frame the duel: the boss above, the ship below, closer than in play
      const top = G.boss.y - G.boss.BH * 0.6, bot = G.ship.y + 70;
      cam.zoom = clamp(Math.min(view.h / (bot - top), view.w / (G.boss.BW + 60)), zoom, zoom * 1.45);
      cam.y = (top + bot) / 2; cam.x = (G.boss.x + G.ship.x) / 2;
      loop.render();
    }),
    shot1: () => scene({ seed: 12, sector: 1 }, () => {
      G.firstKill = false; G.handDone = true; G.teachDone = true;
      G.wave = 2; G.sched = waveSpec(1, 2); G.schedI = 0; G.waveT = 0; G.banner = null;
      G.sockets[0] = mkMod('blaster', 1); G.sockets[5] = mkMod('blaster', 1);
      G.score = G.shown = 340; G.mult = 2; G.chain = 6; G.kills = 7;
      loop.step(200);
      G.parts.length = 0;
      G.ship.x = G.ship.tx = FW * 0.5; G.ship.y = G.ship.ty = FH * 0.7;
      dropPart('fan', 1, G.ship.x + 34, G.ship.y - 100, false);
      attach({ type: 'fan', tier: 1, x: G.ship.x + 30, y: G.ship.y + 4 });
      loop.step(4);
      G.hintT = 3;
      loop.render();
    }),
    shot2: () => scene({ seed: 33, sector: 3 }, () => {
      G.sockets.fill(null);
      build([[0, 'blaster', 2], [2, 'fan', 1], [4, 'fan', 1], [5, 'seeker', 1], [1, 'plate', 1], [9, 'blaster', 1]]);
      G.wave = 5; G.enemies.length = 0; G.sched = []; G.schedI = 0; G.stage = 'boss';
      spawnBoss();
      G.banner = null;
      G.boss.t = G.boss.enter; G.boss.y = G.boss.ty;
      G.score = G.shown = 18640; G.mult = 6; G.chain = 27; G.kills = 140; G.fusions = 3;
      G.boss.pods[1].dead = true;
      loop.step(240);
      if (!G.sockets[2]) G.sockets[2] = mkMod('fan', 1);
      knock(2, 1, 0.2);
      G.chain = 3; G.mult = 1;
      loop.step(12);
    }),
  });

  /* ---------------------------------------------------------------- boot */
  buildLayers();
  view.onResize(() => fit());
  fit();
  // attract mode: the ship flies itself under the title, silent and scoreless
  newRun({ mode: 'attract', seed: 5, sector: 2, god: true, auto: true });
  build([[0, 'blaster', 2], [1, 'fan', 1], [5, 'fan', 1], [3, 'seeker', 1], [7, 'blaster', 1], [11, 'blaster', 1]]);
  loop.step(240);
  musicFor('title');
  loop.start();
})();
</script>
</body>
