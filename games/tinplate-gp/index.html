<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tinplate GP</title>
<meta name="description" content="Hold to throttle a lithographed tin slot car around a lamp-lit workbench. Too fast into a bend and it flies off the track.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Unbounded:wght@600;800&display=swap">
<style>
/* A night workshop: walnut bench, a desk-lamp pool, lithographed tin. The world keeps one palette in both
   themes (it is always night in the workshop); the tin toy-box menus keep their cream lids in both. */
:root {
  --cream: #f3e3c3; --cream-2: #e8d3a9; --red: #d43d2f; --red-dk: #a52a20; --navy: #23395b; --navy-2: #2f4c78;
  --gold: #e8b13a; --bench: #1a0f08; --ink-soft: #5b6a82; --scrim: rgba(26, 15, 8, 0.52);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --scrim: rgba(10, 5, 2, 0.66); --cream: #efdcb8; --cream-2: #e2c99c; color-scheme: dark; }
}
:root[data-theme="dark"] { --scrim: rgba(10, 5, 2, 0.66); --cream: #efdcb8; --cream-2: #e2c99c; color-scheme: dark; }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; background: var(--bench); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: var(--bench); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
#game { position: relative; display: block; width: 100%; height: 100%; outline: none; touch-action: none; }

/* ---------- the tin toy-box shell ---------- */
.k-shell[data-panel=paper] .k-panel {
  background:
    radial-gradient(circle at 14px 14px, #c9b48a 0 3px, #fff6df 3.5px 4px, transparent 4.5px),
    radial-gradient(circle at calc(100% - 14px) 14px, #c9b48a 0 3px, #fff6df 3.5px 4px, transparent 4.5px),
    radial-gradient(circle at 14px calc(100% - 14px), #c9b48a 0 3px, #fff6df 3.5px 4px, transparent 4.5px),
    radial-gradient(circle at calc(100% - 14px) calc(100% - 14px), #c9b48a 0 3px, #fff6df 3.5px 4px, transparent 4.5px),
    linear-gradient(160deg, rgba(255,255,255,.55), rgba(255,255,255,0) 38%, rgba(0,0,0,.06) 70%, rgba(255,255,255,.18)),
    var(--cream);
  border: 0;
  box-shadow: inset 0 0 0 5px var(--red), inset 0 0 0 7px var(--cream), inset 0 0 0 9px var(--navy), 0 18px 0 -6px rgba(0,0,0,.25), 0 26px 60px -18px rgba(0,0,0,.8);
  transform: none;
  padding: 26px 24px 22px;
}
.k-shell[data-panel=paper] .k-panel h2 { color: var(--red); text-shadow: 2px 2px 0 var(--navy); letter-spacing: .01em; text-transform: uppercase; }
.k-shell[data-panel=paper] .k-btn { box-shadow: inset 0 0 0 2.5px var(--navy), inset 0 -4px 0 rgba(35,57,91,.18); background: linear-gradient(#fff9ea, #ecdcb8); }
.k-shell[data-panel=paper] .k-btn.k-primary { background: linear-gradient(#e2503f, var(--red) 55%, var(--red-dk)); color: #fff6e4; text-shadow: 0 1px 0 rgba(0,0,0,.35); box-shadow: inset 0 0 0 2.5px var(--navy), inset 0 2px 0 rgba(255,255,255,.35), 4px 4px 0 var(--navy); letter-spacing: .04em; text-transform: uppercase; font-family: "Unbounded", "Arial Black", system-ui, sans-serif; font-weight: 800; }
.k-shell[data-panel=paper] .k-btn.k-primary:active { transform: translate(3px, 3px); box-shadow: inset 0 0 0 2.5px var(--navy), 1px 1px 0 var(--navy); }
.k-shell .k-title-inner.k-panel { width: min(400px, 100%); padding: 22px 20px 20px; gap: 10px; overflow: hidden auto; }
.k-shell .k-title-head { position: relative; padding: 8px 0 4px; isolation: isolate; }
.k-shell .k-title-head::before { content: ""; position: absolute; left: 50%; top: 46%; width: 340px; height: 340px; transform: translate(-50%, -50%); z-index: -1; border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, rgba(232,177,58,.55) 0 7deg, rgba(243,227,195,0) 7deg 15deg);
  -webkit-mask: radial-gradient(circle, #000 18%, transparent 62%); mask: radial-gradient(circle, #000 18%, transparent 62%); animation: tp-spin 60s linear infinite; }
@keyframes tp-spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
.k-shell .k-kicker { display: inline-block; align-self: center; background: var(--navy); color: var(--cream); padding: 7px 14px 6px; border-radius: 3px; letter-spacing: .22em; font-size: 11px; box-shadow: 0 2px 0 rgba(0,0,0,.25); clip-path: polygon(0 0, 100% 0, calc(100% - 8px) 50%, 100% 100%, 0 100%, 8px 50%); padding-inline: 20px; }
.k-shell[data-title-style=stamp] .k-title-h { color: var(--red); text-shadow: 3px 3px 0 var(--navy), 5px 6px 0 rgba(0,0,0,.18); font-size: clamp(36px, 12vw, 58px); letter-spacing: -.02em; line-height: .92; text-transform: uppercase; -webkit-text-stroke: 1px rgba(35,57,91,.35); }
.k-shell .k-tagline { color: var(--navy); font-size: 15px; font-weight: 700; max-width: 28ch; }
.k-shell .k-best { color: var(--ink-soft); }
.k-shell .k-best b { color: var(--navy); }
.k-shell .k-pausebtn { background: radial-gradient(circle at 35% 30%, #fffaf0, var(--cream) 60%, var(--cream-2)); color: var(--red); border-radius: 50%; box-shadow: inset 0 0 0 2.5px var(--navy), 0 3px 0 rgba(0,0,0,.35); -webkit-backdrop-filter: none; backdrop-filter: none; }
.k-shell .k-stat { background: rgba(35,57,91,.08); border: 1.5px dashed rgba(35,57,91,.25); }
.k-shell .k-newbest { background: var(--gold); color: var(--navy); }
.k-shell .k-score { color: var(--navy); text-shadow: 3px 3px 0 rgba(212,61,47,.35); }
.k-shell .k-eyebrow { color: var(--red); font-weight: 800; letter-spacing: .24em; }
.k-shell .k-toast { background: var(--cream); color: var(--navy); box-shadow: inset 0 0 0 2px var(--navy), 0 4px 0 rgba(0,0,0,.3); -webkit-backdrop-filter: none; backdrop-filter: none; border-radius: 8px; white-space: normal; text-align: center; max-width: min(340px, calc(100% - 32px)); }
.k-shell .k-switch { background: rgba(35,57,91,.25); }

/* Garage and mode pickers on the toy-box lid */
.tp-garage { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 6px; width: 100%; }
.tp-arrow { appearance: none; border: 0; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font: 800 22px/1 "Unbounded", system-ui, sans-serif; color: var(--cream); background: radial-gradient(circle at 35% 30%, #3f5f8f, var(--navy)); box-shadow: inset 0 0 0 2px #1a2a44, 0 3px 0 rgba(0,0,0,.3); display: grid; place-items: center; padding: 0 0 2px; }
.tp-arrow:active { transform: translateY(2px); box-shadow: inset 0 0 0 2px #1a2a44; }
.tp-arrow:disabled { opacity: .35; cursor: default; }
.tp-car { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.tp-car canvas { width: 150px; height: 60px; display: block; }
.tp-car-name { font: 800 14px/1.1 "Unbounded", "Arial Black", system-ui, sans-serif; color: var(--navy); text-transform: uppercase; letter-spacing: .02em; }
.tp-car-desc { font: 600 12px/1.25 "Figtree", system-ui, sans-serif; color: var(--ink-soft); text-align: center; min-height: 15px; }
.tp-bars { display: flex; gap: 10px; font: 700 10px/1 "Figtree", system-ui, sans-serif; color: var(--navy); letter-spacing: .12em; text-transform: uppercase; }
.tp-bars i { display: inline-block; width: 7px; height: 7px; margin-left: 2px; border-radius: 50%; background: rgba(35,57,91,.2); vertical-align: 0; }
.tp-bars i.on { background: var(--red); }
.tp-modes { display: flex; gap: 0; border-radius: 999px; box-shadow: inset 0 0 0 2px var(--navy); overflow: hidden; }
.tp-modes button { appearance: none; border: 0; min-height: 44px; padding: 0 16px; font: 700 14px/1 "Figtree", system-ui, sans-serif; color: var(--navy); background: transparent; cursor: pointer; }
.tp-modes button[aria-pressed=true] { background: var(--navy); color: var(--cream); }
.tp-cont { font: 700 14px/1.3 "Figtree", system-ui, sans-serif; color: var(--navy); background: rgba(35,57,91,.08); padding: 8px 14px; border-radius: 8px; border: 1.5px dashed rgba(35,57,91,.3); }
.tp-link { appearance: none; border: 0; background: none; min-height: 44px; padding: 0 12px; color: var(--red); font: 700 14px/1 "Figtree", system-ui, sans-serif; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
@media (max-height: 640px) { .tp-car canvas { height: 46px; width: 116px; } .k-shell .k-tagline { font-size: 13px; } .k-shell .k-title-inner.k-panel { gap: 7px; padding: 16px 16px 14px; } }
@media (prefers-reduced-motion: reduce) { .k-shell .k-title-head::before { animation: none; } }
.kiln-keyart .tp-ui { display: none !important; }
</style>
</head>
<body>
<canvas id="game" aria-label="Tinplate GP: a slot car race on a workbench"></canvas>
<script src="../../hub/sdk.js"></script>
<script src="../../hub/kit.js"></script>
<script>
(() => {
  'use strict';
  Arcade.init({ id: 'tinplate-gp', title: 'Tinplate GP', version: '1.0.0' });
  const { gfx, fx } = Kit;
  const TAU = Math.PI * 2, clamp = Kit.clamp, lerp = Kit.lerp;

  const view = Kit.view(document.getElementById('game'), { alpha: false });
  const ctx = view.ctx;

  /* ============================================================ constants */
  const W0 = 360, H0 = 620;                       // the track box, world units (portrait)
  const OFFS = [22.5, 7.5, -7.5, -22.5];          // lane offsets toward the inside of the circuit
  const HALF = 32, TW = 64;                        // track half width and width
  const DS = 4;                                    // sample spacing
  const GRIP = 400, VTOP = 360, ACC = 470, BRAKE = 560, ROLL = 10;
  const SLIP_T = 0.12;
  const LOOP_RV = 30, LOOP_VMIN = 205, LOOP_G = LOOP_VMIN * LOOP_VMIN / (5 * LOOP_RV), LOOP_RING = 40;
  const J_RAMP = 28, J_GAP = 34, J_LAND = 28, J_LO = 170, J_HI = 300;
  const CARL = 24, CARW = 12;
  const LAPS = 5, RACES = 6, POINTS = [10, 6, 3, 1];
  const POS = ['1st', '2nd', '3rd', '4th'];
  const LANE_COL = ['#e2463a', '#f2c14e', '#4f8fd8', '#5fbf7a'];

  const CARS = [
    { id: 'bluebird', name: 'Bluebird', num: 7, body: '#2f5d9e', trim: '#f3e3c3', acc: '#d43d2f', grip: 1, accel: 1, top: 1, slip: 1.05, unlock: 0, desc: 'Even-tempered all-rounder' },
    { id: 'lizzie', name: 'Tin Lizzie', num: 3, body: '#4f9a78', trim: '#f6e7c8', acc: '#23395b', grip: 1.08, accel: 0.86, top: 0.97, slip: 1.06, unlock: 1, desc: 'Light: grips well, slow off the line' },
    { id: 'rocket', name: 'Red Rocket', num: 1, body: '#d43d2f', trim: '#ffd36b', acc: '#23395b', grip: 0.94, accel: 1.22, top: 1.05, slip: 1.035, unlock: 3, desc: 'Heavy: fierce pickup, flies off easily' },
    { id: 'comet', name: 'Silver Comet', num: 9, body: '#c9ced2', trim: '#2f5d9e', acc: '#d43d2f', grip: 0.98, accel: 1, top: 1.1, slip: 1.045, unlock: 6, desc: 'Streamliner: the fastest straights' },
    { id: 'goldbug', name: 'Gold Bug', num: 5, body: '#e0a526', trim: '#1d1d1d', acc: '#d43d2f', grip: 1.07, accel: 1.1, top: 1.05, slip: 1.05, unlock: 'cup', desc: 'Win a championship to unlock' },
  ];
  const AI_CARS = [
    { id: 'marmalade', name: 'Marmalade', num: 4, body: '#e3742f', trim: '#fff2d6', acc: '#5a2d0c', grip: 1, accel: 1.02, top: 1, slip: 1.05 },
    { id: 'plum', name: 'Plum', num: 8, body: '#7d4a8c', trim: '#f3e3c3', acc: '#e8b13a', grip: 1.02, accel: 0.98, top: 1, slip: 1.05 },
    { id: 'tealbird', name: 'Kingfisher', num: 2, body: '#2b8a8f', trim: '#f6e7c8', acc: '#d43d2f', grip: 1, accel: 1, top: 1.02, slip: 1.05 },
  ];
  const ALL_CARS = CARS.concat(AI_CARS);
  const carById = id => ALL_CARS.find(c => c.id === id) || CARS[0];

  // Rounded-polygon templates: [x, y, corner radius] in the 360 x 620 box.
  const TEMPLATES = {
    oval: { name: 'Lamp Oval', v: [[45, 45, 125], [315, 45, 125], [315, 575, 125], [45, 575, 125]] },
    kidney: { name: 'Biscuit Kidney', v: [[60, 45, 100], [310, 55, 110], [310, 570, 110], [60, 575, 100], [165, 310, 80]] },
    tri: { name: 'Thimble Tri-Oval', v: [[62, 45, 95], [298, 45, 95], [318, 395, 110], [180, 580, 85], [42, 395, 110]] },
    dogbone: { name: 'Dog-Bone Dash', v: [[45, 45, 90], [315, 45, 90], [315, 225, 70], [222, 310, 70], [315, 395, 70], [315, 575, 90], [45, 575, 90], [45, 395, 70], [138, 310, 70], [45, 225, 70]] },
    eight: { name: 'Spool Eight', v: [[50, 62, 75], [310, 62, 75], [50, 558, 75], [310, 558, 75]], cross: true },
    spiral: { name: 'Clockspring Spiral', v: [[115, 45, 95], [315, 45, 95], [315, 575, 95], [45, 575, 90], [45, 190, 85], [235, 190, 55], [235, 452, 55], [125, 452, 55]], cross: true },
    hairpin: { name: 'Pencil Hairpin', v: [[45, 45, 120], [315, 45, 120], [252, 575, 56], [138, 575, 56], [118, 330, 70]] },
  };
  const CUPS = ['Tin Cup', 'Brass Cup', 'Copper Cup', 'Chrome Cup', 'Gold Cup'];
  const cupName = c => CUPS[Math.min(c, CUPS.length - 1)] + (c >= CUPS.length ? ' ' + (c - CUPS.length + 2) : '');

  // What each race of a championship holds. Cup 0 introduces the pieces one by one.
  function raceConfig(cup, i, seed) {
    if (cup === 0) {
      return [
        { tpl: 'oval', banks: 0, loop: false, jump: false, tea: false, cross: 1, intro: 'Hold to go. Let go before the bend glows red.' },
        { tpl: 'kidney', banks: 2, loop: false, jump: false, tea: false, cross: 1, intro: 'New: banked turns. Striped bends hold more speed.' },
        { tpl: 'tri', banks: 1, loop: true, jump: false, tea: false, cross: 1, intro: 'New: loop-the-loop. Keep the gauge in the green or fall.' },
        { tpl: 'dogbone', banks: 1, loop: false, jump: true, tea: false, cross: 2, intro: 'New: jump ramp. Too slow falls short, too fast flips.' },
        { tpl: 'eight', banks: 2, loop: true, jump: false, tea: false, cross: 1, intro: 'Figure-eight with a bridge. Mind the banks.' },
        { tpl: 'spiral', banks: 2, loop: true, jump: true, tea: false, cross: 1, intro: 'The final: every piece on one circuit.' },
      ][i];
    }
    const r = Kit.rng(seed * 31 + i * 7);
    const order = r.shuffle(Object.keys(TEMPLATES).slice());
    return { tpl: order[i % order.length], banks: r.int(1, 2), loop: r.chance(0.7), jump: r.chance(0.6), tea: r.chance(0.55), cross: r.int(1, 2),
      intro: i === RACES - 1 ? 'The final race of the ' + cupName(cup) + '.' : 'Race ' + (i + 1) + ' of the ' + cupName(cup) + '.' };
  }

  /* ============================================================ track geometry */
  function roundedPoly(verts) {
    const n = verts.length, P = verts.map(v => ({ x: v[0], y: v[1], r: v[2] }));
    const len = [], dir = [];
    for (let i = 0; i < n; i++) {
      const a = P[i], b = P[(i + 1) % n], dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy);
      len.push(L); dir.push({ x: dx / L, y: dy / L });
    }
    const turn = [], tl = [];
    for (let i = 0; i < n; i++) {
      const d1 = dir[(i - 1 + n) % n], d2 = dir[i];
      const t = Math.atan2(d1.x * d2.y - d1.y * d2.x, d1.x * d2.x + d1.y * d2.y);
      turn.push(t); tl.push(P[i].r * Math.tan(Math.abs(t) / 2));
    }
    for (let it = 0; it < 6; it++) for (let i = 0; i < n; i++) {
      const j = (i + 1) % n, need = tl[i] + tl[j], L = len[i] * 0.96;
      if (need > L) { const f = L / need; P[i].r *= f; P[j].r *= f; tl[i] *= f; tl[j] *= f; }
    }
    const pieces = [];
    for (let i = 0; i < n; i++) {
      const p = P[i], d1 = dir[(i - 1 + n) % n], d2 = dir[i], t = turn[i], sg = Math.sign(t) || 1;
      const T1 = { x: p.x - d1.x * tl[i], y: p.y - d1.y * tl[i] }, T2 = { x: p.x + d2.x * tl[i], y: p.y + d2.y * tl[i] };
      const C = { x: T1.x - d1.y * p.r * sg, y: T1.y + d1.x * p.r * sg };
      pieces.push({ type: 'arc', C, r: p.r, a0: Math.atan2(T1.y - C.y, T1.x - C.x), turn: t, sg, len: p.r * Math.abs(t) });
      const j = (i + 1) % n, q = P[j];
      const T1n = { x: q.x - d2.x * tl[j], y: q.y - d2.y * tl[j] };
      pieces.push({ type: 'line', a: T2, b: T1n, d: d2, len: Math.hypot(T1n.x - T2.x, T1n.y - T2.y) });
    }
    return { pieces, minR: Math.min(...P.map(p => p.r)) };
  }

  function sampleCenter(pieces) {
    const X = [], Y = [], TX = [], TY = [], K = [], ST = [], PC = [];
    pieces.forEach((pc, pi) => {
      if (pc.len < 0.5) return;
      const m = Math.max(1, Math.ceil(pc.len / DS));
      for (let j = 0; j < m; j++) {
        const u = j / m;
        if (pc.type === 'arc') {
          const a = pc.a0 + pc.turn * u;
          X.push(pc.C.x + Math.cos(a) * pc.r); Y.push(pc.C.y + Math.sin(a) * pc.r);
          TX.push(-Math.sin(a) * pc.sg); TY.push(Math.cos(a) * pc.sg);
          K.push(pc.sg / pc.r); ST.push(0);
        } else {
          X.push(lerp(pc.a.x, pc.b.x, u)); Y.push(lerp(pc.a.y, pc.b.y, u));
          TX.push(pc.d.x); TY.push(pc.d.y); K.push(0); ST.push(1);
        }
        PC.push(j === 0 ? 1 : 0);
      }
    });
    return { X, Y, TX, TY, K, ST, PC };
  }

  function segX(ax, ay, bx, by, cx, cy, dx, dy) {
    const d = (bx - ax) * (dy - cy) - (by - ay) * (dx - cx);
    if (Math.abs(d) < 1e-9) return false;
    const u = ((cx - ax) * (dy - cy) - (cy - ay) * (dx - cx)) / d, v = ((cx - ax) * (by - ay) - (cy - ay) * (bx - ax)) / d;
    return u >= 0 && u <= 1 && v >= 0 && v <= 1;
  }

  // Builds a whole circuit: centre samples, four lanes with arc length and corner limits, pieces.
  function buildTrack(cfg, seed) {
    const T = TEMPLATES[cfg.tpl];
    const r = Kit.rng(seed);
    let built = null;
    for (let attempt = 0; attempt < 12 && !built; attempt++) {
      const jit = attempt < 11 ? 1 : 0;
      const mirror = r.chance(0.5), reverse = r.chance(0.5);
      let v = T.v.map(p => [p[0] + r.range(-11, 11) * jit, p[1] + r.range(-13, 13) * jit, p[2] * (1 + r.range(-0.08, 0.08) * jit)]);
      v = v.map(p => [clamp(p[0], 40, 320), clamp(p[1], 40, 580), p[2]]);
      if (mirror) v = v.map(p => [W0 - p[0], p[1], p[2]]);
      if (reverse) v.reverse();
      const rp = roundedPoly(v);
      if (rp.minR < 50) continue;
      const c = sampleCenter(rp.pieces);
      const t = finishTrack(c, cfg, r, T);
      if (t) built = t;
    }
    if (!built) {
      const rp = roundedPoly(T.v);
      built = finishTrack(sampleCenter(rp.pieces), cfg, r, T, true);
    }
    built.tpl = cfg.tpl; built.name = T.name; built.seed = seed; built.cfg = cfg;
    return built;
  }

  function finishTrack(c, cfg, r, T, force) {
    let N = c.X.length;
    // overlap and crossing analysis
    const crossings = [];
    for (let i = 0; i < N; i++) {
      const i2 = (i + 1) % N;
      for (let j = i + 30; j < N; j++) {
        if (N - (j - i) < 30) continue;
        const j2 = (j + 1) % N;
        if (Math.abs(c.X[i] - c.X[j]) > 12 || Math.abs(c.Y[i] - c.Y[j]) > 12) continue;
        if (segX(c.X[i], c.Y[i], c.X[i2], c.Y[i2], c.X[j], c.Y[j], c.X[j2], c.Y[j2])) crossings.push([i, j]);
      }
    }
    if (!force) {
      if (!!T.cross !== crossings.length > 0 || crossings.length > 1) return null;
      for (let i = 0; i < N; i += 2) for (let j = i + 24; j < N; j += 2) {
        if (N - (j - i) < 24) continue;
        const d = Math.hypot(c.X[i] - c.X[j], c.Y[i] - c.Y[j]);
        if (d < TW + 6) {
          const near = crossings.some(([a, b]) => (cd(i, a, N) < 26 && cd(j, b, N) < 26) || (cd(i, b, N) < 26 && cd(j, a, N) < 26));
          if (!near) return null;
        }
      }
    }
    // rotate so sample 0 sits 30% into the longest straight that is clear of the crossing
    const runs = straightRuns(c.ST, N);
    const okRun = runs.filter(rn => !crossings.some(([a, b]) => inRun(rn, a, N, 30) || inRun(rn, b, N, 30)));
    const best = (okRun.length ? okRun : runs).sort((a, b) => b.n - a.n)[0];

  /* ============================================================ physics */

    const sp = Kit.reducedMotion ? 10 : 26;
    fx.burst(px, py, { count: sp, color: ['#ffd27a', '#ffb347', '#fff1c1', '#e8743a'], shape: 'spark', speed: [80, 300], life: [0.2, 0.55], size: [1.4, 3], glow: true, gravity: 120 });
    fx.burst(px, py, { count: 8, color: ['#8a7a66', '#5d5146'], speed: [20, 70], life: [0.4, 0.8], size: [2, 4], drag: 2 });
    if (audible(c)) {
      const vol = c.human ? 1 : 0.45;
      sfx('crash', { vol }); sfx('boing', { vol: vol * 0.8, delay: 70 }); sfx('clatter', { vol, delay: 30 });
    }
    if (c.human) {
      fx.shake(7, 260);
      Kit.haptic([30, 30, 50]);
      loop.hitstop(60);
      G.zoom = 1; const sp2 = toScreen(px, py); G.zx = sp2.x; G.zy = sp2.y;
      if (!G.attract) {
        const msg = why === 'loop' ? 'Too slow for the loop!' : why === 'short' ? 'Too slow: fell short!' : why === 'flip' ? 'Too fast off the ramp!' : 'De-slotted!';
        fxFloatAt(c, msg, '#ffcf6b', 15);
        if (!tut.done && CH && CH.race === 0 && !G.toldDeslot) { G.toldDeslot = true; shell.toast('Too fast! Let go when the lane glows amber.', 2600); }
      }
    }
  }

  function stepOff(c, dt) {
    c.tOff += dt;
    c.x += c.vx * dt; c.y += c.vy * dt;
    c.z += c.vz * dt; c.vz -= 900 * dt;
    c.ang += c.spin * dt; c.roll += c.spin * 0.7 * dt * (c.z > 0.5 ? 1 : 0);
    if (c.z <= 0) {
      c.z = 0;
      if (c.vz < -70) {
        c.vz = -c.vz * 0.36;
        if (audible(c)) sfx('clink', { vol: c.human ? 0.8 : 0.3, pitch: G.rng.range(-3, 3) });
        fx.burst(c.x, c.y, { count: 5, color: ['#ffd27a', '#fff1c1'], shape: 'spark', speed: [40, 140], life: [0.15, 0.3], size: [1, 2], glow: true });
      } else c.vz = 0;
      const fr = Math.pow(0.04, dt);
      c.vx *= fr; c.vy *= fr; c.spin *= Math.pow(0.15, dt);
      c.roll = Kit.approach(c.roll, Math.round(c.roll / Math.PI) * Math.PI, dt * 6);
    }
    keepOnBench(c);
    const p = c.part;
    if (p) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.vz -= 900 * dt; p.rot += p.spin * dt;
      if (p.z <= 0) { p.z = 0; if (p.vz < -60) { p.vz = -p.vz * 0.4; } else p.vz = 0; const fr = Math.pow(0.03, dt); p.vx *= fr; p.vy *= fr; p.spin *= fr; }
      keepOnBench(p);
    }
    if (c.tOff >= 0.62) startGrab(c);
  }
  function keepOnBench(o) {
    const b = G.benchBox;
    if (!b) return;
    if (o.x < b.x0) { o.x = b.x0; o.vx = Math.abs(o.vx) * 0.4; } else if (o.x > b.x1) { o.x = b.x1; o.vx = -Math.abs(o.vx) * 0.4; }
    if (o.y < b.y0) { o.y = b.y0; o.vy = Math.abs(o.vy) * 0.4; } else if (o.y > b.y1) { o.y = b.y1; o.vy = -Math.abs(o.vy) * 0.4; }
  }

  function startGrab(c) {
    c.state = 'grab';
    // the arm reaches in from the nearest edge of the bench
    const b = G.benchBox || { x0: -60, x1: W0 + 60, y0: -60, y1: H0 + 60 };
    const d = [c.x - b.x0, b.x1 - c.x, c.y - b.y0, b.y1 - c.y];
    const k = d.indexOf(Math.min(...d));
    const base = [{ x: b.x0 - 40, y: c.y }, { x: b.x1 + 40, y: c.y }, { x: c.x, y: b.y0 - 40 }, { x: c.x, y: b.y1 + 40 }][k];
    let rl = c.rLane, rs = c.rs;
    // re-slot where the lane is clear
    for (let tries = 0; tries < 6; tries++) {
      locateTmp.lane = rl; locateTmp.s = rs; locateTmp.i = 0; locate(locateTmp);
      let free = true;
      for (const o of G.cars) if (o !== c && (o.state === 'slot' || o.state === 'air') && o.lane === rl && cd(o.i, locateTmp.i, TR.N) * DS < CARL * 1.4) free = false;
      if (free) break;
      rs = (rs - 30 + TR.lanes[rl].len) % TR.lanes[rl].len;
    }
    locateTmp.lane = rl; locateTmp.s = rs; locateTmp.i = 0; locate(locateTmp);
    const tp = lanePos(rl, locateTmp.i, locateTmp.f, { x: 0, y: 0 });
    const ta = Math.atan2(TR.TY[locateTmp.i], TR.TX[locateTmp.i]);
    c.grab = { t: 0, bx: base.x, by: base.y, cx: c.x, cy: c.y, ca: c.ang, tx: tp.x, ty: tp.y, ta, rl, rs, open: 1, claw: { x: base.x, y: base.y } };
    if (audible(c)) sfx('servo', { vol: c.human ? 0.8 : 0.3 });
  }
  const locateTmp = { lane: 0, s: 0, i: 0, f: 0 };
  function stepGrab(c, dt) {
    const g = c.grab;
    g.t += dt;
    const T_REACH = 0.32, T_LIFT = 0.42, T_CARRY = 0.86, T_DROP = 0.98;
    if (g.t < T_REACH) {
      const u = Kit.ease.cubicOut(g.t / T_REACH);
      g.claw.x = lerp(g.bx, g.cx, u); g.claw.y = lerp(g.by, g.cy, u); g.open = 1;
    } else if (g.t < T_LIFT) {
      g.claw.x = g.cx; g.claw.y = g.cy; g.open = 1 - (g.t - T_REACH) / (T_LIFT - T_REACH);
      c.z = 6 * (1 - g.open); c.x = g.cx; c.y = g.cy;
      c.roll = Kit.approach(c.roll, 0, dt * 12);
    } else if (g.t < T_CARRY) {
      const u = Kit.ease.sineInOut((g.t - T_LIFT) / (T_CARRY - T_LIFT));
      g.open = 0;
      c.x = lerp(g.cx, g.tx, u); c.y = lerp(g.cy, g.ty, u);
      c.z = 6 + Math.sin(u * Math.PI) * 26;
      c.ang = g.ca + Kit.angleDiff(g.ca, g.ta) * u; c.roll = 0;
      g.claw.x = c.x; g.claw.y = c.y;
      if (g.t - dt < T_LIFT && audible(c)) sfx('servo', { vol: c.human ? 0.6 : 0.25, pitch: 3 });
    } else if (g.t < T_DROP) {
      c.x = g.tx; c.y = g.ty; c.ang = g.ta; c.z = 6 * (1 - (g.t - T_CARRY) / (T_DROP - T_CARRY));
      g.claw.x = c.x; g.claw.y = c.y; g.open = (g.t - T_CARRY) / (T_DROP - T_CARRY);
    } else {
      // back in the slot
      c.state = 'slot'; c.z = 0; c.v = 0; c.th = 0; c.lane = g.rl; c.s = g.rs; c.i = 0; locate(c);
      if (c.rLaps < 0) c.laps = Math.max(0, c.laps - 1);
      c.rLaps = 0;
      c.part = null;
      g.retract = { t: 0, x: g.tx, y: g.ty, bx: g.bx, by: g.by };
      G.arms.push(g.retract);
      c.grab = null;
      if (audible(c)) sfx('clack', { vol: c.human ? 0.8 : 0.3, pitch: -4 });
      fx.burst(c.x, c.y, { count: 6, color: ['#ffe9b8'], shape: 'spark', speed: [30, 90], life: [0.2, 0.35], size: [1, 2], glow: true });
    }
  }

  function lapDone(c) {
    if (G.attract) { c.laps++; return; }
    const t = G.raceT - c.lapStart;
    c.lapStart = G.raceT;
    if (c.done) return;
    c.laps++;
    c.lastLap = t;
    c.lapTimes.push(t);
    if (!c.bestLap || t < c.bestLap) c.bestLap = t;
    let fastest = false;
    if (!G.fastest.t || t < G.fastest.t) { G.fastest = { t, car: c.id }; fastest = true; }
    if (c.human) {
      if (audible(c)) sfx('bell');
      hud.lapRoll[c.human - 1] = 1;
      if (fastest && c.laps > 0) { hud.gold = 1.4; sfx('gold'); fxFloatAt(c, 'Fastest lap ' + t.toFixed(2), '#ffd56b', 15); }
      // ghost of the best lap on this circuit
      if (c.human === 1 && !twoP) saveGhost(c, t);
      c.ghost = [];
      if (!tut.done && G.deslotsThisLap === 0 && CH && !twoP) { tut.done = true; saveTut(); Arcade.track('tutorial_complete', { race: CH.race + 1 }); }
      G.deslotsThisLap = 0;
    }
    if (c.laps >= LAPS) finishCar(c);
  }
  function finishCar(c) {
    if (c.done) return;
    c.done = true;
    c.finishT = G.raceT;
    G.finishOrder.push(c.id);
    if (c.human) {
      const place = G.finishOrder.length;
      sfx(place === 1 ? 'fanfare' : 'finish');
      Kit.music.duck(0.4, 900);
      confetti(place <= 3 ? 70 : 24);
      Kit.haptic(place === 1 ? [40, 60, 40, 60, 80] : [30, 40]);
      fx.flash('#fff3d1', 160, 0.3);
      const allHumansDone = G.cars.every(o => !o.human || o.done);
      if (allHumansDone && G.phase === 'race') { G.phase = 'finish'; G.finT = 0; }
    }
  }

  /* ============================================================ AI */
  function aiThrottle(c, dt, skill) {
    if (c.state !== 'slot') return 0;
    let sk = skill;
    if (!c.human && !G.attract) {
      if (c.cook > 0) { c.cook -= dt; sk = 1.1; }
      else if ((c.cookT -= dt) <= 0) {
        c.cook = 0.9;
        const rate = 0.035 * Math.max(0.05, 1.0 - skill) / 0.1;
        c.cookT = -Math.log(1 - G.rng.next() * 0.98) / rate;
      }
    }
    let target = brakeLimit(c, c.lane, 0.92) * sk;
    if (TR.loop) {
      const d = distAhead(c, TR.loop.i);
      if (d < 220 && d > 0) target = Math.max(Math.min(target, 1e9), Math.min(LOOP_VMIN * 1.12, brakeLimit(c, c.lane, 0.92)));
    }
    if (TR.jump) {
      const d = distAhead(c, TR.jump.lip);
      if (d < 220 && d > 0) target = Math.min(target, lerp(J_LO, J_HI, 0.55) + (sk - 0.95) * 200);
    }
    // traffic in the same lane
    for (const o of G.cars) {
      if (o === c || o.lane !== c.lane || (o.state !== 'slot' && o.state !== 'air')) continue;
      let d = TR.lanes[c.lane].cum[o.i] - c.s;
      if (d < 0) d += TR.lanes[c.lane].len;
      if (d < 60 && d > 0) {
        target = Math.min(target, o.v + (d - 30) * 2);
        if (!c.human && !c.want && G.rng.chance(dt * 2)) {
          const dir = c.lane === 0 ? 1 : c.lane === 3 ? -1 : (G.rng.chance(0.5) ? 1 : -1);
          if (laneFree(c, c.lane + dir)) c.want = dir;
        }
      }
    }
    return clamp((target - c.v) / 18, 0, 1);
  }

  // cars in one lane cannot pass through each other
  function resolveTraffic() {
    const N = TR.N;
    for (const a of G.cars) {
      if (a.state !== 'slot') continue;
      for (const b of G.cars) {
        if (a === b || b.lane !== a.lane || (b.state !== 'slot' && b.state !== 'air')) continue;
        const L = TR.lanes[a.lane];
        let d = L.cum[b.i] + b.f * (L.cum[b.i + 1] - L.cum[b.i]) - a.s;
        if (d < 0) d += L.len;
        if (d > 0 && d < CARL) {
          const rel = a.v - b.v;
          a.s -= (CARL - d); if (a.s < 0) { a.s += L.len; a.laps = Math.max(0, a.laps - 1); }
          a.i = 0; locate(a);
          if (rel > 0) { a.v = b.v * 0.97; if (rel > 60 && audible(a)) { sfx('bump', { vol: a.human || b.human ? 0.8 : 0.3 }); if (a.human || b.human) Kit.haptic(10); } }
        }
      }
    }
    void N;
  }

  /* ============================================================ race flow */
  function update(dt) {
    if (!G) return;
    G.t += dt;
    hudUpdate(dt);
    if (G.phase === 'grid') {
      G.gridT += dt;
      const lights = Math.floor(G.gridT / 0.7);
      if (lights !== G.lastLight && lights >= 1 && lights <= 3) { sfx('beep'); G.lastLight = lights; }
      if (G.gridT >= 2.8) { G.phase = 'race'; G.raceT = 0; sfx('go'); fx.flash('#c8ffb0', 120, 0.18); Kit.haptic(25); G.banner = 0; }
    }
    const racing = G.phase === 'race' || G.phase === 'finish';
    if (racing) G.raceT += dt;
    if (G.phase === 'finish') {
      G.finT += dt;
      const allDone = G.cars.every(c => c.done);
      if (G.finT > 3.2 || (allDone && G.finT > 1.6)) endRace();
    }
    if (G.phase === 'results') { G.resT += dt; }
    for (const c of G.cars) {
      let th = 0;
      if (racing) {
        if (c.human && !c.done && !G.attract) th = humanThrottle(c);
        else th = aiThrottle(c, dt, c.done ? 0.72 : c.human ? (botSkill || 0.95) : c.skill);
        if (c.human && botSkill && !c.done) th = aiThrottle(c, dt, botSkill);
        if (c.want && !c.human && !G.attract) { /* AI waits for a crossover */ }
      } else if (G.phase === 'grid' && c.human) {
        c.th = Kit.approach(c.th, humanThrottle(c), dt / 0.3); // revving on the grid
      }
      if (racing) stepCar(c, dt, th);
      else if (G.phase === 'results') stepCar(c, dt, c.state === 'slot' ? aiThrottle(c, dt, 0.7) : 0);
      updateCarPose(c, dt);
      if (c.state === 'slot' && c.v > 220 && G.rng.chance(dt * (c.v - 200) / 60)) {
        fx.burst(c.x + Math.cos(c.ang) * 10, c.y + Math.sin(c.ang) * 10, { count: 1, color: ['#ffcf7a', '#fff2c8'], shape: 'spark', speed: [30, 80], life: [0.08, 0.18], size: [0.8, 1.6], glow: true });
      }
      if (c.human && c.state === 'slot' && racing && !c.done) recordGhost(c);
    }
    if (racing || G.phase === 'results') resolveTraffic();
    if (racing && !G.attract) updatePositions();
    for (let i = G.arms.length - 1; i >= 0; i--) { G.arms[i].t += dt; if (G.arms[i].t > 0.4) G.arms.splice(i, 1); }
    G.zoom = Math.max(0, G.zoom - dt * 1.1);
    G.loopPulse = Math.max(0, G.loopPulse - dt * 1.4);
    if (mode === 'play' && !G.attract) updateEngines(); else silenceEngines();
    if (G.attract && G.t > 70) startAttract(G.seedA + 1);
    tutorialTick(dt);
  }

  function updateCarPose(c, dt) {
    if (c.state === 'slot' || c.state === 'air') {
      lanePos(c.lane, c.i, c.f, tmpA);
      let x = tmpA.x, y = tmpA.y;
      let ang = Math.atan2(TR.TY[c.i], TR.TX[c.i]);
      if (c.sw) {
        let u = (c.i + c.f - c.sw.i0) / c.sw.n;
        if (u < 0) u += TR.N / c.sw.n;
        if (u >= 1) c.sw = null;
        else {
          const e = Kit.smoothstep(0, 1, u);
          lanePos(c.sw.from, c.i, c.f, tmpB);
          x = lerp(tmpB.x, x, e); y = lerp(tmpB.y, y, e);
          ang += Math.sin(u * Math.PI) * 0.35 * (c.lane > c.sw.from ? -TR.S : TR.S) * 1;
        }
      }
      // tail wiggle when past the limit
      const wig = c.shim > 0.02 ? Math.sin(G.t * 46) * 0.22 * Math.min(1, c.shim) : 0;
      c.x = x; c.y = y; c.ang = ang + wig;
      c.lean = Kit.smooth(c.lean, clamp(TR.K[c.i] * c.v * c.v / 40000, -1, 1), 10, dt);
      if (c.state === 'slot') c.z = 0;
    } else if (c.state === 'loop') {
      const p = loopPoint(c, c.loopTh);
      c.x = p.x; c.y = p.y; c.z = p.z; c.ang = p.ang;
    }
    c.keyRot += dt * (2 + c.v / 30);
  }

  function updatePositions() {
    const ord = rankCars();
    ord.forEach((c, k) => {
      if (c.human && c.prevPos && k + 1 !== c.prevPos) {
        const up = k + 1 < c.prevPos;
        hud.medalFlip[c.human - 1] = 1;
        sfx(up ? 'stamp' : 'stampdown');
        if (up) { Kit.haptic(14); fxFloatAt(c, 'P' + (k + 1), '#ffe08a', 14); }
      }
      c.pos = k + 1;
      if (c.human) c.prevPos = k + 1;
    });
  }
  function rankCars() {
    const N = TR.N;
    return G.cars.slice().sort((a, b) => {
      const fa = G.finishOrder.indexOf(a.id), fb = G.finishOrder.indexOf(b.id);
      if (fa >= 0 || fb >= 0) return (fa < 0 ? 99 : fa) - (fb < 0 ? 99 : fb);
      const pa = a.laps * N + progIdx(a), pb = b.laps * N + progIdx(b);
      return pb - pa;
    });
  }
  function progIdx(c) {
    if (c.state === 'off' || c.state === 'grab') {
      locateTmp.lane = c.rLane; locateTmp.s = c.rs; locateTmp.i = 0; locate(locateTmp);
      return locateTmp.i + (c.rLaps < 0 ? -TR.N : 0);
    }
    return c.i + c.f;
  }

  function endRace() {
    if (G.phase === 'results') return;
    G.phase = 'results'; G.resT = 0;
    const ord = rankCars();
    const res = ord.map((c, k) => ({ id: c.id, car: c.model, human: c.human, pos: k + 1, pts: POINTS[k], best: c.bestLap }));
    const fl = G.fastest.car;
    G.results = res;
    if (CH) {
      for (const r of res) { CH.pts[r.id] += r.pts; if (r.pos === 1) CH.wins[r.id]++; }
      if (fl >= 0) CH.fl[fl]++;
      const me = res.find(r => r.human === 1);
      if (me && me.pos <= 3 && !twoP) { const p = Kit.save.get('podiums', 0) + 1; Kit.save.set('podiums', p); G.unlocked = unlockedNow(p); }
      CH.history.push(res.map(r => r.pos));
      CH.race++;
      saveChamp();
    }
    Kit.music.duck(0.55, 600);
    sfx('tally');
  }
  function unlockedNow(p) {
    const c = CARS.find(cc => cc.unlock === p);
    return c ? c.name : null;
  }
  function continueAfterResults() {
    if (!G || G.phase !== 'results' || G.resT < 1.0) return;
    if (CH.race >= RACES) { finishChampionship(); return; }
    sfx('select');
    beginRace();
  }

  /* ============================================================ championship */
  function newChampionship(seed) {
    const cup = Kit.save.get('cupLevel', 0);
    const s = seed === null || seed === undefined ? (cup === 0 ? 1001 : 1000 + cup * 97 + ((Math.random() * 1e6) | 0)) : seed;
    const rr = seedRng(s);
    const ai = rr.shuffle(ALL_CARS.filter(c => c.id !== selCar).map(c => c.id)).slice(0, 3);
    CH = { seed: s, cup, race: 0, pts: [0, 0, 0, 0], wins: [0, 0, 0, 0], fl: [0, 0, 0, 0], history: [], twoP, car: selCar, car2: twoP ? pickP2Car() : null, ai };
    saveChamp();
  }
  function pickP2Car() { const u = CARS.filter(c => c.id !== selCar && isUnlocked(c)); return (u[0] || CARS.find(c => c.id !== selCar)).id; }
  function beginRace() {
    const cfg = raceConfig(CH.cup, CH.race, CH.seed);
    const skillBase = Math.min(0.99, 0.86 + 0.024 * CH.race + 0.01 * Math.min(CH.cup, 3));
    // the player rotates through the middle lanes; AI fills the rest
    const humanLane = [1, 2, 1, 2, 1, 2][CH.race];
    const lanes = [humanLane];
    const humans = [{ p: 1, car: CH.car }];
    if (CH.twoP) { lanes.push(humanLane === 1 ? 2 : 1); humans.push({ p: 2, car: CH.car2 }); }
    for (let l = 0; l < 4; l++) if (!lanes.includes(l)) lanes.push(l);
    const skill = [0, 0, 0, 0].map((_, k) => skillBase + (k - 2) * 0.008);
    newRace(cfg, CH.seed * 7 + CH.race * 131 + 3, { humans, aiModels: CH.ai, lanes, skill });
    G.raceNo = CH.race;
    G.arms = [];
    G.ghost = loadGhost();
    hud.lapRoll = [0, 0]; hud.medalFlip = [0, 0];
    Kit.music.play(RAG, { restart: true });
    Kit.music.layer('brush', true);
    Kit.music.duck(0.5, 2600);
    sfx('ratchet');
    progress();
  }
  function finishChampionship(forced) {
    if (!CH) return;
    const order = [0, 1, 2, 3].sort((a, b) => CH.pts[b] - CH.pts[a] || CH.wins[b] - CH.wins[a] || a - b);
    const me = 0;
    const lead = order[0];
    const winHuman = G.cars[lead] && G.cars[lead].human;
    const myPlace = order.indexOf(me) + 1;
    const won = !forced && (CH.twoP ? !!winHuman : lead === me);
    const score = runScore();
    const stats = [
      { label: 'Championship', value: POS[myPlace - 1] + ' of 4' },
      { label: 'Points', value: String(CH.pts[me]) },
      { label: 'Race wins', value: String(CH.wins[me]) },
      { label: 'Fastest laps', value: String(CH.fl[me]) + ' (+' + Kit.fmt(CH.fl[me] * 250) + ')' },
    ];
    let title = won ? cupName(CH.cup) + ' champion!' : cupName(CH.cup) + ' over';
    if (CH.twoP) title = winHuman ? 'Player ' + winHuman + ' takes the cup!' : 'The tin bots take the cup';
    if (won && !CH.twoP && !forced) {
      Kit.save.set('cupLevel', CH.cup + 1);
      Kit.save.set('cups', Kit.save.get('cups', 0) + 1);
    }
    const races = CH.race;
    CH = null;
    Kit.save.set('champ', null);
    Arcade.progress(null);
    silenceEngines();
    Kit.music.duck(0.35);

    for (let k = 0; k < (twoP ? 2 : 1); k++) {

  function sfx(name, o) { if (G && G.attract) return false; return Kit.sfx(name, o); }
  function audible(c) { return !G.attract && (c.human || dist2Player(c) < 400 * 400 || true); }
  function dist2Player() { return 0; }

  // Each car has its own little electric motor: a sawtooth that rises with speed (yours loudest).
  const engines = [];
  function updateEngines() {
    if (!Kit.audio.ready) return;
    G.cars.forEach((c, k) => {
      if (!engines[k]) engines[k] = Kit.sfx.engine({ base: 62 + k * 7, vol: 0.05, wave: 'sawtooth' });
      const e = engines[k];
      const human = !!c.human;
      let lvl = (c.state === 'slot' || c.state === 'air' || c.state === 'loop') ? c.v / VTOP : 0;
      if (G.phase === 'grid' && human) lvl = c.th * 0.6;
      if (c.state === 'air') lvl = Math.min(1, lvl * 1.25);
      e.set(clamp(lvl * (human ? 1 : 0.55), 0, 1));
    });
    if (!engines.buzz) engines.buzz = Kit.sfx.engine({ base: 118, vol: 0.022, wave: 'square' });
    const me = humanCar(1);
    engines.buzz.set(me && me.state === 'slot' ? clamp(me.v / VTOP, 0, 1) : 0);
  }
  function silenceEngines() {
    for (let k = 0; k < engines.length; k++) if (engines[k]) { engines[k].stop(); engines[k] = null; }
    if (engines.buzz) { engines.buzz.stop(); engines.buzz = null; }

  // Ragtime swing at 120 bpm: toy-piano melody, square upright bass, brush snare, clockwork ticks.
  const RAG = {
    bpm: 120, swing: 0.34, key: 'F', scale: 'major', steps: 16,
    chords: [0, 0, 3, 3, 0, 5, 1, 4],
    tracks: [
      { name: 'tick', inst: 'hat', hits: 'x.g.x.g.x.g.x.go', vol: 0.55 },
      { name: 'brush', inst: 'snare', hits: '....x..g....x.gg', vol: 0.32, verb: 0.08, on: false },
      { name: 'bass', inst: 'bass', wave: 'square', notes: '0 . . . 4 . . . 0 . . . 4 . 5 .', follow: true, gate: 0.45, cutoff: 760, vol: 0.62 },
      { name: 'oompah', inst: 'pluck', wave: 'triangle', notes: '. . . . 2 . . . . . . . 2 . . .', follow: true, vol: 0.38, oct: 0 },
      { name: 'piano', inst: 'pluck', wave: 'triangle', oct: 1, vol: 0.55, delay: 0.12,

  /* ============================================================ layout */
  let L = { sc: 1, ox: 0, oy: 0, land: false, top: 0, bot: 0 };
  let layoutDirty = true;
  function doLayout() {
    const w = view.w, h = view.h;
    const land = w > h * 1.08;
    const ka = Kit.keyart;
    const bw = land ? H0 : W0, bh = land ? W0 : H0;
    const top = ka ? 6 : land ? 58 : 64, bot = ka ? 6 : land ? 12 : 76;
    const side = ka ? 6 : land ? 92 : 8;
    const sc = Math.min((w - side * 2) / bw, (h - top - bot) / bh);
    L = { sc, land, top, bot, ox: (w - bw * sc) / 2, oy: top + (h - top - bot - bh * sc) / 2, bw, bh };
    // the bench extends to the screen edges: keep tumbling cars on it
    if (G) {
      const a = toWorld(4, 4), b = toWorld(w - 4, h - 4);
      G.benchBox = { x0: Math.min(a.x, b.x) + 8, x1: Math.max(a.x, b.x) - 8, y0: Math.min(a.y, b.y) + 8, y1: Math.max(a.y, b.y) - 8 };
    }
    gfx.clearSprites('car');
    buildStatic();
    layoutDirty = false;
  }
  function toScreen(x, y) { return L.land ? { x: L.ox + L.sc * y, y: L.oy + L.sc * (W0 - x) } : { x: L.ox + L.sc * x, y: L.oy + L.sc * y }; }
  function toWorld(sx, sy) {
    const u = (sx - L.ox) / L.sc, v = (sy - L.oy) / L.sc;
    return L.land ? { x: W0 - v, y: u } : { x: u, y: v };
  }
  function worldTransform(g) {
    g.translate(L.ox, L.oy);
    g.scale(L.sc, L.sc);
    if (L.land) { g.translate(0, W0); g.rotate(-Math.PI / 2); }
  }
  view.onResize(() => { layoutDirty = true; });

  /* ============================================================ static art: bench, props, track */
  let staticCv = null, overCv = null, overBox = null;
  const LAMP = { fx: 0.4, fy: 0.36 };
  function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }

  function buildStatic() {
    if (!TR) return;
    const w = view.w, h = view.h, dpr = view.dpr;
    staticCv = mkCanvas(w * dpr, h * dpr);
    const g = staticCv.getContext('2d');
    g.scale(dpr, dpr);
    const rnd = Kit.rng(TR.seed + 77);
    paintBench(g, w, h, rnd);
    g.save();
    worldTransform(g);
    paintProps(g, rnd, dpr);
    paintTrack(g, dpr);
    g.restore();
    paintLight(g, w, h);
    // the elevated layer: bridge, start gantry
    overCv = mkCanvas(w * dpr, h * dpr);
    const o = overCv.getContext('2d');
    o.scale(dpr, dpr);
    o.save();
    worldTransform(o);
    overBox = paintOver(o, dpr);
    o.restore();
    o.globalCompositeOperation = 'source-atop';
    paintLight(o, w, h, true);
  }

  function paintBench(g, w, h, rnd) {
    g.fillStyle = '#5a381c';
    g.fillRect(0, 0, w, h);
    const land = L.land;
    // planks run along the long side of the screen
    const across = land ? h : w, along = land ? w : h;
    const pw = Math.max(70, across / Math.round(across / 96));
    g.save();
    if (land) { g.translate(w, 0); g.rotate(Math.PI / 2); }
    for (let p = 0; p * pw < across + 1; p++) {
      const x0 = p * pw;
      const base = ['#6b4423', '#61391d', '#714a27', '#664020'][p % 4];
      g.fillStyle = base;
      g.fillRect(x0, 0, pw, along);
      // grain
      const lines = Math.round(pw / 2.4);
      for (let k = 0; k < lines; k++) {
        const gx = x0 + rnd.range(0, pw);
        const amp = rnd.range(1, 5), freq = rnd.range(0.004, 0.012), ph = rnd.range(0, 6);
        g.strokeStyle = rnd.chance(0.5) ? `rgba(40,20,8,${rnd.range(0.12, 0.32).toFixed(2)})` : `rgba(150,100,55,${rnd.range(0.06, 0.16).toFixed(2)})`;
        g.lineWidth = rnd.range(0.4, 1.6);
        g.beginPath();
        for (let y = -10; y <= along + 10; y += 14) {
          const xx = gx + Math.sin(y * freq + ph) * amp + Math.sin(y * freq * 3.1 + ph) * amp * 0.25;
          if (y === -10) g.moveTo(xx, y); else g.lineTo(xx, y);
        }
        g.stroke();
      }
      // knots
      const knots = rnd.int(0, 2);
      for (let k = 0; k < knots; k++) {
        const kx = x0 + rnd.range(pw * 0.25, pw * 0.75), ky = rnd.range(0, along), kr = rnd.range(5, 11);
        for (let ring = 4; ring >= 0; ring--) {
          g.strokeStyle = `rgba(40,20,8,${0.15 + ring * 0.05})`;
          g.lineWidth = 1.2;
          g.beginPath(); g.ellipse(kx, ky, kr * 0.55 + ring * 2.6, kr * 1.6 + ring * 5, 0, 0, TAU); g.stroke();
        }
        g.fillStyle = 'rgba(35,18,6,0.7)';
        g.beginPath(); g.ellipse(kx, ky, kr * 0.5, kr * 1.2, 0, 0, TAU); g.fill();
      }
      // plank seam and bevel
      g.fillStyle = 'rgba(20,10,3,0.75)'; g.fillRect(x0, 0, 1.6, along);
      g.fillStyle = 'rgba(255,215,160,0.10)'; g.fillRect(x0 + 1.6, 0, 1, along);
      // end joints
      const joint = rnd.range(along * 0.2, along * 0.8);
      g.fillStyle = 'rgba(20,10,3,0.6)'; g.fillRect(x0, joint, pw, 1.4);
    }
    g.restore();
    // fine grain noise
    const nz = gfx.noiseTexture(128, 128, { seed: 4, alpha: 0.10, color: '#000', scale: 1 });
    g.save(); g.globalAlpha = 0.9; g.fillStyle = g.createPattern(nz, 'repeat'); g.fillRect(0, 0, w, h); g.restore();
    // scratches, sawdust, stain rings
    for (let k = 0; k < 40; k++) {
      g.strokeStyle = `rgba(255,220,170,${rnd.range(0.03, 0.08).toFixed(3)})`;
      g.lineWidth = 0.6;
      const x = rnd.range(0, w), y = rnd.range(0, h), a = rnd.range(0, TAU), l = rnd.range(8, 40);
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
    }
    for (let k = 0; k < 120; k++) {
      g.fillStyle = `rgba(230,190,130,${rnd.range(0.12, 0.35).toFixed(2)})`;
      const x = rnd.range(0, w), y = rnd.range(0, h);
      g.fillRect(x, y, rnd.range(0.6, 1.8), rnd.range(0.6, 1.8));
    }
  }

  // Warm lamp pool, falling off to a deep brown-black vignette. Baked once.
  function paintLight(g, w, h, atop) {
    const lx = w * LAMP.fx, ly = h * LAMP.fy, R = Math.hypot(w, h) * 0.78;
    g.save();
    if (!atop) {
      const warm = g.createRadialGradient(lx, ly, 0, lx, ly, R * 0.55);
      warm.addColorStop(0, 'rgba(255,210,122,0.30)');
      warm.addColorStop(0.5, 'rgba(255,190,100,0.10)');
      warm.addColorStop(1, 'rgba(255,190,100,0)');
      g.globalCompositeOperation = 'overlay';
      g.fillStyle = warm; g.fillRect(0, 0, w, h);
      g.globalCompositeOperation = 'source-over';
    }
    const dark = g.createRadialGradient(lx, ly, R * 0.16, lx, ly, R);
    dark.addColorStop(0, 'rgba(26,15,8,0)');
    dark.addColorStop(0.45, 'rgba(26,15,8,0.30)');
    dark.addColorStop(0.75, 'rgba(26,15,8,0.72)');
    dark.addColorStop(1, 'rgba(26,15,8,0.94)');
    if (atop) g.globalCompositeOperation = 'source-atop';
    g.fillStyle = dark; g.fillRect(0, 0, w, h);
    g.restore();
  }

  /* ---------- props (world units, seen from above) ---------- */
  function shadowOn(g, dpr, blur, ox, oy, a) {
    g.shadowColor = `rgba(12,6,2,${a || 0.55})`;
    g.shadowBlur = blur * L.sc * dpr;
    g.shadowOffsetX = ox * L.sc * dpr; g.shadowOffsetY = oy * L.sc * dpr;
  }
  function shadowOff(g) { g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetX = 0; g.shadowOffsetY = 0; }

  function paintProps(g, rnd, dpr) {
    const vis0 = toWorld(0, 0), vis1 = toWorld(view.w, view.h);
    const bx0 = Math.min(vis0.x, vis1.x), bx1 = Math.max(vis0.x, vis1.x), by0 = Math.min(vis0.y, vis1.y), by1 = Math.max(vis0.y, vis1.y);
    const placed = [];
    const clearOf = (x, y, r) => {
      for (let i = 0; i < TR.N; i += 3) if (Math.hypot(TR.X[i] - x, TR.Y[i] - y) < HALF + r + 4) return false;
      if (TR.loop && Math.hypot(TR.loop.cx - x, TR.loop.cy - y) < LOOP_RING + HALF + r + 6) return false;
      for (const p of placed) if (Math.hypot(p.x - x, p.y - y) < p.r + r + 4) return false;
      return true;

  function polyPath(g, xs, ys, i0, n, offX, offY) {
