        g.strokeStyle = `rgba(255,214,150,${(a * facing).toFixed(3)})`; g.lineWidth = 1.1;
        const nx = -TR.TY[i] * TR.S * 1.6, ny = TR.TX[i] * TR.S * 1.6;
        g.beginPath(); g.moveTo(ln.x[i] + nx, ln.y[i] + ny); g.lineTo(ln.x[i] + nx + TR.TX[i] * 7, ln.y[i] + ny + TR.TY[i] * 7); g.stroke();
      }
    });
    g.globalCompositeOperation = 'source-over';
  }
  function inRange(i, i0, n) { const d = (i - i0 + TR.N) % TR.N; return d <= n; }

  function paintTrack(g, dpr) {
    const N = TR.N;
    if (TR.loop) paintLoop(g, dpr);
    for (const [i0, n] of groundRanges()) paintRibbon(g, i0, n, dpr, false);
    // crossovers: diagonal slots between neighbouring lanes
    for (const co of TR.crossovers) {
      const a = co.i, b = (co.i + co.n) % N;
      for (let l = 0; l < 3; l++) {
        const A = TR.lanes[l], B = TR.lanes[l + 1];
        for (const [P, Q] of [[A, B], [B, A]]) {
          g.strokeStyle = '#c47a45'; g.lineWidth = 4.4; g.lineCap = 'round';
          g.beginPath(); g.moveTo(P.x[a], P.y[a]); g.bezierCurveTo(lerp(P.x[a], Q.x[b], 0.5), lerp(P.y[a], P.y[b], 0.5), lerp(P.x[a], Q.x[b], 0.5), lerp(Q.y[a], Q.y[b], 0.5), Q.x[b], Q.y[b]); g.stroke();
        }
      }
      for (let l = 0; l < 3; l++) {
        const A = TR.lanes[l], B = TR.lanes[l + 1];
        for (const [P, Q] of [[A, B], [B, A]]) {
          g.strokeStyle = '#060606'; g.lineWidth = 1.9;
          g.beginPath(); g.moveTo(P.x[a], P.y[a]); g.bezierCurveTo(lerp(P.x[a], Q.x[b], 0.5), lerp(P.y[a], P.y[b], 0.5), lerp(P.x[a], Q.x[b], 0.5), lerp(Q.y[a], Q.y[b], 0.5), Q.x[b], Q.y[b]); g.stroke();
        }
      }
      g.lineCap = 'butt';
      // printed arrows on the shoulder
      const m = (co.i + (co.n >> 1)) % N, nx = -TR.TY[m] * TR.S, ny = TR.TX[m] * TR.S;
      for (const side of [1, -1]) {
        g.fillStyle = '#e8b13a';
        const cx = TR.X[m] + nx * side * (HALF - 3), cy = TR.Y[m] + ny * side * (HALF - 3);
        g.beginPath(); g.arc(cx, cy, 2.2, 0, TAU); g.fill();
      }
    }
    // start / finish chequers
    {
      const i = 0, nx = -TR.TY[i] * TR.S, ny = TR.TX[i] * TR.S, tx = TR.TX[i], ty = TR.TY[i];
      for (let row = 0; row < 2; row++) for (let k = 0; k < 12; k++) {
        g.fillStyle = (k + row) % 2 ? '#f1e6cc' : '#141414';
        const o = -HALF + 2 + k * ((TW - 4) / 12), o2 = o + (TW - 4) / 12, s0 = -3 + row * 3, s1 = s0 + 3;
        g.beginPath();
        g.moveTo(TR.X[i] + nx * o + tx * s0, TR.Y[i] + ny * o + ty * s0); g.lineTo(TR.X[i] + nx * o2 + tx * s0, TR.Y[i] + ny * o2 + ty * s0);
        g.lineTo(TR.X[i] + nx * o2 + tx * s1, TR.Y[i] + ny * o2 + ty * s1); g.lineTo(TR.X[i] + nx * o + tx * s1, TR.Y[i] + ny * o + ty * s1); g.fill();
      }
      // grid boxes
      g.strokeStyle = 'rgba(243,227,195,0.5)'; g.lineWidth = 0.8;
      TR.lanes.forEach(ln => {
        const j = 3;
        g.beginPath(); g.moveTo(ln.x[j] - nx * 5, ln.y[j] - ny * 5); g.lineTo(ln.x[j] + nx * 5, ln.y[j] + ny * 5); g.stroke();
      });
    }
    if (TR.jump) paintJump(g, dpr);
    if (TR.teaSpot) paintTea(g);
  }

  function paintLoop(g, dpr) {
    const lp = TR.loop;
    // the hoop rises off the side of the straight; it casts a long shadow because it stands tall
    const rIn = Math.max(4, LOOP_RING - HALF), rOut = LOOP_RING + HALF;
    g.save();
    shadowOn(g, dpr, 22, 16, 26, 0.65);
    g.fillStyle = '#18181c';
    g.beginPath(); g.arc(lp.cx, lp.cy, rOut, 0, TAU); g.arc(lp.cx, lp.cy, rIn, 0, TAU, true); g.fill('evenodd');
    shadowOff(g);
    // struts
    g.strokeStyle = '#9aa1a8'; g.lineWidth = 2.4;
    for (let k = 0; k < 3; k++) {
      const a = Math.atan2(TR.Y[lp.i] - lp.cy, TR.X[lp.i] - lp.cx) + Math.PI + (k - 1) * 0.9;
      g.beginPath(); g.moveTo(lp.cx + Math.cos(a) * (rOut - 4), lp.cy + Math.sin(a) * (rOut - 4)); g.lineTo(lp.cx + Math.cos(a) * (rOut + 10), lp.cy + Math.sin(a) * (rOut + 10)); g.stroke();
    }
    const gr = g.createRadialGradient(lp.cx, lp.cy, rIn, lp.cx, lp.cy, rOut);
    gr.addColorStop(0, '#2a2a31'); gr.addColorStop(0.5, '#1e1e23'); gr.addColorStop(1, '#2c2c33');
    g.fillStyle = gr;
    g.beginPath(); g.arc(lp.cx, lp.cy, rOut - 2, 0, TAU); g.arc(lp.cx, lp.cy, rIn + 2, 0, TAU, true); g.fill('evenodd');
    // lanes on the hoop
    OFFS.forEach((o, li) => {
      const rr = LOOP_RING - o * lp.side;
      g.strokeStyle = '#c47a45'; g.lineWidth = 4.4; g.beginPath(); g.arc(lp.cx, lp.cy, rr, 0, TAU); g.stroke();
      g.strokeStyle = '#060606'; g.lineWidth = 1.9; g.beginPath(); g.arc(lp.cx, lp.cy, rr, 0, TAU); g.stroke();
      void li;
    });
    // ribs, as if seeing the hoop's cross-braces from above
    g.strokeStyle = 'rgba(255,255,255,0.12)'; g.lineWidth = 1;
    for (let k = 0; k < 16; k++) { const a = k * TAU / 16; g.beginPath(); g.moveTo(lp.cx + Math.cos(a) * rIn, lp.cy + Math.sin(a) * rIn); g.lineTo(lp.cx + Math.cos(a) * rOut, lp.cy + Math.sin(a) * rOut); g.stroke(); }
    g.strokeStyle = '#e8b13a'; g.lineWidth = 2; g.setLineDash([5, 5]);
    g.beginPath(); g.arc(lp.cx, lp.cy, rOut - 1.5, 0, TAU); g.stroke(); g.setLineDash([]);
    // a tin hub badge in the middle of the hoop
    g.fillStyle = '#d43d2f'; g.beginPath(); g.arc(lp.cx, lp.cy, Math.max(4, rIn - 1), 0, TAU); g.fill();
    g.fillStyle = '#f3e3c3'; star(g, lp.cx, lp.cy, Math.max(3, rIn - 3), Math.max(1.4, (rIn - 3) * 0.45));
    g.restore();
  }

  function paintJump(g, dpr) {
    const J = TR.jump, N = TR.N;
    const segQuad = (i, j, o0, o1) => {
      const nx = -TR.TY[i] * TR.S, ny = TR.TX[i] * TR.S, nxj = -TR.TY[j] * TR.S, nyj = TR.TX[j] * TR.S;
      g.beginPath();
      g.moveTo(TR.X[i] + nx * o0, TR.Y[i] + ny * o0); g.lineTo(TR.X[i] + nx * o1, TR.Y[i] + ny * o1);
      g.lineTo(TR.X[j] + nxj * o1, TR.Y[j] + nyj * o1); g.lineTo(TR.X[j] + nxj * o0, TR.Y[j] + nyj * o0); g.closePath();
    };
    // hazard chevrons on the take-off and landing ramps, lit brighter as they rise
    for (const [a, n, up] of [[J.i0, J.nR, true], [J.land, J.nL, false]]) {
      for (let q = 0; q < n; q++) {
        const i = (a + q) % N, j = (i + 1) % N, u = up ? q / n : 1 - q / n;
        g.fillStyle = `rgba(232,177,58,${(0.10 + u * 0.18).toFixed(3)})`;
        segQuad(i, j, -HALF + 2, HALF - 2); g.fill();
        g.fillStyle = q % 2 ? 'rgba(232,177,58,0.85)' : 'rgba(20,20,20,0.9)';
        segQuad(i, j, HALF - 6, HALF - 1.5); g.fill();
        segQuad(i, j, -HALF + 1.5, -HALF + 6); g.fill();
      }
    }
    // the lip edges and support legs over the open gap
    for (const [i, s] of [[J.lip, -1], [J.land, 1]]) {
      const nx = -TR.TY[i] * TR.S, ny = TR.TX[i] * TR.S;
      shadowOn(g, dpr, 10, 6, 10, 0.7);
      g.strokeStyle = '#e8b13a'; g.lineWidth = 2.6;
      g.beginPath(); g.moveTo(TR.X[i] + nx * HALF, TR.Y[i] + ny * HALF); g.lineTo(TR.X[i] - nx * HALF, TR.Y[i] - ny * HALF); g.stroke();
      shadowOff(g);
      g.fillStyle = '#9aa1a8';
      for (const side of [1, -1]) { g.beginPath(); g.arc(TR.X[i] + nx * side * (HALF + 2) + TR.TX[i] * s * 3, TR.Y[i] + ny * side * (HALF + 2) + TR.TY[i] * s * 3, 2.2, 0, TAU); g.fill(); }
    }
    // a shadowed gap shows the bench beneath
    const m = (J.lip + (J.nG >> 1)) % N;
    gfx.softShadow(g, TR.X[m] + 4, TR.Y[m] + 6, 22, 30, 0.35);
  }

  function paintTea(g) {
    const t = TR.teaSpot, rnd = Kit.rng(TR.seed + 5);
    g.save();
    g.fillStyle = 'rgba(150,90,35,0.55)';
    g.beginPath();
    const n = 14;
    for (let k = 0; k <= n; k++) { const a = k * TAU / n, r = 26 + rnd.range(-7, 9); const x = t.x + Math.cos(a) * r * 1.2, y = t.y + Math.sin(a) * r; if (!k) g.moveTo(x, y); else g.lineTo(x, y); }
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(190,130,60,0.35)';
    g.beginPath(); g.ellipse(t.x - 4, t.y - 3, 16, 10, 0.3, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(255,235,200,0.45)'; g.lineWidth = 1.4;
    g.beginPath(); g.arc(t.x - 6, t.y - 6, 12, 3.6, 4.6); g.stroke();
    for (let k = 0; k < 4; k++) { g.fillStyle = 'rgba(150,90,35,0.5)'; g.beginPath(); g.arc(t.x + rnd.range(-46, 46), t.y + rnd.range(-40, 40), rnd.range(2, 5), 0, TAU); g.fill(); }
    g.restore();
  }

  // Elevated pieces on their own layer: the bridge deck and the start gantry.
  function paintOver(g, dpr) {
    const N = TR.N;
    let box = null;
    const grow = (x, y, r) => { const p = toScreen(x, y); if (!box) box = { x0: p.x - r, y0: p.y - r, x1: p.x + r, y1: p.y + r }; else { box.x0 = Math.min(box.x0, p.x - r); box.y0 = Math.min(box.y0, p.y - r); box.x1 = Math.max(box.x1, p.x + r); box.y1 = Math.max(box.y1, p.y + r); } };
    for (const [, b] of TR.crossings) {
      let i0 = b, n = 0;
      while (TR.hgt[(i0 - 1 + N) % N] > 0.35 && n < N) { i0 = (i0 - 1 + N) % N; n++; }
      let len = 0;
      while (TR.hgt[(i0 + len) % N] > 0.35 && len < N) len++;
      // pillars
      for (let q = 4; q < len; q += 8) {
        const i = (i0 + q) % N, nx = -TR.TY[i] * TR.S, ny = TR.TX[i] * TR.S;
        for (const side of [1, -1]) {
          shadowOn(g, dpr, 6, 5, 8, 0.6);
          g.fillStyle = '#9aa1a8'; g.beginPath(); g.arc(TR.X[i] + nx * side * (HALF + 3), TR.Y[i] + ny * side * (HALF + 3), 3, 0, TAU); g.fill();
          shadowOff(g);
        }
      }
      paintRibbon(g, i0, len - 1, dpr, true);
      // guard rails
      for (const side of [1, -1]) {
        const e = edgeArrays(side * (HALF + 1.5));
        g.strokeStyle = '#d7dadc'; g.lineWidth = 2.2; polyPath(g, e.ex, e.ey, i0, len - 1); g.stroke();
        g.strokeStyle = '#d43d2f'; g.lineWidth = 2.2; g.setLineDash([6, 6]); polyPath(g, e.ex, e.ey, i0, len - 1); g.stroke(); g.setLineDash([]);
      }
      for (let q = 0; q < len; q += 3) { const i = (i0 + q) % N; grow(TR.X[i], TR.Y[i], (HALF + 26) * L.sc); }
    }
    // the start gantry: two tin posts and a chequered beam over the line
    {
      const i = 0, nx = -TR.TY[i] * TR.S, ny = TR.TX[i] * TR.S, tx = TR.TX[i], ty = TR.TY[i];
      const ax = TR.X[i] + nx * (HALF + 8) - tx * 2, ay = TR.Y[i] + ny * (HALF + 8) - ty * 2;
      const bx = TR.X[i] - nx * (HALF + 8) - tx * 2, by = TR.Y[i] - ny * (HALF + 8) - ty * 2;
      shadowOn(g, dpr, 12, 14, 20, 0.55);
      g.strokeStyle = '#23395b'; g.lineWidth = 7; g.lineCap = 'round';
      g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke();
      shadowOff(g);
      g.lineCap = 'butt';
      const n = 10;
      for (let k = 0; k < n; k++) {
        g.strokeStyle = k % 2 ? '#f3e3c3' : '#d43d2f'; g.lineWidth = 4.6;
        g.beginPath(); g.moveTo(lerp(ax, bx, k / n), lerp(ay, by, k / n)); g.lineTo(lerp(ax, bx, (k + 1) / n), lerp(ay, by, (k + 1) / n)); g.stroke();
      }
      for (const [px, py] of [[ax, ay], [bx, by]]) {
        shadowOn(g, dpr, 6, 4, 6, 0.6);
        g.fillStyle = '#e8b13a'; g.beginPath(); g.arc(px, py, 5.2, 0, TAU); g.fill();
        shadowOff(g);
        g.fillStyle = '#fff2c8'; g.beginPath(); g.arc(px - 1.4, py - 1.4, 1.8, 0, TAU); g.fill();
      }
      grow(ax, ay, 40); grow(bx, by, 40);
    }
    return box;
  }

  /* ============================================================ cars */
  function carSprite(model) {
    const sc = L.sc, pad = 5;
    const w = Math.ceil((CARL + pad * 2) * sc), h = Math.ceil((CARW + pad * 2) * sc);
    return gfx.sprite('car:' + model.id + ':' + sc.toFixed(3), w, h, (g, ww, hh) => {
      g.translate(ww / 2, hh / 2); g.scale(sc, sc);
      paintCar(g, model);
    });
  }
  function paintCar(g, m) {
    // wheels
    g.fillStyle = '#121212';
    for (const [x, y] of [[-7.5, -6.1], [-7.5, 6.1], [7, -5.8], [7, 5.8]]) { gfx.roundRect(g, x - 3.2, y - 1.5, 6.4, 3, 1.2).fill(); }
    g.fillStyle = '#b9c0c6';
    for (const [x, y] of [[-7.5, -6.6], [-7.5, 6.6], [7, -6.3], [7, 6.3]]) { g.fillRect(x - 1, y - 0.5, 2, 1); }
    // body
    const body = new Path2D();
    body.moveTo(-11.5, -4.6);
    body.bezierCurveTo(-6, -5.6, 2, -5.8, 6, -5.2);
    body.bezierCurveTo(10.5, -4.6, 12.6, -2.4, 12.6, 0);
    body.bezierCurveTo(12.6, 2.4, 10.5, 4.6, 6, 5.2);
    body.bezierCurveTo(2, 5.8, -6, 5.6, -11.5, 4.6);
    body.bezierCurveTo(-13, 3.2, -13, -3.2, -11.5, -4.6);
    const gr = g.createLinearGradient(0, -6, 0, 6);
    gr.addColorStop(0, gfx.shade(m.body, 0.28)); gr.addColorStop(0.45, m.body); gr.addColorStop(1, gfx.shade(m.body, -0.35));
    g.fillStyle = gr; g.fill(body);
    // fender bulges
    g.fillStyle = gfx.shade(m.body, -0.12);
    for (const [x, y] of [[-7.5, -4.6], [-7.5, 4.6], [7, -4.4], [7, 4.4]]) { g.beginPath(); g.ellipse(x, y, 3.8, 1.5, 0, 0, TAU); g.fill(); }
    g.save(); g.clip(body);
    // lithographed racing stripe
    g.fillStyle = m.trim; g.fillRect(-14, -1.7, 28, 3.4);
    g.fillStyle = m.acc; g.fillRect(-14, -2.3, 28, 0.55); g.fillRect(-14, 1.75, 28, 0.55);
    // halftone shading toward the shadow side
    g.fillStyle = 'rgba(0,0,0,0.22)';
    for (let y = -5.5; y <= 6; y += 1.25) for (let x = -12.5; x <= 13; x += 1.25) {
      const r = clamp((y + 0.5) / 6, 0, 1) * 0.5;
      if (r > 0.05) { g.beginPath(); g.arc(x + (Math.round(y / 1.25) % 2) * 0.62, y, r, 0, TAU); g.fill(); }
    }
    // sheen
    g.fillStyle = 'rgba(255,255,255,0.32)'; g.beginPath(); g.ellipse(1, -3.6, 9, 1.1, 0, 0, TAU); g.fill();
    g.restore();
    // grille and bumpers
    g.strokeStyle = '#e9edf0'; g.lineWidth = 1.2; g.lineCap = 'round';
    g.beginPath(); g.arc(9.6, 0, 3.5, -0.95, 0.95); g.stroke();
    g.strokeStyle = 'rgba(30,30,30,0.6)'; g.lineWidth = 0.4;
    for (let k = -2; k <= 2; k++) { g.beginPath(); g.moveTo(11.2, k * 0.9); g.lineTo(12.4, k * 0.9); g.stroke(); }
    const ch = g.createLinearGradient(0, -5, 0, 5); ch.addColorStop(0, '#ffffff'); ch.addColorStop(0.5, '#9aa3ab'); ch.addColorStop(1, '#e3e7ea');
    g.strokeStyle = ch; g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(12.7, -3.6); g.quadraticCurveTo(14.2, 0, 12.7, 3.6); g.stroke();
    g.beginPath(); g.moveTo(-12.6, -3.8); g.lineTo(-12.6, 3.8); g.stroke();
    // exhausts
    g.fillStyle = '#c5ccd2'; g.fillRect(-4, -6.4, 7, 0.9); g.fillRect(-4, 5.5, 7, 0.9);
    // number roundel
    g.fillStyle = m.trim; g.beginPath(); g.arc(5.2, 0, 3.3, 0, TAU); g.fill();
    g.strokeStyle = m.acc; g.lineWidth = 0.7; g.stroke();
    g.save(); g.translate(5.2, 0.15); g.rotate(Math.PI / 2); gfx.text(g, String(m.num), 0, 0, { size: 4.4, weight: 800, color: '#141414', world: true }); g.restore();
    // windscreen and cockpit with the tin driver
    g.fillStyle = 'rgba(190,225,240,0.85)'; g.beginPath(); g.ellipse(0.4, 0, 1.1, 3.3, 0, 0, TAU); g.fill();
    g.fillStyle = '#1b1712'; g.beginPath(); g.ellipse(-3, 0, 2.6, 3.1, 0, 0, TAU); g.fill();
    g.fillStyle = m.acc; g.beginPath(); g.arc(-2.8, 0, 2.05, 0, TAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.85)'; g.fillRect(-4.6, -0.35, 3.6, 0.7);
    g.fillStyle = 'rgba(255,255,255,0.5)'; g.beginPath(); g.arc(-3.3, -0.8, 0.7, 0, TAU); g.fill();
    // rivets and outline
    g.fillStyle = 'rgba(255,255,255,0.55)';
    for (const x of [-9, -6, 9]) { g.beginPath(); g.arc(x, -3.6, 0.35, 0, TAU); g.arc(x, 3.6, 0.35, 0, TAU); g.fill(); }
    g.strokeStyle = 'rgba(0,0,0,0.55)'; g.lineWidth = 0.45; g.stroke(body);
  }
  let shadowSpr = null;
  function shadowSprite() {
    const sc = L.sc;
    return gfx.sprite('carshadow:' + sc.toFixed(3), Math.ceil(40 * sc), Math.ceil(28 * sc), (g, w, h) => {
      g.translate(w / 2, h / 2); g.scale(sc, sc);
      for (let k = 6; k >= 0; k--) { g.fillStyle = `rgba(10,5,2,${0.07 + (6 - k) * 0.012})`; gfx.roundRect(g, -13 - k, -6.5 - k * 0.7, 26 + k * 2, 13 + k * 1.4, 6 + k).fill(); }
    });
  }
  // world-space shadow offset that matches the lamp direction on screen
  function shOff(z) {
    const a = 3.2 + z * 0.55, b = 4.6 + z * 0.75;
    return L.land ? { x: -b, y: a } : { x: a, y: b };
  }

  function drawCar(c, alpha) {
    if (c.state === 'grab' && c.grab && c.grab.t < 0.32) { /* still on the bench */ }
    const z = c.z || 0;
    const so = shOff(z);
    const sh = shadowSprite();
    const scale = 1 + z * 0.012;
    ctx.save();
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    // shadow
    ctx.save();
    ctx.translate(c.x + so.x, c.y + so.y); ctx.rotate(c.ang);
    ctx.globalAlpha *= clamp(1 - z * 0.012, 0.35, 1);
    ctx.drawImage(sh, -20, -14, 40, 28);
    ctx.restore();
    // headlamp glow ahead of the car
    if (c.state === 'slot' || c.state === 'air' || c.state === 'loop') {
      ctx.globalCompositeOperation = 'lighter';
      const hx = c.x + Math.cos(c.ang) * 20, hy = c.y + Math.sin(c.ang) * 20;
      gfx.light(ctx, hx, hy, 16 + c.v / 30, '#ffd98a', 0.13 + c.v / 3000);
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.translate(c.x, c.y);
    ctx.rotate(c.ang);
    // tumbling: squash across the roll axis and flip the livery
    const rollC = Math.cos(c.roll || 0);
    const vib = c.state === 'slot' && c.v > 30 ? (Math.random() - 0.5) * 0.3 : 0;
    ctx.translate(vib, c.lean * 0.7);
    ctx.scale(scale * c.squash, scale * (c.state === 'off' || c.state === 'grab' ? Math.max(0.12, Math.abs(rollC)) : 1) / Math.max(0.9, Math.sqrt(c.squash)));
    const spr = carSprite(c.model);
    const w = CARL + 10, h = CARW + 10;
    if (rollC < 0 && (c.state === 'off' || c.state === 'grab')) {
      // the tin underside: plain and dark with an axle
      ctx.fillStyle = '#4a4f55'; gfx.roundRect(ctx, -12, -5, 24, 10, 4).fill();
      ctx.fillStyle = '#2a2d31'; ctx.fillRect(-8, -6.5, 2, 13); ctx.fillRect(6, -6.5, 2, 13);
      ctx.fillStyle = '#c47a45'; ctx.fillRect(10, -1, 3, 2);
    } else {
      ctx.drawImage(spr, -w / 2, -h / 2, w, h);
    }
    // the wind-up key turns as the car runs
    const kw = Math.abs(Math.cos(c.keyRot));
    ctx.save(); ctx.translate(-14.5, 0); ctx.scale(1, Math.max(0.2, kw));
    ctx.fillStyle = '#d9a632'; ctx.fillRect(-1, -0.8, 3, 1.6);
    ctx.beginPath(); ctx.ellipse(-3.3, -2.3, 2.6, 1.9, 0, 0, TAU); ctx.ellipse(-3.3, 2.3, 2.6, 1.9, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,200,0.6)'; ctx.beginPath(); ctx.arc(-3.8, -2.6, 0.8, 0, TAU); ctx.fill();
    ctx.restore();
    // lane-change request: a blinking chevron on the side it will move to
    if (c.want && !G.attract) {
      const side = c.want < 0 ? 1 : -1; // toward the inside lanes = +n_in
      const sy = side * TR.S * 11;
      ctx.globalAlpha = 0.5 + 0.5 * Math.sin(G.t * 14);
      ctx.fillStyle = '#ffd56b';
      ctx.beginPath(); ctx.moveTo(-3, sy - side * 0); ctx.lineTo(3, sy); ctx.lineTo(0, sy + side * 4.5); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    // a rim of lamplight on the car's lit side
    if (c.state === 'slot' && !c.human === false) { /* players get the lane glow instead */ }
  }

  function drawPart(p) {
    const so = shOff(p.z);
    gfx.softShadow(ctx, p.x + so.x, p.y + so.y, 5, 3.5, 0.4);
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    if (p.kind === 'key') drawKeyShape(ctx, 0, 0, 0, 1.1, '#d9a632');
    else { ctx.fillStyle = '#121212'; ctx.beginPath(); ctx.arc(0, 0, 3.6, 0, TAU); ctx.fill(); ctx.fillStyle = '#9aa1a8'; ctx.beginPath(); ctx.arc(0, 0, 1.5, 0, TAU); ctx.fill(); }
    ctx.restore();
  }

  // The tin grabber: a lazy-tongs arm from the bench edge with a two-finger claw and a little face plate.
  function drawArm(bx, by, cx, cy, open, alpha) {
    const dx = cx - bx, dy = cy - by, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d, nx = -uy, ny = ux;
    const so = shOff(16);
    ctx.save();
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    const cells = Math.max(3, Math.round(d / 26));
    const step = d / cells, wd = 7;
    for (const pass of [0, 1]) {
      ctx.save();
      if (pass === 0) { ctx.translate(so.x, so.y); ctx.strokeStyle = 'rgba(10,5,2,0.4)'; }
      else ctx.strokeStyle = '#b9c0c6';
      ctx.lineWidth = 2.6; ctx.lineCap = 'round';
      ctx.beginPath();
      for (let k = 0; k < cells; k++) {
        const ax = bx + ux * step * k, ay = by + uy * step * k, bx2 = ax + ux * step, by2 = ay + uy * step;
        ctx.moveTo(ax + nx * wd, ay + ny * wd); ctx.lineTo(bx2 - nx * wd, by2 - ny * wd);
        ctx.moveTo(ax - nx * wd, ay - ny * wd); ctx.lineTo(bx2 + nx * wd, by2 + ny * wd);
      }
      ctx.stroke();
      if (pass === 1) {
        ctx.fillStyle = '#d43d2f';
        for (let k = 0; k <= cells; k++) { const px = bx + ux * step * k, py = by + uy * step * k; ctx.beginPath(); ctx.arc(px + (k % 2 ? nx : -nx) * 0, py, 1.7, 0, TAU); ctx.fill(); }
      }
      ctx.restore();
    }
    // claw
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(Math.atan2(uy, ux));
    ctx.fillStyle = '#23395b'; gfx.roundRect(ctx, -9, -7, 9, 14, 3).fill();
    ctx.fillStyle = '#f3e3c3'; ctx.beginPath(); ctx.arc(-5.5, -2.6, 1.3, 0, TAU); ctx.arc(-5.5, 2.6, 1.3, 0, TAU); ctx.fill();
    ctx.fillStyle = '#141414'; ctx.beginPath(); ctx.arc(-5.2, -2.6, 0.6, 0, TAU); ctx.arc(-5.2, 2.6, 0.6, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#d7dadc'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    const op = 3 + open * 6;
    ctx.beginPath(); ctx.moveTo(0, -4); ctx.quadraticCurveTo(7, -op - 2, 9, -op + 2); ctx.moveTo(0, 4); ctx.quadraticCurveTo(7, op + 2, 9, op - 2); ctx.stroke();
    ctx.restore();
    ctx.restore();
  }

  /* ============================================================ drawing */
  const motes = [];
  for (let k = 0; k < 28; k++) motes.push({ x: Math.random(), y: Math.random(), z: Math.random(), ph: Math.random() * 6 });

  const PERF = new URLSearchParams(location.search).get('perf') || '';
  function draw() {
    if (layoutDirty) doLayout();
    const w = view.w, h = view.h, t = loop.time;
    // camera nudge toward a crash and a pulse on the loop
    const z = 1 + Kit.ease.cubicOut(G.zoom) * 0.06 + Math.sin(G.loopPulse * Math.PI) * 0.025;
    const moved = z !== 1 || fx.shakeX || fx.shakeY;
    if (moved || !staticCv) view.clear('#1a0f08'); else { ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }
    if (!TR || !staticCv) return;
    ctx.save();
    if (z !== 1) {
      const zx = G.zoom > 0 ? G.zx : w / 2, zy = G.zoom > 0 ? G.zy : h / 2;
      ctx.translate(zx, zy); ctx.scale(z, z); ctx.translate(-zx, -zy);
    }
    ctx.translate(fx.shakeX || 0, fx.shakeY || 0);
    if (!PERF.includes('s')) ctx.drawImage(staticCv, 0, 0, w, h);
    ctx.save();
    worldTransform(ctx);
    if (!PERF.includes('g')) drawGlow();
    drawGhost();
    // ground-level cars (and tumbling ones), then the bridge layer, then raised cars
    const low = [], high = [];
    for (const c of G.cars) {
      if (c.state === 'loop' || c.state === 'grab' || (c.state === 'air') || (c.state === 'off' && c.z > 8)) high.push(c);
      else if (c.state === 'slot' && TR.hgt[c.i] > 0.4) high.push(c);
      else low.push(c);
    }
    for (const c of G.cars) if (c.part && c.state !== 'slot') drawPart(c.part);
    if (!PERF.includes('c')) for (const c of low) drawCar(c);
    ctx.restore();
    if (overCv && overBox) {
      // only the part of the elevated layer that holds anything (bridge, gantry)
      const d = view.dpr, x0 = Math.max(0, Math.floor(overBox.x0)), y0 = Math.max(0, Math.floor(overBox.y0));
      const x1 = Math.min(w, Math.ceil(overBox.x1)), y1 = Math.min(h, Math.ceil(overBox.y1));
      if (x1 > x0 && y1 > y0) ctx.drawImage(overCv, x0 * d, y0 * d, (x1 - x0) * d, (y1 - y0) * d, x0, y0, x1 - x0, y1 - y0);
    }
    ctx.save();
    worldTransform(ctx);
    for (const c of high) drawCar(c);
    for (const c of G.cars) if (c.state === 'grab' && c.grab) drawArm(c.grab.bx, c.grab.by, c.grab.claw.x, c.grab.claw.y, c.grab.open);
    for (const a of G.arms) { const u = Kit.ease.cubicIn(Math.min(1, a.t / 0.4)); drawArm(a.bx, a.by, lerp(a.x, a.bx, u), lerp(a.y, a.by, u), 1, 1); }
    if (!Kit.keyart) drawGauges();
    fx.draw(ctx);
    ctx.restore();
    ctx.restore();
    // ambient: dust in the lamp light, a moth's shadow, a flicker
    if (!PERF.includes('a')) drawAmbient(w, h, t);
    if (!Kit.keyart && mode === 'play' && !PERF.includes('h')) drawHud(w, h, t);
  }

  function drawAmbient(w, h, t) {
    const lx = w * LAMP.fx, ly = h * LAMP.fy;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const R = Math.min(w, h) * 0.55;
    for (const m of motes) {
      const a = m.ph + t * (0.05 + m.z * 0.08);
      const x = lx + (m.x - 0.5) * R * 1.6 + Math.sin(a * 1.7) * 18, y = ly + (m.y - 0.5) * R * 1.4 + Math.cos(a) * 14;
      const d = Math.hypot(x - lx, y - ly) / R;
      const al = Math.max(0, 1 - d) * (0.35 + 0.35 * Math.sin(t * 2 + m.ph));
      if (al < 0.03) continue;
      ctx.fillStyle = `rgba(255,232,180,${al.toFixed(3)})`;
      ctx.beginPath(); ctx.arc(x, y, 0.7 + m.z * 1.3, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    // a moth circling the lamp casts a flicker of shadow on the bench
    if (!Kit.reducedMotion) {
      const ma = t * 0.9, mx = lx + Math.cos(ma) * R * 0.35 + Math.sin(t * 3.1) * 12, my = ly + Math.sin(ma * 1.3) * R * 0.28;
      const flap = 0.5 + 0.5 * Math.abs(Math.sin(t * 22));
      ctx.fillStyle = 'rgba(15,8,3,0.22)';
      ctx.save(); ctx.translate(mx, my); ctx.rotate(ma + Math.PI / 2);
      ctx.beginPath(); ctx.ellipse(-6 * flap, 0, 7 * flap, 4.5, 0.4, 0, TAU); ctx.ellipse(6 * flap, 0, 7 * flap, 4.5, -0.4, 0, TAU); ctx.fill();
      ctx.restore();
    }
    // steam over the coffee
    if (G.mug) {
      const p = toScreen(G.mug.x, G.mug.y);
      for (let k = 0; k < 4; k++) {
        const u = ((t * 0.25 + k / 4) % 1);
        ctx.fillStyle = `rgba(255,245,230,${(0.08 * Math.sin(u * Math.PI)).toFixed(3)})`;
        ctx.beginPath(); ctx.arc(p.x + Math.sin(t * 1.4 + k * 2) * 6 * L.sc - u * 8 * L.sc, p.y - u * 26 * L.sc, (6 + u * 10) * L.sc, 0, TAU); ctx.fill();
      }
    }
    ctx.restore();
  }

  // Your lane ahead glows green, amber, red: the colour says whether you can still brake for what is coming.
  const GLOW_COL = ['rgba(120,235,140,', 'rgba(255,176,50,', 'rgba(255,70,45,'];
  const glowBuckets = Array.from({ length: 12 }, () => ({ n: 0, pts: new Float32Array(300) }));
  function drawGlow() {
    if (G.attract || Kit.keyart) return;
    for (const c of G.cars) {
      if (!c.human || c.state !== 'slot' || c.done) continue;
      const Ln = TR.lanes[c.lane], N = TR.N;
      let i = c.i, d = -c.f * (Ln.cum[i + 1] - Ln.cum[i]);
      const reach = 70 + c.v * 0.55;
      let worst = 0;
      // segments bucketed by colour and fade step: a dozen strokes instead of seventy
      for (const bk of glowBuckets) bk.n = 0;
      let px = c.x, py = c.y;
      for (let k = 0; k < 70 && d < reach; k++) {
        const j = (i + 1) % N;
        const vb = Math.sqrt(Math.max(0, c.v * c.v - 2 * BRAKE * Math.max(0, d)));
        const ratio = vb / vlim(c, c.lane, j);
        worst = Math.max(worst, ratio);
        const ci = ratio > 1.0 ? 2 : ratio > 0.9 ? 1 : 0;
        const fi = Math.min(3, Math.floor(d / reach * 4));
        const bk = glowBuckets[ci * 4 + fi];
        bk.pts[bk.n++] = px; bk.pts[bk.n++] = py; bk.pts[bk.n++] = Ln.x[j]; bk.pts[bk.n++] = Ln.y[j];
        px = Ln.x[j]; py = Ln.y[j];
        d += Ln.cum[i + 1] - Ln.cum[i];
        i = j;
      }
      ctx.lineCap = 'round';
      ctx.globalCompositeOperation = 'lighter';
      for (let q = 0; q < 12; q++) {
        const bk = glowBuckets[q];
        if (!bk.n) continue;
        const ci = q >> 2, fi = q & 3, hot = ci > 0;
        const a = (1 - (fi + 0.5) / 4) * (hot ? 0.8 : 0.34);
        ctx.strokeStyle = GLOW_COL[ci] + a.toFixed(3) + ')';
        ctx.lineWidth = hot ? 6.5 : 4.5;
        ctx.beginPath();
        for (let m = 0; m < bk.n; m += 4) { ctx.moveTo(bk.pts[m], bk.pts[m + 1]); ctx.lineTo(bk.pts[m + 2], bk.pts[m + 3]); }
        ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';
      c.glowRatio = worst;
      if (c.shim > 0.05) {
        ctx.globalCompositeOperation = 'lighter';
        gfx.light(ctx, c.x, c.y, 26, '#ff4a2d', 0.4 * Math.min(1, c.shim) * (0.7 + 0.3 * Math.sin(G.t * 30)));
        ctx.globalCompositeOperation = 'source-over';
      }
    }
  }
  function drawGhost() {
    if (G.attract || !G.ghost || G.phase !== 'race' || twoP) return;
    const me = humanCar(1);
    if (!me || me.laps < 1 || me.done) return;
    const k = Math.floor((G.raceT - me.lapStart) / 0.1);
    const v = G.ghost.g[Math.min(k, G.ghost.g.length - 1)];
    if (v === undefined) return;
    const lane = Math.floor(v / 10000), i = v % 10000;
    if (i >= TR.N) return;
    lanePos(lane, i, 0, tmpA);
    ctx.save();
    ctx.translate(tmpA.x, tmpA.y); ctx.rotate(Math.atan2(TR.TY[i], TR.TX[i]));
    ctx.globalAlpha = 0.32;
    ctx.strokeStyle = '#fff1d0'; ctx.lineWidth = 1.2; ctx.setLineDash([2, 2]);
    gfx.roundRect(ctx, -12, -5.5, 24, 11, 4.5).stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
  // a little tin speed dial over your car before a loop or a jump: keep the needle in the green
  function drawGauges() {
    if (G.attract) return;
    for (const c of G.cars) {
      if (!c.human || c.state !== 'slot' || c.done) continue;
      let lo = 0, hi = 0, d = 1e9;
      if (TR.loop) { const dd = distAhead(c, TR.loop.i); if (dd > 0 && dd < 200) { d = dd; lo = LOOP_VMIN; hi = VTOP * 1.15; } }
      if (TR.jump) { const dd = distAhead(c, TR.jump.lip); if (dd > 0 && dd < 200 && dd < d) { d = dd; lo = J_LO; hi = J_HI; } }
      if (d > 200) continue;
      const a = Math.min(1, (200 - d) / 40);
      const p = toScreen(c.x, c.y);
      ctx.save();
      ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
      const gx = clamp(p.x, 40, view.w - 40), gy = clamp(p.y - 40, 40, view.h - 40);
      const R = 20, vmax = VTOP * 1.15, A0 = Math.PI * 0.85, A1 = Math.PI * 2.15;
      const ang = v => A0 + (A1 - A0) * clamp(v / vmax, 0, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = '#f3e3c3'; ctx.strokeStyle = '#23395b'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(gx, gy, R + 4, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.lineWidth = 5;
      ctx.strokeStyle = '#d43d2f'; ctx.beginPath(); ctx.arc(gx, gy, R - 3, A0, A1); ctx.stroke();
      ctx.strokeStyle = '#4caf6a'; ctx.beginPath(); ctx.arc(gx, gy, R - 3, ang(lo), ang(hi)); ctx.stroke();
      const na = ang(c.v);
      const ok = c.v >= lo && c.v <= hi;
      ctx.strokeStyle = '#141414'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx + Math.cos(na) * (R - 1), gy + Math.sin(na) * (R - 1)); ctx.stroke();
      ctx.fillStyle = ok ? '#4caf6a' : '#d43d2f'; ctx.beginPath(); ctx.arc(gx, gy, 3, 0, TAU); ctx.fill();
      gfx.text(ctx, lo === LOOP_VMIN ? 'LOOP' : 'JUMP', gx, gy + 11, { size: 6.5, color: '#23395b', weight: 800 });
      ctx.restore();
    }
  }

  /* ============================================================ HUD */
  const hud = { lapRoll: [0, 0], medalFlip: [0, 0], gold: 0, lever: [0, 0], leverRect: [null, null], plunger: [0, 0] };
  function hudUpdate(dt) {
    for (let k = 0; k < 2; k++) {
      hud.lapRoll[k] = Math.max(0, hud.lapRoll[k] - dt * 2.4);
      hud.medalFlip[k] = Math.max(0, hud.medalFlip[k] - dt * 2.6);
      hud.lever[k] = Math.max(0, hud.lever[k] - dt * 4);
      const c = humanCar(k + 1);
      hud.plunger[k] = Kit.smooth(hud.plunger[k], c ? (G.phase === 'grid' ? c.th : c.th) : 0, 20, dt);
    }
    hud.gold = Math.max(0, hud.gold - dt * 0.6);
  }
  const DISP = '"Unbounded", "Arial Black", system-ui, sans-serif';

  function tinPlate(x, y, w, h, r, fill) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; gfx.roundRect(ctx, x + 2, y + 3, w, h, r).fill();
    const gr = ctx.createLinearGradient(x, y, x, y + h);
    gr.addColorStop(0, gfx.shade(fill, 0.18)); gr.addColorStop(0.5, fill); gr.addColorStop(1, gfx.shade(fill, -0.18));
    ctx.fillStyle = gr; gfx.roundRect(ctx, x, y, w, h, r).fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1; gfx.roundRect(ctx, x + 0.5, y + 0.5, w - 1, h - 1, r).stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    for (const [rx, ry] of [[x + 5, y + 5], [x + w - 5, y + 5], [x + 5, y + h - 5], [x + w - 5, y + h - 5]]) { ctx.beginPath(); ctx.arc(rx, ry, 1.4, 0, TAU); ctx.fill(); }
    ctx.restore();
  }

  function drawHud(w, h, t) {
    if (!G || G.attract) return;
    const me = humanCar(1);
    const top = 10;
    // rolling-digit lap counter
    const lapP = (pl, x) => {
      const c = humanCar(pl);
      if (!c) return;
      const lap = clamp(c.laps + 1, 1, LAPS);
      const roll = Kit.ease.cubicOut(1 - hud.lapRoll[pl - 1]);
      tinPlate(x, top, 112, 44, 8, pl === 1 ? '#23395b' : '#7a2a22');
      gfx.text(ctx, 'LAP', x + 20, top + 22, { size: 9, color: '#f3e3c3', weight: 800, font: DISP });
      // the drum window
      const wx = x + 38, wy = top + 7, ww = 26, wh = 30;
      ctx.save();
      ctx.fillStyle = '#f6ecd6'; gfx.roundRect(ctx, wx, wy, ww, wh, 4).fill();
      ctx.beginPath(); ctx.rect(wx, wy, ww, wh); ctx.clip();
      const gold = hud.gold > 0 && pl === 1 && Math.floor(t * 12) % 2 === 0;
      const prev = Math.max(1, lap - 1);
      const off = (1 - roll) * wh;
      gfx.text(ctx, String(lap), wx + ww / 2, wy + wh / 2 + 1 - off + wh * (roll < 1 ? 1 : 0) - (roll < 1 ? wh : 0) + off, { size: 20, color: gold ? '#c98a12' : '#141414', weight: 800, font: DISP });
      if (roll < 1) gfx.text(ctx, String(prev), wx + ww / 2, wy + wh / 2 + 1 + roll * wh, { size: 20, color: '#141414', weight: 800, font: DISP });
      const sh = ctx.createLinearGradient(0, wy, 0, wy + wh);
      sh.addColorStop(0, 'rgba(0,0,0,0.35)'); sh.addColorStop(0.25, 'rgba(0,0,0,0)'); sh.addColorStop(0.75, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,0.35)');
      ctx.fillStyle = sh; ctx.fillRect(wx, wy, ww, wh);
      ctx.restore();
      gfx.text(ctx, '/' + LAPS, x + 82, top + 23, { size: 15, color: '#f3e3c3', weight: 800, font: DISP });
      // lap times underneath
      const cur = G.phase === 'race' && !c.done ? G.raceT - c.lapStart : c.lastLap;
      const best = c.bestLap ? '  best ' + c.bestLap.toFixed(2) : '';
      gfx.text(ctx, (cur ? cur.toFixed(2) : '0.00') + best, x + 4, top + 56, { size: 10.5, color: hud.gold > 0 && pl === 1 ? '#ffd56b' : 'rgba(243,227,195,0.85)', weight: 700, font: 'body', align: 'left', stroke: 'rgba(0,0,0,0.6)', strokeWidth: 3 });
    };
    lapP(1, 10);
    if (twoP) lapP(2, w - 112 - 66);
    // stamped tin position medallion
    const medal = (pl, x) => {
      const c = humanCar(pl);
      if (!c) return;
      const pos = c.pos || (G.cars.indexOf(c) + 1);
      const fl = hud.medalFlip[pl - 1];
      const sx = fl > 0 ? Math.abs(Math.cos(fl * Math.PI)) : 1;
      const y = top + 24;
      ctx.save();
      ctx.translate(x, y); ctx.scale(Math.max(0.08, sx) * (1 + Math.sin(fl * Math.PI) * 0.15), 1 + Math.sin(fl * Math.PI) * 0.15);
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.arc(2, 3, 25, 0, TAU); ctx.fill();
      // ribbon tails
      ctx.fillStyle = pl === 1 ? '#d43d2f' : '#2f5d9e';
      ctx.beginPath(); ctx.moveTo(-14, 14); ctx.lineTo(-20, 34); ctx.lineTo(-12, 30); ctx.lineTo(-6, 36); ctx.lineTo(-2, 18); ctx.fill();
      ctx.beginPath(); ctx.moveTo(14, 14); ctx.lineTo(20, 34); ctx.lineTo(12, 30); ctx.lineTo(6, 36); ctx.lineTo(2, 18); ctx.fill();
      const col = pos === 1 ? '#e8b13a' : pos === 2 ? '#c9ced2' : pos === 3 ? '#c47a45' : '#8a8f94';
      const gr = ctx.createRadialGradient(-6, -8, 2, 0, 0, 25);
      gr.addColorStop(0, gfx.shade(col, 0.45)); gr.addColorStop(0.6, col); gr.addColorStop(1, gfx.shade(col, -0.3));
      ctx.fillStyle = gr;
      ctx.beginPath();
      for (let k = 0; k < 24; k++) { const a = k * TAU / 24, r = k % 2 ? 23 : 25; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, 0, 18, 0, TAU); ctx.stroke();
      ctx.restore();
      if (sx > 0.3) {
        ctx.save(); ctx.translate(x, y); ctx.scale(sx, 1);
        gfx.text(ctx, String(pos), -3, 1, { size: 21, color: '#23395b', weight: 800, font: DISP });
        gfx.text(ctx, ['st', 'nd', 'rd', 'th'][pos - 1], 10, -6, { size: 8, color: '#23395b', weight: 800, font: DISP });
        ctx.restore();
      }
    };
    if (!twoP) medal(1, Math.min(w / 2, 150 + 30));
    else { medal(1, 150); medal(2, w - 66 - 140); }
    // race tag
    if (CH && !twoP) {
      const rx = Math.min(w / 2, 180) + 34, rw = Math.max(0, w - 62 - rx);
      if (rw > 62) {
        gfx.text(ctx, 'RACE ' + (CH.race + (G.phase === 'results' ? 0 : 1)) + '/' + RACES, rx + 4, top + 16, { size: 10, color: '#f3e3c3', weight: 800, font: DISP, align: 'left', stroke: 'rgba(0,0,0,0.6)', strokeWidth: 3 });
        gfx.text(ctx, CH.pts[0] + ' pts', rx + 4, top + 33, { size: 11, color: '#ffd56b', weight: 700, font: 'body', align: 'left', stroke: 'rgba(0,0,0,0.6)', strokeWidth: 3 });
      }
    }
    // plunger controllers and lane levers
    const bottomY = h - 12;
    const plun = (pl, x, mirror) => {
      const pr = hud.plunger[pl - 1];
      const bw = 50, bh = 54, bx = x - bw / 2, by = bottomY - bh;
      // curly cord off the edge
      ctx.save();
      ctx.strokeStyle = '#141414'; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let k = 0; k <= 20; k++) { const u = k / 20; const cx2 = x + (mirror ? -1 : 1) * (bw / 2 + u * 40) , cy2 = bottomY - 8 + Math.sin(u * 20) * 4 + u * 10; if (!k) ctx.moveTo(cx2, cy2); else ctx.lineTo(cx2, cy2); }
      ctx.stroke();
      ctx.restore();
      tinPlate(bx, by, bw, bh, 9, pl === 1 ? '#23395b' : '#7a2a22');
      ctx.fillStyle = '#f3e3c3'; ctx.fillRect(bx + 6, by + bh - 14, bw - 12, 5);
      ctx.fillStyle = '#d43d2f'; ctx.fillRect(bx + 6, by + bh - 14, (bw - 12) * pr, 5);
      // the plunger rod and red knob press in as you hold
      const travel = 16 * pr;
      const ky = by - 22 + travel;
      ctx.fillStyle = '#c9ced2'; ctx.fillRect(x - 3, ky + 10, 6, by - ky - 8);
      ctx.strokeStyle = '#8a9096'; ctx.lineWidth = 1;
      for (let k = 0; k < 4; k++) { const sy = ky + 14 + k * ((by - ky - 12) / 4); ctx.beginPath(); ctx.moveTo(x - 6, sy); ctx.lineTo(x + 6, sy + 3); ctx.stroke(); }
      const kg = ctx.createRadialGradient(x - 4, ky - 2, 1, x, ky + 4, 14);
      kg.addColorStop(0, '#ff8a72'); kg.addColorStop(0.5, '#d43d2f'); kg.addColorStop(1, '#8e231a');
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(x + 2, ky + 7, 14, 7, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = kg; ctx.beginPath(); ctx.ellipse(x, ky + 4, 14, 9, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.beginPath(); ctx.ellipse(x - 4, ky + 1, 5, 2.4, -0.3, 0, TAU); ctx.fill();
      gfx.text(ctx, pl === 1 && !twoP ? 'HOLD' : 'P' + pl, x, by + 18, { size: 9, color: '#f3e3c3', weight: 800, font: DISP });
      const c = humanCar(pl);
      if (c && c.glowRatio > 0.9 && c.state === 'slot') {
        ctx.fillStyle = c.glowRatio > 1 ? '#ff4a2d' : '#ffb032';
        ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 20);
        ctx.beginPath(); ctx.arc(x, by + 31, 4, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1;
      }
    };
    const lever = (pl, x) => {
      const c = humanCar(pl);
      const lw = 56, lh = 48, lx = x - lw / 2, ly = bottomY - lh;
      hud.leverRect[pl - 1] = { x: lx, y: ly, w: lw, h: lh };
      tinPlate(lx, ly, lw, lh, 9, '#e8d3a9');
      const want = c ? c.want : 0;
      const dir = want || (c ? c.swDir : -1);
      const tilt = (want ? 0.55 : 0.18) * (dir < 0 ? -1 : 1);
      ctx.save(); ctx.translate(x, ly + lh - 12); ctx.rotate(tilt);
      ctx.fillStyle = '#5b636b'; ctx.fillRect(-2.5, -26, 5, 26);
      ctx.fillStyle = want ? '#ffb032' : '#23395b'; ctx.beginPath(); ctx.arc(0, -27, 7, 0, TAU); ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#23395b'; ctx.beginPath(); ctx.ellipse(x, ly + lh - 10, 12, 4, 0, 0, TAU); ctx.fill();
      gfx.text(ctx, 'LANE', x, ly + lh - 4, { size: 7.5, color: '#23395b', weight: 800, font: DISP });
      if (want) {
        ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 14);
        ctx.strokeStyle = '#ffb032'; ctx.lineWidth = 2.5; gfx.roundRect(ctx, lx - 2, ly - 2, lw + 4, lh + 4, 10).stroke();
        ctx.globalAlpha = 1;
      }
    };
    if (!twoP) { plun(1, w - 40, false); lever(1, 40); }
    else { plun(1, 34, true); lever(1, 100); plun(2, w - 34, false); lever(2, w - 100); }
    // grid: tin starting lights and the race banner
    if (G.phase === 'grid') drawStartLights(w, h);
    if (G.phase === 'race' && G.raceT < 0.9) {
      const a = 1 - G.raceT / 0.9;
      gfx.text(ctx, 'GO!', w / 2, h * 0.42, { size: 54 + (1 - a) * 30, color: '#7fe08e', weight: 800, font: DISP, alpha: a, stroke: '#23395b', strokeWidth: 7 });
    }
    if (G.phase === 'finish' && me && me.done) {
      const a = Math.min(1, G.finT * 3);
      const place = G.finishOrder.indexOf(me.id) + 1;
      ctx.save(); ctx.translate(w / 2, h * 0.42); ctx.rotate(-0.06); ctx.scale(0.6 + 0.4 * Kit.ease.backOut(a), 0.6 + 0.4 * Kit.ease.backOut(a));
      gfx.text(ctx, 'FINISH', 0, -22, { size: 22, color: '#f3e3c3', weight: 800, font: DISP, stroke: '#23395b', strokeWidth: 6 });
      gfx.text(ctx, twoP ? 'P' + G.cars[G.finishOrder[0]].human + ' wins' : POS[place - 1], 0, 22, { size: 50, color: place === 1 ? '#ffd56b' : '#f3e3c3', weight: 800, font: DISP, stroke: '#d43d2f', strokeWidth: 8 });
      ctx.restore();
    }
    if (G.phase === 'results') drawResults(w, h, t);
    drawTutorial(w, h, t);
  }

  function drawStartLights(w, h) {
    const x = w / 2, y = Math.max(96, h * 0.3);
    const lit = Math.floor(G.gridT / 0.7);
    ctx.save();
    tinPlate(x - 74, y - 24, 148, 48, 12, '#23395b');
    for (let k = 0; k < 3; k++) {
      const on = lit > k;
      const lx = x - 46 + k * 46;
      ctx.fillStyle = '#120d0a'; ctx.beginPath(); ctx.arc(lx, y, 15, 0, TAU); ctx.fill();
      ctx.fillStyle = on ? '#ff4a2d' : '#4a1d17'; ctx.beginPath(); ctx.arc(lx, y, 12, 0, TAU); ctx.fill();
      if (on) { ctx.globalCompositeOperation = 'lighter'; gfx.light(ctx, lx, y, 40, '#ff4a2d', 0.6); ctx.globalCompositeOperation = 'source-over'; }
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.arc(lx - 4, y - 4, 3.4, 0, TAU); ctx.fill();
    }
    ctx.restore();
    // race banner: the circuit name and what is new
    const cfg = TR.cfg;
    const by = y + 44;
    const bw = Math.min(w - 32, 340);
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; gfx.roundRect(ctx, w / 2 - bw / 2 + 3, by + 3, bw, 58, 8).fill();
    ctx.fillStyle = '#f3e3c3'; gfx.roundRect(ctx, w / 2 - bw / 2, by, bw, 58, 8).fill();
    ctx.strokeStyle = '#d43d2f'; ctx.lineWidth = 3; gfx.roundRect(ctx, w / 2 - bw / 2 + 4, by + 4, bw - 8, 50, 6).stroke();
    const head = twoP ? TR.name.toUpperCase() : 'RACE ' + (CH ? CH.race + 1 : 1) + ' · ' + TR.name.toUpperCase();
    gfx.text(ctx, head, w / 2, by + 20, { size: bw < 300 ? 11 : 13, color: '#23395b', weight: 800, font: DISP });
    gfx.text(ctx, cfg.intro || '', w / 2, by + 40, { size: bw < 300 ? 11 : 12.5, color: '#a52a20', weight: 700, font: 'body' });
    ctx.restore();
  }

  function drawResults(w, h, t) {
    const a = Math.min(1, G.resT * 3);
    ctx.save();
    ctx.fillStyle = `rgba(20,10,4,${(0.55 * a).toFixed(3)})`; ctx.fillRect(0, 0, w, h);
    const bw = Math.min(w - 28, 360), bh = 312;
    const bx = w / 2 - bw / 2, by = clamp(h / 2 - bh / 2 - 10, 70, h - bh - 10) + (1 - Kit.ease.backOut(a)) * 40;
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; gfx.roundRect(ctx, bx + 5, by + 8, bw, bh, 14).fill();
    ctx.fillStyle = '#f3e3c3'; gfx.roundRect(ctx, bx, by, bw, bh, 14).fill();
    ctx.strokeStyle = '#d43d2f'; ctx.lineWidth = 5; gfx.roundRect(ctx, bx + 6, by + 6, bw - 12, bh - 12, 10).stroke();
    ctx.strokeStyle = '#23395b'; ctx.lineWidth = 1.6; gfx.roundRect(ctx, bx + 11, by + 11, bw - 22, bh - 22, 7).stroke();
    ctx.fillStyle = '#c9b48a';
    for (const [rx, ry] of [[bx + 18, by + 18], [bx + bw - 18, by + 18], [bx + 18, by + bh - 18], [bx + bw - 18, by + bh - 18]]) { ctx.beginPath(); ctx.arc(rx, ry, 3, 0, TAU); ctx.fill(); }
    const raceNo = (CH ? CH.race : 1);
    gfx.text(ctx, (twoP ? 'RACE ' : 'RACE ') + raceNo + ' RESULT', w / 2, by + 36, { size: 15, color: '#d43d2f', weight: 800, font: DISP });
    gfx.text(ctx, TR.name, w / 2, by + 56, { size: 12, color: '#55657f', weight: 700, font: 'body' });
    const rows = G.results || [];
    rows.forEach((r, k) => {
      const ry = by + 80 + k * 38;
      const show = Math.min(1, Math.max(0, G.resT * 4 - k * 0.6));
      if (show <= 0) return;
      ctx.save();
      ctx.globalAlpha = a * show;
      ctx.translate((1 - show) * 30, 0);
      if (r.human) { ctx.fillStyle = r.human === 1 ? 'rgba(212,61,47,0.14)' : 'rgba(47,93,158,0.14)'; gfx.roundRect(ctx, bx + 18, ry - 15, bw - 36, 32, 6).fill(); }
      gfx.text(ctx, POS[k], bx + 40, ry + 1, { size: 13, color: '#23395b', weight: 800, font: DISP });
      ctx.fillStyle = r.car.body; ctx.beginPath(); ctx.arc(bx + 72, ry, 8, 0, TAU); ctx.fill();
      ctx.fillStyle = r.car.trim; ctx.fillRect(bx + 64, ry - 1.5, 16, 3);
      const name = r.human ? (twoP ? 'Player ' + r.human : 'You') + ' · ' + r.car.name : r.car.name;
      gfx.text(ctx, name, bx + 88, ry + 1, { size: 13, color: '#23395b', weight: 700, font: 'body', align: 'left' });
      gfx.text(ctx, '+' + r.pts, bx + bw - 76, ry + 1, { size: 13, color: '#d43d2f', weight: 800, font: DISP });
      const tot = CH ? CH.pts[r.id] : r.pts;
      gfx.text(ctx, String(tot), bx + bw - 36, ry + 1, { size: 13, color: '#23395b', weight: 800, font: DISP });
      if (G.fastest.car === r.id) { ctx.fillStyle = '#e8b13a'; star(ctx, bx + bw - 100, ry, 6, 2.6); }
      ctx.restore();
    });
    gfx.text(ctx, 'pts', bx + bw - 36, by + 64, { size: 9, color: '#55657f', weight: 700, font: 'body' });
    const fl = G.fastest.car >= 0 ? G.cars[G.fastest.car] : null;
    if (fl) gfx.text(ctx, 'Fastest lap: ' + (fl.human ? (twoP ? 'P' + fl.human : 'you') + ' (+250)' : fl.model.name) + ' · ' + G.fastest.t.toFixed(2) + ' s', w / 2, by + bh - 52, { size: 11.5, color: '#55657f', weight: 700, font: 'body' });
    if (G.unlocked) gfx.text(ctx, 'New car unlocked: ' + G.unlocked + '!', w / 2, by + bh - 70, { size: 12, color: '#d43d2f', weight: 800, font: 'body' });
    if (G.resT > 1) {
      const last = CH && CH.race >= RACES;
      gfx.text(ctx, (last ? 'Tap for the final standings' : 'Tap for the next race') + '  ▸', w / 2, by + bh - 28, { size: 13, color: '#23395b', weight: 800, font: 'body', alpha: 0.6 + 0.4 * Math.sin(t * 5) });
    }
    ctx.restore();
  }

  // Teaching without reading: a ghost thumb holding on the first grid, a ghost second finger at the first crossover.
  function drawTutorial(w, h, t) {
    if (twoP || !CH || CH.race > 0 || G.phase === 'results') return;
    const me = humanCar(1);
    if (!me) return;
    let show = null;
    if (!tut.held && (G.phase === 'grid' || (G.phase === 'race' && G.raceT < 6))) show = 'hold';
    else if (!tut.lane && G.phase === 'race' && me.state === 'slot' && TR.crossovers.length) {
      const d = distAhead(me, TR.crossovers[0].i);
      if (d > 20 && d < 260 && me.laps >= 1) show = 'lane';
    }
    if (!show) return;
    const x = show === 'hold' ? w / 2 : w / 2 + 40, y = h * 0.72;
    const press = show === 'hold' ? 1 : (Math.sin(t * 6) > 0 ? 1 : 0);
    ctx.save();
    ctx.globalAlpha = 0.85;
    // ripple
    ctx.strokeStyle = 'rgba(255,240,200,0.6)'; ctx.lineWidth = 2;
    const u = (t * 1.2) % 1;
    ctx.globalAlpha = 0.8 * (1 - u); ctx.beginPath(); ctx.arc(x, y, 14 + u * 26, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 0.85;
    drawThumb(x, y + (press ? 4 : 0));
    if (show === 'lane') { ctx.globalAlpha = 0.5; drawThumb(w / 2 - 50, y + 4); }
    ctx.globalAlpha = 1;
    const label = show === 'hold' ? 'HOLD ANYWHERE TO GO' : 'TAP A 2ND FINGER: CHANGE LANE';
    gfx.text(ctx, label, w / 2, y + 62, { size: 12, color: '#f3e3c3', weight: 800, font: DISP, stroke: 'rgba(0,0,0,0.7)', strokeWidth: 4 });
    if (show === 'hold') gfx.text(ctx, 'Let go when your lane glows amber', w / 2, y + 82, { size: 12, color: '#ffd56b', weight: 700, font: 'body', stroke: 'rgba(0,0,0,0.7)', strokeWidth: 3 });
    ctx.restore();
  }
  function drawThumb(x, y) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = 'rgba(255,236,214,0.9)'; ctx.strokeStyle = 'rgba(80,50,30,0.6)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-11, 46); ctx.lineTo(-12, 6); ctx.quadraticCurveTo(-12, -10, 0, -10); ctx.quadraticCurveTo(12, -10, 12, 6); ctx.lineTo(13, 46); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; gfx.roundRect(ctx, -7, -6, 14, 11, 5).fill();
    ctx.restore();
  }

  function fxFloatAt(c, txt, color, size) {
    if (Kit.keyart || G.attract) return;
    fx.float(txt, c.x, c.y - 18, { color: color || '#fff', size: (size || 13) / L.sc * 0.9, stroke: 'rgba(0,0,0,0.6)', font: 'display', weight: 800 });
  }
  function confetti(n) {
    if (Kit.reducedMotion) n = Math.min(n, 16);
    const a = toWorld(0, -10), b = toWorld(view.w, -10);
    for (let k = 0; k < n; k++) {
      const u = Math.random();
      fx.burst(lerp(a.x, b.x, u), lerp(a.y, b.y, u), { count: 1, color: ['#d43d2f', '#f3e3c3', '#e8b13a', '#2f5d9e', '#4f9a78'], shape: 'circle', speed: [10, 60], angle: L.land ? Math.PI : Math.PI / 2, spread: 0.6, gravity: 0, life: [1.6, 2.6], size: [2, 3.5], drag: 0.2 });
    }
    // falling paper punches
    for (let k = 0; k < n; k++) {
      const u = Math.random();
      const p = toWorld(view.w * u, -20 - Math.random() * view.h * 0.4);
      fx.burst(p.x, p.y, { count: 1, color: ['#d43d2f', '#f3e3c3', '#e8b13a', '#2f5d9e'], shape: 'circle', speed: [0, 20], gravity: 0, life: [2.2, 3.2], size: [2, 3.2], drag: 0 });
    }
    sfx('pop');
  }

  /* ============================================================ loop and shell */
  const loop = Kit.loop({
    view,
    update(dt) { keyActions(); update(dt); },
    draw,
  });
  const shell = Kit.shell({
    title: 'Tinplate GP',
    kicker: 'Clockwork championship',
    tagline: 'Hold to throttle. Let go before the bend glows red.',
    playLabel: 'Race',
    how: [
      'Hold anywhere (or Space) for power; let go to brake. Your car stays in its slot.',
      'Your lane glows green, amber, red ahead. Red means you cannot slow down in time: too fast into a bend and the car flies off. A grabber arm puts it back.',
      'Tap a second finger, double-tap, or hit the LANE lever (Up/Down keys) to switch lanes at the next crossover. Inside lanes are shorter but tighter.',
      'Striped banks hold more speed. Loops need speed, ramps want the dial in the green. Spilled tea is slippery.',
      'Six races, 5 laps each, points 10/6/3/1. Fastest lap +250. Two players: left and right halves (keys A and L, lanes Z and M).',
    ],
    loop,
    focus: view.canvas,
    score: () => (mode === 'play' && CH ? runScore() : 0),
    lose: () => { if (CH) finishChampionship(true); else shell.over({ reason: 'lose', delay: 0 }); },
    runProps: () => ({ mode: twoP ? '2p' : '1p', car: selCar }),
    theme: {
      panel: 'paper', layout: 'card', button: 'rounded', titleStyle: 'stamp', font: 'house', radius: 16,
      colors: { ink: '#23395b', inkSoft: '#55657f', panel: '#f3e3c3', accent: '#d43d2f', accentInk: '#fff6e4', scrim: 'var(--scrim)', line: '#23395b' },
    },
    onStart() {
      const act = ACTIONS.last;
      ACTIONS.last = 'play';
      mode = 'play';
      held.clear();
      const saved = Kit.save.get('champ', null);
      if (act === 'play' && saved && saved.race < RACES && !nextSeed && !twoP) {
        CH = saved;
        selCar = CH.car;
      } else newChampionship(nextSeed);
      nextSeed = null;
      silenceEngines();
      beginRace();
      fx.clear();
      fx.flash('#fff3d1', 200, 0.2);
      Kit.sfx('select');
    },
    onPause() { held.clear(); silenceEngines(); },
    onResume() { held.clear(); },
    onOver() { mode = 'over'; silenceEngines(); held.clear(); setTimeout(() => { if (shell.phase === 'over') refreshTitle(); }, 0); },
  });
  // which shell button started this run: Play continues a saved championship, Restart/Play again start fresh
  shell.el.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('[data-k]');
    if (b) ACTIONS.last = b.dataset.k === 'play' ? 'play' : 'fresh';
  }, true);

  /* ---------- title extras: garage, mode, continue ---------- */
  const titleActions = shell.el.querySelector('.k-title-actions');
  const playBtn = shell.el.querySelector('[data-k=play]');
  const ui = document.createElement('div');
  ui.className = 'tp-ui';
  ui.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:10px;width:100%';
  ui.innerHTML = `
    <div class="tp-garage">
      <button class="tp-arrow" type="button" data-d="-1" aria-label="Previous car">&#8249;</button>
      <div class="tp-car"><canvas width="300" height="120" aria-hidden="true"></canvas><div class="tp-car-name"></div><div class="tp-bars"></div><div class="tp-car-desc"></div></div>
      <button class="tp-arrow" type="button" data-d="1" aria-label="Next car">&#8250;</button>
    </div>
    <div class="tp-modes" role="group" aria-label="Players"><button type="button" data-m="1" aria-pressed="true">1 Player</button><button type="button" data-m="2" aria-pressed="false">2 Players</button></div>
    <p class="tp-cont" hidden></p>`;
  titleActions.insertBefore(ui, playBtn);
  const newBtn = document.createElement('button');
  newBtn.className = 'tp-link tp-ui'; newBtn.type = 'button'; newBtn.textContent = 'New championship'; newBtn.hidden = true;
  titleActions.appendChild(newBtn);
  const carCv = ui.querySelector('canvas');
  function drawPreview() {
    const m = carById(selCar);
    const g = carCv.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, 300, 120);
    g.save();
    g.translate(150, 62); g.scale(8, 8);
    g.fillStyle = 'rgba(35,57,91,0.18)'; gfx.roundRect(g, -12, -4.5, 26, 12, 5).fill();
    paintCar(g, m);
    g.save(); g.translate(-14.5, 0); g.fillStyle = '#d9a632'; g.fillRect(-1, -0.8, 3, 1.6); g.beginPath(); g.ellipse(-3.3, -2.3, 2.6, 1.9, 0, 0, TAU); g.ellipse(-3.3, 2.3, 2.6, 1.9, 0, 0, TAU); g.fill(); g.restore();
    g.restore();
    ui.querySelector('.tp-car-name').textContent = m.name;
    const dots = v => { const n = Math.round(clamp((v - 0.84) / 0.07, 1, 5)); let s = ''; for (let k = 0; k < 5; k++) s += `<i class="${k < n ? 'on' : ''}"></i>`; return s; };
    ui.querySelector('.tp-bars').innerHTML = `<span>Grip${dots(m.grip)}</span><span>Power${dots(m.accel)}</span><span>Speed${dots(m.top)}</span>`;
    const locked = CARS.filter(c => !isUnlocked(c));
    ui.querySelector('.tp-car-desc').textContent = m.desc + (locked.length ? ' · next: ' + (locked[0].unlock === 'cup' ? 'win a cup' : locked[0].unlock + ' podium' + (locked[0].unlock > 1 ? 's' : '')) : '');
  }
  function refreshTitle() {
    const saved = Kit.save.get('champ', null);
    const cont = saved && saved.race < RACES && !twoP;
    ui.querySelector('.tp-garage').hidden = !!cont;
    ui.querySelector('.tp-cont').hidden = !cont;
    newBtn.hidden = !cont;
    if (cont) ui.querySelector('.tp-cont').textContent = 'Race ' + (saved.race + 1) + ' of ' + RACES + ' · ' + cupName(saved.cup) + ' · ' + saved.pts[0] + ' pts';
    playBtn.querySelector('span').textContent = cont ? 'Continue' : 'Race';
    if (!isUnlocked(carById(selCar))) selCar = 'bluebird';
    ui.querySelectorAll('[data-m]').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.m === '2') === twoP)));
    drawPreview();
  }
  ui.addEventListener('click', e => {
    const a = e.target.closest('[data-d]');
    if (a) { cycleCar(+a.dataset.d); return; }
    const m = e.target.closest('[data-m]');
    if (m) { twoP = m.dataset.m === '2'; Kit.sfx('click'); refreshTitle(); }
  });
  function cycleCar(d) {
    const un = CARS.filter(isUnlocked);
    let k = un.findIndex(c => c.id === selCar);
    k = (k + d + un.length) % un.length;
    selCar = un[k].id;
    Kit.save.set('car', selCar);
    Kit.sfx('click', { pitch: d * 2 });
    drawPreview();
  }
  newBtn.addEventListener('click', () => { Kit.save.set('champ', null); Arcade.progress(null); Kit.sfx('click'); refreshTitle(); });
  window.addEventListener('keydown', e => {
    if (shell.phase !== 'title' || Kit.keyart) return;
    if (e.key === 'ArrowLeft') { cycleCar(-1); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { cycleCar(1); e.preventDefault(); }
  });

  /* ============================================================ attract mode */
  function startAttract(seed) {
    mode = 'title';
    const cfg = { tpl: 'eight', banks: 2, loop: true, jump: false, tea: false, cross: 1, intro: '' };
    newRace(cfg, seed || 4, { attract: true, aiModels: ['bluebird', 'rocket', 'lizzie', 'marmalade'], skill: [0.95, 0.93, 0.9, 0.97] });
    G.seedA = seed || 4;
    G.arms = [];
    for (const c of G.cars) { c.s = (c.id * 120) % TR.lanes[c.lane].len; c.i = 0; locate(c); c.v = 120; }
  }

  /* ============================================================ test hooks and scenes */
  Arcade.test({
    seed(n) { nextSeed = n; },
    race(n) { if (!CH) return false; CH.race = clamp((n | 0) - 1, 0, RACES - 1); beginRace(); G.phase = 'race'; G.raceT = 0; return true; },
    step(sec) { loop.step(Math.round((sec || 1) * 60)); },
    throttle(x) { forceTh = x === null || x === undefined ? null : clamp(+x, 0, 1); },
    changeLane(dir) { const c = humanCar(1); if (c) requestLane(c, dir); return c ? c.want : 0; },
    bot(skill) { botSkill = skill ? +skill : 0; },
    forceDeslot() { const c = humanCar(1); if (c && c.state === 'slot') deslot(c, 'bend'); return c ? c.state : null; },
    skipGrid() { if (G && G.phase === 'grid') { G.gridT = 2.79; loop.step(2); } },
    win() {
      const c = humanCar(1);
      if (!c || !G || G.attract) return false;
      for (const o of G.cars) if (o !== c) o.laps = Math.min(o.laps, LAPS - 2);
      c.laps = LAPS - 1; c.lapStart = G.raceT - 6;
      if (G.phase === 'grid') { G.phase = 'race'; }
      finishCar(c); endRace();
      return true;
    },
    lap() { const c = humanCar(1); if (c) { c.s = TR.lanes[c.lane].len - 1; c.i = 0; locate(c); } },
    next() { if (G) { G.resT = 5; continueAfterResults(); } },
    endRun() { if (CH) finishChampionship(true); },
    info: () => {
      if (!G) return null;
      const c = humanCar(1);
      return {
        mode, racePhase: G.phase, race: CH ? CH.race : null, cup: CH ? CH.cup : null, pts: CH ? CH.pts.slice() : null, tpl: TR.tpl,
        lap: c ? c.laps : null, pos: c ? c.pos : null, v: c ? c.v : 0, lim: c && c.state === 'slot' ? vlim(c, c.lane, c.i) : 0, state: c ? c.state : null,
        lane: c ? c.lane : null, want: c ? c.want : 0, deslots: c ? c.deslots : 0, i: c ? c.i : 0, N: TR.N, score: runScore(),
        loop: TR.loop ? TR.loop.i : -1, jump: TR.jump ? TR.jump.lip : -1, crossovers: TR.crossovers.map(o => o.i), banks: TR.banks.length, tea: !!TR.teaSpot,
        crossings: TR.crossings.length, finished: G.finishOrder.slice(), twoP,
      };
    },
    track: () => (TR ? { tpl: TR.tpl, N: TR.N, len: TR.lanes.map(l => Math.round(l.len)), minR: Math.min(...TR.lanes[0].R), crossings: TR.crossings.length } : null),
    build(tpl, seed, cfg) { const t = buildTrack(Object.assign({ tpl, banks: 1, loop: true, jump: true, tea: true, cross: 2 }, cfg || {}), seed); return { N: t.N, loop: !!t.loop, jump: !!t.jump, crossovers: t.crossovers.length, crossings: t.crossings.length, minR: Math.min(...t.lanes.map(l => Math.min(...l.R))), len: t.lanes.map(l => Math.round(l.len)) }; },
    setSpeed(v) { const c = humanCar(1); if (c) c.v = v; },
    placeBefore(kind, dist, lane) {
      const c = humanCar(1); if (!c) return false;
      const target = kind === 'loop' ? TR.loop && TR.loop.i : kind === 'jump' ? TR.jump && TR.jump.lip : kind === 'cross' ? TR.crossovers[0] && TR.crossovers[0].i : null;
      if (target === null || target === undefined) return false;
      if (lane !== undefined) c.lane = lane;
      const Ln = TR.lanes[c.lane];
      c.s = (Ln.cum[target] - dist + Ln.len) % Ln.len; c.i = 0; locate(c); c.state = 'slot';
      for (const o of G.cars) if (o !== c && o.lane === c.lane) { o.lane = (c.lane + 2) % 4; o.s = sAtIndex(o.lane, o.i, o.f); }
      return true;
    },
    placeCorner(lane) {
      const c = humanCar(1); if (!c) return false;
      if (lane !== undefined) c.lane = lane;
      // the sharpest corner, 20 units before it
      let best = 0;
      for (let i = 0; i < TR.N; i++) if (TR.lanes[c.lane].R[i] < TR.lanes[c.lane].R[best]) best = i;
      const Ln = TR.lanes[c.lane];
      c.s = (Ln.cum[best] - 8 + Ln.len) % Ln.len; c.i = 0; locate(c); c.state = 'slot';
      return vlim(c, c.lane, best);
    },
    p2: () => { const c = humanCar(2); return c ? { v: c.v, th: c.th, lane: c.lane } : null; },
    twoPlayer(on) { twoP = !!on; refreshTitle(); },
  });
  if (Kit.debug) window.__game = { test: () => window.__kilnTest, get G() { return G; }, get TR() { return TR; }, get CH() { return CH; } };

  function scene(seed, raceNo, setup) {
    fx.seed(seed);
    Kit.save.set('champ', null);
    twoP = false;
    nextSeed = seed;
    tut = { held: true, lane: true, done: true };
    shell.start();
    if (raceNo) { CH.race = raceNo - 1; CH.pts = [10 * (raceNo - 1), 6 * (raceNo - 1), 3 * (raceNo - 1), raceNo - 1]; beginRace(); }
    G.phase = 'race'; G.raceT = 0; G.banner = 0;
    botSkill = 0.97;
    if (setup) setup();
    loop.stop();
  }
  function runFor(sec) { const n = Math.round(sec * 60); for (let k = 0; k < n; k++) loop.step(1); }
  Arcade.scenes({
    // the lamp-lit bench from above: a figure-eight, four tin cars, one tumbling off a bend in sparks
    art: () => scene(41, 5, () => {
      runFor(6.5);
      const victim = G.cars.find(c => !c.human && c.state === 'slot' && TR.K[c.i] !== 0 && TR.hgt[c.i] < 0.2) || G.cars.find(c => !c.human && c.state === 'slot');
      if (victim) { victim.v = 300; deslot(victim, 'bend'); }
      fx.clear();
      if (victim) {
        fx.burst(victim.x, victim.y, { count: 40, color: ['#ffd27a', '#ffb347', '#fff1c1', '#e8743a'], shape: 'spark', speed: [80, 320], life: [0.3, 0.6], size: [1.4, 3.2], glow: true, gravity: 120 });
        G.zoom = 0;
      }
      for (let k = 0; k < 9; k++) loop.step(1);
      G.zoom = 0;
    }),
    // the start grid: lights, rolling counter, medallion and plunger
    shot1: () => {
      fx.seed(11);
      Kit.save.set('champ', null);
      twoP = false; nextSeed = 11;
      tut = { held: false, lane: false, done: false };
      shell.start();
      forceTh = 1;
      loop.step(Math.round(2.0 * 60));
      forceTh = null;
      hud.plunger[0] = 0.85;
      humanCar(1).th = 0.85;
      loop.stop();
    },
    // a loop and a banked turn, your lane glowing red, leading the race
    shot2: () => scene(23, 6, () => {
      runFor(9);
      const c = humanCar(1);
      // lead the field, then charge into the next bend too fast
      const lead = rankCars()[0];
      if (lead !== c) { c.laps = lead.laps; }
      let best = -1, bd = 1e9;
      const Ln = TR.lanes[c.lane];
      for (let i = 0; i < TR.N; i++) {
        if (!TR.bank[i] || TR.hgt[i] > 0.1) continue;
        const d = (Ln.cum[i] - c.s + Ln.len) % Ln.len;
        if (d > 40 && d < bd) { bd = d; best = i; }
      }
      if (best >= 0) { c.s = (Ln.cum[best] - 95 + Ln.len) % Ln.len; c.i = 0; locate(c); }
      c.v = 330; c.th = 1; forceTh = 1; botSkill = 0;
      for (const o of G.cars) if (o !== c) { o.laps = Math.min(o.laps, c.laps); }
      const looper = G.cars.find(o => !o.human);
      if (looper && TR.loop) { looper.state = 'loop'; looper.loopTh = 2.6; looper.loopV = 300; }
      loop.step(3);
      updatePositions();
      c.pos = 1;
      forceTh = null;
    }),
  });

  /* ============================================================ boot */
  startAttract(4);
  refreshTitle();
  doLayout();
  Kit.music.play(RAG);
  loop.step(60);
  loop.start();
})();
</script>
